body:
  text: 關中勝迹圖志卷四陜西巡撫臣畢沅撰古迹宫闕西安府殷豐宫通志在鄠縣東五里小豐村詩大雅既伐于崇作邑于豐正義豐宫周文王宫也在雍州鄠縣杜預左傳注豐宫東有靈臺康王於是朝諸侯雍録史記曰文王伐崇侯虎而作豐邑伐崇之後自岐遷都於豐武王改邑於鎬豐宫元不移徙每遇大事皆步自宗周而往以其事告於豐廟周鎬京雍勝略在長安縣西南三十里豐水東詩大雅考卜維王宅是鎬京維龜正之武王成之帝王世紀武王自豐水居鎬諸侯宗之是為宗周今豐水之東長安之南有鎬池即其故都也水經注自漢穿昆明池於是地基搆淪褫今無可究辟雍通志在鄠縣東三十里詩大雅鎬京辟雍三輔黃圖亦曰辟雍如璧之圓雍之以水象教化流行也詩於論鼓鐘於樂辟雍三代學禮記注周立三代之學學書於有虞氏之學典謨之教所以興也學舞於夏后氏之學文武中也學禮樂於商之學功成治定與已同也冀闕通志在咸陽城中史記秦孝公作咸陽築冀闕徙都之萯陽宫三輔黃圖秦文王所起在鄠縣西南二十三里漢書東方朔傳作倍陽顔師古注倍陽即萯陽也其音同耳宫名芷陽宫通志在灞上秦襄公起秦咸陽城雍勝略在咸陽縣東二十里三輔黃圖自秦孝公至始皇胡亥並都此城案孝公十二年作咸陽築冀闕徙都之始皇徙天下高資富豪於咸陽十二萬户引渭水灌都以象天漢橫橋南渡以法牽牛咸陽北至九嵕甘泉南至鄠杜東至河西至汧渭之交東西八百里南北四百里離宫别館相望聫屬木衣綈繡土被朱紫宫人不移樂不改懸窮年忘歸猶不能遍雍録秦之咸陽孝公所都也在漢長安西北故漢書紀高帝項羽自霸上而入秦都皆曰西上咸陽也古語山南水北曰陽秦之所都若概舉其凡則在九嵕諸山之南渭水之北若細推之則秦之朝宫苑殿固在渭北而秦都實跨渭水史記諸書皆云始皇都咸陽引渭水灌都以象天漢橫橋南渡以法牽牛此可見都之兼在渭南矣故史記水經凡序長樂悉以其地屬之咸陽而於甘泉阿房亦自明命以為咸陽前殿也阿房宫雍勝略故基在長安縣西三十里史記秦始皇本紀始皇帝三十五年以為咸陽人多先王之宫廷小吾聞豐鎬之間帝王之都也乃營作朝宫渭南上林苑中先作前殿阿房東西五百步南北五十丈上可以坐萬人下可以建五丈旗周馳為閣道自前殿直抵南山表南山之巔以為闕為復道自阿房渡渭屬之咸陽以象天極閣道絶漢抵營室也計宫三百三輔黃圖阿房前殿以木蘭為梁以磁石為門三輔舊事阿房宫東西三里南北五里庭中可受十萬人車行酒騎行炙千人唱萬人和其外有城名阿城東西北三面有牆南面無牆三輔黃圖始皇收天下兵聚之咸陽銷鋒鏑以為金人十二以弱天下之人立于宫門坐高三丈銘其後曰皇帝二十六年初兼天下改諸侯為郡縣一法律同度量大人來見臨洮其大五丈足迹六尺唐杜牧阿房宫賦六王畢四海一蜀山兀阿房出覆壓三百餘里隔離天日驪山北搆而西折直走咸陽二川溶溶流入宫牆五步一樓十步一閣廊腰縵回簷牙髙啄各抱地勢鈎心鬭角盤盤焉囷囷焉蜂房水渦矗不知其幾千萬落長橋卧波未雲何龍復道行空不霽何虹髙低冥迷不知西東歌臺暖響春光融融舞殿冷袖風雨淒淒一日之內一宫之間而氣候不齊妃嬪媵嬙王子皇孫辭樓下殿輦來於秦朝歌夜絃為秦宫人明星熒熒開粧鏡也緑雲擾擾梳曉鬟也渭流漲膩棄脂水也煙斜霧橫焚椒蘭也雷霆乍驚宫車過也轆轤逺聽杳不知其所之也一肌一容盡態極妍縵立逺視而望幸焉有不得見者三十六年燕趙之收藏韓魏之經營齊楚之精英幾世幾年取掠其人倚疊如山一旦不能有輸來其間鼎鐺玉石金塊珠礫棄擲邐迤秦人視之亦不甚惜嗟乎一人之心千萬人之心也秦愛紛奢人亦念其家奈何取之盡錙銖用之如泥沙使負棟之柱多於南畝之農夫架梁之椽多於機上之工女釘頭磷磷多於在庾之粟粒瓦縫參差多於周身之帛縷直闌橫檻多於九土之城郭管絃嘔啞多於市人之言語使天下之人不敢言而敢怒獨夫之心日益驕固戌卒叫函谷舉楚人一炬可憐焦土嗚呼滅六國者六國也非秦也族秦者秦也非天下也嗟夫使六國各愛其人則足以拒秦秦復愛六國之人則遞二世可至萬世而為君誰得而族滅也秦人不暇自哀而後人哀之後人哀之而不鑑之亦使後人而復哀後人也信宫通志在咸陽縣渭水南史記秦始皇本紀始皇帝二十七年作信宫渭南已而更命信宫為極廟象天極自極廟道通酈山作甘泉前殿築甬道自咸陽屬之長樂宫通志一名興樂宫在長安城中三輔黃圖秦始皇造漢修飾之周回二十餘里漢太后嘗居之甘泉宫雍録古以甘泉名宫者三秦之甘泉在渭南一也漢之甘泉在雲陽縣磨石嶺上二也隋之甘泉在鄠三也秦之甘泉史嘗明言在渭之南而無言其在渭南何地者秦始皇本紀迎太后于雍而入咸陽復居甘泉宫徐廣曰表云咸陽南宫也秦時咸陽跨渭南北則此宫不在渭北之咸陽而在渭南之咸陽也又本紀曰自極廟道通酈山作甘泉前殿自咸陽屬之則甘泉前後必近上林苑即鄠縣也則秦之甘泉與隋之甘泉正同一地安知隋宫不襲秦之舊也蘭池宫雍勝略在咸陽縣東二十五里水經注地理志曰渭城縣有蘭池宫秦始皇微行逢盜于蘭池林光宫雍勝略秦時宫也故基在甘泉山上三輔黃圖林光宫胡亥所造從廣各五里關中記林光宫一曰甘泉宫秦起在今池陽縣西北故甘泉縣甘泉山上周回十餘里曲梁宫元和郡縣志秦曲梁宫在三原縣西南十五里黃白城內步高宫雍勝略故基在渭南縣西南三十里三輔黃圖步高宫亦名市邱城又步高宫西有步夀宫長楊宫雍勝略在盩厔縣東南三十三里三輔黃圖長楊本秦舊宫宫中有垂楊數畝因為宫名門曰射熊觀秦漢遊獵之所望夷宫通志在涇陽縣東南八里長陵西北臨涇水處史記秦二世本紀二世夢白虎齧其左驂馬殺之心不樂怪問占夢卜曰涇水為祟二世乃齋于望夷宫欲祠涇沈四白馬漢長安故城通志在西安府城西北二十里三輔黃圖高祖七年築長安宫城自櫟陽徙居此城本秦離宫也初本狹小至惠帝更築之高三丈五尺下濶一丈五尺上濶九尺雉高三坂周回六十五里城南為南斗形城北為北斗形至今人呼漢京為斗城是也漢舊儀曰長安城中經緯各長三十二里十八步九百七十二頃八街長安志有華陽街章臺街夕隂街香室街尚冠街太常街藁街前街漢書有熾盛街九陌三宫九府三廟十二門九市長安志六市在道東三市在道西十六橋水泉深二十餘丈城下有池周繞廣三丈深二丈石橋各六丈與街相直三輔決録長安城面三門四面十二門皆通達九徑以相經緯括地志長安在渭水南隔渭水北對秦咸陽宫漢于其地置未央宫曰長安城因名縣三秦記長安城中地皆黑壤今城赤且堅如石如金父老相傳云盡鑿龍首山中土以為城及諸城闕皆然雍録漢都長安其城在渭之南而咸陽之東南也凡漢城之水皆取諸昆明第一派自西而東橫亘城南之鼎路門巳而東折以注青門水經謂之漕渠第二支自西面南來周遍諸宫自清明門出城是為王渠與漕渠合北入渭長安圖志漢城惠帝築後趙石虎亦嘗修之苻姚西魏宇文皆都之隋開皇三年都龍首川此城遂廢至今民呼猶曰楊家城宣平門三輔黃圖長安城東出北頭第一門曰宣平民間所謂東都門水經注宣平門王莽更名春王門正月亭亦曰東都門清明門三輔黃圖長安城東出第二門曰清明一曰籍田門以門內有籍田倉故名一曰凱門漢宫殿疏曰第二門名城東門莽更名曰宣德門布恩亭長安志清明門外郭門曰東平門霸城門三輔黃圖長安城東出南頭第一門曰霸城門水經注王莽更名曰仁夀門無疆亭門色青又名青城門或曰青綺門亦曰青門門外舊出佳瓜述異記景帝元年有青雀羣飛于霸城門乃改為青雀門更修飾刻木為綺橑雀去因名青綺門覆盎門三輔黃圖長安城南出東頭第一門曰覆盎門一號杜門廟記曰門外有魯班所造橋工巧絶世長樂宫在城中近東直杜門一曰下杜門又名端門北對長樂宫王莽更名曰永清門長茂亭安門三輔黃圖長安城南出第二門曰安門亦曰鼎路門北對武庫王莽更名曰光禮門顯樂亭西安門三輔黃圖長安城南出第三門曰西安門北對未央宫一曰便門即平門也謹按平便古字通王莽更名曰信平門誠正亭章城門三輔黃圖長安城西出南頭第一門曰章城門三輔舊事曰章門一曰光華門又曰便門王莽改曰萬秋門億年亭直城門三輔黃圖長安城西出第二門曰直城門亦曰故龍樓門門上有銅龍本名直門王莽更曰直道門端路亭雍門三輔黃圖長安城西出北頭第一門曰雍門本名西城門王莽改曰章義門著義亭其水北入有函里民呼曰函里門洛城門三輔黃圖長安城北出東頭第一門曰洛城門又曰高門漢宫殿疏曰高門長安北門也又曰鸛雀臺門外有漢武承露盤在臺上水經注北出西頭第三門本名杜門亦曰利城門王莽更名進和門臨水亭其水有客舍故名曰客舍門又曰洛門也厨城門三輔黃圖長安城北第二門曰厨城門王莽更名建子門廣世亭水經注厨門其內有長安厨官故城曰厨門也如淳曰今名廣門橫門三輔黃圖長安城北出西頭第一門曰橫門外有橋曰橫橋水經注橫門王莽更名霸都門左幽亭如淳曰音光故曰光門其外郭有都門有棘門徐廣曰棘門在渭北孟康曰在長安北秦時宫門也三輔黃圖曰棘門在橫門外按漢書徐厲軍于此又有通門亥門也巳上長安故城長樂宫括地志在長安故城中漢書高帝本紀高帝五年治長樂宫三輔黃圖長樂宫本秦之興樂宫也高皇帝始居櫟陽七年長樂宫成徙居長安城後太后常居之王莽改為長樂室近東直杜門關中記長樂宫周回二十餘里有殿十四史記惠帝為東朝長樂及間往來數蹕煩人乃作復道築武庫南詔立原廟玉海長樂者高帝既以為居又以受朝無異于正宫矣自惠帝後人主皆居未央而長樂常奉母后雍録未央在漢城西隅而長樂乃東隅也元和郡縣志言兩宫相去止隔一里此一里所即武庫漢武故事建章未央長樂三宫皆輦道相屬懸棟飛閣不由徑路東闕西闕釋名闕在門兩旁中央闕然為道也漢書宣帝本紀宣帝五鳳三年鸞鳯集長樂宫東闕中樹上劉屈氂傳太子引兵驅四市人至長樂西闕下逢丞相軍合戰司馬門三輔黃圖未央甘泉長樂四面皆有公車司馬門凡言司馬者宫垣之內兵衛所在司馬主武事故謂宫之外門為司馬門前殿三輔黃圖長樂宫前殿東西四十九丈七尺兩序中三十五丈深十二丈臨華殿三輔黃圖在長樂前殿後武帝建漢書成帝本紀成帝永始四年夏四月長樂宫臨華殿災大厦殿三輔舊事秦作銅人立阿房殿前漢著長樂宫大厦殿前長信宫三輔黃圖長信宫漢太后嘗居之按通靈記太后成帝母也后宫在西秋之象也秋主信故宫殿皆以長信長秋為名又永夀永寧殿皆后所處也雍録黃圖曰長樂殿西有長信長秋永夀永寧四殿而水經注亦云殿西有長信長秋永夀永昌等殿則長信長秋皆在長樂宫中也長安志别出長信等七宫不以統諸長樂殆傳疑耶酒池三輔黃圖廟記曰長樂宫中有魚池酒池池上有肉炙樹秦始皇造漢武帝行舟於池中關中記酒池北起臺天子於上觀牛飲者三千人太平寰宇記武帝作酒池以誇羌人飲以鐵杯重不能舉皆牛飲水經注長樂殿之東北有池池北有臺沼謂是池為酒池非也宣德殿通光殿高明殿長安志見三輔宫殿名在長樂宫中又長樂宫有長定建始廣陽中室月室神仙椒房諸殿溫室殿漢書孔光傳或問光溫室省木皆何木也光默然不應晉灼曰長樂宫中有溫室殿鴻臺三輔黃圖長樂宫有鴻臺秦始皇二十七年築高四十丈土起觀宇帝嘗射飛鴻于臺上故號鴻臺漢書惠帝四年長樂宫鴻臺災鐘室漢書高帝本紀高帝十一年呂后殺韓信于長樂鐘室師古曰謂懸鐘之室地理志未央殿東北二里許鐘室故處也有隙地丈餘草色皆殷赤相傳吕后殺淮隂血漬而然巳上長樂宫臣謹按關中古迹宫闕於秦為盛史記始皇令咸陽之旁二百里內宫觀二百七十復道甬道相連漢書賈山傳秦起咸陽而西至雍離宫三百然世移代易非惟建基無考抑亦名與俱湮漢之宫殿惟長樂未央建章為大餘如長楊五柞甘泉集靈諸宫班固所謂離宫别館三十六所神池靈沼往往而在其中闕庭神麗宫室光明張千門而立萬户幸史記兩漢書及三輔黃圖西京雜記關中記長安志雍録雍勝略諸書尚存基址方位猶可得其髣佛謹備録之并繪圖卷內以資考證至於名雖未湮而地無可稽或宫不詳其基址或殿未審其附麗而稱名舉事猶往往見於他説謹附載各宫篇末以竊副職詳之義其魏晉以後諸宫闕並倣此例明光宫三輔黃圖武帝太初四年秋起南與長樂宫相連屬漢書元后傳成都侯商病欲避暑從上借明光宫注明光在城內近桂宫長安志王莽篡位命孺子為定安公孝平皇后為定安太后改明光宫為定安館定安太后居之未央宫括地志在長安故城中近西南隅漢書高帝本紀高帝七年蕭何治未央宫西京雜記未央宫周回二十二里九十五步五尺關中記作三十三里街道周回七十里關中記作十七里臺殿四十三其三十二在外其十一在後宫關中記作有臺三十二池十三關中記作池十二門闥凡十五關中記作宫殿門八十一掖門十四三秦記未央一名紫微宫東闕漢書高帝本紀蕭何治未央宫立東闕文帝本紀文帝七年未央宫東闕罘罳災關中記未央宫東有蒼龍闕北闕漢書高帝本紀顔師古注未央殿雖南向而上書奏事謁見之徒皆詣北闕公車司馬亦在北焉是則以北闕為正門而又有東門東闕至於西南兩面無門闕矣關中記未央宫北有玄武闕闕中有閶闔門止車門柏梁臺漢書武帝本紀武帝元鼎二年春起柏梁臺郊祀志武帝鑄柏梁銅柱三輔故事臺高二十丈用香柏為殿梁香聞十里長安志廟記曰柏梁臺漢武帝造在北闕內道西三秦記柏梁臺上有銅鳳名鳳闕漢柏梁詩并序漢武帝元封三年作柏梁臺詔羣臣二千石有能為七言者乃得上坐日月星辰和四時帝驂駕駟馬從梁來和撫孝郡國士馬羽林材刀司總領天下誠難治四夷不易哉筆之吏臣執之撞鐘伐鼓聲中詩交戟禁不時總宗室廣大日益滋領從宗柏梁臺劉周衛平理清讞絶嫌疑次之乘修飾輿馬待駕來輿御物主治之公郡國吏功差陳粟萬石揚以箕農徼道宫下隨討治盜阻南山為民災外三輔盜賊天下危家公主不可治欂椒房率更領其材橘栗蠻夷朝賀常舍其逐柱枅櫨相支持枇杷桃李梅官走狗張罘罳林齧妃女脣甘如飴迫窘詰屈幾窮哉司馬門漢書元帝本紀元帝初元五年令從官給事宫司馬中者得為大父母父母兄弟通籍注應劭曰司馬中者宫內門也顔師古曰司馬門者宫之外門也衛尉有八屯衛候司馬主衛士徼巡宿衛每面各二司馬故謂宫之外門為司馬門端門漢書周勃傳皇帝入未央宫有謁者十人持戟衛端門師古注殿之正門也班固西都賦立金人於端闈李善注宫中門謂之闈掖門漢書吕后紀朱虛侯章請卒千人入未央宫掖門注顔師古曰非正門而在兩旁若人之臂掖也雍録御覽出禁省為殿門外出大道為掖門則不特夾立正門之旁為掖門雖殿門外他出之門皆可名為掖門也前殿三輔黃圖未央宫前殿東西五十丈深十五丈高三十五丈營未央宫因龍首以制前殿至孝武以朩蘭為棼橑文杏為梁柱金鋪玉户華榱璧璫雕楹玉磶重軒鏤檻青瑣丹墀左墄右平黃金為璧帶間以和氏珍玉風至其聲玲瓏然也長安志王莽改前殿曰王路堂蘭臺雍録漢百官表御史中丞在殿中蘭臺掌圖籍祕書外督部刺史內領侍御史受公卿奏事西京賦曰蘭臺金馬遞宿迭居按此蘭臺正在殿中石渠天祿皆在殿北宣明殿廣明殿三輔黃圖皆在未央殿東昆德殿玉堂殿三輔黃圖皆在未央殿西白虎門漢書王莽傳王莽大置酒未央宫白虎殿勞賜將帥自前殿南下西出椒除白虎門注服虔曰邪行閣道下者也顔師古曰除殿陛之道也椒取芬香之名也宣室三輔黃圖未央前殿正室也漢書文帝受釐宣室夜半前席賈生問鬼神之事即此長安志漢書宣帝嘗幸宣室齋居而決事如淳曰宣室宣布政教之室蓋其殿在前殿之側齋則居之金馬門史記滑稽傳金馬門者宦者署門也門傍有銅馬故謂之金馬門漢書公孫宏傳天子擢宏對為第一待詔金馬門注武帝時相馬者東門京作銅馬法獻之立馬於魯班門外更名魯班門為金馬門一謂之金門長安志揚雄待詔金門金馬門也玉海金馬門又謂之黃門宦者署漢書蘇武傳宣帝詔武待詔宦者署顔師古注百官公卿表少府屬官有宦者令丞以其署親近故令於此待詔雍録百官表有中黃門顔師古曰謂閽人居禁中在黃門之內給事者也天祿閣三輔故事在未央大殿北天祿異獸也即揚雄校書處漢宫闕疏天祿石渠蕭何造以藏祕書處賢才班固西都賦天祿石渠典籍之府石渠閣三輔故事在未央大殿之北三輔黃圖石渠門蕭何造其下礲石為渠以導水若今御溝因為閣名藏入關所得秦之圖籍成帝於此藏祕書焉雍録石渠閣礲石為渠以導水以水經約其地望則滄池在未央西南此之為渠必引滄池下流轉北以行成其為渠也水之又北遂轉行乎明光桂宫之間謂之明渠也又益趨東則長樂之有酒池都城東之有王渠皆此水也承明殿三輔黃圖未央宫有承明殿著述之所也漢書霍光傳皇太后車駕幸未央承明殿漢書翼奉傳孝文帝躬行節儉其時未央宫無高門武臺麒麟鳯皇白虎玉堂金華之殿獨有前殿曲臺漸臺宣室溫室承明耳謹按承明殿一作承明廬漢書嚴助傳嚴助為會稽太守數年不聞問賜書曰君厭承明之廬注張晏云承明廬在石渠閣外一作承明庭班固西都賦序內有承明著作之庭漢書揚雄傳客有薦雄文似相如者召雄待詔承明之庭雍録云廬者以更直之地言之庭者以受詔作文之地言之實即承明殿也諸志乘分而為三似誤溫室殿三輔黃圖溫室在未央宫殿北武帝建冬處之則溫暖也謹按孔光傳晉灼注則溫室在長樂宫據三輔黃圖則溫室在未央宫是漢有兩溫室也西京雜記溫室以椒塗壁被之文繡香桂為梁設火齊屏風鴻羽帳規地以罽賔氍毹清涼殿三輔黃圖清涼殿在未央宫殿北夏居之則清涼也漢書曰清室則中夏含霜此也高門殿三輔舊事武帝於未央宫起高門殿三輔黃圖汲黯請見高門注曰未央宫高門殿也哀帝時鮑宣諫曰陛下擢臣巖穴誠兾有益毫毛豈欲臣美食大官重高門之地玉海鮑宣又言高門去省户數十步求見出入二年未省玉堂殿漢書揚雄傳厯金門上玉堂注晉灼曰黃圖有大玉堂小玉堂殿李尋傳注顔師古曰玉堂殿在未央宫長秋門漢書戾太子傳太子使舍人無且持節夜入未央宫殿長秋門因長御倚華具白皇后內謁者署三輔黃圖在未央宫屬少府掌宫中步帳褻物椒房殿三輔宫殿名未央宫有椒房殿漢官儀皇后殿稱椒房以椒塗室主溫暖除惡氣也掖庭漢書元帝本紀賜單于待詔掖庭王嬙為閼氏漢官儀媫妤以下皆居掖庭有月景臺雲光殿光華殿鳴鸞殿開襟閣臨池觀不在簿籍皆繁華窈窕之所棲宿焉昭陽殿三輔黃圖成帝趙皇后居昭陽殿漢書外戚傳皇后既立寵少衰而弟絶幸為昭儀居昭陽舍班固西都賦昭陽特盛隆於孝成屋不呈材牆不露形三輔黃圖武帝時後宫八區有昭陽飛翔增城合歡蘭林披香鳳皇鴛鸞等殿後增修安處常寧茝若椒風發越蕙草等殿為十四位增城舍長安志漢書曰班媫妤居增城舍應劭曰後宫有八區增城第三也椒風舍漢書董賢傳董賢女弟為昭儀位次皇后更名其舍為椒風以配椒房云漸臺關中記未央宫西有滄池池中有漸臺雍録未央宫有漸臺文帝之夢鄧通王莽之死於兵皆在其處黃圖曰滄池其水滄色麒麟殿三輔黃圖未央宫中麒麟殿漢書哀帝燕董賢父子於麒麟殿金華殿三輔黃圖未央宫中有金華殿漢書敘傳上方向學鄭寬中張禹朝夕入説尚書於金華殿宴昵殿漢書敘傳班伯少受詩於師丹大將軍王鳳薦伯宜勸學召見宴昵殿武臺殿三輔舊事武帝於未央宫起武臺殿猗蘭殿漢武故事王美人七月七日旦生武帝於猗蘭殿漢武內傳景帝夢一赤彘從雲中直入崇芳閣覺而坐閣下果有赤龍如霧來蔽户牖使王夫人移居崇芳閣乃改閣為猗蘭殿白虎殿三輔黃圖未央宫有白虎殿漢書王商傳河平四年單于來朝引見白虎殿曲臺殿漢書孟卿傳后蒼説禮數萬言號曰后氏曲臺記顔師古注曲臺殿在未央宫飛羽殿漢書元后傳太后冬饗飲飛羽顔師古注飛羽殿在未央宫中羽或作雨敬法殿漢書王莽傳燒作室門斧敬法闥顔師古注敬法殿名鳯皇殿三輔黃圖在未央宫又未央宫有通光殿鈎弋殿夀成殿萬嵗殿永延殿夀安殿平就殿宣德殿東明殿又神明殿見漢武故事延年殿合歡殿四車殿見三輔決録宣平殿長年殿見漢宫闕疏朱鳥堂見漢宫殿疏麒麟閣漢書蘇武傳上思股肱之美乃圖畫其人於麒麟閣注張晏曰武帝獲麒麟時作此閣遂以為名唐六典注麒麟閣亦藏書又白虎閣屬車閣堯閣三輔黃圖俱在未央宫織室漢書百官表少府有東織西織令丞河平元年省東織更名西織為織室三輔黃圖未央宫有東西織室織作文繡郊廟之服有令史凌室三輔黃圖未央宫藏冰之室暴室三輔黃圖在未央宫漢書宣帝本紀注應劭曰暴室者宫人獄也今曰薄室師古曰暴室者掖庭主織作染練之署謂之暴室者取暴曬為名耳或謂薄室者薄亦暴也今俗語云暴曬蓋暴室織務既多因為置獄主治其罪人故往往謂之暴室獄耳本非獄也郎中府漢書高后本紀注如淳曰百官表令郎中掌宫殿門戶故其府在宫中後轉為光祿勳四寶祠漢書郊祀志宣帝以方士言為隨侯劒寶玉寶璧周康寶鼎立四祠于未央宫中弄田三輔黃圖在未央宫弄田燕遊之田天子所戲弄耳漢書昭帝紀曰始元元年上耕於鈎盾弄田應劭注云帝時年九嵗未能親耕帝籍鈎盾宦者近署故往試耕為戲弄成帝建始三年小女陳持弓年九嵗闌入尚方掖門至未央殿鈎盾禁中青瑣門三輔黃圖未央宫有青瑣門漢舊儀黃門郎屬黃門令日暮入對青瑣門拜名曰夕郎漢書元后傳注顔師古曰青瑣門刻為連瑣文而以青塗之也作室門漢書成帝本紀成帝為太子初作桂宫上急召太子出龍樓門不敢絶馳道西至直城門得絶乃度還入作室門鈎弋臺三輔黃圖在未央宫又未央宫有東山臺西山臺釣臺見三輔故事路軨廏三輔黃圖在未央宫掌宫中輿馬亦曰未央廏漢書曰武帝時期門郎上官桀遷為未央廏令虎圈彘圈虎圈凡九彘圈一三輔黃圖俱在未央宫文帝問上林尉及馮妃當熊皆此處虎圈上有樓觀巳上未央宫北宫漢書外戚傳注顔師古曰未央宫之北三輔黃圖北宫在長安城中近桂宫周回十里高帝時創孝成增修之東交門漢書東方朔傳武帝從董偃遊戲北宫馳逐平樂觀有詔置酒北宫引董君從司馬門入更名東交門前殿三輔黃圖北宫有前殿廣五十步珠簾玉户如桂宫紫房復道漢書孔光傳大司空何武曰定陶太后可居北宫宫有紫房復道朝夕至哀帝所夀宫三輔黃圖北宫有神仙宫夀宫張羽旗設供具以禮神君神君來則肅然風生帷帳皆動太子宫漢書成帝本紀孝成皇帝元帝太子也母曰王皇后元帝在太子宫生甲觀畫堂謹按太子宫未詳所在三輔黃圖敘入北宫今從之巳上北宫桂宫元和郡縣志在長安故城中三輔黃圖漢武帝造周回十餘里水經注未央宫北即桂宫舊乘復道用相徑通故渠出二宫之間謂之明渠班固西都賦輦路經營修塗飛閣自未央而連桂宫張衡西京賦鈎陳之外閣道穹窿屬長樂於明光徑北通乎桂宫西京雜記武帝為七寶牀雜寶案厠寶屏風列寶帳設於桂宫時人謂為四寶宫龍樓門漢書成帝本紀成帝為太子居桂宫上嘗急召太子出龍樓門注張晏曰門樓有銅龍若白鶴飛廉之為名也鴻寧殿漢書五行志桂宫鴻寧殿災帝祖母傅太后之所居也明光殿關輔記桂宫中有明光殿土山復道從宫中西上城西至建章宫神明臺蓬萊山三秦記未央宫漸臺西有桂宫中有明光殿皆金玉珠璣為簾箔綴明月珠金砌玉階晝夜光明走狗臺三輔黃圖桂宫有走狗臺又有商臺避風臺巳上桂宫建章宫雍勝略在長安故城西漢書武帝本紀太初元年二月起建章宫注顔師古曰在未央宫西今長安故城西俗所稱貞女樓即此宫之闕也郊祀志建章宫度為千門萬户關中記建章周回二十餘里張衡西京賦柏梁既災越巫陳方建章是經用厭火祥營宇之制事兼未央雍録三輔舊事關中記皆言建章在城西上林之地東方朔傳曰陛下以城中為小圖起建章長安記曰王莽壞城西苑中建章十餘所取其材為九廟師古曰自建章以下皆在上林苑中關中記上林苑中有宫十二建章其一然建章如此其侈而正史少曾正書臨幸則皆從飛閣越城以出也飛閣三輔黃圖武帝於未央營造日廣以城中為小乃於宫西跨城池作飛閣通建章宫構輦道以上下雍録案建章宫在長安城外與未央諸宫隔城相望故跨城而為閣道尤與常異閶闔門三輔黃圖宫之正門曰閶闔門高二十五丈亦曰璧門漢書曰建章宫南有玉堂璧門三層臺高三十丈玉堂內殿十二門階陛皆玉為之鑄銅鳳高五尺飾黃金樓屋上下向風若翔椽首薄以璧因名璧門鳳闕史記封禪書建章前殿度高未央其東則鳳闕索隱曰三輔黃圖武帝營建章起鳯闕高二十五丈三輔黃圖璧門左鳳闕張衡西京賦設璧門之鳳闕上觚稜而棲金雀關輔古語俗謂鳳皇闕為貞女樓神明臺三輔黃圖璧門右神明臺漢書曰建章宫有神明臺廟記曰神明臺武帝造祭金人處上有承露盤有銅仙人舒掌捧銅盤玉杯以承雲表之露以求仙道長安記仙人掌大七圍以銅為之漢宫闕疏神明臺高五十丈常置九天道士百人水經注神明臺有九室俗謂之九子臺而實非也後有疏園神明堂圓闕三輔黃圖建章宫門北起圓闕高二十五丈上有銅鳳皇赤眉賊壞之西京賦圓闕聳以造天若雙闕之相望是也長安志古歌辭所謂銅雀即銅鳳也古歌長安城西雙圓闕上有一雙銅雀宿一鳴五榖生再鳴五穀熟璧謹按史記建章鳳闕高二十餘丈即西京賦所云設門之鳳闕也又關中記建章宫圓闕有金鳳在上故號鳳闕似又以圓闕為鳳闕矣然唐王維詩云雲裏帝城雙鳳闕似璧門圓闕上並有鳳皇故皆稱鳳闕至唐而遺址尚存因並著之别風闕西京賦閶闔之內别風嶕嶢關中記别風以言别四方之風也玉海閶闔門內東出有析風閣一名别風嶕嶢闕長安志廟記曰建章宫有嶕嶢闕薛綜注次門女闕也在圓闕門內二百步井幹樓史記封禪書武帝作建章宫乃立神明臺井幹樓度五十丈輦道相屬漢宫闕疏神明井幹俱高五十丈井幹樓積朩而高為樓若井幹之形也井幹者井上朩欄也其形或四角或八角張衡西京賦井幹疊而百層三輔黃圖别風闕對峙井幹樓各高五十丈輦道相屬前殿漢書郊祀志建章前殿度高未央唐中庭史記封禪書建章宫西則唐中數十里索隱唐堂庭也爾雅以廟中路謂之唐西京賦前開唐中彌望廣潒是也一作商中漢書郊祀志建章宫西則商中數十里注如淳曰商中商庭也顔師古曰商金也於序在秋故謂西方之庭為商庭鼓簧宫三輔黃圖漢宫闕疏云鼓簧宫周匝一百三十步在建章宫東旁有承光宫竒華宫三輔黃圖在建章宫旁四海夷狄器服珍寶火浣布切玉刀巨象大雀師子宫馬充塞其中又有竒寶殿枍詣宫三輔黃圖枍詣朩名宫中美朩茂盛也駘蕩宫三輔黃圖春時景物駘蕩滿宫中也馺娑宫三輔黃圖馺娑馬行疾貌馬行迅速一日之間遍宫中言宫之大也天梁宫三輔黃圖梁至於天言宫之高也函德殿三輔黃圖建章宫有函德承華鳴鸞等二十六殿漢書宣帝本紀神爵元年三月詔曰金芝九莖産於函德殿銅池中涼風臺關中記建章宫北作涼風臺積朩為樓高五十餘丈避風臺關中記太液池有避風臺即飛燕結裾之處曝衣閣卜子陽園苑疏太液池西有武帝曝衣閣常至七月七日宫女出后衣登樓曝虎圈漢書郊祀志建章宫西虎圈注顔師古曰於菟亦西方之獸故於此置其圈也太液池史記封禪書建章宫治大池漸臺高二十餘丈命曰太液池中有蓬萊方丈瀛洲象海中神山索隱三輔故事云池北岸有石魚長二丈廣五尺西岸有龜二枚各長六尺又唐中池三輔黃圖周回十二里在建章宫太液池南又孤樹池西京雜記在太液池西池中有一洲上煔樹一株六十餘圍望之重重如車蓋故取為名又淋池拾遺記昭帝元始元年穿淋池廣千步東引太液之水池中植分枝荷一莖四葉狀如駢蓋又影娥池三輔黃圖武帝鑿以玩月其傍起望鵠臺以眺月影入池中使美人乘舟弄月影名影娥也亦曰眺蟾臺北闕廟記高二十丈建章宫北闕門也已上建章宫鈎弋宫漢武故事在直門之南列仙傳鈎弋夫人姓趙氏河間人見召武帝命所居曰鈎弋宫堯母門漢書趙媫妤傳趙媫妤居鈎弋宫太始元年生昭帝號鈎弋子十四月乃生命所生門曰堯母門巳上鈎弋宫宜春宫漢書東方朔傳建元三年武帝微行東遊宜春注顔師古曰宜春宫在長安東南説者乃以為在鄠非也在鄠者自是宜春觀耳在長安城西豈得言東遊也司馬相如上林賦注顔師古曰宜春宫名在杜縣東即今曲江池是其地也扶荔宫三輔黃圖在上林苑中漢武帝元鼎六年破南越起扶荔宫以植所得竒草異朩儲元宫通志在漢長安城中長安志馮昭儀與子信都王居儲元宫顔師古曰在上林苑中宣曲宫三輔黃圖在昆明池西孝宣帝曉音律嘗於此度曲因以為名太乙宫通志在西安城南五十里太乙山谷中漢元封初南山谷間雲起融結成象武帝於此建宫櫟楊宫唐書盧懷慎傳高祖受命五日一朝太公於櫟楊宫豫樟宫述異記漢武帝寶鼎二年立豫樟宫於昆明池中作豫樟亭昭臺宫三輔黃圖在上林苑中孝宣霍皇后處昭臺宫長門宫通志在長安城東三輔黃圖孝武陳皇后居長門宫長安志顧成廟無宿宫竇太主獻長門園如淳曰園在長門長門在長安城東南園可以為館宿處所故獻之上大喜更名竇太主園為長門宫今按漢書長安城無名長門者犬臺宫三輔黃圖在上林苑中長安西二十八里漢書江充召見犬臺宫注晉灼曰上林有犬臺宫外有走狗觀明堂三輔黃圖在長安城西南七里漢書武帝本紀武帝初即位嚮儒術以文學為本議立明堂於城南以朝諸侯黃山宫三輔黃圖在興平縣西三十里武帝微行西至黃山宫即此也漢書地理志右扶風槐里縣有黃山宫池陽宫元和郡縣志在涇陽縣西北八里三輔黃圖池陽宫在池陽南上原之陂有長年陂去長安五十里長楊宫雍勝略在盩厔縣東南三十二里三輔黃圖本秦舊宫至漢修飾之以備行幸宫中有垂楊數畝因為宫名長楊榭三輔黃圖在長楊宫秋冬校獵其下命武士搏射禽獸天子登此以觀焉射熊館三輔黃圖在長楊宫武帝好自擊熊司馬相如作賦諫焉漢揚雄長楊賦子墨客卿問於翰林主人曰蓋聞聖主之養民也仁霑而恩洽動不為身今年獵長楊先命右扶風左太華而右褒斜椓嶻嶭而為杙紆南山以為罝羅千乘於林莽列萬騎於山隅帥軍踤阹錫戎獲胡扼熊羆拖豪豬朩擁槍纍以為儲胥此天下之窮覽極觀也雖然亦頗擾於農民三旬有餘其厪至矣而功不圖恐不識者外之則以為娛樂之遊內之則不以為乾豆之事豈為民乎哉且人君以元默為神淡泊為德今樂逺出以露威靈數搖動以罷車甲本非人主之急務也蒙竊惑馬翰林主人曰吁客何謂兹邪若客所謂知其一未覩其二見其外不識其內者也僕嘗倦談不能一二其詳請略舉其凡而客自覽其切焉客曰唯唯主人曰昔有強秦封豕其土窫窳其民鑿齒之徒相與摩牙而爭之豪俊麋沸雲擾羣黎為之不康於是上帝眷顧高祖高祖受命順斗極運天關橫巨海漂崑崙提劒而叱之所過摩城邑下將降旗一日之戰不可殫記當此之勤頭蓬不暇梳飢不及餐鞮鍪生蟣蝨介胄被霑汗以為萬姓請命乎皇天乃展民之所屈振民之所乏規億載恢帝業七年之間而天下密如也逮至聖文隨風乘流方垂意於至寧躬服節儉綈衣不敝革鞜不穿大厦不居木器無文於是後宫賤玳瑁而踈珠璣却翡翠之飾除雕琢之巧惡麗靡而不近斥芬芳而不御抑止絲竹宴衎之樂憎聞鄭衛幻眇之音是以王衡正而泰階平也其後獯鬻作虐東夷橫叛羌戎睚眥閩越相亂遐氓為之不安中國蒙被其難於是聖功勃怒爰整其旅乃命驃衛紛紜沸渭雲合電發猋騰波流機駭蜂軼疾如奔星擊如震霆碎轒輼破穹廬腦沙幕髓余吾遂躐乎王庭驅槖駝燒蠡分剓單于磔裂屬國夷坑谷拔鹵莽刋山石蹂尸輿厮係纍老弱鋌瘢耆金鏃淫夷者數十萬人皆稽顙樹頜扶服蛾伏二十餘年矣尚不敢愓息夫天兵四臨幽都先加回戈邪指南越相夷靡節西征羌僰東馳是以遐方踈俗殊鄰絶黨之域自上仁所不化茂德所不綏莫不蹻足抗手請獻厥珍使海內淡然永亡邊城之災金革之患今朝廷純仁尊道顯義并包書林聖風雲靡英華沈浮洋溢八區普天所覆莫不沾濡士有不談王道者則樵夫笑之意者以為事罔隆而不殺物靡盛而不虧故平不肆險安不忘危乃時以有年出兵整輿竦戎振師五柞習馬長楊簡力狡獸校武票禽乃萃然登南山瞰烏弋西厭月􅒸東震日域又恐後世迷於一時之事常以此為國家之大務淫荒田獵陵夷而不禦也是以車不安軔日未靡旃從者倣佛骩屬而還亦所以奉太尊之烈遵文武之度復三王之田反五帝之虞使農不輟耰工不下機婚姻以時男女莫違出愷弟行簡易矜劬勞休力役見百年存孤弱帥與之同苦樂然後陳鐘鼓之樂鳴鞀磬之和建碣磍之虞拮隔鳴球掉八列之舞酌允鑠肴樂胥聽廟中之雍雍受神人之福祐歌投頌吹合雅其勤若此故真神之所勞也方將俟元符以禪梁父之基增泰山之高延光於將來比榮乎往號豈徒欲淫覽浮觀馳騁粳稻之地周流梨栗之林蹂踐芻蕘誇詡衆庶盛狖玃之收多麋鹿之獲哉且肓者不見咫尺而離婁燭千里之隅客徒愛胡人之獲我禽獸曾不知我亦巳獲其王侯言未卒墨客再拜稽首曰大哉體乎允非小人之所能及也乃今日發矇廓然已昭矣巳上長楊宫五柞宫雍勝略在盩厔縣東南三十八里漢書武帝本紀武帝後元二年幸盩厔作五柞宫三輔黃圖漢之離宫也宫中有五柞樹因以為名青梧觀西京雜記五柞宫西有青梧觀觀前有三梧桐樹樹下有石麒麟二枚刋其脅為文字是秦始皇驪山墓上物也巳上五柞宫葡萄宫雍勝略在盩厔縣境十道志葡萄宫在上林苑西漢書胸奴傳元夀元年單于來朝以太嵗厭勝所在舍之上林苑葡萄宫醴泉宫通志在醴泉縣東南三十里漢宣帝聞泉味如酒因以建宫唐貞觀重修縣因以名步夀宫通志在耀州東北一里漢書郊祀志神爵二年正月鳳皇集祋祤於所集得玉寶起步夀宫三輔黃圖秦亦有步夀宫今按其地與漢異則秦漢各有步夀宫耳後漢獻帝宫長安志在長安故城中本京兆府舍也帝王世紀獻帝聞關東兵起董卓遷帝都長安見未央等宫遭赤眉之亂宫室廢弛故居京兆府舍晉太極殿周地圖記晉愍帝之宫在長安南門後姚興重建西宫晉書前趙載記劉曜命起酆明觀立西宫太極前殿晉書前秦載記苻堅入長安稱天王大單于繕宗廟社稷置百官僭即皇帝位於太極前殿東宫晉書前秦載記苻健疾苻菁勒兵入東宫將殺苻生時生侍健疾菁回攻東掖門健聞變升端門陳兵執菁殺之平朔門晉書前秦載記苻健置來賔館於平朔門雲龍門長安志清河王苻法率壯士入雲龍門廢苻生而立苻堅明光殿長安志明光殿者秦苻堅之殿也露堂晉書前秦載記苻堅將為赦與王猛苻融密議於露堂明堂晉書前秦載記苻堅起明堂祀其伯健以配上帝東闕晉書前秦載記苻堅僭位五年鳳皇集於東闕西堂長安志車師前部鄯善王林密馱朝於秦堅賜以朝服引見於西堂徽音堂長安志在惡犬城之外苻氏造也永安宫長安志永安姚萇宫也東堂晉書後秦載記薑龕淳于岐郭高等皆耆儒碩德興每於聽政之暇引龕等於東堂講論道藝錯綜名理咨議堂晉書後秦載記姚興常臨咨議堂聽決疑獄於時號無寃滯西宫長安志姚興立姚見子監國入居西宫黃龍門長安志姚興之宫門也秦王殿通志在耀州北七十里今遺瓦殿基尚在耀州志上有御池泉即古鳳遊鄉也晉太元十一年苻堅將姚萇背堅起兵北地自立為王國號秦秦王殿蓋始於此南三十里入淳化境又有萇按軍厰云魏孝武帝宫北史魏孝武帝本紀永熙三年高歡入洛宇文泰迎帝入長安以雍州公廨為宫清暉室長安志魏文帝大統四年祀天於清暉室陽武門北史魏文帝本紀文帝大統五年十月於陽武門外縣鼓置紙筆以求得失憑雲觀北史魏文帝本紀大統七年十二月帝御憑雲觀引見諸王敘家人之禮乾安殿謹按長安志西魏有乾安殿周書閔帝紀會百官於乾安殿班賞各有差周承西魏都邑不改意此殿則自西魏而後周襲之歟後周延夀殿周書明帝本紀明帝元年九月朝羣臣於延夀殿正武殿長安志周明帝武帝並聽訟於正武殿麟趾閣周書蕭大圜傳蕭大圜恆以讀詩禮書易為事開麟趾殿招集學士大圜預焉露門周書武帝本紀武帝建德三年正月壬戌朝羣臣於露門玉海保定中置露門學大德殿周書武帝本紀武帝天和三年八月帝御大德殿集百僚及沙門道士等親講禮記咸陽宫周書宣帝本紀宣帝大象二年四月祈雨至咸陽宫醴泉宫周書武帝本紀武帝天和二年五月行幸醴泉宫雲陽宫北史後周有雲陽宫紫極宫見長安志又正陽宫天興宫崇義宫大武殿崇信殿會義殿含仁殿雲和殿思齊殿太極殿天德殿連珠殿重陽閣雲和樓天臺通道觀軍器監津門肅章門青城門青門應門皆後周所有隋大興京城隋書文帝本紀開皇二年六月詔左僕射髙熲等創造新都于龍首山十二月名新都曰大興城地理志開皇三年置雍州東西十八里南北十五里各一百七十五步東面通化春明延興三門南面啓夏明德安化三門西面延平金光開逺三門北面光化一門里一百六市二長安志隋文帝開皇二年自故都徙其地在漢故城之東南屬杜縣周之京兆郡萬年縣界雍録宇文愷之營隋都也曰朱雀街南北盡郭有六條高坡象乾卦六爻故於九二置宫殿以當帝王之居九三立百司以應臣子之數九五貴位不欲常人居之故置元都觀及興善寺以鎮其地皇城長安志亦曰子城東西五里一百一十五步南北三里一百四十步城中南北七街東西五街其間並列臺省寺衛自西漢以後至於宋齊梁陳並有人家在宫闕之間隋文帝以為不便於是皇城之內惟列市府不使雜人居止大興宫通志隋文帝建以城名大興殿通志宫城之正殿也隋書文帝本紀開皇四年宴突厥高麗吐谷渾使者于大興殿中華殿通志在大興殿後臨光殿隋書文帝本紀開皇元年二月上自相府常服入宫備禮即皇帝位于臨光殿昭陽門通志在大興殿之南開皇二年作初名唐陽門仁夀二年改今名又大興宫之南門為建春門後改通訓門北門為大興門後改乾福門巳上大興宫觀德殿隋書文帝本紀開皇二年十月上疾愈享百僚于觀德殿賜錢帛任其自取盡力而出射殿隋書文帝本紀開皇六年九月上御射殿召百僚射文思殿隋書文帝本紀開皇十一年春正月上御文思殿嘉則殿隋書文帝本紀開皇十三年二月宴考使於嘉則殿武德殿隋書文帝本紀開皇十九年大射武德殿宴賜百官允武殿隋書煬帝本紀大業五年正月百僚大射于允武殿崇德殿隋書煬帝本紀大業五年二月上御崇德殿之西院大業殿隋書煬帝本紀大業十二年春正月夜有二大鳥似雕飛入大業殿宣仁門隋書文帝本紀開皇元年三月宣仁門槐樹連理衆枝內附建國門隋書煬帝本紀大業六年正月有盜數十人入自建國門端門街隋書煬帝本紀大業六年正月角抵大戲于端門街天下竒技異藝畢集終月而罷謹按巳上殿八門二街一據書傳所載皆在大興城中東宫朝堂通志在皇城內長樂宫隋書地理志京兆郡大興有長樂宫通志望春宫在西安府城東十里隋文帝建煬帝改名曰長樂宫仙都宫福陽宫隋書地理志京兆長安有仙都福陽等宫仙林宫通志在興平縣西十八里隋文帝置太平宫通志隋建在鄠縣東南三十里草堂寺唐高祖避暑處遊仙宫通志在盩厔縣南三十五里舊圖經曰隋文帝避暑於此宜夀宫通志隋離宫在宜夀城中謹按通志宜夀城在盩厔縣南三十里崇業宫通志在渭南縣東十五里煬帝大業二年建醴泉宫隋書文帝本紀開皇七年二月車駕幸醴泉宫關中勝迹圖志卷四
