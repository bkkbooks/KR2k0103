縣矣又安得謂一漆縣冇兩漆水乎程大昌力辨其誤似不為無見故存其說以俟考臣謹按元和郡縣志謂漆水有二綿詩之漆在邠之新平而不在岐之普潤其說是也程大昌謂不當以一漆而著諸兩縣陜西通志辨之然其語意亦似謂普潤新平只一漆水而不知入渭入涇自有兩水不可融合臣嘗以考之經一章言公劉居豳即著沮漆之水二章乃言古公遷岐然則綿詩之漆安得謂其在岐而不在邠乎元和郡縣志謂新平縣西九里有漆水北流入涇禹貢錐指謂涇水今自邠州北東南流於永夀界漆水北流必注於涇是邠州漆水不特與綿詩合而亦即禹貢漆沮既從之漆水太平寰宇記以白土川當之是也然其謂恐是漢之漆水則又不然蓋漢志漆水以十三州志考之當是入渭之水班固言漆水在漆縣西今漆縣故城在麟遊樂史乃謂今麟遊縣東南有漆水南流與杜陽水合非漢之漆水其說正與班志相背臣竊以為方輿紀要白土川或謂之漆水此綿詩及禹貢之漆也許慎說文漆水出右扶風杜陽岐山東入渭乃是漢志之漆如此分屬殊不岐誤若其在耀州富平者源出同官又是一水與此兩漆水皆無與也岐水在麟遊縣西淮南子岐水出石橋山東南流論衡王季葬於滑山之尾樂水齧其墓水經注大欒水出杜陽縣西北大道川東南流入漆即故岐水也隋書地理志普潤縣有岐水太平寰宇記岐水即大欒水也源出普潤縣東南流入漆水杜水在麟遊縣南城下東南流入乾州界漢書地理志杜陽縣有杜水南入渭詩曰民之初生自土沮漆齊詩作自杜言公劉居杜與沮漆之地水經注水發杜陽縣大嶺側世謂之赤泥峴沿波歷澗俗名大橫水疑即杜水矣其水東南流徑杜陽故城世謂之故縣川二坑水注之水有二源一水出西北與瀆魋水合而東厯五將山又合鄉谷水水出鄉溪東南流入杜水謂之鄉谷川杜水又南合莫水隋書地理志普潤縣有杜水太平寰宇記杜水源出普潤縣東南溪澗間通志杜水出縣西五十里招賢鎮杜山之隂行石澗中東南流至舊九成宫西納鳳臺山北西海口一帶之水而其流始大蓋西海口納良舍西坊兩流也又東南納清水河一帶之水而其流愈大杜水又接排雲殿山細流而東徑縣南北受通濟橋五龍泉和尚泉等水又東則南受馬家溝口水又東折徑火星廟北過峽東轉合於澄水縣治居杜澄二水之中復折而過慈禪寺受石臼山史家河一派再折至柴石山後受吳雙以北之水而可以勝舟矣又數折北受縣東之尉遲澗水又受小花石溝水而其勢益大出縣境徑乾州又至武功入渭清水河在麟遊縣西十里通志合青蓮山箭括山下兩流北流入杜水謹按疑即水經注之二坑水五龍泉水在麟遊縣西南流入杜水通志水味作酒異常宋熙寧中王竦為記立石今不存澄水在麟遊縣東城下通志源出澄名里納北來嶺西河四郎廟峽內諸水東南入杜水謹按疑即水經注之鄉溪水尉遲澗水在麟遊縣東三十里通志入長安便道兩山險阻中橫一澗相傳太宗幸九成宫尉遲敬德開修輦路於此細川谷水在麟遊縣西太平寰宇記細川谷水在普潤縣南北流入涇州界一統志後魏永安中髙平賊帥万俟醜奴散營於岐州之北百里細川即此玉女潭在麟遊縣西南十五里名山記俗傳唐武后避暑九成宫時浴此通志潭在魚塘峽內其水自永安宫前流入此潭半山落下聲震巖谷四面屛山圍繞入畫隋文帝常遊宴於此醴泉在麟遊縣西五里唐魏徵醴泉銘序貞觀六年帝避暑九成宫歷覽臺閣閒步西城躊躇髙閣之下俯察厥土微覺有潤因以杖導之有泉隨而湧出乃承以石檻引為一渠味甘若醴雍勝略泉在九成宫中年久泉涸有醴泉碑銘魏徵撰歐陽詢書尚存又見古蹟已上麟遊渭水在隴州南百四十里自秦州清水縣入境又東入寶雞界水經注渭水東南出石門度小隴山徑南由縣南東與楚水合又東入散關元和郡縣志渭水在南由縣南四十里太平寰宇記渭水在隴安縣西南四十五里長蛇水在隴州西南山海經數厯之山楚水出焉而南流注於渭水經注楚水世所謂長蛇水出汧縣之數歷山南流徑長蛇戍東又南流注於渭闞駰以是水為汧水元和郡縣志長蛇川在南由縣西百步通志在吳山縣舊境內其流委曲如蛇後魏以此名縣金陵河在隴州東南四十里南村鎮西又東南流入寶雞界汧水在隴州南又東流入汧陽界史記周孝王使非子養馬於汧渭之間漢書地理志汧縣汧水出西北入渭續漢書郡國志汧水出汧山水經注汧水出汧縣之蒲谷鄉弦中谷爾雅曰水决之澤為汧汧之為名實兼斯舉水有二源一水出縣西小隴山其水東北流歷澗注以成淵潭漲不測出五色魚俗以為靈莫敢採捕因謂是水為魚龍水自下亦通謂之魚龍川川水東徑汧縣故城北又東歷澤亂為一右合龍泉又東會一水自水會上下咸謂之魚龍川又東徑隃麋澤謹按隃麋縣今屬汧陽隋書地理志汧陽縣有汧水括地志源出汧源縣西南汧山東入渭録異記隴州路七十餘里有洞中有石或大或小隨水流出破之皆有魚龍形過者並不敢語語者便聞風雷之聲通志汧河源出汧山東流會北河東南入汧陽界濱水之地自州西至汧陽寶雞幾二百里謂之汧川唐許棠汧湖詩偶得湖中趣都忘隴坻愁邊聲風下雁楚思浪移舟靜極亭連寺涼多島近樓吟遊終不厭還似曲江頭白環谷水在隴州西九域志吳山縣有白環水金史地理志汧源縣有白環水通志水流如環故名蒲峪水在隴州西二十里周官職方氏其澤藪曰弦蒲注弦蒲在汧鄭司農云弦蒲或為汧浦爾雅九藪秦有楊陓郭璞注楊陓在汧水經注汧水出蒲谷鄉弦中谷決為弦蒲藪九域志汧源縣有弦蒲藪州志弦蒲藪在州西四十里謹按楊陓即弦蒲今州西四十里尚冇蒲峪寨則其為古之蒲谷鄉無疑也金泉水在隴州東四十里水經注汧水右合龍泉泉徑五尺源流奮通淪漪四泄東北流注於汧通志金泉在州東南梨林川水出如注汚之即涸俗傳昔人得金鞭於此州志一名白龍泉八渡河在隴州東南俗名一水河水經注汧水又東會一水發南山西側山下石穴廣四尺髙七尺水溢石穴懸波側注發源成川北流注於汧州志一水河發源望輦峰左旋繞廟前東北流入汧水又神岔溝在閬苑西三里許一通五峰山壑一通一水河源即宋吳玠敗金人處謹按水經注云汧水有二源一水出縣西山一水發南山西側二源皆汧水也本文甚明自昔人誤謂一水為水名而不察汧有二源之語遂呼為一水其謬甚矣今特為正之巳上隴州關中勝蹟圖志卷十七
