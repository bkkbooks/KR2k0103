body:
  text: 關中勝蹟圖志卷十七陜西巡撫臣畢沅撰大川附水利鳳翔府雍水在鳳翔縣南又東南流入岐山界水經注雍氷出雍山東南流歷中牢溪世謂之中牢水亦曰氷井水南流而左會左陽水又與東水合世亦名之為淬空水又東流鄧公泉注之汧水在鳳翔縣西三十里自汧陽縣流入通志一名汧陽河返眼泉水在鳳翔縣西北三十里即東水水經注東水北出河桃谷南流右會南源世謂之返眼泉亂流南徑岐州城東而南合雍水州居二水之中南則兩川之交會也通志泉出似人返眼故名塔寺水在鳳翔縣東二里即左陽水一名西水水經注左陽水世名之西水北出左陽溪南流徑岐州城西又南流注於雍水縣志左陽水行十里至西平伏不見伏三十里至三岔復出東流合於塔寺河府志塔寺河在城東從西來轉南達於雍水又鳳凰泉在城西北繞城而流南合於塔寺河鄧水在鳳翔縣北十里即鄧公泉水經注水出鄧艾祠北故名數源俱發徑雍縣城南又東流注於雍水橫水在鳳翔縣東三十里一名小橫水一名杜陽川又名夜叉河東南流入岐山界水經注杜水出杜陽山其水南流謂之杜陽川又東南流左會漆水俗謂之小橫水東湖在鳳翔縣東門外一統志即宋蘇軾詩鳳翔八觀之一也岐州水苦鹽濁獨此水味絶甘美多芰荷修竹為郡中遊覽之勝通志其水南流入雍水宋蘇軾東湖詩吾家蜀江上江水緑如藍邇來走塵土意思殊不堪況當岐山下風物尤可慙有山禿如赭有水濁如泔不謂郡城東數步見湖潭入門便清奧恍如夢西南泉源從高來隨波走涵涵東去觸重阜盡為湖所貪但見蒼石螭開口吐清草借汝腹中過胡為目耽耽新荷㺯晚涼輕棹極幽探飄飄忘逺近偃息遺佩篸深有龜與魚淺有螺與蚶曝晴復戲雨戢戢多於蠶浮沈無停餌倐忽遽滿籃絲緡雖強致瑣細安足戡聞昔周道興翠鳳棲孤嵐飛鳴飲此水照影㺯毿毿至今多梧桐合抱如彭聃翠羽無復見上有鸇搏䳺嗟豫生雖晚好古意所妉圖書巳漫漶猶復訪僑郯卷阿詩可繼此意久巳合扶風古三輔政事豈汝諳聊為湖上飲一縱醉後談門前逺行客劫劫無留驂問胡不回首無乃趁朝參豫今正疏懶官長幸見函不辭日遊再行恐嵗滿三暮歸仍倒載鐘鼓已韽韽臣謹按方輿紀要鳳翔東湖為雍渭二水所溢今考雍水在湖下流若渭水則相距頗逺無由溢入嘗閲宋蘇軾詩泉源從髙來隨波走涵涵東去觸重阜盡為湖所貪今城西北有鳳凰泉繞城而流南合於塔寺河詳軾詩意乃因泉水涓流滙而為澤軾詩又云聞昔周道興翠鳳棲孤嵐飛鳴飲此水照影㺯毿毿自注此飲鳳池也益可見即泉之所瀦矣當日湖潭清奧與渼陂􅜁水並傳名勝嵗久就堙舊有湖亭及軾祠宇亦多傾圮臣於乙未春初護送川師入蜀經歷鳳翔飭為重加葺治灌莽既闢清流瑩然蒲稗因依榆栁映蔚庶幾昔賢遺跡復還舊觀按軾八觀詩一為石鼓舊在縣南二十里石鼓原唐鄭餘慶守鳳翔遷之孔廟軾時猶及見之大觀中移置汴京元皇慶二年復輦致大都今在國子監一為詛楚文軾詩自注碑獲於開元寺土下今在太守便㕔按詛楚文傳有數本今石碣均已湮沒一為開元寺王維吳道子畫一為天柱寺楊惠之塑維摩像今二寺雖有其名不特畫壁塑像久而不存即梵宇亦俱非舊制一為李氏園禾黍彌望一為真興寺閣故址莫尋惟秦穆公墓在城東南隅今置守冢而東湖尚為岐下勝遊八觀陳迹遺留僅此而巳飲馬池在鳳翔縣南七里相傳為秦穆公飲馬處槖泉在鳳翔縣城內東南隅通志其泉注水旋盈旋涸有似無底故名槖泉謙泉在鳳翔縣東關外通志泉甘可飲盈而不溢有似乎謙故名虎跑泉在鳳翔縣東北十五里通志在大像寺前一名金沙泉巳上鳳翔渭水在岐山縣南四十里自寶雞界流入又東入郿縣界水經注渭水自合磻溪水又東徑石原南又東徑五丈原北又東至郿縣白玉溝水在岐山縣南五十里通志渭南小水也源出五丈原西北流入渭斜谷河在岐山縣南自褒城界流入又東北至郿縣界入渭史記河渠書褒水通沔斜水通渭褒之絶水至斜間百餘里括地志斜水出衙嶺山與褒水同源而泒分通志桃川在縣南百五十里其水出大山中流為斜谷水徑太白峽斜谷關北流入渭一名石頭河又青峰澗水在縣南百五十里桃川西朱石澗水在縣南百一十里俱在斜谷關內繚曲四十里北流入渭雍水在岐山縣南十里自鳳翔界流入又東入扶風界水經注雍水自合鄧公泉又東徑召亭世謂之樹亭川蓋召樹聲相近而誤耳又東南流與杜水合謹按今雍水在岐山者俗名濉河一名後河至扶風縣合湋水自下又通名為湋水亦名白水皆即雍水之訛也橫水在岐山縣南三里自鳳翔界流入合雍水通志即杜水水經注杜水東南合漆岐二水俗謂之小橫水或名之米流川徑岐山西又屈徑周城南又厯周原下自下亦名岐水又東徑姜氏城南為姜水與雍水合縣志潢河一名水南河自鳳翔界流來合潤德泉水又徑縣西有南寺溝水自實相寺南流入之又八畝溝水自縣城北來流入之潢河又東南流會濉河為交河亦名雙溪謹按潢河即橫水亦以木而訛水也潤德泉水在岐山縣西北十五里周公廟後通志即古卷阿也唐大中元年十月大風忽作飛泉噴湧節度使崔珙上其事褒賜今名又流徑縣西七里為佛兒溝宋蘇軾周公廟詩廟在岐山西北七八里廟後百許步有泉依山湧洌異常國史所謂潤德泉也吾今那復夢周公尚喜秋來過故宫翠鳳舊依山硉兀清泉常與世窮通至今遊客傷離黍故國諸生詠雨濛牛酒不來烏鳥散白楊無數暮號風湋水在岐山縣東又東南合雍水流入扶風界漢書溝洫志關中有湋渠如淳注湋水出湋谷元和郡縣志扶風縣南湋川水近代訛作圍太平寰宇記源出縣東北六里湋谷東縣志湋水一名白水亦名圍川唐以此名縣又魯班溝水在縣東十里龍尾溝水在縣東二十里麻葉溝水在縣東二十里俱有小水南流入交河通志按太平寰宇記則湋水出於縣境當即魯班溝諸水乃今皆直指雍水為湋川矣岐水在岐山縣北源出麟遊縣普潤里東南流入漆水斜谷河渠在岐山縣南一百五十里一統志一名石頭河其水灌田甲於他處已上岐山雍水在扶風縣南門外自岐山界流入又東入武功界水經注雍水自合姜水又東徑美陽縣之中亭川謹按美陽故城在縣北元和郡縣志湋川縣以縣湋水為名謹按唐湋川縣即今治縣志湋水一名白水即雍水城數患水勢衝激明知縣黃鉉築隄植栁以障之今隄尚存畤溝河在扶風縣東十步俗名漆水通志源出縣西北五十里自岐山界龍泉寺流來至縣東門外合湋水謹按此水入雍水與麟遊縣入小橫水之漆水别為一水縣志引綿詩疑誤美水在扶風縣東十五里一名浪店溝通志源出美山徑美陽故城至縣東浪店南入湋水又石槽澗在縣北鳳泉西兩山壁立古柏從石罅中出狀如龍蛇其下為石澗波濤漱激泰川水在縣東北二十五里源出呂寨之溫泉隆冬不氷南流合於美水信義泉在扶風縣東二十里信義村通志形如盆口隨汲隨盈不汲亦不溢其味甘洌鳳泉在扶風縣東北五十里雍勝略在明月山西相傳文王時鳳鳴岐山曾飲於此通志泉在天度鎮北十里其泉為瀦水時或溢出檻外已復縮入有禱輒應人稱靈異又明月山隂有碗泉在鳳泉之後水自石罅下注於石其形如碗故名又馬泉在鳳泉東十里已上扶風渭水在郿縣北三里自岐山界流入又東入盩厔界水經注渭水東徑積石原又東徑五丈原北又東徑郿縣故城南又東徑武功縣北斜水自南注之又東徑馬冢北又徑武功縣故城北又東合雍水通志渭河自入縣界徑西磑汶家村又徑縣北東流過槐芽鎮柿林里至龍舞屯凡流七十五里出縣界斜谷河在郿縣西南三十里與岐山接界漢書地理志武功縣斜水出衙嶺山北至郿入渭水經注斜水出武功縣西南衙嶺山北歷斜谷徑五丈原東以出武功縣亦謂之武功水其水北流注於渭通志斜谷河分導縣境者曰清水河徑馬鞍山循紅崖東北流二十里入渭源微而委緩清徹可鑒故名其東導一派曰磨渠河徑景家橋與蒼龍谷水合亦曰蒼谷水東入乾溝河以在城南亦名南河乾溝河在郿縣東五里通志其源有五一名五谷水一曰磨石谷水出滴水崖合井索谷水水出觀音池徑曲兀堡合萬户谷水又徑西梁閣合桐谷水稍東又合駱谷水徑洪寺谷合流紆曲四十餘里雨潦時五谷水皆會旱則絶流故名乾溝謹按此駱谷别是一水非盩厔之駱谷水也赤谷水在郿縣東二十五里縣志駱谷之東有赤谷水俗呼紅河源出太白湫名太白峽水自山巖噴飛而下出谷分三派其徑河底注渭者曰洪溝河又名寧曲河其徑第二坡由教坊注渭者曰教坊河其徑馬頭原清湫里者曰清湫河北流二十里入渭又有黑谷水在赤谷水東出於滴水崖在南山寨坪坪下有潭清徹見底再南即四嘴山有白馬仰天池或曰即谷水之源也北流入於清湫河山河在郿縣東三十里清湫河東通志源發太白湫出潭谷口流二十餘里為槐芽泉其水湍激西流注於渭湯谷河在郿縣東五十里唐書地理志郿縣有鳳泉湯通志隋唐之鳳泉縣以此名謹按鳳泉故城在縣東湯為隋唐勝蹟其南有魚洞每嵗穀雨前有金鯽浮游少焉大魚湧出三日乃止有鱗鬛異常者亦名魚龍泉其水出碌碡崖徑鍾呂坪出谷口北流二十五里入渭以源發湯谷又名湯谷河兩谷河在郿縣東通志大振谷水俗稱仙人峽水在湯谷東源出燕子窩北流二十里至睡佛寺與韋谷水合名為兩谷河河有怪石多沙又名沙河北流二十里至太白廟入渭其韋谷水俗訛為泥谷源出掃帚嶺北流合大振谷水入渭謹按韋谷水亦見盩厔石麓廟渠在郿縣南三十里通志引斜谷關水以達於石麓廟堡之前後左右分為四渠頗資灌溉金渠在郿縣東南二十里通志引洪溝河水至寧曲堡寧曲地皆砂石不能鑿井康熙八年知縣梅遇鑿石開甽以通水路自寧曲以上為居民食水自寧曲而下灌坂下田數百頃寧渠民居成集遂興市集名曰金渠集巳上郿縣渭水在寶雞縣南一里自隴州流入又東入岐山界水經注渭水東與楚水合又東入散關又東徑西武功北與扞水合又東右合南山五溪水諸澗流注之又東徑陳倉縣西陳倉水東南注之渭水又東與綏陽溪合又東徑郁夷故城南汧水入焉渭水之右磻溪水注之又東徑石原謹按西武功故城在縣西南又按太平寰宇記郁夷故城在隴州西則渭水不應徑陳倉而復徑郁夷也疑傳寫之誤陸川在寶雞縣西二十五里通志即楚水一名長蛇水水經注楚水南流徑長蛇戍又南流注於渭塔河在寶雞縣西南十五里自鳳縣界來東北流入於渭通志即扞水水經注扞水經故道縣西又東北歷大散關入渭謹按故道縣今屬鳳縣清澗河在寶雞縣南五里東北流入渭通志瀑布泉在縣西南七十里出煎茶坪山頂懸流如布即清澗河源也謹按此當即酈注之五溪水也金陵河在寶雞縣東五里源出五峰山南流入渭通志在渭水北自隴州流入縣境又南徑陵原入渭清水在寶雞縣東南二十里通志即陳倉水水經注陳倉水出陳倉山下東北流注於渭汧水在寶雞縣東三十里自汧陽界流入又東南入渭水經注汧水徑郁夷縣又徑平陽故城南又東流注於渭水謹按平陽今屬岐山縣通志一名汧陽河出隴州北入境東南流六十里入渭洛谷水在寶雞縣東南六十里源出南山北流入渭通志即綏陽水水經注綏陽溪水上承斜水自斜谷分注綏陽溪北届陳倉入渭箕谷水在寶雞縣東南六十五里源出箕谷北流三里入渭方與紀要蜀