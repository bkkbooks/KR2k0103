  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0103_WYG_009-1a, image: WYG0588/WYG0588-0619a.png}
body:
  text: 闗中勝蹟圖志巻九陜西巡撫臣畢沅撰地理同州府釋名路史春秋地圖同州為國地州之取名以此謹按同州志城南九龍泉九源同流故名亦足備一説沿革一統志治在省城東北二百四十里禹貢雍州之域戰國時魏臨晉邑秦置臨晉縣漢屬左馮翊後漢建安初為馮翊郡治晉改縣曰大荔後魏太和十一年置華州及華山郡改縣曰華隂西魏改郡縣皆曰武鄉改州曰同州元和郡縣志禹貢云漆沮既從灃水攸同言二水至此同流入渭城居其地故曰同州也隋開皇初廢郡存州大業初改縣曰馮翊改州為馮翊郡唐武德初復曰同州天寳初曰馮翊郡乾元初復曰同州隸闗内道五代因之宋曰同州馮翊郡定國軍節度屬永興軍路金屬京兆府路元初以州治馮翊縣省入屬奉元路明屬西安府同州府志本朝雍正三年直隸陜西布政使司領縣四曰朝邑郃陽澄城韓城十三年改置同州府以州所治置附郭大荔縣復改華州直隸州及所領之潼闗縣為㕔華隂蒲城二縣並来屬焉又以耀州所屬之白水来附今共領縣八曰大荔朝邑郃陽澄城韓城華隂蒲城白水州一曰華州㕔一曰潼闗府城通志城昉於秦盖厲共公滅大荔而築者元魏改州治於李潤堡刺史元燮表還馮翊舊城唐易為方城明嘉靖乙卯地震城圮重築周九里有竒髙三丈池深丈餘廣倍之門四東南曰大安西南曰普濟東北曰長寧西曰永定大荔縣同州府志附郭釋名魏晉縣名晋武帝以大荔戎築城於此因以名縣沿革本朝雍正十三年升同州直隸州為府以州所治地置今縣地理沿革與府治同朝邑縣釋名通志本南五泉西魏改朝邑元和郡縣志以北據朝坂故以為名沿革一統志治在府東三十里漢臨晉縣地後魏太和十一年置南五泉縣屬澄城郡西魏改曰朝邑隋屬馮翊郡唐初屬同州乾元三年割屬河中府改名河西大厯三年復曰朝邑仍屬同州五代宋金元明不改本朝因之縣城明景泰二年建嘉靖乙卯地震後重築周四里門五郃陽縣釋名通志本有莘國詩所謂在洽之陽也春秋晉為合陽邑漢以名縣水經注云城南有郃水縣取名焉沿革一統志治在府東北一百里漢縣屬左馮翊後漢初廢永平二年復置仍屬左馮翊晉因之後廢後魏太和二十年復置屬華山郡後周屬澄城郡隋屬馮翊郡唐武德三年割屬西韓州貞觀八年還屬同州五代梁改屬河中府後唐天成元年復故宋因之金貞祐三年改屬楨州元初復屬同州明不改本朝因之縣城西魏大統三年同州刺史王羆建後圮明正統十四年重築周八里有竒門四澄城縣釋名通志本春秋晉徵邑漢置徵縣後魏為澄城縣元和郡縣志徴澄同音後人悞為澄沿革一統志治在府北一百里漢徵縣屬左馮翊後漢廢晉為郃陽縣地後魏太平真君七年置澄城縣兼置澄城郡隋開皇初郡廢以縣屬馮翊郡唐屬同州五代梁改屬河中府後唐同光中復故宋金元明不改本朝因之縣城通志後魏時建周三里有竒門四韓城縣釋名通志本周韓侯國雍勝略隋置韓城縣以古韓國為名沿革一統志治在府東北二百二十里本古梁國戰國初魏少梁邑秦置夏陽縣漢屬左馮翊後漢因之晉屬馮翊郡後魏屬華山郡後省入郃陽隋開皇十八年改置韓城縣屬馮翊郡唐武德三年屬西韓州八年徙州治此貞觀八年州廢以縣屬同州天祐二年改名韓原縣五代梁改屬河中府後唐天成元年復曰韓城還屬同州宋因之金貞祐三年升為楨州元至元二年州廢六年以縣屬同州明不改本朝因之縣城通志詩溥彼韓城燕師所完者後無考唐王勃有登城樓寓望序金大定四年改置楨州修築之周四里百五十九歩門四華隂縣釋名通志本禹貢華隂地太平寰宇記漢改華隂以在太華之隂故名沿革一統志治在府南百六十里戰國魏隂晉邑秦恵文王六年更名寧秦漢髙帝八年改曰華隂屬京兆尹為京輔都尉治後漢建武十五年改屬宏農郡晉因之後魏屬華山郡隋屬京兆郡唐屬華州垂拱元年改曰仙掌神龍元年復曰華隂上元二年改曰太隂寳應元年復曰華隂五代金元明不改本朝因之同州府志初屬華州雍正十三年改屬同州府縣城本隋唐舊址元至正十八年逹嚕噶齊托里巴修築明嘉靖四十二年重築周二里九分門三蒲城縣釋名太平寰宇記以縣東故蒲城為名也或云以縣東有蒲池即小蒲川沿革一統志治在府西八十里秦置重泉縣漢屬左馮翊後漢因之晉屬馮翊郡後廢後魏太和十一年置南白水縣屬白水郡西魏改縣曰蒲城隋屬馮翊郡唐初屬雍州開元四年改曰奉先天祐三年改屬同州後唐還屬雍州宋建隆中屬同州開寳四年復曰蒲城天禧四年改屬華州金元明不改本朝因之同州府志雍正十三年改屬同州府縣城通志西魏時建明景泰嘉靖間修周八里有竒門四白水縣釋名雍大記秦置白水縣以縣臨白水也沿革一統志治在府西北百三十里漢置粟邑縣屬左馮翊後漢初廢永元九年復置晉因之後廢後魏太和二年始置白水縣兼置白水郡隋郡廢以縣屬馮翊郡唐屬同州五代宋金元明不改本朝雍正三年屬耀州同州府志十三年改屬同州府縣城通志相傳唐尉遲恭監築元末兵燹主簿丁華權移治於南臨川明洪武三年還舊治後屢修築周五里門四華州釋名通志州南有少華山東連太華故以取名焉沿革一統志治在府南百八十里周為鄭國春秋屬晉戰國為秦魏二國境秦置鄭縣漢屬京兆尹後漢因之晉屬京兆郡後魏太平真君元年置華州郡孝昌二年置東雍州西魏始改州曰華州隋開皇三年郡廢大業二年州廢縣屬京兆郡義寧元年復置華山郡唐武德初仍曰華州垂拱元年改曰太州神龍元年復故天寳初改華隂郡乾元初復故上元元年又改太州寳應元年仍曰華州屬闗内道乾寧四年升州為興德府光化三年復曰華州五代因之宋曰華州華隂郡兼鎮潼軍節度屬永興路金屬京兆路元以州治鄭縣省入屬奉元路明屬西安府本朝雍正三年直隸陜西布政使司同州府志十三年改屬同州府州城通志唐永泰元年節度使周智光建元至正中拓修明嘉靖乙夘地震城圮重築周七里有竒門四潼闗㕔釋名通志潼闗因地有潼水後漢設闗名明以名衛本朝以名縣因闗舊名也沿革一統志治在府西北六十里漢華隂縣地後漢建武中始置潼闗明洪武七年設潼闗守禦千戸所屬陜西都司九年置潼闗衛屬河南都司永樂六年改隸中軍都督府本朝改隸西安府雍正二年裁潼闗衛歸併同華等州五年置縣屬華州同州府志十三年改屬同州府城垣通志宋熙寧中侍御史陳泊築明洪武五年重築後屢修北臨洪河東南跨麒麟山西南跨鳯象二山周一十七里有竒門六闗中勝蹟圗志巻九
