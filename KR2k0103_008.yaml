body:
  text: 關中勝迹圖志卷八陜西巡撫臣畢沅撰古迹郊邑西安府上古造書臺雍勝略長安縣西三十里三會寺有臺即蒼頡造書處法苑珠林唐西明寺道宣律師逐靜在京師城南故靜業寺修道忽有一人來至律師所問今西京髙四土臺俗云是蒼頡造書臺如何答曰蒼頡於此臺上增土造臺觀鳥迹者非無其事又有天人姓陸名元暢來謁律師云所聞髙四土臺者本迦葉佛於此第三會説法度人至穆王時文殊目連來即列子所謂化人者也云髙四臺是迦葉佛説法處因造三會道場至秦穆公時扶風獲一石佛穆公棄馬坊中穢汚此像公夢之上帝所極被責疏覺大怖又欲造佛像於髙四臺臺上造重閣髙三百尺人號髙四臺曰髙四樓唐岑參題三會寺蒼頡造字臺詩野寺荒臺晚寒天古朩悲空階有鳥迹猶似造書時隂康氏陵路史隂康氏葬浮肺山之隂注驪山也冢今存焉華胥渚通志在藍田縣北三十五里伏羲氏母居也今陵及華胥溝育聖橋枯棗樹俱存尊盧氏陵通志在藍田縣東三十里玉山之西路史尊盧氏葬浮肺山之隂注即今藍田山見後魏風土記流金泊通志在涇陽縣北五十里黃帝鑄鼎處夏三過村鄠縣志在縣北二十里按輿地志鄠古崇國也連山易云顓頊五代孫鯀封於崇史記鯀治水功用不成禹痛父罔功八年三過其門不入今三過村舊傳即其處也甘亭長安志在鄠縣西南五里漢書在甘水之東長水鄉史記夏本紀注馬融曰甘有扈氏南郊地名索隱曰夏啓所伐扈南有甘亭商亳亭史記六國表注徐廣曰京兆杜縣有亳亭王季陵通志在鄠縣西五里渼陂村戰國䇿昔王季葬於楚山謹按論衡作滑山之尾欒水謹按即大欒水出鱗逰齧其墓史記周本紀注皇甫謐曰葬鄠縣之南山鄠縣志春秋祀焉周文王陵通志在咸陽縣北一十五里畢原上山海經狄山文王葬其所竹書紀年文王葬畢西於豐三十里長安志漢書曰太子發上祭於畢下至於盟津畢文王墓近鎬也會典文武成康陵俱陜西西安府祭武王陵咸陽縣志在文王陵北汲冡周書成王元年夏六月葬武王於畢成王陵咸陽縣志在文王陵西南長安志在縣西北二十里康王陵咸陽縣志在文王陵東南長安志在縣北十五里通志成王陵盩厔分祭康王陵鄠縣分祭穆王陵長安志在長安縣西南二十五里張恭村村近咸陽恭王陵咸陽縣志在文王陵南周公墓咸陽縣志在文王陵東墓前有廟史記魯世家周公在豐病曰必葬我成周以明吾不敢離王既卒成王葬周公於畢以明不敢臣周公也太公墓咸陽縣志在文王陵東史記齊世家注太公封於營邱比及五世皆反葬於周八士墓咸陽縣志在縣東五十里烽火樓雍勝略在驪山上第一峰史記周本紀褒姒不好笑幽王欲其笑舉烽火諸侯至而無寇乃大笑幽王城長安志一名幽王壘在臨潼縣東南戲水上城髙八尺周二百尺十步國語曰幽王滅於戲蘇林曰新豐縣東南戲亭是也有陵在焉長安志兩京道里記曰陵髙一丈三尺周二百步扁鵲墓通志在臨潼縣東北三十里史記扁鵲傳扁鵲渤海郡鄭人謹按徐廣曰鄭當為鄚為醫名聞天下來入咸陽秦太醫令李醯自知伎不如鵲使人刺殺之老子墓通志在盩厔東南三十里水經注曰就水北徑大陵即此今吾老洞有老子首骨石函土封覆以屋水經注大陵世謂之老子陵昔李耳為周柱史以世衰入戎於此有冢事非經證然莊周著書云老聃死秦失弔之是非不死之言秦子午鎮通志在長安縣南五十五里宋景佑三年置以南山子午谷名舊有子午關戰國䇿秦張儀曰秦一軍塞午道鮑彪注北山是子南山是午顔師古曰今京城直南山有谷通梁漢道者名子午谷三秦記長安正南山名秦嶺谷名子午胡三省通鑑注唐廣德二年吐蕃既去亡軍逃卒猶竄伏南山子午等五谷為患南山西接岐山東抵虢州界谷之大者有子谷駱谷斜谷藍田衡嶺五谷通鑑地理通釋梁王神念以舊路沿山避水橋梁多毁别開乾路更名子午道即此路是也舊道在今金州安康縣界語曰山水險阻黃金子午魏張郃由子午欲攻漢中曹真從子午南入漢中桓溫伐秦命司馬勛出子午道漢平帝元始五年王莽通子午道從杜陵直絶南山徑漢中因置關宋於子午谷口置陽嶺寨西城路置渭門寨分水寨皆偹禦之要中橋渡即古中渭橋長安志在縣西北二十五里括地志本名橫橋架渭水上橋對橫門故名史記文帝紀代王至渭橋注蘇林曰在長安故城東三里索隱曰咸陽宫在渭北興樂宫在渭南秦通兩宫之間作渭橋漢書張釋之傳文帝行出中渭橋有人從橋下過驚乘輿馬注索隱曰渭橋有三所一在城西北咸陽路曰西渭橋一在東北髙陵路曰東渭橋其中渭橋在故城之北三輔黃圖渭水貫都以象天漢橫橋南渡以法牽牛水經注渭水經長安縣北水上有梁謂之渭橋秦制也亦曰便門橋橋廣六丈南北二百八十步六十八間七百五十柱一百二十二梁南北有隄激立石柱柱南京兆立之柱北馮翊立之有令丞各領徒一千五百人橋之北首壘石水中故謂之石柱橋後董卓入關遂毁此橋魏武帝更造橋三丈六尺通鑑晉永和十二年秦主生發三輔民治渭橋元和郡縣志劉裕入關又毁之後魏重造唐貞觀十年移於今所雍録舊名渭橋因西有便門橋東有東渭橋故加中以别之水經注又名為便門橋亦取通渭南北往來皆便也邵平瓜田雍勝略在舊長安城東門外今長安縣之西北也水經注廣陵人邵平為秦東陵侯秦破為布衣種瓜青門外瓜美世謂之東陵瓜皇子陂長安志在萬年縣南二十五里水經注皇子陂在樊川太平寰宇記陂在啓夏門南三十里陂北原上有秦王子冢因以為名杜甫詩天寒皇子陂隋文帝改曰永安陂周回九里蘭池陂雍勝略在咸寧縣東二十五里三秦記始皇引渭水為長池東西二百里南北二十里築為蓬萊山刻石為鯨魚長二百尺亦曰蘭池陂昭襄王墓史記秦始皇本紀葬茝陽通志括地志云在雍州新豐縣西南三十五里以地計之當在咸寧界中孝文王壽陵通志在咸寧縣通化門外史記秦始皇本紀孝文王葬壽陵注陵在雍州萬年縣東北二十五里莊襄王陵通志在咸寧縣通化門外今青門大冢是或曰韓信冢非也史記莊襄王葬茝陽注括地志云陵在雍州新豐縣西南三十五里始皇陵在北亦謂為見子陵二世皇帝陵咸寧縣志在宜春苑南史記秦始皇本紀趙髙以黔首葬二世杜南宜春苑中注括地志云陵在雍州萬年縣南三十四里章邯臺通志在興平縣東南十里按項羽封章邯為雍王都廢邱故有此臺露臺通志臨潼縣驪山東南三十里秦始皇露臺在焉坑儒谷長安志在臨潼縣西南五里漢書儒林傳注師古曰今新豐縣溫湯之處號愍儒鄉溫湯西南三里有馬谷谷之西岸有坑古相傳以為秦坑儒處也佷石長安志在臨潼縣東十里秦始皇陵東南二里形似龜初始皇逺採此石將致之驪山至此不復動石崇一丈八尺周十八步始皇陵通志在臨潼縣一十五里史記秦始皇本紀始皇初即位穿治酈山及并天下以七十餘萬人穿三泉下銅而致槨宫觀百官竒器珍怪徙滿藏之令匠作機弩矢有所穿近者輒射之以水銀為百川江河大海機相灌輸上具天文下具地理以人魚膏為燭度不滅者久之漢書劉向傳始皇葬酈山之阿下錮三泉上崇三墳其髙五十餘丈周回五里有餘石槨為遊館人膏為燈燭水銀為江海黃金為鳬鴈項籍燔其宫室營宇往者咸見發掘其後牧兒亡羊羊入其鑿師古注鑿所謂穿冡藏者牧者持火照求羊失火燒其藏槨漢舊儀始皇使丞相李斯將天下刑人徒隸七十二萬人作陵三十七歲深極不可入奏之曰丞相臣斯昧死言臣所將隸徒治驪山者已深巳極鑿之不入燒之不然叩之空空如下天狀制曰其旁行二百丈乃止水經注始皇大興厚葬營建冢壙於麗戎之山斬山鑿石旁行周回三十餘里墳髙五丈項羽入關發之以三十萬人三十日運物不能窮關中盜賊銷槨取銅牧人尋羊燒之火延九十日不能滅博物志始皇陵在驪山泉本北流障使東西流又運取大石於渭北渚故歌曰運石甘泉口渭水為不流千人唱萬人謳金陵餘石大如塸土屋其餘功力皆如此類兩京道里記陵髙一千二百四十尺內院周五里外院周十一里俗呼當陵蓋以南嶺作望峯言築陵望此為凖都穆驪山記始皇陵內城周五里舊有門四外城周十二里其址俱存自南登之二邱並峙人曰此南門也右門石樞猶露土中陵髙可四丈昔項羽黃巢皆嘗發之老人云始皇葬山中此特其虛冢子嬰墓臨潼縣志子嬰扶蘇墓在新豐西北隅鐘官城元和郡縣志一名灌鐘城在鄠縣東北二十五里秦始皇收天下兵器銷為鐘鐻處藍田關元和郡縣志在藍田縣東南九十八里括地志即秦嶢關也史記髙帝紀秦王子嬰遣將拒嶢關沛公引兵繞嶢關踰蕢山擊秦軍大破之注應劭曰嶢山之關李竒曰在上洛北藍田南武關之西水經注渥水西徑嶢關北歷嶢柳城又魏土地紀嶢關地名嶢柳道通荆州雍録藍田縣即嶢柳城也水經亦謂之青泥城嶢山在縣南二十里故又名嶢關亦名藍田關通典七盤十二䋫藍田之險路太平寰宇記後周明帝元年自嶢關徙置青泥故城側改曰青泥關武帝建德二年改為藍田關隋煬帝大業元年徙復舊所藍田關因縣為名灰塠通志在渭南縣西南五里崇三十尺周一百步俗傳秦始皇焚書處王翦墓通志在富平縣東四十里縣志翦墓左六冢相傳為六國圖書每歲二月八日鄉人望其墓若海市狀謹按關中陵墓志作六月朔望日城闕依然車馬交錯其上豈地氣使然歟孟薑女墓通志在同官縣北三里女回山雍勝略薑女至長城尋夫而回卒於山下遂葬焉故地名女回山漢軹道亭通志在漢長安城東十三里漢書髙帝本紀秦王子嬰素車白馬繫頸以組封皇帝璽符節降軹道旁注蘇林曰亭名也灞上雍大記在通化門東三十里灞河西岸漢王元年十月沛公至灞上子嬰降文帝六年宗正劉禮為將軍次灞上樊鄉雍録在長安城南水經注樊川即杜之樊鄉也漢祖至櫟陽以將軍樊噲灌廢邱最賜邑於此鄉也霸陵亭史記李廣傳李廣家居數歲廣與故潁隂侯孫居藍田山中射獵嘗夜從一騎出從人田間飲還至霸陵亭霸陵尉醉呵止廣廣騎曰故李將軍尉曰今將軍尚不得夜行何乃故也廣宿亭下朱博村通志去杜祠三里朱博丞相故里也在華巖寺北倚少陵下瞰終南霸橋咸寧縣志在府城東北二十里霸橋鎮水經注霸水有橋謂之霸橋初學記漢作霸橋以石為梁漢書王莽傳莽更名長存橋三輔黃圖霸橋跨水作橋都人送客至此折柳贈别開元遺事長安東霸陵有橋來迎去送至此黯然故人呼為銷魂橋元和郡縣志隋開皇三年造更以石為之長安志唐景龍二年仍舊所為南北兩橋通志漢霸橋在長安城東二十里霸店南北兩橋以通新豐道唐霸陵橋在京兆通化門東二十五里元時山東唐邑人劉斌修築凡一十五虹長八十餘步濶二十四尺中分三軌旁翼兩欄有華表鯨頭鼇首築隄五里栽柳萬株逰人轂擊肩摩為長安壯觀咸寧縣志宋時橋記韓縝重修元季又嘗修葺明成化六年布政使余子俊增修今沙石壅塞遺址僅存本朝康熙六年造大小船各一以濟渡水落架木為橋别有渡入藍田路文帝霸陵咸寧縣志在白鹿原東北崖去城四十里史記孝文帝本紀帝治霸陵皆以瓦器不得以金銀銅錫為飾不治墳欲為省毋煩民注應劭曰因山為藏不復起墳山下川流不遏絶也就其水名以為陵號水經注霸水左合滻水歷白鹿原東即霸川之西故芷陽矣漢文帝葬其上謂之霸陵元和郡縣志白鹿原亦謂之霸上王仲宣詩曰