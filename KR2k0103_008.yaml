鑿可置山陵又佐命功臣義深舟楫追念在昔何日忘之漢氏將相陪陵又給東園祕器篤終之義恩深意厚自今以後功臣密戚及德業佐時者如有薨亡賜塋地一所及祕器使窀穸之時喪事無闕請陪陵葬者聽之以文武分為左右墳髙四丈以下三丈以上若父祖陪陵子孫從葬者亦如之若宮人陪葬則陵户為之成墳凡諸陵皆置留守領甲士與陵令相知巡警左右兆域內禁人無得葬埋古墳則不毁之昭陵在京兆府醴泉縣因九嵕層峯鑿山南深七十五步為元宫山旁架梁為棧道懸絶百仭繞山二百三十步始逹元宫門頂上亦起遊殿文德皇后元宫有五重石門其門外於雙棧道上起舍宫人供養如平常及太宗山陵畢宫人亦依故事以閻立德奏乃止醴泉縣志唐書貞觀十年十一月庚寅葬文德皇后於昭陵十一年二月丁已營九嵕為陵則是陵未營而后先葬陵之營因后也陵有獻殿有後殿山巔亦有遊殿今俱廢惟陵北存石屋三楹六駿列於左右及貞觀中擒服諸畨君長頡利等十四人像琢石列之北司馬門內今皆不完其周垣重門甬路故迹猶存臣謹按林侗昭陵石迹考九嵕山在涇陽王橋鎮西地脈從崆洞來渭繞其前涇環其後而出其東岐梁西峙仲山嵯峨東障南則終南太乙天外列屏封內周回百二十里陪葬諸王妃主勳舊畨將東西班列碁布有序他如諸畨君長擒伏歸降者刻石肖其狀貌深眼大鼻弓刀雜佩凡十四人拱立於享廟之前北闕之下石駿如生臣於乙未春三月以護送官兵入蜀回途閲視涇陽龍洞渠道出醴泉得以周覽封域瞻拜元宫及陪葬諸臣冢墓其土人所稱丞相冢者魏徴墓也在鳯凰山距昭陵十里英國公李績墓在西屯村距昭陵二十五里衛國公李靖墓在煙霞洞距昭陵二十五里乃當日詔凖漢衛霍故事起塜象隂山鐵山以旌殊功土人呼為上下三塜謂塜有三峯也其餘可考者為蘭陵公主墓中書令馬周墓薛國公阿史那忠墓並在下古村距昭陵三十里虞國公溫彥博墓在煙霞洞距昭陵二十五里申國公髙士亷墓國子祭酒孔穎逹墓內侍將軍張阿難墓並在上占村距昭陵三十里梁國公房元齡墓在留束村距昭陵二十五里莒國公唐儉墓在大陽村距昭陵四十五里鄂國公尉遲恭墓在老軍營距昭陵三十五里褒國公段志元墓光祿卿薑遐墓並在莊河村距昭陵十五里冠軍將軍許洛仁墓天䇿府記室薛收墓並在新寨村距昭陵三十里乙速孤昭祐墓乙速孤行儼墓並在叱干村距昭陵三十五里吏部尚書張復允墓在下巖峪村距昭陵二十里陸先妃墓在西屯村距昭陵三十五里凡二十有一餘俱茫昧難稽其塜有屹若崇山如英衛二公者有巉削如懸崖絶壁者有頂平如磐石者有下方上鋭漸削如浮圖者其他如堂如壘或僅賸圈墻或僅存石獸或巳蝕為田畝盡一日之力瞻拜不暇歸檢新舊唐書唐會要文獻通考及志乘圖籍所載互有不同唐書僅録七十四人遊景叔昭陵圖百六十四人茍好善醴泉縣志同文獻通考百五十五人惟會要所録百六十七人比諸家較為詳具惟是當時各冢皆有穹碑夾以蒼松翠柏長楊巨槐下宫寢殿與表裏山河互相映帶一時君臣際會之隆生死同歸之誼可稱甚盛慨自朱梁盜發而後再歷千年髙臺已傾曲池己平不但塜墓無存即金石文字亦皆剝蝕無有今可録者惟二十三碑而已因飭屬重加修飾並為清釐封域樹以宰木墓前古刻建以碑亭庶令樵牧牛羊知所禁避而先烈前徽得以貽諸永久云肅宗建陵醴泉縣志在縣正北三十里武將山唐書代宗本紀廣德元年三月庚午葬文明武德大聖大宣孝皇帝於建陵長安志建陵陪葬功臣一尚父汾陽郡王郭子儀太元洞通志在華原東五里耀州志唐孫真人思邈隱居所也往時逰者持火可深入今崩礙不能行洞下有洗藥池二皆鑿石為者柳公綽墓通志在耀州西北四十里其弟公權墓亦在焉令狐德棻墓耀州志在州西北三里令狐楚墓通志在耀州西北五里楚本州人唐憲宗時為相卒葬於此綯楚之子墓亦在焉宋四馬務長安志在興平縣東南二十里一曰飛龍務次大馬務次小馬務次羊澤務地凡三百七十一頃南渡渭河慶厯中為營田尋罷之其後民占佃簿籍散亡不復歸於有司相橋臨潼縣志在縣北六十里跨清水上宋相寇忠愍公凖所建呂通墓藍田縣志在縣北五里宋呂蕡先汲郡人任比部郎中父通太常博士蕡過藍田愛其山川風景遂葬通於藍田因家焉生大忠大防大鈞大臨舊有墓十五明成化十九年修元蕭㪺墓長安縣志蕭貞敏公墓在城南五十里子午鎮楊恭懿墓通志在髙陵縣南八里三陽寺前郝忠定墓三原縣志在縣北二十里樓底原上忠定為元五路軍民萬户冀國公名華善巴圖爾中書左丞郝天挺父也王寶寶墓通志在盩厔縣西南十里寶寶歿於國事贈武德將軍盩厔子明馮從吾墓長安縣志馮恭定墓在城南康橋臨潼縣志在縣北八十里明劉瑾陷李夢陽武功康海救之有義聲歸里時潼令為橋於漆水渡之因名呂柟墓馬理呂文簡公墓志公以嘉靖辛丑秋卒甲辰七月葬於邑城之艮隅王九思墓通志王檢討墓在鄠縣西北二里仁和里龍橋通志在三原縣北門外兩城對峙中貫清水河河上有橋建隆四年清河泛漲橋圮明萬厯二十年邑人少保溫純建大石橋三洞髙八九丈袤十餘丈兩傍砌石欄南北各建石坊下有龍潭故名王恕墓通志王端毅公墓在三原縣西北二里正德四年敕修馬理墓通志在三原縣西北五里薛應旗馬光祿墓志嘉靖三十六年十月葬公於丁村塋溫純墓通志在三原縣西北五里柴家關盩厔縣志在縣南微東三百六十里自黑水谷歷桃李坪爛柴灣石牛灘逾柳葉河登峻逾險至老虎坡梨樹坪小王澗一堵牆越秦嶺六十里置關道通洋縣明正德十六年設巡司今裁十八盤