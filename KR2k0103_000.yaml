body:
  text: 關中勝蹟圖志目録地理類七古蹟之屬巻一陜西省地理西安府地理巻二西安府名山巻三西安府大川巻四西安府古蹟卷五西安府古蹟巻六西安府古蹟巻七西安府古蹟巻八西安府古蹟巻九同州府地理巻十同州府名山巻十一同州府名山華嶽巻十二同州府大川巻十三同州府古蹟巻十四同州府古蹟巻十五鳳翔府地理巻十六鳳翔府名山巻十七鳳翔府大川巻十八鳳翔府古蹟巻十九漢中府地理巻二十漢中府名山巻二十一漢中府大川巻二十二漢中府古蹟巻二十三延安府地理名山大川古蹟巻二十四榆林府地理名山大川古蹟巻二十五商州地理名山大川古蹟巻二十六乾州地理名山大川古蹟巻二十七邠州地理名山大川古蹟巻二十八興安州地理名山大川古蹟巻二十九綏德州地理名山大川古蹟巻三十鄜州地理名山大川古蹟巻三十一圖陜西省西安等府州屬疆域巻三十二圖華嶽中南太白吳岳黄河渭河漢江龍首永濟二渠龍洞渠附漢未央長樂宫建章宫唐西内東内南内華清宫臣等謹案闗中勝蹟圖志三十二巻乾隆四十一年廵撫陜西兵部侍郎兼都察院右副都御史臣畢沅所撰進也闗中為禹貢雍州舊壤黒水西河古稱神臯陸海漢唐皆建都其地凡夫城郭宫室之鉅麗市井風物之阜繁髙山大川之竒麗而䧺偉其遺聞古蹟流傳最多故學士大夫毎加裒輯自闗中記三輔舊事三輔黄圖以下如宋敏求長安志吕大防長安圖記程大昌雍錄無名氏華山記李好文長安志圖伍福馬理陜西通志何景眀雍大記李應祥雍略南軒闗中文獻志之類幾及數十家體例不同未免純駁互見我國家醲化覃敷漸被西土雨暘時若慶告屢豐華嶽之祠太白之湫俱仰荷宸翰褒題光燭霄宇其秦漢涇渠故道亦俱次第興脩勝蹟留貽倍加生色是編舉陜西廵屬諸州縣各分地理名山大川古蹟四目考據本末薈粹諸書系之以圖敬陳乙覽臣等謹為錄副藏在秘書亦庸以備一統志之採擇焉乾隆四十六年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
