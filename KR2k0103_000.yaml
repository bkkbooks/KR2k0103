body:
  text: 關中勝迹圖志目録地理類七古迹之屬卷一陜西省地理西安府地理卷二西安府名山卷三西安府大川卷四西安府古迹卷五西安府古迹卷六西安府古迹卷七西安府古迹卷八西安府古迹卷九同州府地理卷十同州府名山卷十一同州府名山華嶽卷十二同州府大川卷十三同州府古迹卷十四同州府古迹卷十五鳳翔府地理卷十六鳳翔府名山卷十七鳳翔府大川卷十八鳳翔府古迹卷十九漢中府地理卷二十漢中府名山卷二十一漢中府大川卷二十二漢中府古迹卷二十三延安府地理名山大川古迹卷二十四榆林府地理名山大川古迹卷二十五商州地理名山大川古迹卷二十六乾州地理名山大川古迹卷二十七邠州地理名山大川古迹卷二十八興安州地理名山大川古迹卷二十九綏德州地理名山大川古迹卷三十鄜州地理名山大川古迹卷三十一圖陜西省西安等府州屬疆域卷三十二圖華嶽中南太白吳嶽黃河渭河漢江龍首永濟二渠龍洞渠附漢未央長樂宫建章宫唐西內東內南內華清宫臣等謹案關中勝迹圖志三十二卷乾隆四十一年巡撫陜西兵部侍郎兼都察院右副都御史臣畢沅所撰進也關中為禹貢雍州舊壤黑水西河古稱神臯陸海漢唐皆建都其地凡夫城郭宫室之巨麗市井風物之阜繁髙山大川之竒麗而雄偉其遺聞古迹流傳最多故學士大夫每加裒輯自關中記三輔舊事三輔黃圖以下如宋敏求長安志吕大防長安圖記程大昌雍録無名氏華山記李好文長安志圖伍福馬理陜西通志何景眀雍大記李應祥雍略南軒關中文獻志之類幾及數十家體例不同未免純駁互見我國家醲化覃敷漸被西土雨暘時若慶告屢豐華嶽之祠太白之湫俱仰荷宸翰褒題光燭霄宇其秦漢涇渠故道亦俱次第興修勝迹留貽倍加生色是編舉陜西巡屬諸州縣各分地理名山大川古迹四目考據本末薈粹諸書系之以圖敬陳乙覽臣等謹為録副藏在祕書亦庸以備一統志之採擇焉乾隆四十六年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
