body:
  text: 關中勝蹟圖志卷十九陜西巡撫臣畢沅撰地理漢中府釋名通志秦郡常璩曰因水名也府志郡臨漢水之陽南面漢山故名沿革一統志治在省城西南一千七十里禹貢梁州之域春秋時為蜀地戰國初秦楚之境後屬秦置漢中郡史記秦惠王十三年攻楚漢中取地六百里置漢中郡華陽國志周赧王二年秦惠文王置郡漢初為漢國後仍為漢中郡屬益州後漢因之三國屬蜀通典後漢末張魯改漢中為漢寧魏武復曰漢中郡後蜀先主有其地以為重鎮魏景元四年克蜀兼置梁州王隱晋書魏末克蜀分廣漢巴涪陵以北七郡為梁州治沔陽晋因之晋書地理志泰始三年立梁州於南鄭東晋隆安中又僑置秦州宋齊因之梁天監三年入於魏曰梁州漢中郡大同初還梁西魏廢帝元年復克之隋開皇三年郡廢大業三年州廢改為漢川郡唐武德初復曰梁州置總管府開元十三年改曰褒州二十年復故天寶初曰漢中郡乾元初復曰梁州興元元年升興元府為山南西道節度使治五代屬蜀宋曰興元府漢中郡山南西道節度為利州路治紹興十四年分為利州路治元為興元路屬陕西行省明洪武三年改為漢中府九年屬陕西布政使司本朝因之領縣八曰南鄭褒城城固洋西鄉鳯沔略陽州一曰寧羌府城通志舊址在府東二里秦厲公所築漢髙祖王漢中時居此宋嘉定十二年徙築今城明正德五年修築悉甃以磚周九里有竒天啓元年因建瑞藩展北二丈十步門四東曰朝陽西曰振武南曰望江北曰拱宸南鄭縣釋名通志周邑名秦以名縣耆舊傳云鄭桓公遺民南奔漢中故以南為稱府志桓公都鄭其民徙河南者為新鄭奔漢中者為南鄭沿革一統志附郭本秦南鄭邑漢置縣為漢中郡治後漢至南北朝因之隋為漢川郡治唐為興元府治宋因之元為興元路治明為漢中府治本朝因之褒城縣釋名通志郭子章云周褒國漢置褒中縣隋改名褒城沿革一統志治在府西北四十里漢置褒中縣屬漢中郡為都尉治後漢因之晋義熙中改曰苞中劉宋省後魏永平四年復置褒中縣兼置褒中郡隋開皇初郡廢改縣曰褒內仁夀元年又改褒城屬漢川郡義寧二年又改褒中唐貞觀三年復曰褒城屬興元府宋因之元屬興元路明屬漢中府本朝因之縣城通志漢唐建縣於打鐘寺宋徙山河堰北紹興中兵燬明正德四年蜀有藍鄢之亂巡撫藍璋以褒據秦蜀之衝下令修築甃城以石周三里門四城固縣釋名通志秦縣名方輿勝覽始城而兾其鞏固之意也沿革一統志治在府東少北七十里漢置城固縣屬漢中郡後皆因之唐武德二年改曰唐固貞觀二年復故屬興元府宋因之元屬興元路明屬漢中府本朝因之縣城通志蜀漢建興七年諸葛亮建樂城魏正始中移治壻鄉宋崇寧二年移建今城明正德七年拓築磚甃周七里有竒門四洋縣釋名太平寰宇記後魏置洋州因水為名沿革一統志治在府東一百二十里漢城固縣地晋置興道縣屬漢中郡劉宋廢後魏延昌三年置興勢縣屬晋昌郡西魏分置儻成郡隋開皇初郡廢縣屬漢川郡唐初屬洋州貞觀二十三年改曰興道天寶十五載移洋州郡來治乾元初復改郡曰洋州屬山南西道五代時孟蜀改曰源州宋初復曰洋州元至元二年以州治興道縣省入屬興元路明初降州為縣屬漢中府本朝因之縣城通志宋熙寧間文同守洋州築土為城明崇禎七年甃以磚周七里有竒門五西鄉縣釋名通志太平寰宇記蜀南鄉晋改西鄉府志與䕫之東鄉對故名沿革一統志治在府東南二百四十里漢城固縣地蜀漢置南鄉縣晋改曰西鄉屬漢中郡宋齊因之後魏改置豐寧縣兼置洋州及洋川郡隋開皇中郡廢大業初州廢縣復曰西鄉屬漢川郡唐武德初復於縣置洋州天寶初曰洋川郡十五載徙郡治興道以西興屬焉宋亦屬洋州元屬興元路明屬漢中府本朝因之縣城通志宋建於蒿坪山之陽元遷今治建城磚土相半明正德中築東關新城嘉靖初悉磚甃之周三里門四鳯縣釋名通志方輿勝覽鸑鷟嘗鳴於岐翺翔至南而集焉是以西岐曰鳯翔南岐曰鳯州至明降州為縣沿革一統志治在府西北三百八十里漢置故道縣屬武都郡後漢及晋因之後魏太和元年改置涼泉縣尋改曰梁泉孝昌中又置南岐州西魏廢帝三年改州為河池郡唐武德初復為鳯州天寶初曰河池郡乾元初仍曰鳯州屬山南西道五代初屬岐後屬蜀宋仍曰鳯州河池郡屬秦鳯路元至元五年以州治梁泉縣省入屬興元路明初降州為縣屬漢中府本朝因之縣城通志古鳯州舊治明嘉靖十九年悉甃以石周四里有竒門三沔縣釋名通志本漢沔陽以沔水為名也元自略陽移沔州來治明降為縣沿革一統志治在府西一百十里漢置沔陽縣屬漢中郡後漢晋及宋齊因之後魏析置嶓冡縣並屬華陽郡隋初省沔陽縣大業初改嶓冡曰西縣屬漢川郡唐武德三年於縣置褒州八年州廢縣屬梁州宋乾德三年以縣直𨽻京師謹按太平寰宇記平蜀後以西縣及三泉縣路當津要申奏公事直屬朝廷二縣遂割出𨽻京師三泉今寧羌州後屬興元府元初屬沔州至元二十年省西縣入略陽改置鐸水縣移沔州來治後又省鐸水縣入州明初改州為縣屬漢中府成化二十二年改屬寧羌州本朝仍屬漢中府縣城通志蜀漢建興七年諸葛亮築漢樂二城漢城即沔城也倚山垣堞以土明洪武四年遷於西山谷口沔水環流萬歷元年甃以磚周三里門四略陽縣釋名通志用武之地曰略衆山之南曰陽故以為名按略陽漢縣也在今鞏昌界後魏僑置略陽郡縣於此趙宋遂以名縣沿革一統志治在府西北二百九十里漢置沮縣屬武都郡後漢及晋因之後魏正始三年置武興鎮尋改置東益州及武興郡西魏廢帝二年改州曰興州郡曰順政大業二年罷州為順政郡唐武德初復為興州天寶初復曰順政郡乾元初仍曰興州屬山南西道五代屬蜀宋仍曰興州順政郡屬利州路開禧三年改州曰沔州縣曰略陽嘉定三年仍屬利州路元至元十四年改屬廣元路二十年移沔州治釋水縣以略陽縣屬焉明初屬漢中府成化二十二年改屬寧羌州本朝仍屬漢中府縣城通志即古興州城址明正德六年築土城周五里門五寧羌州釋名通志本白馬氐東境成化中設寧羌取輯寧氐羌之意沿革一統志治在府西南二百八十里漢廣漢郡葭萌縣地晋為梓潼郡晋夀縣地隋為義成郡綿谷縣地唐武德四年分置三泉縣兼置南安州八年州廢縣屬利州天寶元年改屬漢中郡宋乾德三年以縣直𨽻亰師至道二年建為太安軍三年軍廢縣仍屬亰師紹興三年復置太安軍屬利州路元初為大安州至元二十年降州為縣屬沔州又省三泉縣入之明初省大安入沔縣改置寧羌衛成化二十二年升為寧羌州屬漢中府本朝因之州城通志舊為白馬氐之羊鹿坪明洪武三十年因羌民田九成據馬面山作亂遣指揮姜觀建羌羌衛於此成化二十二年建州於衛治南漢水繞城地勢險固周七百七十餘丈門四關中勝蹟圖志卷十九
