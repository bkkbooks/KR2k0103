body:
  text: 關中勝迹圖志卷十二陕西巡撫臣畢沅撰大川附水利同州府洛水在同州府城西南五里自澄城蒲城界來南徑商原又徑大荔縣南沙苑北又東至霸城村入朝邑界山海經白於之山洛水出於其陽而東流注於渭周禮職方氏雍州其浸渭洛詩小雅瞻彼洛矣維水泱泱謹桉雍州之洛鄭康成注出懷德賈疏即詩云瞻彼洛矣者也與禹貢導洛自熊耳者别水經注渭水又東徑華隂縣北洛水入焉詩地理考洛水出洛源縣白於山東流至鄜州洛交縣又東南流至京兆府雲陽縣東又徑同州澄城西北去富平之懷德亦近謹按洛源今屬安化洛交今屬鄜州雲陽今屬淳化懷德今屬富平禹貢錐指洛水自徑朝邑縣西之朝阪又南自趙渡鎮歷華隂縣西北葫蘆灘入渭明成化中洛水改流東過鎮南徑趨于河不復至華隂入渭矣渭水在同州府城南三十五里自渭南華州界流入又東入朝邑華隂界水經注渭水東經平舒城北水之陽即懷德縣界謹按平舒城今屬華隂漢懷德縣今屬朝邑詳見西安九龍泉在同州府城南八里沙苑太平寰宇記泉有九穴同為一注因名九龍今為鵝鴨池通志九泉同流州所由得名也鍾而為池廣袤五頃今漸堙廢己上大荔黃河在朝邑縣東七里自郃陽界流入與山西蒲州接界又南入華隂界書禹貢𨗳河積石至于龍門南至于華隂孔安國傳雍州東據河龍門之河在冀州西孔穎達正義河從積石北行又東乃南行至于龍門計應三千餘里水經注河水又南徑西河圁陽縣東謹按即今神朩縣又南徑離石縣西謹按即今永寧州又南過土軍縣西謹按即今石樓縣又南過上郡高奴縣東謹按即今膚施縣又南過河東北屈縣西謹按即今山西平陽府吉州有孟門山又南過皮氏縣西謹按即今山西絳州河津縣又南出龍門口又南徑梁山原東謹按原在今韓城縣又南過汾隂縣西謹按即今山西蒲州府榮河縣又徑郃陽城東又南徑陶城西謹按即今山西蒲州府臨晉縣又南過蒲坂縣西謹按即今山西蒲州又南徑雷首山西又南至華隂潼關厯船司空謹桉船司空故城通典在華隂縣東北五十里與渭水會雍勝略黃河自龍門而來厯韓城郃陽經本縣臨晉關轉經潼關界同州府志黃河舊自郃陽入朝邑東境南至大慶關東濱蒲州城故曰蒲津禹貢所謂西河也南至金龍渡為河與洛渭交滙之處世稱三河口去朝邑縣東南三十里朝邑縣志自明成化中洛水崩於河河之害十倍於前隆慶三年浸縣東門萬厯六年浸太陽諸聚落七年越大慶關浸淫西出喬家灘三徙兩陽村浸其半至十二年三河口亦在洪流中矣洽水今名金水河在朝邑縣北五十里自郃陽界南流六十餘里入縣界又東流徑汙峪鎮入於河洛水在朝邑縣南五里自大荔縣界流入又東南入河朝邑縣志洛水舊流自縣南之趙渡鎮徑華隂西北葫蘆灘入渭明成化中洛水改流東過趙渡鎮南徑趨于河不復入渭矣渭水通志在朝邑縣南四十里自同州界來又東至華隂界入河水經注渭水又東徑長城北又東至華隂界苦泉元和郡縣志在朝邑縣西北三十里其水醎苦羊飲之肥今於泉側置羊牧故諺云苦泉羊洛水漿已上朝邑黃河郃陽縣志在縣東四十里自韓城界流入與山西臨晉縣分界又南入朝邑界水經注河水南過汾隂縣西又徑郃陽城東又南瀵水入焉又南徑陶城西謹按陶城今屬山西臨晉縣徐水通志在郃陽縣北十五里水經注徐水出西北梁山東南流徑漢武登仙宫東又東南徑子夏陵北東入河一名橋頭河郃陽縣志橋頭河源出梁山東峪徑城東北入河順治中邑人引水西流環城而東如圍帶又名腰帶水洽水通志在郃陽縣西北三十里又東南入朝邑界詩大雅在洽之陽朱子集傳洽水名在今同州郃陽縣今流已絶故去水而加邑水經注城北有北瀵水又城南側中有瀵水河南又有瀵水即洽水也並注於河太平寰宇記瀵水總發源西河西岸平地雍勝略洽河源出梁山西峪東流注於黃河漢永平間流絶今有乾河村其後復流邑人重之呼為金水縣志縣有王村瀵鯉瀵東鯉瀵渤地瀵夏陽瀵去河數武湧出地尺許清洌迥異陽湫郃陽縣志在縣東南五十里即刳首水左傳文公七年秦敗晉於令狐至於刳首一名刳谷水唐書地理志郃陽縣陽湫貞元四年堰汙谷水成朝邑縣志朝邑縣東北有刳谷鎮以近刳谷口而名已上郃陽洛水禹貢錐指在澄城縣西二十里自白水界來又東南入蒲城界漢書溝洫志武帝時穿渠自徵引洛水至商顔下顔師古注洛即漆沮徵即澄城也長寧河在澄城縣西北四十里通志以流徑長寧城故名西南流入于洛一名三娘子川縣志源出宜君界麻林坡會雲門紅羅二水又有隂泉水在縣西北三十里泉自崖隂出味甘冽並入長寧河酒泉通志在澄城縣西北四十里左傳王巡虢守虢公為王宫於玤王與之酒泉杜預注酒泉周邑今同州有甘泉出匱谷造酒尤美縣志一名甘泉俗名縣西河會縣西諸泉入于洛又隋公泉在縣西北三里許其水清徹可愛東南流入甘泉水澄泉雍勝略在澄城縣西三里縣以此名源出大慶里西莊澗中雍大記源潔流清會甘泉入洛又名官泉大峪河澄城縣志在縣東二十里源出界頭山與郃陽分界至蒲城入洛亦名撲地河巳上澄城黃河通志在韓城縣東十五里自宜川界流入與山西河津榮河分界又南入郃陽界水經注河水南出龍門口又南右合暢谷水又南徑梁山原東又南崌谷水注之又南右合陶渠水昔魏文侯與吳起浮河而下美山河之固即於此也縣志河自龍門而南距郃陽不百里河堧多容土遇潦輒潰與榮河縣接界即韓信以朩罌渡軍擊魏處治戶川通志在韓城縣東北七十里龍門山北有河口略似龍門而不能通相傳鯀治水時所鑿今名錯開河衛氏地圖記錯開河由龍門而上六七里曰金門其西有澗曰治戶川川口頗多鐫迹在昔金門未闢崇伯不諳水性意欲使河直行東北故失利耳書曰鯀湮洪水疑即謂此也暢谷水通志在韓城縣西北百十里水經注暢谷水自溪東南流徑夏陽縣西北東南注于河縣志一名盤水源出硃砂嶺厯縣北徑馮峰口東過薛曲里暖水自西南入焉又南過帶村東入於河又縣北二十里有文水合盤水入於河崌谷水通志在韓城縣西南一里水經注崌谷水出縣西北梁山東南流橫溪注之東南徑夏陽故城北又東南流入河一名澽水通志澽水源出麻線嶺東流為白馬潭在縣西七十里受八水謹按八水謂離水景封峪水洫水澗水水潦水澮水芝水入河陶渠水通志在韓城縣西二十三里源出香山水經注陶渠水出西北梁山徑司馬子長墓北東南流入河一名芝水縣志芝川河源出方山東南流潗水澻水沆水來會同澽水入河靈潭韓城縣志在縣西三里峪一名青龍潭巉巖之下將雨則絮絮雲升相傳有龍潛焉旱禱輒應山半飛閣巋然松老莓苔如繡已上韓城黃河通志在華隂縣東北四十里自朝邑界南徑縣東北與渭水合又東入潼關界水經注河水南至華隂潼關歷船司空與渭水會縣志黃河自龍門南下經本縣東北葫蘆灘寺南至潼關折而東注寺南即渭亂河處渭水通志在華隂縣北二十里自華州界來與朝邑接界又東流入於河是曰渭口杜預左傳注渭水東入河水之隈曲曰汭水經注渭水自合石橋水又東敷水注之又東良餘水注之又東合黃酸之水又東徑平舒城北謹按平舒故城在華隂縣西北又東徑長城北長澗水注之又東徑華隂縣北洛水入焉闞駰以為漆沮之水又東沙渠水注之又東徑定城北謹按定城在華隂縣東又東泥泉水注之又東入河春秋之渭芮也臣謹按舊志洛水自朝邑界來厯華隂之葫蘆灘入渭今則東過朝邑之趙渡鎮徑入於河不復至華隂入渭敷水華隂縣志在縣西二十五里源出大敷谷入谷三里有百索灘又南有撾鼓潭皆敷水之源也其谷受秦嶺以北東西諸水故其流最大經敷水鎮東北逶迤至灘子里入渭水經注敷水南出石山之敷谷北徑告平城東謹按告平城故迹在華隂縣西北流注于渭良餘水通志在華隂縣西二十里水經注良餘水南出良餘山之隂北流入于渭俗謂之宣水黃酸水通志在華隂縣西十三里水經注黃酸水世名之為干渠水水南出升山北流注于渭縣志黃酸水至干渠頭東流過頁橋合仙谷水謹按仙谷水源出谷中車箱潭亦謂之車箱水又北徑縣西長城橋下又東流入于渭長澗水通志在華隂縣西門外水經注長澗水源出太華山側長城東而北流注于渭縣志源出蓮峰水簾洞玉泉三伏見循古長城北注為王家河過縣西為西河又西轉北折而東流為清河又東至員莊入于渭又有小澗水在縣南一名竇谷水源出王刁洞西北流徑城南入長澗水又有大澗水在縣東南源出黃神谷一名黃龍潭水俗曰大澗西北流入長澗河沙渠水通志在華陰縣東十五里水經注沙渠水出南山北流又西北入長城又北入渭一名蒲澗水泥泉水通志在華陰縣東三十五里水經注泥泉出南山靈谷北流注於渭縣志靈谷在水谷西今近水谷下有泉水濁而赤由小月溝金盆寨過橋西北注於渭或以為即泥泉水也陽華藪通志在華隂縣東南吕氏春秋九藪秦之陽華髙誘注桃林西長城是也晉書載記太元九年慕容洪苻睿戰於華澤胡三省通鑑注華陰之澤也或以為即陽華藪縣志縣西南之甕谷為商洛經道入谷五十里東轉為華陽川即古陽華之藪也已上華隂洛水通志在蒲城縣東四十里太平寰宇記洛水亦曰沮水縣志洛水經白水澄城入縣境合南河水折而東南流入同州境白水河通志在蒲城縣北自白水縣流入界內入洛縣志白水即同官之烏泥川入縣境或名丁家河或名髙家河皆以傍水居民為名東流納白石水龍門溝虎頭溝諸水厯縣境北經五龍山陰入於洛溫湯通志在蒲城縣東六十里源出沮水東岸石穴中又西流里許入於沮水四時溫暖可浴縣志一名溫塘旁有太湖山平地突起周五六里髙十餘仞左右危石流泉為邑名勝鹵中長安志在蒲城縣南二十里漢書宣帝紀宣帝微時嘗困於蓮勺鹵中注如淳曰蓮勺有鹽池縱廣十餘里其鄉人名曰鹵中服虔曰或曰澤中縣志今名安豐灘唐大厯十二年東池生瑞鹽後敕禁斷鹽不復生已上蒲城洛水禹貢錐指在白水縣東三十里自宜君界來東南徑縣東又東南入澄城蒲城界沮水舊循鄭渠東至此入洛今富平之流已絶矣雍録洛在漆沮之東至白水縣與漆沮合而南流所謂洛即漆沮言其本同也縣志洛水抵黃龍山麓東折又南過阿門村距縣三十里又東循五龍山隂南流入蒲白水河通志在白水縣西三里東南流入蒲城界入洛水經注沮水自徑當道城南謹按當道今屬富平又東徑蓮勺縣故城北謹按蓮勺今屬渭南又徑粟邑縣故城北謹按粟邑故城在白水縣西北又東北注於洛太平寰宇記洛水東南沮水入焉故洛水亦名漆沮水其境東南多白玉因曰白水同州府志即烏泥川之下流由縣西而來北受白石水又北受龍門溝水又受虎頭溝水又折而東至五龍山隂入於洛已丄白水臣謹按水經注沮水至富平分二𣲖其一自富平徑臨潼北境入渭其一自富平至白水入洛今白水縣沮水為同官縣烏泥川之下流蓋富平之流已絶也渭水通志在華州北十五里自渭南界來又東入華隂界水經注渭水自白渠口東徑欒都城北謹按欒都城在州西北又東灌水注之又東合沙溝水又東合西石橋水又東合敷水小赤水通志在華州西三十里水經注小赤水即山海經之灌水也水出石脆之山北徑蕭加谷于狐相原西東北流與愚水合又北注于渭太平寰宇記小赤水今名髙谷水愚水通志在華州西山海經禺水出英山北流注于招水水經注愚水與招水相得亂流西北注于灌太平寰宇記愚水出孤相原華州志愚水亦名喬峪水先時西自龍灣北徑聖山村入灌水明永樂間水暴漲北徑遇仙橋而北入渭因名遇仙橋河故道在今髙塘朱渠村諸處又有漁村川水舊入喬峪水後亦因水漲遂入遇仙橋河或疑即古之招水也又有短嶺水亦流入遇仙橋河西石橋水通志在華州西十里水經注西石橋水南出馬嶺山北流注于渭闞駰謂之新鄭水華州志石隄谷水源出石隄谷北流至良侯村之北名五港河合赤隄谷水入沙澗經石橋鋪以達于渭蓋即西石橋水矣東石橋河通志在華州東水經注石橋水故沈水也亦南出馬嶺山北流徑武平城東謹按武平即武城縣故城在華州東又北徑沈城北入渭謹按沈城即沈陽縣故城在華州東北華州志東石橋水源出構峪一名構峪水謹按構當作榖即楮木也可為紙今華峪多榖故名舊作構誤蓮花池通志在華州東南十五里阜頭峯下宋天禧五年陷為河水深不測故一名移山潭亦謂之白崖湖潭水又滙為數區湖側有眠雲石西溪水通志在華州西南時人目之為小曲江以杜甫為州司功時所嘗遊也華州志西溪水源出州南山澗經故縣河澗諸村又太平橋水在州東亦謂之泥河亦謂之北溪水合西溪水入渭巳上華州黃河在潼關北一里禹貢錐指自華隂界來徑雷首山西本縣北又折而東是為河曲入河南界水經注河在關內南流潼擊關山因謂之潼關自關東北流經黃巷坂東出即函谷關也潼河通志在潼關城下源出潼谷北流入黃河又嵩坌峪水自龍王廟北流合潼水水經注灌水出松果之上北流徑通谷世謂之通谷水東北注于河所謂潼谷水也或説因水以名地也元和郡縣志潼關西一里有潼水因以名關華隂縣志水北流經蝎子山入黃河古稱潼亭潼津皆以此已上潼關關中勝迹圖志卷十二
