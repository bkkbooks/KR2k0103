body:
  text: 關中勝蹟圖志卷二十三陜西巡撫臣畢沅撰地理延安府釋名元和郡縣志隋延安郡以界內延水為名沿革一統志治在省城北七百四十里禹貢雍州之域春秋時白翟所居戰國初屬魏置上郡秦亦曰上郡漢元年項羽置翟國尋屬漢仍為上郡謹按定邊靖邊二縣為漢北地郡地後漢因之建安二十年郡廢晉時荒廢後屬赫連勃勃後魏初屬統萬鎮太和元年置偏城郡延昌二年置東夏州西魏廢帝三年改為延州隋大業三年改州曰延安郡唐武德元年復曰延州天寶初曰延安郡乾元初復曰延州屬關內道五代後唐置彰武軍節度宋曰延州延安郡屬陜西路慶厯元年分置鄜延路元祐四年升延安府金亦曰延安府元為延安路屬陜西行省明為延安府屬陜西布政使司本朝因之領縣十曰膚施安塞甘泉安定保安宜川延川延長定邊靖邊府城通志唐天寶初建一云赫連勃勃築宋范仲淹龎籍經略時增修明初重築周九里有奇門四膚施縣釋名通志戰國趙邑名秦昭王以名縣在今綏德界隋大業初始置於延安界因舊名也謹按舊傳釋氏尸毗王割肉救鴿故縣名膚施然自秦以前巳有是名恐出附㑹故未敢録沿革一統志附郭秦置高奴縣漢初為翟國都尋屬上郡後漢因之晉廢後魏為偏城郡廣武縣地隋大業三年始分豐林金明二縣地置膚施縣為延安郡治唐為延州治宋為延安府治金元明不改本朝因之安塞縣釋名通志元縣名本宋安塞堡縣從堡名也沿革一統志治在府北少西四十里漢上郡高奴縣地後魏太平真君十年置廣洛縣隋仁夀元年改曰金明屬延安郡大業末廢唐武德二年分膚施復置金明縣兼置北武州貞觀二年州廢屬延州五代因之宋熙寧五年廢入膚施元初改置安塞縣屬延安路明屬延安府本朝因之縣城通志本金舊堡元初改建周三里有奇門三甘泉縣釋名太平寰宇記以其泉甘美為名縣志甘泉在縣南五十里沿革一統志治在府南少西九十里漢上郡雕陰縣隋為洛交縣地唐武德元年分置伏陸縣屬鄜州天寶元年改曰甘泉五代因之宋初改屬延安府金元明不改本朝因之縣城通志唐天寶初建明景泰中重築周三里有奇門三安定縣釋名通志本宋安定堡元因以名縣沿革一統志治在府北少東一百八十里秦置陽周縣屬上郡漢因之後漢省入膚施高奴二縣隋為延川縣地唐為延川延昌二縣地宋置安定堡屬延川縣元憲宗五年升為安定縣屬延安路明屬延安府本朝因之縣城通志明洪武初建成化中築東關城周五里有奇門三保安縣釋名通志本宋保安軍金以名州元以名縣沿革一統志治在府西北二百二十里漢高奴縣地後魏廣洛縣地隋膚施縣地唐置永康鎮宋太平興國二年建為保安軍屬永興路金大定十一年置保安縣二十二年升為州屬鄜延路元至元六年降州為縣屬延安路明屬延安府本朝因之縣城通志即古栲栳城明初增築周九里有奇門四宜川縣釋名通志本後魏義川太平興國中改名避太宗匡義諱也沿革一統志治在府東南二百六十里戰國魏定陽邑漢置定陽縣屬上郡後漢因之晉省後魏大統三年置義川縣及義川郡廢帝三年改州曰丹州後周改縣曰丹陽隋開皇初郡廢復改縣曰義川大業初州廢屬延安郡義寧元年又於縣置丹陽郡唐武德元年復曰丹州天寶初改曰咸寧郡乾元初復曰丹州屬關內道宋曰丹州咸寧郡屬永興軍路太平興國元年改縣曰宜川金曰丹州屬鄜延路元廢丹州以縣屬延安路明屬延安府本朝因之縣城通志宋初建明正統中重築周九里有奇門四延川縣釋名元和郡縣志後魏文安縣隋改延川以吐延川為名沿革一統志治在府東少北一百九十里漢高奴膚施二縣地西魏置文安縣又置文安郡隋開皇初郡廢改縣曰延川屬延安郡唐屬延州宋屬延安府金元明不改本朝因之縣城通志本元舊址明正統中重築周四里有奇門三延長縣釋名通志延水長流入河因以名縣沿革一統志治在府東一百五十里漢高奴縣地西魏廢帝元年置廣安縣隋仁夀元年改曰延安屬延安郡大業末廢唐武德二年復置延安縣兼置北連州貞觀二年州廢屬延州廣德二年改曰延長屬延安府金元明不改本朝因之縣城通志金大定中築周四里有奇門二定邊縣釋名通志本明定邊堡蓋取底定邊疆之意沿革縣志治在府西北三百五十里漢北地郡馬領縣地唐為鹽州地明正統二年置定邊營屬延綏鎮本朝雍正九年置定邊縣屬榆林府乾隆元年改屬延安府縣城縣志即舊定邊營明正統中築周四里有奇門二靖邊縣釋名通志本明靖邊堡取綏靖邊疆之意沿革縣志治在府西北三百里漢北地郡地後魏置闡熙郡及長津縣隋開皇三年郡廢縣屬夏州唐貞觀七年於縣置長州十三年州廢還屬夏州元和十五年移宥州來治宋為西夏地明成化十一年置靖邊營屬延綏鎮本朝初為靖邊所雍正九年置靖邊縣屬榆林府乾隆元年改屬延安府縣城縣志本宋夏州兀刺城明景泰四年改築新城成化中改置靖邊營後又增築南關城及新軍家丁兩營連環共四城周六里有竒門二名山延安府鳯凰山在膚施縣西通志府城跨其上雉堞巍然為郡首山清涼山在膚施縣東北七十步一統志一名太和山其巔最高一峰曰蓮花峰上有尸毗巖及萬佛洞內有石佛萬餘山半有鷲峰泉定甲泉及仙石洞五龍山在膚施縣東一里金史地理志膚施縣有五龍山府志山下有黑龍泉嘉嶺山在膚施山東南百八十步南河之濱通志形勢高峻上有古塔范仲淹大書嘉嶺山三字刻於石一統志隋志有豐林山疑即此伏龍山在膚施縣北五里太平寰宇記形似卧龍是上郡之名山牡丹山在膚施縣西南四十里一統志其地多牡丹樵者採以供薪一名花原頭卧虎山在膚施