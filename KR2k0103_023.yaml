衙行云少留同家窪欲出蘆子關意亦其遊歷所及今從陜西通志載之蘆關通志在安塞縣北一百五十里雍勝略有東西二城遺址唐書地理志延長北有蘆子關長慶四年築城於關北以護寨外元和郡縣志關屬夏州在寨門鎮北去鎮一十八里謹按寨門鎮在縣西北一百五十里元和郡縣志本在夏州寧朔縣界開元二年移就蘆子關南金鎮所安置又考明成化二年移置榆柳莊名鎮靜九年復移於白塔澗口去塞三百里縣志稱城垣屹然蓋舊寨之遺基也通鑑後唐長興四年李彝超以夏州拒命命藥彥稠等討之進屯蘆關彝超遣党項抄掠官軍自蘆關退保金明趙珣聚米圖經自蘆關南入寨門為金明路舊有蘆關寨宋史地理志至道中廢元豐四年復為戍守之所李繼周傳淳化五年繼周以阿都關寨門蘆關等寨最居邊要遂規修築寨城蔡夢弼杜詩注去延州百八十里有土門山兩崖峙立如門形如葫蘆故謂之蘆子縣志北控沙漠舊設兵固守今城猶新環城坑窖尚存别名鐵門寨洪門故鎮一統志在靖邊縣南唐書張獻甫傳獻甫領邠寧節度使請復鹽州洪門及洛原鎮屯兵詔可太平寰宇記宥州南至洪門鎮八十里為界渾瑊墓一統志在宜川縣西南五十里後梁高萬金墓通志在府城南八十里盤龍村延綏志萬金河西人高萬興弟延州刺史貞明四年卒乃以萬興為鄜延節度兄弟世家其土宋金明寨通志在安塞縣東南一百一十步宋史地理志熙寧五年省金明縣為寨周美傳康定初夏人破金明諸寨美請於范仲淹曰金明當邊衝今不亟城將遂失之仲淹因屬美復城如故新興堡安塞縣志在縣西南一百五十里控延安東北疆遠川一帶太平興國中築一名新寨招安橋通志在安塞縣西北四十里甃石為之狄青築招安寨於橋子谷即此地歷元迄今往來利濟柳榆堡通志在安定縣西北四十里范仲淹所築園林堡通志在保安縣東八十里即園林驛九域志慶厯五年置金湯城通志在安定縣西北一百二十里宋史哲宗本紀元符二年築鄜延路金湯城周美傳美敗夏人於金湯城焚其族部二十一縣志為縣戍守要地今基址猶存與慶陽黑水接界雲巖鎮通志在宜川縣北少西八十里府志山巖重叠如雲故名後魏置縣唐因之宋熙寧中省為鎮劉延慶墓一統志在保安縣北二里延慶官保信軍節度使金永平堡通志在延川縣西北一百里金史地理志延川寨一永平府志古永州城謹按唐武德二年於金城縣界內置永州縣志皇統二年修寨一所明知縣王世相金棟繼修元瓦􅘸堡通志在安定縣東三十里元初建因山為堡明季冦數至邑人郭永治守禦有方堡賴以無恐高奴寨通志在延長縣北二百里北山府志元圖烈巴令參政何遠築以屯兵周二百九十八步在高部山上四面陡絶俗訛為高奴非也明延水關通志在延川縣東南七十里吐延川口東臨黃河北通山西永和縣府志魏置文安縣隋廢唐改延水宋省為鎮入延川今為延水關又有清水關在縣東南一百里清水川口東臨黃河北通山西大寧縣有清水關渡文安堡通志在延川縣西三十里明參政張愚築又禪梯嶺堡在縣西七十里嘉靖間延綏巡撫張珩言延川縣西有禪梯嶺乃套夷深入之路比他鎮獨重宜增築一城從之甎井堡一統志在定邊縣東四十里正統二年置後余子俊以甎井難守於迤西東海螺城改置新興堡嘉靖三十二年復修甎井城在平川為極衝上地又新興堡在縣東南八十里成化十一年置城在山上為次衝中地安邊堡一統志在定邊縣東一百里亦名舊安邊營地名深井正統二年置城在平川為極衝中地成化十一年余子俊以其地平曠難守移守深河兒地名中山坡改置新安邊營城在山坡為極衝中地背山面水險阻四塞嘉靖三十三年巡撫王輪以舊營地近大邊復守之於是新舊兩營並置柳樹澗堡一統志在定邊縣東一百四十里天順初置為極衝中地又名潦池堡在縣南一百里成化十一年置三山堡在縣西南九十里成化九年置饒陽水堡在三山堡南四十里成化十三年置鹽場堡一統志在定邊縣西四十里成化十三年置城在平川為極衝中地鎮羅堡一統志在靖邊縣東北四十里本名魚口寨明萬厯十八年增置城在平川為極衝中地鎮靜堡一統志在靖邊縣東北八十里地名白灘兒亦名白塔澗口明初守安塞縣塞門成化三年尚書王復請移於榆柳莊改名鎮靜後又移此城在山畔北臨快灘河為極衝中地龍州堡一統志在靖邊縣東北一百二十里明成化五年置城在平地為極衝中地寧塞堡一統志在靖邊縣西四十里明成化十年置城在山原為極衝中地又把都河堡在寧塞堡西三十四里把都河口成化九年置關中勝蹟圖志卷二十三
