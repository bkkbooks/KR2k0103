body:
  text: 闗中勝蹟圖志巻十一陜西巡撫臣畢沅撰名山華隂縣華嶽縣志在縣南十里書舜典八月西巡守至于西岳禹貢西傾朱圉鳥䑕至于太華周禮職方氏豫州其山鎮曰華山左傳僖公十五年晉賂秦河外列城五南及華山史記封禪書華山黄帝之所常遊與神㑹白虎通華之為言穫也萬物成熟可得穫也風俗通華者華也萬物滋然變華於西方也唐書地理志上元二年改華山曰太山寳應元年復故名括地志華山古文以為惇物洞天記華山名太極總仙之天即少昊為白帝治西嶽上應井宿之精下鎮秦地之分野九域志華山四州之際東北冀東南豫西南梁西北雍十字分之四隅為四州述征記華山從麓至頂升降迂迴凡三十三里太平寰宇記華嶽有三峰直上數千仞基廣而峰峻叠秀迄于嶺表昭文館記上有三峰上接三光中有石池二十八所上應二十八宿懷藴金玉蓄藏風雷為大帝之别宮乃神仙之窟宅也雍勝略以西有少華山故曰太華登岳者發軔先玉泉圖書編雲臺觀至玉泉院一里雍勝略玉泉在張超谷口其水色如􅄴相傳玉井滲出者因置玉泉院魏光緒記玉泉院有祠祀希夷先生祠後石洞為先生睡像左畔有山蓀亭隴蜀餘聞山蓀亭踞盤石上玉泉環流有樹四株名無憂樹出玉泉院東南上為谷口水經注從北南入谷七里又届一祠謂之石養父母石龕木主存焉范守已記两壁直立如削髙千仞谷底濶不盈尺寛者或二三尋谷流轉折随山約五里許至五里闗圖書編自玉泉院至闗五里范守已記巨石突塞谷口為石門人佝僂上若隧道然額曰通天第一門桃林坪圖書編在五里闗上張超谷楊嗣昌記五里闗南後漢書張楷傳華隂山南有公超市性好道術能作五里霧華岳圖一名仙谷以張超結廬改名今石室依然峯麓名勝記一稱張超霧市谷内有卧仙坪内石室為蛻骨所樵牧戲其間有飛石来塞其穴石羊城名山記在張超谷西黄初平叱石化羊處與兄初起俱仙隐於此又名仙谷算塲蘆花池雍勝略在張超谷中述異記後魏道士宼謙之洞曉渾天儀曽定天元五紀後随成公興去棄其餘算籌化為葭荻即成蘆花池壺公石室峯麓名勝記在岳西北孤峯上石室可容十餘人有泉東北入霧市谷東谷中即宼謙之算塲西谷中即修羊公石榻希夷峽都穆記第一闗四里至方洞洞口斗崖百尺名希夷峽其上𩔖穴乃其蛻骨所舊有垂鏁可攀以上見骨盛木函色微紅香甚有人竊趾骨以去道士憤之斷其鏁自是人不得上范守已記嘉靖末姚直指一元遷葬于祠内香櫝下峽謹按希夷蜕骨于明李復遷􅄟中第二闗都穆記希夷峽西折四十歩為第二關大石中分若斧劈者車箱潭雍勝略在仙谷内十里水府記華山車箱潭乃第七水府也通志宋仁宗嵗遣使投玉簡于此崇寧二年封豐潤候甕谷通志在華山西谷口環抱如甕為商洛徑道桃谷通志在華山西入谷八里為張果晒經處牛心谷通志在華山東即楊震教授生徒處峯麓名勝記其地多槐稱楊震槐市山間多五色鶩鳥文仙谷通志在華山東呂真君修道處藏馬谷雍勝略在華山東漢武帝求仙有神馬自華山出不見尋之在此谷石龕下故又名藏馬龕東北澗中石上馬跡尚存黄神谷通志與藏馬谷相近真人黄蘆子𨼆居處華隂縣志内有黄龍潭旱則禱焉宋封廣潤侯娑羅坪都穆記第二闗行三里至娑羅坪土曠而夷三才圖㑹有娑羅菴菴外東靣石壁可數十丈鳴瀑掛壁而下范守已記山至是两壁各縮約十餘丈谷滸寛平如几有遊者過此祈禱外有娑羅樹一本上方峰楊嗣昌記娑羅坪東對小上方又上為大上方華岳圖洞天坪即娑羅坪其東絶巘為上方峯突靣攀鏁險不可視非登岳要路雍勝略上方白雲宮中方太淸宮下方雲臺宮皆在娑羅坪東峯上因羽人焦道廣建甕肚峯通志在華山中方上又有駕鶴軒在中方半路唐開元記山突起如半甕明皇嘉其髙迥欲于峯腹大鑿開元二字填以白石令百餘里皆見因諫乃止西元門王􅂂記上方峯攀鏁盡處有石罅號西元門此峯唐金仙公主駕鶴昇仙處門則元宗覓金仙而鑿者也十大洞天記華山西元洞周迴三十里名極真洞天乃長春之境八仙洞都穆記在娑羅坪西險不可上繫馬峯三才圖㑹娑羅坪北望山頭有石如柱十八盤三才圖㑹踰娑羅坪至十八盤山最陡者凡十有八折楊嗣昌記坪之上為盤最下三盤曰斗三盤逆十八盤而上孤峯錯落山猶左右截也青柯坪圖書編自希夷峽至此十里雍勝略在十八盤之上有青柯館遊者至此舎輿易􅋔王履記至此山恰半入山来悉﨑嶔側塞夷者惟此楊嗣昌記坪在西峯下迴􅂗曲磴浮蒼㸃黛宻如柯葉寥陽洞都穆記青柯坪右范守巳記洞旁架木為祠迤北皆石崖壁立北斗坪華岳圗青柯坪西冇峯插天名北斗坪盖四毛女拜斗得仙之地壑謹按升岳塗徑自谷口至娑羅坪尚屬山麓地多幽曲澗上至青柯坪通計得二十里當山之半登陟者可肩輿以達凡上方以下諸峰皆環繞於坪之左右者也至迴心石始攀鐵索以行至者畏險輒還故曰迴心也回心石圖書編青柯坪左上里許喬宇記路皆斜削絶壁攀鐵索至此始千尺㠉圖書編青柯坪東上三里許水經注南至天井裁容人穴空迂迴傾曲而上可髙六丈餘上者皆所由渉更無别路欲出井望空視明如在室窺牕也范守己記一峯直立劃焉中崩如鋸曳痕左偃右覆人自壁中行濶尺許髙百餘尋百尺峽圖書編在㠉上東北轉一里許水經注東上百丈崖升降皆須攀繩挽葛以行范守巳記峯如前而殺壁益狭两腋摩壁石以行上有塊石撑之若恐其復合者吳同春記峡頂有巨石如雲名雲頭石二仙橋喬宇記百尺峽東北行二里許靣崖執鏁足踏木棧以漸東移横行百歩曰仙人橋過橋數轉為俯渭崖西為車箱崖崖如車箱人縁輪以行媪神洞通志在二仙橋上洞内恭懸聖祖仁皇帝字扁額御賜抱真二老君犁溝范守己記百尺峽上五里許石壁插天若剗若削水霤一道自上而下直若引繩深若發耜李之椿記犁險於㠉㠉暗而犁突三才圖㑹一云離垢謂老君登華離却塵垢云胡孫愁喬宇記自仙人橋東北行里許攀行六十歩曰胡孫愁三才圖㑹崖壁竒峭上有鐵猨顰踞崖畔雲臺峰圖書編犁溝又行四里雍勝略两峰峥嶸四面懸絶上冠景雲下通地脉嶷然獨秀有若雲臺下有穴昔人入此東去云經黄河底上聞流水聲峯側有長春石室峯􅅢名勝記貞觀中有道士杜懷謙居此自號長春先生玉女牕峯􅅢名勝記在雲臺南峯上有石門入丈餘直上石窰如牕望見南峰明星玉女之别館也神土巖雍勝略在雲臺峰東南百歩周武帝時道士焦道廣居雲臺峰帝親問道因於谷口置雲臺觀道廣欲構房廊精思所感石上湧出神土用盡復生于今尚然又仙油􅜐峯麓名勝記在雲臺峰壁中焦道廣每設醮天降油於此後道廣乗去油不復生試鑿穴峯麓名勝記在雲臺北峰北面髙百丈深不可測穴邊一石如鑿希夷先生蛻骨所也公主峰述異記與雲臺峰相近漢南陽公主避莽亂入山得仙尚有朱履遺跡竇谷通志在華山東即王遥隐居處谷中有王刁三洞雍勝略仙人王遥刁自然登仙處上洞莫能到中洞有飛石遮洞門下洞隠居者皆在其中相近有碧雲洞峯麓名勝記下為碧雲溪宋有鄭雲叟翟士端鄭明處羅隐之居此時稱四髙士居白雲峯峯麓名勝記在岳東北唐金仙公主修行之所名曰白雲宮宮側有焦真人石洞白羊峰雍勝略在岳西北五里層崖晃朗洞石空濛昔有人隠此莫知姓名常乗白羊往来因以名峯毎至三元八節及諸齋日即有神燈或三或五見於崖壁焦公崖峯麓名勝記焦公崖在岳東南真人焦孝龍居此野火焚其菴坐火中徐起常于雪中單衾卧毛女峯雍勝略在岳西秦時宮人字玉姜入山隠此峯上食柏飲水體生緑毛人常見之有毛女洞洞中猶聞鼓琴之聲其西為太極總仙洞下有車箱潭三十六小洞天記第三西岳華山洞周迴三百里名總仙洞天擦耳崖吳同春記自犁溝東轉至崖路僅容趾下臨絶塹行則崖石擦耳仙人碥范守已記自雲臺折而南行三里許吳同春記崖如鑿塊挽鏁而上百餘歩名上天梯有赤白二圓形崖下為金天洞循崖西南行復半里許有三元洞御道范守巳記過仙人碥行亂石上一石若蓮屏直立循屏而度又一石稍濶為坊其上曰升嶽御道峯麓名勝記漢武帝唐元宗曽由此因名今两旁有石臼乃當時栽闌纒錦以遮危險者御道之右有白鹿龕漢武内傳魯生女乗白鹿從王母而去故曰白鹿龕蒼龍嶺圖書編自日月崖轉西南行三里許是為山脊水經注至胡趨寺神像有童子之容從祠南歴夾嶺廣裁三尺餘两箱崖數萬仞窺不見底祀祠有感則雲與之平然後敢度猶須騎嶺抽身漸以就進故世謂斯嶺為搦嶺王履記嶺凡两折中隆旁殺如背色正黑楊嗣昌記古無闌砌今可平視其上石級合數之得二百四十有六説鈴嶺盡為龍口冐一大石有鑱曰韓退之投書所鷂子翻身圖書編過蒼龍嶺又上行一里許至其巔路忽絶由崖下鑿折身反度八公龕范彤弧記度蒼龍嶺復循髙崖下黄上黒有水泉積雪樹最古者曰將軍樹上馬石范守己記石嶺如馬脊自東踰石而西若騙馬狀石两旁如削過石復有一石亘跨嶺際為單人橋橋南銜石背而上為通天門唐杜甫詩箭括通天有一門即此宗土地祠三才圖㑹趨雲山崖有宗土地祠謂華為羣山之宗也說鈴華岳有三麓首谷口次青柯坪次宗土地祠祠在三峯之下相近有四仙菴三才圖㑹為譚紫霄馬丹陽劉海蟾邱長春修煉之所細辛坪雍勝略在頂之西南隅方圓三四畆盡是細辛坪東過溪口登巨石上有鐵坊曰太極東元門又自坪西行百餘歩有洞曰朝陽玉女峯華岳圖在東峯右同阯而異巘昔有人見玉女乗白馬入峯間集仙錄明星玉女居華山服玉漿白日上昇許孚逺記玉女偃伏東峯之内若闔閣間玉女殿在峯頂雪壁爍日范守己記有巨室若龜狀背上叠石為玉女祠三才圖㑹龜腹刳為石室舊有楊妓師事韓姑于此醴泉峯麓名勝記在玉女祠旁水微有酒香為國之瑞玉女洗頭盆范守已記祠前度石梁而南一石突兀廣二丈長十餘丈有坎可容五斗水雍勝略祠前有五石臼水紺碧澄澈不乾不溢又有玉女石馬甚靈異常夜聞嘶噉之聲三才圖㑹洗頭盆前石裂可五尺以石投之食頃猶有聲或云下通黄河范守己記石北泐可五寸其深不測是為唐人進簡處東峯名山志朝陽峯也説鈴東峯有三玉女在左石樓在右三茅洞三才圖㑹東峯上有三茅洞前為小殿殿左有崖當東峯盡處仙掌崖雍勝略在東峯東北西京賦綴以二華巨靈贔屭髙掌逺蹠以流河曲西征賦眺華岳之隂崖睹仙掌之遺跡水經注華岳本一山當河河水過而曲行河神巨靈手盪脚蹋開而為两今掌足之跡仍存王涯仙掌辨峯有五崖比壑破崖而列自下逺望偶為掌形三才圖㑹厓壁黒色膏自􅪤中流出随膏凝結黄白相間逺望之見其大者五岐如指名山記上有石月半輪光可鑑衛叔卿博臺雍勝略在岳頂東南隅别一孤峯遥望有方石如棋局韓非子秦昭王令工施鈎梯而上華山以節柏之心為博箭長八尺棊長八寸而勒之曰王與天神博於此范守己記東峯南下有小峰平頂當岳之胸上有鐵瓦亭一區鐡棊一枰為衛叔卿圍棊處路由懸崖鐵鏁直縋約十餘丈鏁盡蹠崖自度﨑嶇九折乃至其所石樓峯名山記髙於玉女其東壁則為仙人掌謹按宗土地祠在三峯口己抵玉女峯下自玉女西麓西南去三里許至細辛坪有溪直界乃東峯與西南二峯分界處升岳者度溪至東元門必先登玉女故以東峯次玉女後而玉女祠諸勝則附玉女三茅洞諸勝則附東峯也西峯即蓮花峰雍勝略一曰芙蓉峯昭文館記蓮花峰為太上山迴巒四合三峰峥嶸上廣十里名山記從雲臺望東西二峰上分下合若並蒂蓮花南峰藏其間如蓮房説鈴西峰冇三石樓在前老君爐在後石樓峯與東峯石樓相對乃白帝建鐘鼓之所頂有巨靈足跡范守已記跡長三尺許深一寸許儼然踵跡㾗神香子斧劈石范守己記長十數丈浮置峰頂斷而為三其北若夾壁上有覆石其下若門才可容人石西下臨深壑五千仞石東亦陡削直至谿底玉井雍勝略在蓮花峯傍三才圖㑹深可十丈圓徑半之楊嗣昌記玉井涓渫異常泉左方為鎮岳宮右上即南峰路二十八宿潭華岳圖在玉井旁三才圖㑹峰之下有石窪如臼凡二十有八上應列宿自北而南如貫珠自崖端下挂山腹水簾洞洩之頂又有八卦池太乙池石仙人水簾洞雍勝略在岳北面半腹中登真隠訣洞深三百里中有瑶臺玉室石髄金精遥望方圓可丈許鳥道絶通時出異色雲氣洞口上有丹石間青石似丹青畫出仙人之狀冠帔衣服無不周備號曰石仙人范彤弧記洞在西峰之腰正臨削壁諺曰老君臍玉井出西峰二十八潭奔注两峰間懸瀑數千仞至洞口下有丹石承之倒灌入洞伏而不見至青柯坪于石隙中如珠簾散布而出流行成澗出谷口入渭岳有四洞東曰昭陽西曰西元南曰正陽北曰水簾洞元石室峯麓名勝記在頂之西北峰上東西有二門初才容身側入至室中周迴五六丈有石道君像髙三丈名山記一名裴君石室真人裴君入石室精思至道積二十三年降五龍元老之所屈嶺水經注自上宮東北出四百五十歩有屈嶺説鈴西峰有一臂詰曲如蒼龍嶺廣倍之名曰屈嶺度嶺經巨壑四五乃至南峯老君煉丹爐李之椿記在蓮花峯北三才圖㑹罏徑丈餘髙可六尺謹按玉井白蓮自古著稱有谿自玉井東至玉女峰北注乃西峰與南峰分界處南峰獨髙西峰最竒其三峰統稱蓮花實由西峰得名也凡玉井諸勝俱附西峰之後南峯即落雁峯唐語林李白登華山落雁峯曰此山最髙呼吸之氣想通帝座恨不攜謝眺驚人語来搔首問青天耳尹伸記即縣中所見如冠形者中峯隠約與東西峰相對南峰為西峰所障躡松檜峰始識其靣絶其巔而後見東西峰之在下也魏光緒記南峰五岐並起中為落雁峯東松檜峰又東為賀老石室西則老君丹罏又西為寳旭黑龍潭峯麓名勝記在南峰上旱禱必應宋熙寧二年封顯潤侯王履記潭有三深淺不等深者不過二三尺雖大旱不涸説鈴龍在則水黑去則水清華之頂門水也菖蒲池雍勝略在太上泉旁池有菖蒲一寸九節水經注届山頂上方七里靈泉二所一名蒲池西流注于澗一名太上泉東注澗下楊嗣昌記太上泉水清淥作瑟瑟光俗謂之仰天池老君洞峯麓名勝記在頂之東南峰朝元洞王履記南峰南靣迎陽洞上為雷神洞復右折為朝元洞上下壁削鑱壁成堮叠石置闗窽石以入深可四丈廣近之髙又倍焉純白如雪昔賀老營此四十年賀老避静處三才圖㑹朝元洞之下有賀老石室室憑突崖煬竈猶在吳同春記從朝元洞垂雙鏁下縋鏁盡以鐵杙插壁承以狹版鏁當人膺行則靣壁舒臂縁鏁以足横移洞額即全真巖説鈴長空棧在壁半廣八寸長數十丈背空虚行棧盡得賀老窰俯臨之可千仞全真崖三才圖㑹在静室旁有崖髙十餘丈遥覆其室朱書全真崖三字各大仞許非御虚者不能成避詔崖范守已記由峯頂東南下為避詔崖李之椿記崖形覆前縮後約數十丈華岳圖希夷表云九重寵詔休教丹鳯啣来一片野心已被白雲留住因以此名崖有希夷手書避詔崖三字三公山峯麓名勝記在岳東南三峰森秀上象三台魏光緒記南峰背臨絶壑壑外更為三峯名三公山髙與前埓两畔千峰林立若青蓮瓣之擁䕶燕公石室峯麓名勝記在三公山漢明帝時有燕子㣲隠此服蒼术黄精得仙三鳯山楊嗣昌記在三公山稍西山頂各一石起立如危闌相倚環三峰者層樊細皴如千葉寳蓮蹟謹按三公三鳯諸山在南峰之南大壑外其神靈勝俱在岳北盖岳體北向南其背也南峰最峻東西二峰僅及其半升岳者必登南峰而極凡黑龍潭諸勝俱附南峰之後唐杜甫封西岳賦并序上既封泰山之後三十年間車轍馬跡至於太原遷於長安時或謁太廟祭南郊毎歳孟冬巡幸温泉而已聖主以為王者之禮告厥成功止於岱宗可矣故不肻到崆峒訪具茨驅八駿於崑崙親射蚑於江水始為天子之能事壯觀焉爾况行在供給蕭然煩費或至作歌有慚於從官誅求坐殺於長吏甚非主上執元祖醇醲之道端拱御蒼生之意大哉聖哲垂萬代則盖上古之君皆用此也然臣甫愚竊以古者疆埸有常處賛見有常儀則備乎玉帛而財不匱乏矣動乎車輿而人不愁痛矣雖東岳五岳之長足以勒崇垂鴻與山石無極伊太華最為難上至於封禪之事獨軒轅氏得之夫七十二君罕能兼之矣其餘或蹶踣風雲碑版祠廟終么麽不足追數今聖主功格軒轅氏業纂七十君風雨所及日月所照莫不砥礪華近甸也其可恧乎比嵗鴻生巨儒之徒誦古史引時義云國家土德與黄帝合主上夲命與金天合而守闕者亦百數天子寢不報盖謙如也頃或詔厥郡國掃除層巔雖翠盖可薄乎蒼穹而銀字未藏於金氣臣甫誠薄劣不勝區區吟咏之極故作封西岳賦以勸賦之義預述上將展禮封柴者實覬聖意因冇感動焉為其詞曰惟時孟冬百工乃休上將陟西岳覽八荒御白帝之都見金天之王既刋石乎岱宗又合符乎軒皇兹事體大越不可載已先是禮官草具其儀各有典司俯協吉日欽若神祇而千乗萬騎已蠖略佁儗屈驕陸離唯君所之然後拭翠鳯之駕開日月之旗撞鳴鐘發雷輜辦格澤之修竿決河漢之淋漓彍天狼之威弧墜魍魎之霏霏赤松前驅彭祖後馳方明夾轂昌寓侍衣山靈秉鉞而踉蹡海若䕶蹕而參差風馭冉以縱􅑨雲螭縒而遲跜地軸軋軋殷以下折原隰草木儼而東飛岐梁閃倐涇渭反覆而天府載萬侯之玉尚方具左纛黄屋已焜煌於山足矣乗輿尚鳴鑾輿儲精澹慮華盖之大角低回北斗之七星皆去届蒼山而信宿屯絶壁之清曙既臻夫隂宮犀象硉兀戈鋋窸窣飄飄蕭蕭洶洶如也於是太乙抱式元㝠司直天子乃宿祓齋就登陟駢素虬超崱屴天語秘而不可知代欲聞而不可得柴燎上達神光充塞泥金乎菡蓞之南刻石乎清㝠之北上意由是茫然延降天老與之相識問太微之所居稽上帝之遺則颯弭節以徘徊撫八紘而黬黒忽風翻而景倒澹殊狀而異色冏若褰袪開帷下辯宸極者乆之雲氣蓊以迴復山嘑嶪而未息祀事孔明有嚴有翼神保是格時萬時億爾乃駐飛龍之秋秋詔王屬以中休覲羣后於髙掌之下張大樂於洪河之洲芬樹羽林莽不可収千人舞萬人謳麒麟踆踆而在郊鳯凰蔚䟦而来遊雷公發鼓而揮汗地祇被震而悲愁樂師拊石而具發􅈭越乎遐陬羣山為之相􅲞萬穴為之倒流又不可得載己乆而景移樂闋上悠然垂思曰嗟乎余昔嵗封泰山禪梁父以為王者成功已纂終古甞鑒前史至於周穆漢武豫遊寥濶亦所不取惟此西岳作鎮三輔非無意乎頃者猶恐百姓不足人所疾苦未暇􅄟斯玉帛考乃鐘鼓是以視岳於諸侯錫神以茅土豈惟壯設險於甸服報西成之農扈亦所以感一念之精靈答應時之風雨者矣今兹冡宰庻尹醇儒碩士僉曰黄帝顓頊乗龍遊乎四海發軔匝乎六合竹帛有云得非古之聖君而泰華最為難上故封禪之事鬱沒罕聞以余在位發祥隤祉者焉可勝紀而不得已遂建翠華之旗用塞雲臺之議矧乎殊方奔走萬國皆至元元從助清廟歔欷也臣甫舞手蹈足曰大哉爍乎真天子之表奉天為子者矣不然何數千萬載獨繼軒轅氏之羙彼七十二君又疇能臻此盖知明主聖罔不克正功罔不克成放百靈歸華清元宗途經華岳詩飭駕去京邑鳴鑾指洛川循途經太華迴蹕暫周旋翠嵓留斜影懸崖凝夕烟四川皆石壁五位配金天彷彿看髙掌依稀聽子先終當銘嵗月從此寄靈仙蘇頲奉和聖製途經華岳應制詩朝望蓮花岳神玉心就日来晴觀五十仭仙掌拓山開受命金符叶過祥瑞陪霧披乗鹿見雲起馭龍回偃樹枝封雪殘碑石冒苔聖皇惟道契文字勒巖隈張説奉和聖製途經華岳應制詩西岳鎮皇京中峰入太清玉鑾重嶺應緹騎薄雲迎霽日懸髙掌寒空類削成軒遊㑹神處漢幸望仙情舊廟青林古新碑綠字生羣臣願封岱還駕勒鴻名沈佺期辛丑嵗十月上幸長安時扈從出西岳作西鎮何穹崇壯哉信靈造諸嶺皆峻秀中峯特美好傍見巨掌存勢如石東倒頗聞首陽去開坼此河道磅壓洪源巍峩壯清昊雲泉紛亂瀑天磴屹横抱子先呼其巔宮女世不老下有府君廟歴載傳灑掃星明應天遊十月戒豐鎬微末忝閒從兼得事蘋藻宿心愛兹山意欲拾靈草隂壑己永閟雲竇絶探討芳月期再来迴策思方浩祖詠觀華岳詩西入秦闗口南瞻驛路連彩雲生闕下松樹到祠邊作鎮當官道雄都俯大川蓮峰徑上處彷彿有神仙王維華岳詩西岳出浮雲積雪在太清連天凝黛色百里遥青㝠白日為之寒森沈華隂城昔聞乾坤閉造化生巨靈右足踏方止左手推削成天地忽開拆大河注東溟遂為西峙岳雄雄鎮秦京大君包覆載至德被羣生上帝佇昭告金天思奉迎人祇望幸乆何獨禪云亭杜甫望岳詩西岳崚嶒竦處尊諸峰羅列似兒孫安得仙人九節杖拄到玉女洗頭盆車箱入谷無歸路箭括通天有一門稍待西風涼冷後髙尋白帝問真源李白西岳雲臺歌送丹邱子西岳峥嶸何壯哉黄河如絲天際来黄河萬里觸山動盤渦轂轉秦地雷榮光休氣紛五采千年一清聖人在巨靈咆哮擘兩山洪波噴箭射東海三峰却立如欲摧翠崖丹谷髙掌開白帝金精運元氣石作蓮花雲作臺雲臺閣道連窈㝠中有不死丹邱生明星玉女備洒掃麻姑搔背指爪輕我皇手把天地戸丹邱談天與天語九重出入生光輝東来蓬莱復西歸王漿倘惠故人飲騎二茅龍上天飛韓愈古意詩太華峯頭玉井蓮花開十丈藕如船冷比霜雪甘比蜜一片入口沈疴痊我欲求之不憚逺青壁無路難夤縁安得長梯上摘實下種七澤根株連臣謹按唐一行云天下山河之象存乎兩戒北戒自積石終南負地絡之隂而東及太華南戒自岷山嶓冡負地絡之陽而東及太華河自北戒之首循雍州北徼以逹華隂江自南戒之首循梁州南徼以達華陽是太華者兩戒山河之㑹也周禮職方尊為西嶽祭視三公漢樊毅謂其能通精氣興雲雨又用昭明百榖繁殖黎民時雍是以軒帝遊焉以㑹衆神虞帝柴焉以覲羣后爰自夏氏以迄我朝世歴四千秩祀罔替乾隆辛夘之嵗臣恭膺簡命備位闗中抵華隂境祇謁嶽祠申禋展事計今五稔以来仰䝉皇上宵衣旰食敬天勤民蒼祇合符嶽靈効職雨𤾉時若年榖順成百物無疵癘夭札維時以兩金川小醜未靖徴輸旁午未獲親陟三峰以章美報嵗乙未秋八月西師告㨗大凱將還以東路郵程待需察眎遂由省城啟行途經臨潼渭南華州各邑時維九月秋稼登場但社期巳過農民尚未俶事春田待澤孔殷因念華嶽距中土西偏七宮正位少陽用事萬物生華自古在昔報賽禱祈咸在於是因率領縣令致齋簡從躡屫登山宿半山之媪神洞次日得至落雁峯頂上有金天宮為康熙四十二年癸未聖祖仁皇帝翠華西幸勅發帑金修建御題露凝仙掌四字恭懸正殿奎文炳爍巖壑増輝因領縣令恭禮嶽靈䖍誠祈禱即時甘霖大沛連三晝夜徧數千里報謝下山啟程回省臣以職司守土幸際昌期心切康年情殷請命仰䝉聖恩俯鑒微忱特頒御書嶽蓮靈澍殿額臣恭率寮宷跪迎至署祓飾厥文敬上金天宫殿兩朝奎畫輝映後先麗並三辰光増羣岳天人之事盛矣神祇之望允塞猗歟休哉曠古所希遇也至於嶽之大體山海經云太華之山削成而四方其髙五千仞其廣十里此盖指蓮花玉女落雁三峰而言實則五峰岐出南為落雁西為蓮花東為玉女北為雲臺中則香罏峰也由谷口以至娑羅坪尚屬山麓上至青柯坪計程得二十里青柯坪至蒼龍嶺得二十里蒼龍嶺至落雁峯頂得二十里然他山迤行此則直上故其峻絶數覺倍之青柯坪以下皆由北峯取道過媪神洞則轉至中峰至三峰口始蒞東西兩峰之趾登東西峰始見南峰之趾名為三峯實則前屏後障左龍右沙蟠天際地各自為髙者甚衆不同他山一二大峰外餘皆㟝嶁然大峰雖多實以三峯為之主餘皆環拱擁衛不同他山之參差雜插漫無主峰譬如大將之統列帥牧伯之總羣侯有綱有紀不僣不忒分之各自為雄合之共成其大秦地名山甲於天下而此獨尊之為岳良有以也至岳之竒莫過於千尺㠉險莫過於蒼龍嶺其餘大竒則大險小竒則小險蝸旋而上猨挂而下随足所到皆非心神意計所及上至三峰之頂自為天地日月星斗㡬可平視風雲雷雨皆在下方出沒隠見光晶掩鬱與人間經見景象迥異俯視下界近則秦嶺少華逺則終南太白往時所見以為𣺌若霄漢者皆如兒孫帖帖肘腋却顧此身虚空飄蕩𣺌如黍粟儵忽惝怳㡬無見聞所謂御六氣之辨以至無窮升崑崙而排閶闔其視下也亦若是而巳矣臣仰䝉聖恩具位西陲際斯嘉㑹忭欣感戢莫可名言謹識大凡巻末以志慶幸云關中勝蹟圗志巻十一
