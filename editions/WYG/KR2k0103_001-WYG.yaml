body:
  text: 闗中勝蹟圖志巻一陜西巡撫臣畢沅撰地理陜西省禹貢黒水西河惟雍州孔安國傳西距黒水東據河龍門之河在冀州西故曰西河州謹按今陜西地惟漢中府興安州商為古梁州域餘皆屬雍一統志周為王畿東遷後屬秦其東境分屬晉戰國時秦都咸陽其東北境屬魏南境屬楚秦始皇并天下以京師為内史兼置上郡漢中等郡漢元年項羽以漢中為漢國分秦地為雍塞翟三國高帝都長安初置渭南河上中地郡九年復為内史景帝分置左右内史武帝改内史置京兆尹左馮翊右扶風是為三輔置司隸校尉統之又以上郡朔方元朔二年置西河元朔四年置等郡屬并州漢中郡屬益州後漢光武遷都雒陽以三輔屬司隸諸郡分屬并益州如故建安十八年罷司隸置雍州三國屬魏仍曰雍州其漢中郡屬漢後屬魏分置梁州晉仍曰雍梁二州晉初於長安置雍州統京兆馮翊扶風安定北地始平新平七郡梁州治漢中所領郡皆在今四川界魏興郡則屬荆州建興元年復都長安尋皆陷建興二年李雄陷漢中四年劉曜陷長安太興二年曜自平陽徙都長安改號趙咸和四年石勒克長安永和六年苻堅據關中為前秦十一年姚萇據長安為後秦義熙十三年劉裕滅姚秦十四年夏赫連勃勃陷長安後魏神䴥三年平關中仍為雍州後分置洛岐華夏北華等州正始間分置東益東夏南岐東梁及東秦北雍東雍諸州西魏徙都長安州名更易不常復增置綏丹洋三州後周武帝保定三年增置銀州隋開皇二年建新都三年廢郡存州大業初改雍州為京兆尹又改諸州為馮翊本西魏廢帝所置同州扶風本岐州上郡本鄜州雕隂本綏州延安本延州朔方本夏州榆林本勝州隋開皇二十年置漢川本梁州西城本金州河池本鳯州順政本興州上洛本洛州後周改商州等郡唐仍隋都復改諸郡為州貞觀元年分置關内及山南道關内道治京兆府領鳯翔府華同商邠隴鄜坊丹延鹽夏綏銀宥麟勝等州唐末李茂貞又增置乾耀鼎翟等州山南道開元二十一年又於山南分東西二道後又分置鳯翔邠寧夏州山南西道諸節度使唐末廢都五代因之乾耀邠岐隴鄜坊丹延九州初屬岐鳯州屬岐亦屬蜀金州初屬蜀後皆屬唐梁洋二州屬前後蜀宋初曰陜西路熙寧五年分為永興軍路兼屬秦鳯利州京西河東四路宋史地理志慶厯元年分陜西沿邊為秦鳯涇原環慶鄜延四路熙寧五年以熙河洮岷州通逺軍為一路又以熙河等五州軍為一路通舊鄜延等五路後分永興保安軍等為永興軍路秦階隴鳯等為秦鳯路並置轉運使仍以永興鄜延環慶秦鳯涇原熙河分六路各置經略安撫司永興軍路領京兆延安府同華耀邠鄜商坊丹等州其後又增銀州醴州及綏徳清平等軍其鳯翔府隴鳯二州屬秦鳯路興元府洋興二州屬利州路金州屬京西路麟府豐三州屬河東路南渡後陜西地入於金分為京兆鳯翔鄜延等路京兆府路本宋永興軍路皇統二年改名鳯翔路本宋秦鳯路大定二十七年改名鄜延路治延安府又以邠州分屬慶原路其興元府金洋鳯沔等州則仍屬宋利州路元中統三年立陜西四川行省治京兆至元二十三年改為陜西等處行中書省明初仍立陜西行省洪武九年改置陜西等處承宣布政使司有左右二使並治西安府共領八府一州又置陜西都指揮使司統諸衛所本朝初因明之舊康熙二年移右布政使治甘肅左布政使仍治西安領西安延安鳳翔漢中四府興安一州陜甘始分雍正三年升西安府之商同華耀乾邠六州延安府之鄜綏徳葭三州直隸陜西布政司九年又改榆林衞為府十三年復改同州為府華州屬焉耀州改屬西安乾隆元年葭州改屬榆林今領府六西安同州鳳翔漢中延安榆林直隸州六興安商乾邠鄜綏徳州縣七十有八詳見各府西安府釋名通志本元西安路明因其義改為府沿革一統志自府治至京師二千六百五十里禹貢雍州之域周武王都此為鎬京東遷後屬秦為都邑史記秦本紀徳公初居雍獻公徙治櫟陽孝公作咸陽徙都之始皇置内史漢元年項羽分置雍塞二國章邯為雍王王咸陽以西司馬欣為塞王王咸陽以東至河及翟國為三秦尋併於漢二年改為渭南河上中地三郡渭南即京兆河上即左馮翊皆塞國地中地即右扶風雍國地五年定都於此九年罷郡復為内史景帝二年分置左右内史此為左内史武帝太初元年改右内史為京兆尹左内史為左馮翊主爵都尉為右扶風謂之三輔後漢遷都洛陽置雍州於此尋罷晉初仍置雍州建興後歴為劉聰石勒苻健姚萇赫連勃勃所據後魏亦曰雍州京兆郡時郡移治霸城永熙三年遷都於此是為西魏隋開皇二年建新都三年罷京兆尹復置雍州大業三年復故唐仍隋都武徳元年又改郡曰雍州貞觀元年為關内道治開元元年改曰京兆府二十一年置京畿採訪使唐書地理志唐仍隋都初曰京城天寳元年曰西京至徳二載曰中京上元二年復曰西京代宗元年曰上都天祐初遷都洛置佑國軍節度使於此五代梁改為大安府改軍曰永平後唐復為西京京兆府晉罷京置晉昌軍漢改永興軍周因之宋復曰京兆府永興軍節度為陜西路治熙寧後為永興軍路治金皇統二年置總管府為京兆府路治元初亦曰京兆府中統三年置陜西四川行省治此至元十六年改京兆府為安西路總管府二十三年改陜西行省皇慶元年改為奉元路明洪武元年改曰西安府為陜西布政使司治本朝因之今領縣十五曰長安咸寧咸陽興平臨潼髙陵鄠藍田涇陽三原盩厔渭南富平醴泉同官州一曰耀州府城通志即隋唐京城舊址隋文帝厭長安制小召髙熲等創建新都其地在漢故城東南南直終南子午谷北枕龍首山以據渭水東臨灞滻唐永徽五年築羅城天佑元年匡國軍節度使韓建改築約其制謂之新城宋金元因之明洪武初增修周四十里門四東曰長樂西曰安定南曰永寧北曰安逺十七年建鐘鼓二樓於城内東西相距半里許滿城通志在府城内東北隅西界鐘樓本朝順治六年即故明秦藩城改築門五長安縣釋名三輔黄圖長安本秦鄉名史記始皇本紀王弟長安君成蟜漢書楚懐王封項羽為長安侯因以名縣沿革一統志附郭漢高帝五年定都於此置長安縣為京兆尹治王莽改曰常安後漢復舊晉為京兆郡治後魏以後因之唐為京兆府治乾封初分置乾封縣長安二年復併入焉五代梁改曰大安後唐復舊宋金因之元為奉元路治明為西安府治本朝因之咸寧縣釋名名為天寳初改取萬國咸寧之意沿革一統志附郭本周杜伯國漢置霸陵杜陵等縣屬京兆尹晉改霸陵曰霸城杜陵曰杜縣屬京兆郡後魏以霸城為京兆郡治改杜縣為杜城屬焉後周明帝二年分置萬年縣與長安並治京城建徳二年省霸城杜城二縣入之隋開皇三年改曰大興為京兆郡治唐武徳初復曰萬年天寳七載改為咸寧縣乾元二年復曰萬年五代梁改曰大年後唐復曰萬年宋仍為京兆府治宣和七年改曰樊川金又改曰咸寧泰和四年廢入長安尋復置元為奉元路治明為西安府治本朝因之咸陽縣釋名三秦記咸陽秦所都在九嵕山南渭水北山水俱陽故名咸陽元和郡縣志山南曰陽水北亦謂之陽縣在北山之陽渭水之北沿革一統志治在府西少北五十里秦置縣漢高帝元年更名新城七年罷屬長安元鼎三年更名渭城屬右扶風晉咸和中後趙置石安縣苻秦兼置咸陽郡後魏移郡於涇水北以縣屬之隋廢入涇陽縣唐武徳元年復置咸陽縣屬雍州五代宋金因之元屬奉元路明屬西安府本朝因之縣城通志舊在杜郵館西明洪武四年遷今治南濱渭河周九里有竒門五興平縣釋名唐至徳初置興平軍於此尋改為縣即以名之沿革一統志治在府西一百里周犬邱邑秦曰廢邱漢為槐里茂陵平陵三縣地俱屬右扶風後漢以槐里為右扶風治三國魏黄初中改平陵曰始平晉初併茂陵入始平於槐里置始平郡後魏太平真君中郡廢二縣俱屬扶風郡西魏以始平為郡治隋省槐里以始平縣屬京兆郡唐天授二年改屬稷州大足元年還屬雍州景龍四年改曰金城至徳二載改為興平貞元中嘗以神策軍屯此曰興平鎮五代宋屬京兆府金因之元屬奉元路明屬西安府本朝因之縣城通志隋大業九年築周七里有竒門四臨潼縣釋名方輿紀要以縣有臨潼水故名沿革一統志治在府東五十里周為驪戎國秦為驪邑漢高帝七年置新豐縣屬京兆尹晉屬京兆郡隋初屬雍州大業初屬京兆郡唐初仍屬雍州垂拱二年改為慶山縣天授二年屬鴻州大足元年還屬雍州神龍元年復曰新豐天寳三載析置㑹昌縣七載省新豐改㑹昌曰昭應五代因之宋大中祥符八年避昭應宫名改曰臨潼屬京兆府金因之元屬奉元路明屬西安府本朝因之縣城通志唐天寳六載建明洪武初增築周四里門四高陵縣釋名史記秦昭王封弟高陵君郭子章云南有奉政原高四五丈名所由昉也沿革一統志治在府東北七十里秦孝公置縣漢屬左馮翊三國魏改曰高陸屬京兆郡晉因之尋復舊後魏熙平中復為高陸隋大業二年復曰高陵屬京兆郡唐天授二年屬鴻州大足元年還屬雍州五代宋金因之元屬奉元路明屬西安府本朝因之縣城通志隋大業七年建明景泰元年增築周四里有竒門四鄠縣釋名長安志本夏之扈國也秦改為姚察漢書訓纂扈一也古今字耳沿革一統志治在府西南七十里本夏時扈國漢置鄠縣屬右扶風晉屬始平郡後魏太平真君七年改屬京兆郡唐屬京兆府五代宋金因之元屬奉元路明屬西安府本朝因之縣城通志隋大業十年建周六里有竒門四藍田縣釋名長安志秦孝公置周禮玉之美者曰藍三秦記縣出美玉故名沿革一統志治在府東南九十里秦置縣漢屬京兆尹晉屬京兆郡後魏太平真君七年併入霸城縣太和十一年復置仍屬京兆郡周閔帝於縣置藍田郡武帝時省隋仍屬京兆郡唐屬京兆府五代宋金因之元屬奉元路明屬西安府本朝因之縣城通志本名嶢栁城亦名青泥城晉桓温伐苻健遣京兆太守薛珍擊青泥破之即此周四里有竒門四涇陽縣釋名史記秦昭王弟悝封涇陽君苻秦置縣葢以涇水在縣之南也沿革一統志治在府西北七十里漢惠帝四年置池陽縣屬左馮翊晉初為扶風郡治苻秦又析置涇陽縣後魏徙咸陽郡治池陽以涇陽屬焉後周廢池陽縣隋開皇初郡廢以涇陽縣屬雍州唐天授二年改屬鼎州大足元年還屬雍州五代宋因之金屬京兆府元至元二年併入高陵三年復置屬奉元路明屬西安府本朝因之縣城通志秦苻堅創建元至正二十七年修築周五里有竒門四三原縣釋名長安志前秦苻堅於嶻櫱山置三原䕶軍以其地南有酆原西有孟侯原北有白鹿原是為三原因以名縣沿革一統志治在府北九十里漢池陽縣地後魏太平真君七年置三原縣屬北地郡永安元年於縣置建忠郡後周建徳初郡廢隋屬京兆郡唐武徳四年改曰池陽六年改曰華池仍分置三原縣屬北泉州貞觀元年省三原縣改華池曰三原屬雍州天授二年屬鼎州大足元年還屬雍州五代唐屬耀州宋金元因之明改屬西安府本朝因之縣城通志縣本舊龍橋鎮元至元二十四年徙縣治於此築城周九里有竒門四水門二明初增築西郭門二嘉靖三十六年築北郭門四崇禎中增築東郭門二盩厔縣釋名長安志漢舊縣也山曲曰盩水曲曰厔因以名之沿革一統志治在府西南一百六十里漢縣屬右扶風後漢省後魏復置屬扶風郡後周置周南郡兼置恒州尋並廢隋屬京兆郡唐武徳三年屬稷州貞觀元年屬雍州天授二年又屬稷州大足元年還屬雍州天寳元年改曰宜夀至徳二載復故乾寧中改屬乾州天復初改屬鳳翔府五代及宋因之金貞祐四年陞為恒州元初州廢縣屬奉元路明屬西安府本朝因之縣城通志本隋唐舊址周五里有竒門四渭南縣釋名通志縣名始前秦苻堅以在渭水之南也沿革一統志治在府東一百四十里漢新豐縣地苻秦置縣後魏孝明帝改置渭南郡及南新豐縣西魏廢帝二年又改縣曰渭南後周郡廢隋屬京兆郡唐武徳初改屬華州五年屬雍州天授二年於縣置鴻州大足元年鴻州廢還屬雍州五代周顯徳三年改屬華州宋熙寧六年省入鄭縣元豐元年復置仍屬華州金元因之明萬厯中改屬西安府本朝因之縣城通志隋大業九年建元至正二十一年拓修周七里門四富平縣釋名長安志晉徙北地郡富平縣於懐徳城葢用其舊名也沿革一統志治在府東北一百二十里秦置頻陽縣漢屬左馮翊三國魏徙置富平縣於此屬北地郡頻陽仍屬馮翊郡後魏景明元年改頻陽置土門縣與富平俱屬北地郡西魏移北地治富平後周改曰中華郡尋罷隋大業初廢土門入富平屬京兆郡義寧二年復置土門縣唐初二縣俱屬雍州貞觀十七年又廢土門縣咸亨二年復以故土門置美原縣天授二年二縣俱屬宜州大足元年還屬雍州天祐二年於美原縣置鼎州五代梁改裕州後唐廢裕州二縣俱屬耀州金廢富平縣入美原元省美原復置富平縣仍屬耀州明萬厯三十六年改屬西安府本朝因之縣城通志本名窰橋頭元末張良弼移縣治於此明正統初築城周三里門四醴泉縣釋名元和郡縣志縣有後周醴泉宫隋因以為名沿革一統志治在府西北一百二十里秦谷口邑漢置谷口縣屬左馮翊後漢廢晉為池陽縣地後魏置寧夷縣屬咸陽郡西魏兼置寧夷郡後周改郡曰寧秦後廢隋開皇十八年改縣曰醴泉屬京兆郡唐武徳中省貞觀十年復置天授元年屬鼎州大足元年還屬雍州乾寧中改屬乾州五代後唐同光中還屬京兆宋政和八年改屬醴州金屬乾州元因之明萬厯三十六年改屬西安府本朝因之縣城通志即古仲橋城元增築周二里許明成化四年拓外城六里有竒門五同官縣釋名元和郡縣志苻秦於銅官川置銅官䕶軍後魏改置銅官縣周作同沿革一統志治在府治北二百五十里漢祋祤縣地後魏太平真君七年置縣屬北地郡周曰同官隋屬京兆郡唐武徳初屬宜州貞觀十七年屬雍州天授二年屬宜州大足元年改屬耀州宋金元明未改國初因之雍正十三年耀州改隸西安府並縣屬焉縣城通志後周建徳四年建明增修周四里門四耀州釋名通志郭子章云州東十五里有鑑山年豐則山中有光耀如鑑州以是名沿革一統志治在府治北一百八十里漢置祋祤縣屬左馮翊後漢初廢永元九年復置三國魏廢祋祤僑置泥陽縣兼置北地郡晉因之後魏太平真君七年并泥陽入富平景明元年復置仍屬北地郡永熙元年兼置北雍州西魏廢帝三年改州曰宜州又改郡曰通川隋開皇三年郡廢六年改縣曰華原大業三年州廢縣屬京兆郡義寧二年於縣置宜君郡唐武徳初曰宜州貞觀十七年州廢屬雍州垂拱二年改縣曰永安天授二年又置宜州大足元年州廢還屬雍州神龍元年復曰華原天祐三年以縣置耀州唐書方鎮表天祐三年置義勝軍節度使領耀鼎二州五代梁貞明元年改曰崇州後唐同光二年復故五代史職方考耀州屬岐為義勝軍梁改静勝唐改順義周罷軍宋亦曰耀州華原郡屬永興路宋史地理志開寳五年為感義軍節度太平興國初改感徳軍金屬京兆府路元至元元年以州治華原縣省入屬奉元路明屬西安府國初因之雍正三年陞為直隸州十三年復改屬西安府州城通志本華原縣元末遭兵燹城圮明景泰初重建周六里有竒門四闗中勝蹟圖志巻一
