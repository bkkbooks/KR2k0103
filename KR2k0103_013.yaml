body:
  text: 關中勝蹟圖志卷十三陕西巡撫臣畢沅撰古蹟宫闕同州府魏萬夀殿北史魏文帝本紀大統八年十二月行幸華州起萬夀殿於沙苑北後周天成宫通志西魏太師宇文泰故居泰以同州扼關河之要既專政猶時居州後孝閔帝受魏禪改同州宫宣帝大象二年改天成宫長春宫玉海在同州朝邑縣本周武帝作保定五年宇文護築隋開皇中修之唐書髙祖本紀髙祖起義兵九月次長春宫杜甫詩天晴宫栁暗長春今縣西北一里有東西長春二堡即其故址隋金城宫唐書地理志華隂東三十里有隋金城宫普德宫唐書地理志華州鄭縣東北三里有隋普德宫唐咸亨二年更名神臺宫華隂宫唐書地理志華隂縣西十八里有隋華隂宫唐顯慶三年更名瓊嶽宫古蹟苑囿第宅附後漢張超廬通志在華隂縣霧谷後漢張楷字公超結廬此地學者如市又能為五里霧故稱張超霧市魏沙苑監通志在同州東西八十里南北三十里西魏大統二年宇文泰與髙歡戰大破之後于用兵之處建忠武寺令騎士種栁各一株數及七千以其地宜六畜置沙苑監豢養隴右牛羊諸畜以供上方之用故杜甫沙苑行有云左輔白沙如白水繚以周墻百餘里苑中騋牝三千匹豐草青青寒不死集異記唐明皇十三載重九獵於沙苑雲際有孤鶴徘徊上親御弧矢一發而中其鶴帶箭墮而復起及幸蜀遊道觀中視所掛箭道士徐佐卿題乃上獵沙苑之日也隋廣通倉通志在華州隋文帝以長安倉廩尚虛詔以西至蒲陕東至衛汴水次十三州募丁運米于華州置廣通倉以給長安唐折衝府通志在蒲城縣唐建府有五曰相原孝德溫泉宣化懷仁按相原今之賢相鄉舊管勳貴里者又有崇德善德懷仁各鄉即孝德宣化懷仁諸府所由名也伏龍府通志在澄城縣南五十里唐置兵之所太宗時太原王榮為伏龍府折衝古蹟祠宇漢華嶽廟在華隂縣東五里通志自虞舜西狩三代以降莫不有祀然皆不廟置祠自漢武帝始光和二年修晉書禮志魏元帝咸熙元年行幸長安使使者以璧幣禮祀華山魏書禮志文成皇帝即位三年正月遣有司詣華嶽修廟立碑數十人在山上聞虛中若有音聲聲中稱萬嵗云册府元龜梁太平二年八月車駕西征次于陕命宰臣杜曉祭華嶽廟並禱魏書禮志泰常七年正月遣使以太牢祭華嶽太延元年立廟置侍祀九十人嵗時祈禱水旱春秋遣官率刺史祭以牲牢有玉帛又孝文帝紀太和二十一年五月癸卯遣使祭華嶽隋書禮儀志大業十年祀華嶽築場於廟側唐書髙祖紀武德二年十月甲子祀華山三年四月丙申祀華山册府元龜元宗先天二年八月癸丑封華嶽神為金天王開元八年三月令太常長官祭華嶽舊唐書元宗紀開元十二年十一月庚申幸東都至華隂上製嶽廟碑勒之於後唐㑹要元宗幸東都至華州命刺史徐知仁與信安王褘勒石於華嶽祠南之通衢上親製文十三年七月七日碑成張于應天門以示百寮册府元龜開元二十五年十月戊申敕御史大夫李適之祭西嶽天寶三載四月丙辰令宗正卿濮陽郡王徹祭西嶽八載九月命宗正卿褒郡信王璆祭西嶽九載正月文武百僚禮部尚書崔翹等纍上表請封西嶽刻石紀榮號帝固拒不許宋史禮志太祖建隆二年八月修西嶽廟開寶六年立秋日祀西嶽廟于華州真宗祥符四年祀汾隂車駕至潼關遣官祀西嶽用太牢備三獻禮庚午親謁華隂西嶽廟羣臣陪位廟垣內外列黃麾仗遣官分奠廟內諸神加號嶽神為順聖金天王五月乙未加上西嶽曰金天順聖帝春明退朝録祥符四年車駕次華隂上見嶽神數里迎謁上召問老巫阿馬婆對如上所見上加敬禮詔封為金天王上仍自書製碑文以寵異之碑髙五十餘尺濶丈餘厚四五尺天下碑莫及也其餘刻扈從太子王公以下百官名氏製作壯麗巧無倫比元史祭祀志至元三年定嵗祀嶽鎮之制七月土王日祀華山於華州界二十八年春二月加上西嶽金天大利順聖帝華嶽廟碑明洪武三年詔依古制止以山水本名稱西嶽華山之神王維正西嶽廟記西嶽廟圮嘉靖已亥陕西巡撫聞其事天子曰新之潼關兵備副使何鰲受椒任事於是閟宫穹閣峩闕修廊窅窅耀耀奕奕堂堂視嶽比雄而埒麗矣續文獻通考隆慶二年六月陕西地震命撫臣張祉告祭西嶽華山之神通志本朝順治八年遣禮部尚書王鐸致祭康熙元年遣左都御史楊時薦致祭三十二年因秦省亢旱復遣致祭四十二年聖祖仁皇帝翠華西巡御題露凝仙掌四字額恭懸嶽頂金天宫內廟中建石碑一座勒奎文四十四年御書重修西嶽廟碑五十六年遣內閣學士查弼納致祭雍正元年遣內閣學士田文鏡致祭皇上御極以來屢遣大員祗詣嶽祠申禋展事廟制正殿六楹寢殿四楹兩翼司房八十餘間階下鐘鼓樓各一前為金城門再為櫺星門其外左碑亭右香亭牌樓七又前臺門五上有樓後有萬夀閣凡一百七十楹正與嶽對周圍蕭墻三百七十四丈廟中古朩森列唐柏五株有後周天和二年趙文淵八分書華嶽頌唐開元八年劉升八分書華嶽精享昭應之碑開元十三年吕向正書述聖頌天寶元年韓擇朩八分書告華嶽文乾元二年顔真卿正書金天王廟題名漢西嶽華山廟砰周禮職方氏河南山鎮曰華謂之西嶽春秋傳曰山嶽則配天乾坤定位山澤通氣雲行雨施賦成萬物易之義也祀典曰日月星辰所昭仰也地理山川所生殖也功加於民祀以報之禮記曰天子祭天地及山川嵗遍焉自三五迭興其奉山川或在天子或在諸侯是以唐虞疇咨四嶽五嵗一巡狩皆以四時之中月各省其方親至其山柴祭燔燎夏商則未聞所損益周監於二代十有二嵗王巡狩殷國亦有事於方嶽祀以圭璧樂奏六歌髙祖初興改秦淫祀太宗承循各詔有司其山川在諸侯者以時祀之孝武皇帝修封禪之禮思登假之道巡省五嶽禋祀豐備故立宫其下宫曰集靈宫殿曰存仙殿門曰望仙門中宗之世重使使者持節祀焉嵗一禱而二祀後不承前至于亡新寖用邱墟迄今垣址營兆猶存建武之元事舉其中禮從其省但使二千石以嵗時往祠其有風旱禱請祈求靡不報應自是以來百有餘年有事西巡輒過享祭然其所立碑石刻紀時事文字磨滅莫能存識延熹四年七月甲子宏農太守安國亭侯汝南袁逢掌華嶽之正位應古制修廢起頓閔其若兹深達和民事神之義精通誠至礿祭之福乃按經傳所載原本所由銘勒斯石垂之於後其辭曰巖巖西嶽峻極穹蒼奄有河朔遂荒華陽觸石興雲雨我農桑資糧品物亦相瑶光崇冠二州古曰雍梁馮于豳岐文武克昌天子展儀巡狩省方玉帛之贄禮與岱亢六樂之變舞以致康在漢中葉建設宇堂山嶽之守是秩是望侯惟安國兼命斯章尊修靈基肅共壇場明德惟馨神歆其芳遏攘凶札揫斂吉祥嵗其冇年民說無疆唐元宗祀西嶽太華山碑天冇四序星辰辨其分地有五方山嶽鎮其域隂陽交暢則品物形矣精氣相射則神明著矣西嶽太華山者當少隂用事萬物生華故曰華山踞中土西偏七宫正位是稱西嶽按圖以察削成而四方信焉立表以算其髙五千仞明焉石壁傑堅而雄竦衆山奔走而傾附其氣肅其威振其行配金其辰直酉前對華陽之谷後壓華隂之郡左抱桃林之塞右産藍田之玉諒少昊之下都蓐收之别館者也軒帝遊焉以㑹衆神虞舜柴焉以覲羣后爰自夏氏迄於隋室朝更五姓載厯三千祀典相因舊章未改壇場廟宇何代不修一禱三祀無嵗而缺所以報生殖事靈神不有怠也故亦祚休明災淫慝未嘗爽也皇天眷佑馨我烈祖奄有萬方逮於六葉郊天地望山川精意必達典禮咸甄亦命州將四時告䖍加視王秩進號金天若是何者抑有由焉豫小子之生也嵗庚戌月仲秋膺少昊之盛德協太華之本命故嘗寤寐靈嶽肸蠁神交玉帛未陳幽贊必先意而啓椒醴雖薄景福果應期而集元感昭賽可一二而道耶記云下有方士真人金鼎石室上有明星玉女仙草瓊漿茅龍一去毛女千祀前代帝王多所僥覬朕學羲文之道故靡斯人之徒憂在至道之不宏不憂富貴之無永患在蒼生之不理不患年夀之若流以功施四海為長生以業傳百代為不死焉羡置集靈之宫虛望非福立存仙之殿妄思輕舉哉於戲維嶽配天尚弼豫志豫欲布大政康兆人嶽翼豫欲定禮樂諧神人嶽聽豫思其維嶽降神生此多士無俾申甫專美於嵩語酌古訓心通神景善而不答誠而不應未之有也嶽其念哉十有二載孟冬之月步自京邑幸於洛師停鑾廟下清眺仙掌雲拂石牀霓裳可接風過松嶺仙駕如聞久勤報德之願未暇封崇之禮遲回刻石梗概銘山萬姓瞻宇言可復也銘曰巖巖太華柱天直上青崖白谷仰見靈掌雄封峻削菡萏森爽是曰靈嶽衆山之長白帝西下黃河北來隂陽孕育精氣徘徊偶聖呈瑞逢昏降災玉池神挹石室仙開海絶瀛洲天遙元圃偉哉此鎮峥嶸中土鬼神乍遊風雲忽聚髙標爀日半壁飛雨自古王者巡方必至龍駕帝服封天禪地南靣㑹神西后在位待豫治國安人然後徐思其事宋龍光寺在同州府北四十里宋文帝元嘉五年建明崇禎間修梁饒益寺朝邑縣志在縣南十里新市鎮創自蕭梁天監間貞觀二年起十三層浮圖明初圮天順萬厯間繼修內有藏春塢嵌歷代名人題咏魏大統寺通志在同州府北二十五里西魏文帝建金明昌五年修明天順六年重修隋金塔寺通志在同州府治東隋建寺內有禇遂良書聖教序碑宋開寶時重修龍興寺通志在同州府西北隋開皇年建治平寺通志在澄城縣東北四十里白家河村即隋文帝避暑宫明萬厯四年重修回鑾寺通志在澄城縣南四十里隋文帝避暑回鑾駐蹕於此因名唐九龍廟同州府志在大荔縣東南十餘里九龍泉唐乾寧中連帥李公塘建每嵗二月有司以牲醴修祀曰扶龍頭居民以五月十八日報賽相傳元伊克守州禱雨以女許神雨降而女卒遂塑像焉明鄧鏜云祈禱雖有桑林餘意而事甚不經神若有知其羞血食於此矣隆興寺同州志在大荔縣治東本隋文帝龍潜處舊名興國寺唐改今名尉遲恭建渭源寺通志在大荔縣西南五十里唐開元年建明嘉靖三十六年修司馬遷祠同州府志一在府城中一在府城東街名漢官祠唐時建金龍寺朝邑縣志在縣西一里唐貞觀元年建明宣德七年重修韓山奕應侯廟通志在郃陽縣西一里唐太和四年工部尚書談石寶建祀韓侯奕宋政和五年禮部侍郎王顯重修光國寺郃陽縣志在縣治西唐貞觀三十八年建宋延祐六年宣和二年屢修明宏治元年繼修精進寺通志在澄城縣東門外唐肅宗建有浮圖九級本朝康熙二十三年重修肅宗寺澄城縣志在縣西北二十五里創自唐肅宗時憲宗元和四年重修明宏治正德間兩次興修規模崇麗甲於一縣雲臺觀華隂縣志在縣南八里華嶽下唐建通志後周武帝時有道士焦道廣獨居雲臺峰辟粒飱霞常有三青鳥報未然之事武帝親詣山庭臨軒問道因於谷口置雲臺觀徐元文記唐宋之亂希夷先生實修是觀而𨼆居焉縣志明隆慶年修本朝康熙五十七年復修又靈臺觀李裕華山記云創始前唐亦希夷寓所堙于兵燹明洪武中建今圯右為朱子祠徐元文記宋時有宫觀之秩朱子嘗主雲臺觀號雲臺真逸康熙二十年知縣遲屏萬因建祠焉唐孟郊遊華山雲臺觀詩華嶽獨靈異草木恆新鮮山盡五色石水無一色泉仙酒不醉人仙芝皆延年夜聞明星館時韻女蘿絃聽兹不能寐焚柏吟道篇宋韓琦雲臺觀詩仙掌峰前羽客家玉虛宫殿倚雲霞最髙頂上誰曽到得見蓮開十丈花靈應夫人祠蒲城縣志在縣西二十五里堯山唐咸通中碑云靈應昭著一方行祠在東門內宋崇寧三年封敕曰雨暘之期應答如響有司以聞在所旌異明天啓間入祀典仙臺觀長安志在蒲城縣西二十里橋陵南唐金仙玉真二公主入道置此觀甘露寺通志在華州南八里少華峰之西唐張喬遊少華山甘露寺詩少華中峰寺髙秋衆景歸地連秦塞起河隔晉山微晚景蟬相應涼天雁並飛殷勤記巖石祗恐再來稀宋靈應觀通志在朝邑縣西南三里宋大中祥符四年建在紫陽山一名紫陽觀形如箕掌宫殿參差時稱名勝張三丰曽憩息其中魏徵祠澄城縣志魏徵封鄭國公賜莊田于澄邑子孫世居焉宋宣和間建祠于西郊金承安三年建祠于縣南門外中肖其像及五世孫魏謨侍立于左元至正七年重修一在縣北二十里亦宋時建后土祠韓城縣志在縣西南巍山上宋真宗祈嗣于此山下有駕到坪蓋駐蹕之所河瀆靈源王廟通志在韓城縣東五里漁村宋大觀初因河清敕建太史公廟在韓城南二十里宋靖康元年修法王廟通志在韓城縣北三十里西莊神房姓名寅以宋真宗夢中治疾顯敕封五嶽法王營宇繪像以崇典禮每嵗清明四方來祀者輻輳玉泉觀通志在華隂縣南十里宋皇祐三年建初名玉泉院內有山蓀亭旁有洞陳摶遺像在焉金城隍廟華州志在城東南隅碑記唐乾寧三年李茂貞犯京師昭宗幸華州州刺史韓建夜袖劍詣行宫有神人厲聲叱之建倉皇出明日物色之乃華之城隍神也明年車駕還京師改元光化封神濟安侯州署東北其祠在焉大定甲午太守完顔公憫祠處于隘遷城東南隅礱石以記神之英烈明嘉靖丙午年修元神禹廟通志在韓城縣東北八十里元史世宗本紀至元二年龍門禹廟成王鶚禹廟碑記禹門舊有神祠因兵而燬道流善信鳩衆議工為殿五楹兩廡間架各有十八寢殿營其後别為道院世祖素知善信即位時召對及陛辭敕賜宫曰建極殿曰明德閣曰臨思仍命大司農姚樞書額雷祥廟白水縣志在縣東十五里大雷祥村一作雷公亞父廟昔有雷祥善醫歿為彭衙土神嘗顯靈異蝗不為害有捍禦之功因祀焉元代常加敕封至元十二年重修墓亦在村內明安靖寺朝邑縣志故址瀕渭水元至正元年沒于渭明正德間改建王林村東距縣三十里殿懸宋寧宗時鐘乃自渭浮來者孫真人洞朝邑縣志在縣西北四十里雙泉鎮先是居人久議建祠未果嘉靖三十四年地震後鐮山晝夜雲起忽有泉湧出成洞洞中自然成像倣佛真人因於洞前建祠以祀禹廟郃陽縣志在縣西南三十里南峰山相傳禹甸梁山經此因立廟明萬厯間重建聖母廟通志在郃陽縣南二十里慶陽村祀聖母太任太姒龍王廟澄城縣志一在縣東郭外一在縣西南三十里湫頭西岸其地洛水經焉兩崖壁立水自髙岸奔下有潭洞然深黑上常有雲氣能致雨明正統間禱雨有應因立廟望仙觀華隂縣志距城三十里故正里漢武望仙臺故址今為望河觀明萬厯九年修本朝金天宫通志在華隂縣華嶽南峰巔康熙癸未聖祖仁皇帝翠華西幸敕諭撫臣鄂海撥帑金修建恭懸御書露凝仙掌額於殿內卜子祠通志在韓城縣東五里卜家村康熙三十七年建河津縣西北五里許曰辛興有塜一丘相傳為子夏墓居人多卜姓厯代封祀元末人民徙遷卜氏多涉河而西生齒漸盛墓祭日居西河者苦涉河爰建祠以祀伊尹祠通志在郃陽縣東四十里耕于有莘之野即此一在學宫旁以下建置時代無考韓奕廟通志在韓城縣西北里許春秋祭祀鄭桓公祠通志在華州西關紀信祠通志在華州東二十里栁子鎮蘇武廟通志在韓城縣西北五里春秋祭祀郭子儀祠通志在華州東關顔真卿祠通志在同州府城中顔真卿嘗為此州刺史商山神廟澄城縣志在縣北三十里世傳村東有河引水成潭中有巨蛇時出害人行人幾斷神蕩除之一方獲安因立廟以祀關中勝蹟圖志卷十三
