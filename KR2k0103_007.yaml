body:
  text: 關中勝蹟圖志卷七陜西巡撫臣畢沅撰古蹟祠宇西安府隋大崇仁寺長安縣志在城西五里隋髙祖子秦孝王施宅建為濟渡寺唐髙宗徙於安業坊而以其處為靈寶寺盡度太宗嬪御為尼以處之復徙鄰之道德寺於休祥坊至儀鳯二年二處併為崇聖寺輦下歲時記唐進士櫻桃宴在崇聖寺佛牙閣即此也明天順八年秦藩創修治地得古白玉佛像及鐘磬碑刻之屬成化十二年畢工額曰大崇仁寺臣謹按寺在長安縣之勝金鋪俗呼為勝金寺秦藩長史趙德輝碑記謂寺在西補長安之金氣也天順間寺東光彩浮騰掘地得藥師佛玉像築臺作殿以祀乾隆乙未臣加修建鼎新焉興善寺咸寧縣志在永寧門外五里初名遵善寺隋開皇間額曰大興善寺詔僧徒二十餘萬實之招提之盛甲於海內唐元和四年建修轉輪藏經閣太和二年得梵相觀音移大內天王閣於寺中作大士閣唐末獨二閣存焉宋淳熙間崇辨禪師居閣夜深有老狐聽經明永樂時葺唐鄭谷題興善寺詩寺在帝城隂清虛勝二林蘚侵隋畫暗茶助越甌深巢鶴和鐘唳詩僧倚錫吟烟莎後池水前跡杳難尋自注十才子詩集多有興善寺後池之作今寺在池無每用追嘆寶慶寺通志在城南安仁坊一名花塔寺隋仁壽初建隋文帝唐中宗嘗臨幸焉文宗感蛤蜊觀音像建塔明景泰二年修慈恩寺通志在城南十里曲江池北本隋無漏寺內有浮圖六級舊稱鴈塔宋張禮城南逰記唐貞觀二十一年髙宗在春宫為文德皇后立永徽三年沙門元奘起塔初惟五層磚表土心效西域窣堵波長安中摧倒天后及王公施錢重建至十層云鴈塔者天竺記逹嚫國有迦葉佛伽藍穿石山作塔五層最下一層作鴈形謂之鴈塔蓋此意也兵餘止存七層長興中西京留守安重霸再修之長安士庶每歲春秋遊者道路相屬熙寧中富民康生遺火經宵不滅而遊人自此衰矣張舜民畫墁録慈恩與含元殿相直續文獻通考基四面各一百四十尺倣西域制度有五級并象輪露盤高一百八十尺層層中心皆葬舍利不啻萬顆上層以石為室立碑載二聖所製三藏聖教序記乃褚遂良書李楷鴈塔記景龍三年中宗幸慈恩寺登浮圖時在重陽羣臣上菊花酒上賦詩學士及詞臣並和聖製上官媫妤以宋之問詩為美即其事也李肇國史補唐進士既捷題名于慈恩寺塔故謂之鴈塔題名明天順間秦藩修唐儲光羲同諸公登慈恩寺塔詩金祠起真宇直上青雲垂地靜我亦閒登之秋清時蒼蕪宜春苑片碧昆明池誰道天漢高逍遙方在兹虛形賓太極攜手行翠微雷雨傍杳冥鬼神中躨跜靈變在倐忽莫能窮天涯冠上閶闔開履下鴻雁飛宮室低邐迤羣山小參差俯仰宇宙空庶隨了義歸崱屴非大厦久居亦以危岑參雪後與羣公過慈恩寺詩乘興忽相招僧房暮與朝雪融雙樹濕紗暗一燈燒竹外山低塔藤間院隔橋歸家如欲懶俗慮向來消又登慈恩寺浮圖詩塔勢如湧出孤髙聳天宮登臨出世界磴道盤虛空突兀壓神州崢嶸如鬼工四角礙白日七層摩蒼穹下窺指高鳥俯聽聞驚風連山若波濤奔湊似朝東青槐夾馳道宮館何玲瓏秋色從西來蒼然滿關中五陵北原上萬古青濛濛淨理了可悟勝因夙所宗擔將挂冠去覺道資無窮杜甫同諸公登慈恩寺塔詩高標跨蒼穹烈風無時休自非曠士懷登兹翻百憂方知象教力足可追冥搜仰穿龍蛇窟始出技撐幽七星在北戶河漢聲西流羲和鞭白日少昊行清秋秦山忽破碎涇渭不可求俯視但一氣焉能辨皇州回首呌虞舜蒼梧雲正愁惜哉瑶池飲日宴崑崙邱黃鵠去不息哀鳴何所投君看隨陽各有稻粱謀李頻秋宿慈恩寺遂上人院詩滿閣終南色清宵獨倚欄風高斜漢動葉下曲江寒帝里求名老空門見性難吾師無一事不似在長安盧宗回登長安慈恩寺塔詩東方曉日上翔鸞西轉蒼龍拂露盤渭水寒光搖藻井玉峯晴色墮朱䦨九重宮闕參差見百二山河表裏觀暫輟去蓬悲不定一憑金界望長安章八元題慈恩寺塔詩十層突兀在虛空四十門開面面風却怪鳥飛平地上自驚人語半天中回梯暗踏如穿洞絶頂初攀似出籠落日鳯城佳氣合滿城春樹雨濛濛薦福寺通志在永寧門外西南三里隋煬帝在藩舊宅唐天授元年改為薦福寺神龍以後翻譯佛經並在此寺東有放生池相傳即漢鴻澤陂也歷代名畫記天后飛白書額淨土院門外兩邊吳道子畫鬼神南邊神頭上龍為妙謹按諸畫今無存咸寧縣志武后始立為大獻福寺度僧二百餘天授初改薦福中宗即位大加營飾寺基周一頃五十畝有浮圖十五級高三百餘尺景龍中宫人率錢所立者也俗呼為小鴈塔歷宋元明繼修本朝康熙間修塔寺有鐘出自武功河畔砧婦坐石搗衣忽聲自石出響閒數里土人發之乃巨鐘也送歸寺內溫國寺通志在城南四十里潏水岸本隋薛國公長孫覽妻鄭氏捨宅置名實際寺唐開元十五年大德進法師立為道場建塔改名大定寺一統志在鄠縣東南雲際山一名雲際寺通志昔魏武之始有李順興者隱居此地誦金剛經聚叠瓦塔以記經數至隋大業中乃以此地賜駙馬尉遲安為柴莊安嘗見一老人謂曰此古寺地何不再葺之安遂置寺因掘地得石像焉長安志隋仁壽元年為居賢捧日寺宋太平興國三年改今名縣志金大定再葺惠果寺涇陽縣志在縣治西北夲隋中興禪寺唐為大壺寺宋改惠果寺老子祠通志在盩厔縣東南三十里樓觀南老子於此說道德五千言授尹喜有說經臺又曰升天臺長安志華陽子録記秦始皇好神仙於尹喜先生樓南立老子廟晉元康五年修蒔朩萬株南北連亘七里給戶三百供灑掃隋開皇元年即故址重建通鑑高祖武德七年十月丙子幸樓觀謁老子祠宋蘇軾說經臺詩劍舞有神通草聖海山無事化琴工此臺一覽秦川小不待傳經意已空唐周文武成康祠通志在咸陽縣治北街册府元龜憲宗元和十四年正月詔以周文王武王祠宇在咸陽縣俾有司精加修飾縣志明嘉靖十年重建合祀四王后土廟通志在三原縣東北四十里唐村縣志本名太寧宫唐時敕建宋慶厯四年修修時誠心所感致有祥雲垂覆於地慶厯至金泰和初修葺者四明嘉靖年地震圮隆慶崇禎間繼修享賽稱勝焉翠微寺通志在長安縣城西南翠微山上宋張禮城南遊記本唐太和宫武德八年建貞觀十年廢二十年太宗厭禁內煩熱命將作大匠閻立本再葺改為翠微宫元和元年廢為寺金趙秉文翠微寺詩南山常愛退之詩未說雲烟潤色之要看山光如潑黛更須留待雨晴時南山深鎖翠微宫寺在南山十里東祗怪朝來衫袖濕不知身在翠微中報恩寺長安志在縣治南唐中宗時為懿德太子資福遂名懿德寺後惟址存元至正中賜平章額森鼐夫人頁嚕為花圃嘗見白石像放光復捨為寺敕額大興國報恩寺香積寺一統志在長安縣南神禾原上通志唐神龍二年建宋太平興國三年改為開利寺舊有香積堰水入城中遭朱泚亂壞龍首香積以决其流宋時龍首堰復香積堰廢縣志寺前有大小塔二唐王維過香積寺詩不知香積寺數里入雲峯古木無人徑深山何處鐘泉聲咽危石日色冷青松薄暮空潭曲安禪制毒龍開元寺通志在咸寧縣治西唐開元年建元開元寺碑開元二十八年正月二十八日元宗於延慶殿與勝光師論佛恩德乃令天下州府各置開元寺一所宋建隆四年中書令王彥超修牛頭寺通志在府城南二十里樊川北勳䕃陂貞元十一年建咸寧縣志宋太平興國中改為福昌寺明隆慶五年修殿前有四季柏形如張蓋四時皆花唐司空圖牛頭寺詩終南最佳處禪誦出青霄羣木澄幽壑踈烟泛泬寥西五臺通志在府城西北隅是臺基於唐創於宋屢葺於明有禱必應六月大㑹歲以為常總督鄂海於康熙戊戌重修由三天門拾級而升層臺紺閣環列左右最高處為大士殿登殿四望收一郡之勝圓光寺通志在府城南六十里太乙山中今稱為南五臺圓光寺碑記隋仁壽中有毒龍變為羽人攜藥貨於長安詐稱仙術大士現比丘身以妙智力伏妖唐大厯六年號為南五臺山聖壽寺宋太平興國三年夏前後六次現五色圓相祥雲等瑞敕額為五臺山圓光之寺咸寧縣志千佛寺一名竹林寺在城南七十里即圓光寺下院寶泉寺明周仲仁碑記亦名元安寺在咸寧縣東南四十里彭村又下寶泉寺在南五臺山下漢時建寺於山頂魏永平中於峯下塑毗盧佛像增建下寶泉寺泉從竹林寺流至峰下故名唐時即故址重建元延祐巳未公主僧格喇實捨金鈔重修泰定四年改峰泉寺明成化正德間相繼修葺普光寺一統志在府城南六十里終南山仰天池上唐為龍池寺縣志明洪武初西印土烏薩羅國僧無壞拄錫於此屢著靈異秦愍王為建上下二寺莊嚴冠長安明都穆遊終南山記寺有方池名曰仰天跨以石梁于兹玩月為宜安國寺通志在咸陽縣城內唐開成六年建石墨鐫華唐寂照和尚碑舊在馬跑泉後移城內寺中以碑有安國寺字遂改名其寺碑為唐段成式撰僧無可書福巖寺臨潼縣志即石甕寺雍勝略石甕谷在驪山東繡嶺兩京道里記谷有懸泉激石成臼似甕形因以名寺鄭嵎津陽門詩注開元中以造華清宫餘材修繕佛殿中有玉石像幽州所進與朝元閣道像相同精巧無比叩之如磬謹按玉像今無存餘像皆楊惠之手塑脫空像皆元竒爾製工巧纎麗曠古無儔通志寺西上有緑閣紅樓基址尚存又津陽門詩注驪山石魚巖下有天然石甕以貯飛泉寺僧于上層飛樓中懸轆轤斜引修綆長二百餘尺以汲甕泉出紅樓高樹之杪縣志緑閣在西紅樓在東下有瀑布千尺聲淙淙林石間仄磴盤空上下曲折人從柏影中北瞰渭河明膩如線明袁宏道云驪山佳處在此唐權德輿石甕寺詩石甕靈泉勝寶井汲人回挂青絲綆厨烟半逐白雲飛當晝老僧來灌頂靈泉觀在驪山北雍勝略本華清宫祿山亂後天子罕復遊晉天福中改為觀賜道士居之老母殿臨潼縣志在驪山第二峰授經碑記唐李筌居少室山好仙術至嵩山虎石巖得黃帝隂符經不曉其義入秦至驪山下逢一老母神狀甚異路旁見火燒樹因自語曰火生於木禍發必剋筌驚問曰此隂符經語母何得而言之母云受此符巳三元六周甲子矣少年從何得之坐石與說其義日巳晡袖中出一瓢令筌谷中取水及還母不見但留麥飯數升筌食之氣血不衰入山訪道不知所終崇皇寺高陵縣志在縣西南申村唐初置宋太宗賜額相傳漢薄姬妊文帝而出宫至此柏下誕生文帝俗傳唐明皇兩幸於此又名重皇寺內有閣當重邱之上夏月居之不暑曰納涼閣栖禪寺一統志在鄠縣東南四十里圭峰下即姚秦逍遙園遺址晉書載記姚興如逍遙園引諸沙門于澄元堂聽鳩摩羅什演說佛經通志羅什沒後焚之其舌不壞有塔存唐置栖禪寺今名草堂寺明王九思遊終南山記前殿畫壁甚古西南為鳩摩羅什葬塔有亭覆焉明道先生詩注云寺在竹林之心其竹蓋將十頃乃今根株盡矣獨寺後銀杏四株上薄霄漢亦百年外物也門外諸峰蒼翠如畫仙遊寺通志在盩厔縣南三十里仙遊潭明王九思遊南山記仙遊寺榜曰普緣蓋此地故有仙遊宫因以名寺寺四面皆山黑水經流其門蓋奧區也殿前石塔塔下空中塑一病佛側睡且死諸羅漢按摩哭泣籲禱備極情態寺門西瀕水二石塔上刻吳道子畫諸佛像有東坡題名唐韓翊題仙遊觀詩仙臺下見五城樓風物凄凄宿雨收山色遙連秦樹晚砧聲近報漢宫秋疏松影落空潭靜細草香閒小洞幽何用别尋方外去人間亦自有丹邱白居易送王十八歸山寄題仙遊寺詩曽於太白峰前住數到仙遊寺裏來黑水澄時潭底出白雲破處洞門開林間暖酒燒紅葉石上題詩掃緑苔惆悵舊遊那復到菊花時節羡君回清源寺一統志在藍田縣南輞谷口唐書王維傳維與弟縉皆篤志奉佛表輞川第為寺李肇國史補王維得之問輞川别業山水勝絶今清源寺是也縣志即今鹿苑寺有王右丞祠廣濟寺通志在醴泉縣東北二十里有唐刻石鼓經咒金大定三年重修迎祥觀明王恕迎祥觀碑記在城內廣濟街東創自唐景龍二年舊名景龍觀按蘇靈芝書老君應現碑云開元二十九年元宗夢見老君曰吾乃汝遠祖有像在京城西南百餘里汝遣人求之吾合與汝于興慶宫相見覺而異之即命尚書張九齡道士蕭元裕尋訪於盩厔聞仙峪果得老君玉像高三尺餘以進其日元宗在興慶宫遂親迎謁置於殿內次日送景龍觀大同殿安置瞻仰與夢中所見無異即改景龍為迎祥觀仍於現像之所建㑹靈觀焉兩京記景龍觀景雲二年天臺道士司馬承禎被召止於此觀縣志今鐘樓懸唐景雲二年鑄鐘唐睿宗景龍觀鐘銘原夫一氣凝真含紫虛而構極三清韞祕控碧落而崇因雖大道無為濟物歸於善貸而妙門有教滅咎在於希聲景龍觀者中宗孝和皇帝之所造也層城寫質閬苑圖形但名在騫林而韻停鐘簴朕翹情八素締想九元命彼鼓延鑄斯無射考虞倕之遺法得晋曠之宏規廣召鯨工逺徵鳬匠耶溪集寶麗壑收珍警風雨之辰節昏明之候飛亷扇炭屏翳營罏翥鶴呈姿蹲熊發狀角而不震侈而克揚庶其曉散靈音鎮入鵷鸞之殿夕騰仙韻恆流鳷鵲之闈聾俗聽而咸痊迷方聞而永悟洪鈞式啓寶字攸鐫其銘曰紫宸御厯青元樹因傾巖集寶竭府收珍杜䕫律應張永規陳形包九乳儀超萬鈞上資七廟傍延兆人風嚴韻急霜重音新自兹千歲從今億春懸玉京而薦福侣銅史而司辰景雲二年太歲辛亥金九月癸酉金朔一十五日丁亥土鑄成樓觀元和郡縣志在盩厔縣東三十七里本周康王大夫尹喜宅也穆王為召幽逸之人置為道士相承至秦漢皆有道士居之晉惠帝時重置其地舊有尹先生樓因名樓觀武德初改名宗聖觀玉海關令尹傳曰尹喜結草為樓精思至道周康王聞之拜為大夫以其樓觀望故號此宅為關令草樓觀即觀之始也一云周穆王尚神仙因尹真人草樓在終南山之隂召幽逸之人尹軌杜冲謂之道士居於草樓之所號草樓觀册府元龜元宗開元間帝夢京師終南山趾有天尊之像求得之於盩厔樓觀之側縣志唐高祖自以系出老氏元宗尊為元元皇帝詔改樓觀為宗聖觀宋端拱三年詔改順天興國觀元中統元年復改為宗聖前為四子堂及文始三清二殿再進則望氣樓其右殿曰景陽有丹井左殿曰寶章後為宗聖宫林莽翠繞有臺據高閣之上曰說經臺元至元二年重修樓殿凌空金碧溢目明王九思遊南山記樓觀紫雲樓兩層其上為玉皇像其後灰壁為山水人物畫甚竒非今人筆也唐岑參樓觀詩草樓荒井閉空山關令乘雲去不還羽蓋霓旌何處在空餘藥臼在人間宋蘇軾樓觀詩門前古碣卧斜陽閲世如流事可傷長有幽人悲晋惠强修遺廟學秦皇丹砂久窖井水赤白术誰燒厨竈香聞道神仙亦相過只疑田叟是庚桑又樓觀詩鳥噪猿呼晝閉門寂寥誰識古皇尊青牛久巳辭轅軛白鶴時來訪子孫山近朔風吹積雪天寒落日淡孤村道人應怪遊人衆汲盡階前井水渾㑹靈觀盩厔縣志在縣東唐元宗時建册府元龜開元二十九年帝夢一真容云吾是汝遠祖吾之形像可三尺餘在京城西南一百餘里帝即命使兼令諸道士相隨果於盩厔縣東南山阜間遇真容迎到便於興慶宫大同殿安置仍於現像之所建㑹靈觀焉尹喜祠盩厔縣志在老子祠北碑記云真人姓尹名喜字公父天水人涉覽山水於盩厔聞仙里結草為樓精思至道後迎老君請著書以惠後世遂屏絶人事著書九篇號關尹子顯聖廟三原縣志在縣治內按碑記祀春秋時伍員也唐乾符三年詔司農姬晉卿賚錦繖賽湫重修昭宗進封普濟王宋封靈濟昭佑顯聖王明萬厯間封靈湫大帝重修廟游巖宫三原縣志在縣治龍橋北安政坊相傳為唐田游巖宅高祖所幸第也唐坤厚記其地勢前對終南後枕嵯峨峪水涇渠左右交流為渭北勝地元中統初邑元帥揚子江請天光白真人主之重構殿宇元末燬明重建內有神鐘形僅逾尺聲聞數里靜明觀通志在耀州東五里北有太元洞即唐孫思邈隱處石像猶存耀州五臺山志其升仙臺大門有唐敕賜靜明觀額字竒徑李西平王祠通志在高陵縣南十里渭橋北百餘步祀唐李晟墓亦在焉春秋致祭有唐裴度撰碑栁公權正書府君廟長安縣志在城西四十里祀唐崔珏武德三年民懷其德為之建祠太宗夢與神遇遂封號曰府君之神宋大中祥符三年祈嗣有應加封地曹判官遣使致祭元延祐二年封為護國西齊王建廟始於長安因祀焉其一在城西二十里崔家莊宋太平興國觀通志在盩厔縣東三十里終南鎮玉海有神降於盩厔民張守真家守真為道士即所居創北帝宫太宗嗣位真君降言有忠孝加福愛民治國之語詔於終南山下築宫凡二年宫成宫中有通明殿題曰上清太平宫真君預言祀神之夕上望拜太平興國六年十一月壬戌封神為翊聖將軍大中祥符七年加號翊聖保德真君凡真君所降語帝命王欽若編為三卷宋史禮志太祖神御之殿鳯翔上清太平宫縣志宋太宗以年號名宫今俗呼為雪樣宫日久圮明代重建中興寺通志在盩厔縣西南五十里黑水谷仙遊潭上宋蘇軾留題仙遊潭中興寺東有玉女洞洞南有馬融讀書石室過潭而南山石益竒潭上有橋畏其險不敢渡清潭百尺皎無泥山木隂隂谷鳥啼蜀客曾遊明月峽秦人今在武陵溪獨攀書室窺巖竇還訪仙姝欵石閨獨有愛山心未至不將雙腳踏飛梯唐太宗廟醴泉縣志舊在縣東三十里宋開寶六年建金天眷元年修廟前有石刻昭陵圖記及六駿圖像明萬厯間移建縣城南揮麈前録宋太祖朝嘗詔修先代帝王祠廟令太常禮院重定配享功臣唐太宗以長孫無忌房元齡杜如晦魏徵李靖配李衛公祠通志在三原縣治西祀唐李靖碑記宋德祐初封衛公為輔世靈祐王元加忠顯威烈王賜廟額曰仁濟春秋致祭李光弼祠富平縣志在縣治內宋皇祐元年建邑令王晳毁赤眉祠為之明萬厯間重修元丹陽萬壽宫通志在咸寧縣治西南祀馬丹陽雍正八年修又東關外五里許别有萬壽宫今稱牛皮洞有元至正間董仙碑蹟重陽宫通志在盩厔縣東六十里祖庵鎮元劉祖謙碑記師姓王名嚞字知明重陽其號咸陽人金正隆間遇至人於甘河後於南時村掘地為隧封高數尺居三年復自實之遂遷於劉蔣村即今祖庵鎮成道時門人建殿號祖師庵元季門徒道衆㑹葬祖師重陽真人興建殿閣名重陽宫內有趙孟俯書敕藏御服碑周處廟渭南縣志在縣南五十里倒獸谷口續文獻通考元順帝至元三年封晉周處為英毅武惠正義王明五嶽廟通志在長安縣治東南明正統九年修本朝重修太白廟通志在長安縣西郭門外明崇禎間巡撫汪喬年修本朝總督白如梅重修臣謹按太白山即禹貢所云惇物山神福應王主祠在鳯翔郿縣境內臣於乾隆三十九年春三月因陜省雨澤少愆率屬於省城太白廟步禱有應經臣奏請特加封號重修祠宇以答神庥䝉恩加封昭靈普濟四字山神感沐懷柔凡有禱祈益昭丕應至於歷代封典故蹟並詳郿縣卷中清真寺通志在長安縣東北明洪武十七年尚書鐵鉉修永樂十一年太監鄭和重修瑞泉觀通志在渭南縣西南五里觀內有泉四時不涸縣志內有秦女峰唐岑參詩云秦女峰頭雪未歸即此上有朝元洞泉懸流百丈取水禱雨輒應觀為明天順三年建嘉靖十二年修孟姜女祠通志在同官縣北三里金山岩下明馬理孟姜女祠碑記秦始皇時有孟姜女楚地澧人范喜妻也姓姜氏歸三日范赴長城之役姜女製寒衣往尋范不見乃繞城而哭哭聲震地城一隅為之隳雲霧中范見其像女嚙指出血滴骸滲入者知為其夫遂負之歸至宜君山渴甚痛哭地湧甘泉今名哭泉南至同官水灣乃負骸置西巖石龕下坐其旁而逝邑人重其節義乃即其遺骸塑雙像祀之其龕中石隙祠人致誠以燎燭之則有金叉出見示神異焉萬厯二十二年重修董子祠通志在府城東南下馬陵祀漢儒董仲舒祠後即仲舒墓明嘉靖二十一年建杜工部祠咸寧縣志在樊川祀唐工部杜甫明嘉靖間建顔魯公祠通志在藍田縣藍橋明天啓六年建春秋致祭韓文公祠通志在藍田縣秦嶺縣志一在北郭本湘子祠明萬厯三十七年改肖文公像於中祀之晉公廟通志一在藍田縣東三十里一在縣西三十里明建祀唐裴度又渭南縣治西關外官路北有裴晉公祠明嘉靖間建通志公河東人其苗裔散在四方渭獨居多因立祠縣志初與寇萊公並祀額曰二公祠順治八年增祀蔡孝子順王節度忠嗣白侍郎樂天更名五賢祠忠烈祠名山記按三輔㑹要烈士段秀實廟在臨潼縣西十里斜口鎮西南縣志俗呼為烈神廟呂氏祠通志在藍田縣北五里舊無專祠明成化年即其故地建祠仲春致祭又縣西有三呂祠明成化十九年巡撫阮勤奏藍田縣有呂大忠大臨大鈞祠歲久淪毁乞修治賜祭下有司修飾之歲一祭本朝廣仁寺通志在長安縣西湖園教場西北康熙四十四年聖祖仁皇帝敕建御賜慈雲西䕃殿額并御製廣仁寺碑文云朕存心天下眷顧西陲惟兹關隴之區實切封疆之重歲當癸未特舉時巡省方設教訓吏寧人巳責除租行慶布德引年賜帛奬學興賢所過山川聖哲祠域遣修祀事用殫精禋凡所以裨邦政厚民生者靡弗致勤焉又以運際承平無忘武備簡稽將士整飭戎行發內帑之金錢普軍中之頒給爰於演武之場躬親校閲之典以建威銷萌之義有觀德習禮之風顧念久安長治務在因俗宜民若乾竺之傳言雖殊尚而利濟之道指有同歸閲武之頃周覽地形相其爽塏命創招提即大賚之餘資為雙林之小築厥工匪侈逾載告竣斯役也經營適協乎輿情銖黍不煩夫民力將使黃山巖岫秀比靈山渭水波濤凝如定水洪河浪息渡法海之津梁華嶽雲開通耆闍之轍跡五陵六郡之衆回向香城外蕃屬國而遙羣遊淨土賁神光之常護上以祝慈壽於無涯助王化之遐宣下以錫民庥於有永其亦朕綏懷寰宇順導蒸黎之至意也歟於是題廣仁之額標括三乘書多寶之碑昭垂奕葉云爾康熙四十四年十一月初一日白龍廟盩厔縣志在縣治廟後流泉足資灌溉每歲夏四月祭祀康熙二十一年修女華神廟通志在同官縣北長安志山層峰秀出每大風雷多從華嶽至此舊傳華嶽女君在此山人因立祠每水旱禱焉康熙三十五年修丁蘭廟通志在興平縣北五里孝子村康熙三十九年重建碑云孝子河內人寓居茂陵人敬之立祠以祀張橫渠祠縣志在臨潼縣城中康熙三十七年建橫渠書院祀公於講堂北按伊洛淵源録云橫渠再移疾西歸過洛陽别二程行李蕭然至臨潼而沒門人挽車而葬於郿三皇祠通志在藍田縣北三十里祀華胥氏伏羲氏女媧氏蓋伏羲女媧皆華胥氏所出故祀於故里以下祠宇建置時代無考金山神廟長安志在藍田縣南十里輞谷口金山之前舊圖經曰黃帝滅蚩尤之衆於此蓋風后之祠鹿臺神廟通志在髙陵縣西南三十里鹿苑原上佐軒轅破蚩尤者又旁有雷石風洞俗名雨磨禱雨多應太平寰宇記今號為鹿臺將軍成湯廟通志在興平縣治西北二十里始建之義無考後人遂名其地為湯祠鄉漢髙祖廟通志一在興平縣東南二十里樊噲城北一在縣西南三十里龍過村黃山宫興平縣志在縣西三十里馬嵬鎮即漢代老子祠故址內有太上槐露臺祠縣志在驪山東南二十里漢文帝廟也帝欲作露臺惜百金中人十家産而止民感之立祠其地有露臺故基又縣西北二十里有龍淵廟祀漢武帝王翦廟通志在富平縣北六十里其一為頻山神廟在縣北三十五里亦祀秦王翦又錦屏山上亦有王翦廟霍光廟鄠縣志在縣東十里金山建置無考東觀漢記永平二年十一月詔京兆右扶風以中牢祀霍光蔡孝子祠渭南縣志在縣城東祀漢孝子蔡順今孝子里有順墓在焉祋祤廟通志在耀州東一里即祋祤故城漢宣帝二年鳯凰集亦名鳯凰臺祋祤令有遺愛因祀之耀州志廟南有祋祤冢即令葬處馬周祠渭南縣志在縣東十里官路南周勸太宗勵精圖治澤被羣黎故其祠至今猶存汾陽王廟一統志在涇陽縣東門內祀唐郭子儀寇萊公祠通志在渭南縣北五十里下邽鎮鎮即公故里也程子祠通志在鄠縣治北祀明道先生關中勝蹟圖志卷七
