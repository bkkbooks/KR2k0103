body:
  text: 關中勝蹟圖志卷六陜西巡撫臣畢沅撰古蹟苑囿附第宅西安府周靈囿詩大雅王在靈囿孟子文王之囿方七十里又靈臺左傳注在京兆鄠縣周之故臺今鄠縣東五里有酆宫又東二十五里有靈囿囿中有臺詩大雅經始靈臺三輔黃圖臺髙二丈周四百二十步又靈沼三輔黃圖在長安西三十里詩大雅王在靈沼集傳臺下有囿囿中有沼也臣謹按靈臺在靈囿中雍勝略云靈囿在長安西四十里跨鄠縣境今舊址無存惟靈臺故基巋然在灃河西岸秦渡鎮北明秦藩改為佛寺臣於乾隆三十九年親往相度加修葺焉漢上林苑雍勝略即秦之舊苑也其故基跨今盩厔鄠長安咸寧藍田五縣之境水經注武帝微行以為道遠勞苦又為百姓所患乃使太中大夫吾邱壽王與待詔能用算者舉籍阿城以南盩厔以東宜春以西提封頃畝及其價值屬之南山以為上林苑東方朔諫秦起阿房而天下亂因陳泰階六符之事上乃拜太中大夫卒起上林苑故相如請為天子逰獵之賦稱烏有先生亡是公而奏上林也漢舊儀上林苑中廣長三百里苑中養百獸天子春秋射獵苑中取獸無數其中離宫七十所容千乘萬騎西都賦西郊則有上林禁苑林麓藪澤陂池連乎蜀漢繚以周墻四百餘里離宫别館三十六所神池靈沼往往而在關中記上林苑門十二中有苑三十六宫十二觀二十五西京雜記初修上林苑羣臣遠方各獻名果異卉三千餘種其中亦有制為美名以標竒麗也承華殿漢武故事七月七日上林承華殿齊正中忽有一青鳥從西北方來甫頃王母至鳯凰殿長安志宣帝神爵四年鳯凰集上林乃作鳯凰殿以答嘉瑞平樂館漢書武帝本紀武帝元封六年夏京師民觀角抵於上林平樂館注平樂館大作樂處繭館漢書元后傳注師古曰漢宫闕疏云上林苑有繭館蓋蠶繭之所也上蘭館漢書元后傳注師古曰上蘭館名也在上林中涿沐館長安志宣帝許美人居上林涿沐館數召入飾室磃氏館漢書郊祀志上求神君舍之上林中磃氏館注如淳曰磃音蹄鹿館長安志外戚傳成帝許美人在上林鹿館數召入飾室新臺長安志上林賦曰登新臺在豐水西北近渭今鄠縣也清臺雍録漢志曰武帝造太初厯即上林清臺課候則清臺在上林苑中矣三輔黃圖曰漢靈臺在長安西北八里漢始曰清臺後更名曰靈臺蠶室長安志减宣怒其吏成信信亡藏上林中宣使郿令將吏卒䦨入上林中蠶室門延壽門長安志平帝迎玉皇后自上林延壽門入未央宫前殿昆明池雍勝略在長安縣西南三十里豐邑鄉鸛鵲莊三輔黃圖昆明池漢武帝元狩四年穿圃曰上林苑有昆明池史記平凖書越欲與漢用船戰遂乃大修昆明池列觀環之治樓船髙十餘丈旗幟加其上甚壯關中記昆明池漢武習水戰也中有龍沼神池云堯時治水訖停舟於此蓋堯時已有汙池漢代因而廣深耳三輔故事昆明池三百二十五頃池中有豫章臺及石鯨刻石為鯨魚長三丈每至雷雨常鳴吼鬣尾皆動立石牽牛織女於池之東西以象天漢周庾信和春日晚景宴昆明池詩春餘足光景趙李舊經過上林柳腰細新豐酒徑多小船行釣鯉新盤待摘荷蘭臯徒稅駕何處有凌波唐宋之問奉和晦日幸昆明池應制詩春豫靈池㑹滄波帳殿開舟凌石鯨度搓拂斗牛回節晦蓂全落春遲柳暗催象溟看浴景燒劫辨沈灰鎬飲周文樂汾歌漢武才不愁明月盡自有夜珠來沈佺期昆明池侍宴應制詩武帝伐昆明穿池習五兵水同河漢在館有豫章名我后光天德埀衣文教成黷兵非帝念勞物豈皇情春仗過鯨沼雲旗出鳯城靈魚銜寶躍仙女廢機迎柳拂旌門暗蘭依帳殿生還如流水曲日晚棹歌清豫章觀三輔黃圖武帝造在昆明池中亦曰昆明觀三輔故事昆明池中有龍首船常令宫女泛舟池中張鳯蓋建華旗作櫂歌雜以鼓吹帝御豫章觀臨觀焉昆靈池百子池初學記上林苑中積草池三輔黃圖上林苑有積草池蒯池漢武故事上林苑蒯池生蒯草以織席牛首池上林賦濯鷁牛首張揖曰牛首池名上林苑西頭太平寰宇記野韭澤即漢牛首池地在內苑西豐水西北西陂池東陂池印池三輔黃圖皆在上林苑中飛亷觀三輔黃圖在上林苑武帝元封二年作飛亷神禽能致風氣者身似鹿頭如雀有角而蛇尾文如豹武帝命以銅鑄置觀上因以為名班固漢武故事曰公孫卿言仙人好樓居於是上於長安作飛亷觀髙四十丈陽祿觀柘觀長安志班媫妤生子陽祿觀師古曰二觀並在上林苑中雲林觀包陽觀犬臺館當路館鼎郊館朗池觀博望觀樛木觀便門觀華元觀益樂觀明光觀三輔黃圖並在上林苑中已上俱上林苑博望苑雍録武帝為戾太子立博望苑使通賔客苑在漢長城外漕渠之北至成帝始撤去御宿苑三輔黃圖在長安城南御宿川中漢武帝為離宫别館禁御人不得往來逰觀止宿其中故曰御宿又御羞苑通志漢書武帝元鼎二年初置水衡都尉掌上林苑有五丞屬官有御羞苑禁圃令如淳曰御羞地名在藍田其土肥沃多出御物可進者師古以為即御宿川非是宜春下苑三輔黃圖在京城東南隅雍録宜春之名漢史凡三有曰宜春苑者地屬下杜有曰宜春宫者即下杜苑中宫也有曰宜春觀者則在鄠縣雖三其名而實止兩地也樂逰苑雍勝略樂逰原上有樂逰苑一曰樂逰園去咸寧縣八里漢書宣帝本紀宣帝神爵二年春起樂逰苑兩京新記宣帝樂逰廟謹按關中記宣帝立廟於曲江之北號樂逰亦名樂逰原亦名樂逰苑地基最髙四望寬敞唐李顃樂逰苑春望詩五陵佳氣晚氤氲霸業雄圖勢自分秦地山河連紫塞漢家宫殿入青雲未央樹色春中見長樂鐘聲月下聞無那楊花起愁思滿天飄落雪紛紛代邸漢書文帝本紀代王至渭橋太尉勃上天子璽代王謝曰至邸而議之閠月已酉入代邸羣臣從至議請即天子位代王西向讓者三南向讓者再遂即天子位羣臣奉天子法駕迎代邸皇帝即日夕入未央宫丞相府西京雜記平津侯公孫宏自以白衣為丞相乃大開東閣營客館招延天下士人其外曰欽賢之館以待大賢之士次曰翹材之館以待大材之士又次曰接士之館以待國士其有德有賢可佐理隂陽者處之欽賢館其有材堪將軍二千石者居翹材之館其有一介之善一方之藝者居接士之館所得俸祿以奉之三輔𪠘雍録三輔黃圖曰三輔者主爵中尉及左右內史武帝改曰京兆尹左馮翊右扶風共治長安中是為三輔郡皆有都尉又曰京兆在故城尚冠里馮翊在故城內太上皇廟西扶風在夕隂街北此其𪠘治之所也長安志中尉府在尚冠里街東京兆尹即廢中尉府也御史府通典漢御史所居曰御史府亦曰御史大夫寺在大司馬門內無孰其門用梓板不雘色亦謂之憲臺漢書朱博傳御史府中列柏木常有野烏數千棲宿其上晨去暮來號曰朝夕烏司隸府漢舊儀司隸府治即孝武帝廟也鴻臚府長安志王莽以鴻臚府為定安太后宫蠻夷邸雍録陳湯斬郅支單于上疏乞垂之藁街蠻夷邸間諸家無言藁街之在何地者唐都髙驛即蠻夷邸在朱雀街西與鴻臚府近細柳倉通志在咸陽西三十里周亞夫屯軍處三輔故事漢文帝大將軍周亞夫軍於細柳今呼石徼是也石徼西有細柳倉東有嘉禾倉樊噲傳柳中即細柳地也在長安西漢書注服䖍曰在長安西北如淳曰長安細柳倉在渭北近石徼注張揖曰在昆明池南今有柳市是也師古曰胸奴傳云置三將軍軍長安西細柳渭北棘門灞上此則細柳不在渭北揖說是也蕭何第漢書蕭何傳蕭何買田宅必居窮僻處為家不治垣屋曰令後世賢師吾儉不賢毋為勢家所奪長安志王莽為安漢公以故蕭何宅為安漢公第石奮宅漢書石奮傳髙祖召其姊為美人徙其家長安中戚里注師古曰於上有姻戚者皆居之故名其里曰戚里田子春宅通志在漢長安城中孟嘗君孫因諸吕擅權乃入關圖扶漢誅諸吕故有是宅霍光第漢書霍光傳宣帝賜甲第一區王根第通志曲陽侯王根大治第室極其奢僣司隸校尉京兆尹不敢舉奏王商第漢書外戚傳成都侯王商穿長安城引內灃水注第中大陂以行船上幸商第見穿城引水意恨內銜之董賢第漢書董賢傳哀帝詔將作大匠為賢起大第北闕下重殿洞門土朩之工窮極伎巧柱檻衣以錦綈黃山苑漢書霍光傳霍雲當朝請數稱病私出多從賔客張圍獵黃山苑中袁廣漢園西京雜記茂陵富人袁廣漢藏鏹巨萬家僮九百人於北􅉭巖築園謹按北芒巖在興平即始平原也東西四里南北三里激流注其內搆石為山髙十餘丈連延數里養白鸚鵡紫鴛鴦旄牛青兕後沒入官為園鳥獸草朩皆徙入上林苑魏顔斐菜園魏志斐字文林為京兆守於府下起菜園使吏簡拔鋤治也晉逍遙園長安志姚興嘗於逍遙園引諸沙門聽畨僧鳩摩羅什講演佛經起逍遙宫殿庭旁有樓閣髙百尺相去四十丈以麻繩大一圍兩頭各絟樓上㑹日令二人各從繩上行過以為佛神相遇又澄元堂長安志在逍遙園中周華林園周庾信三月三日華林園馬射賦并序堯以仲春之月刻玉而逰河舜以甲子之朝披圖而巡洛夏后瑶臺之上或御二龍周王元圃之前猶驂八駿我大周之創業也南正司天北正司地平九黎之亂定三危之罪雲紀御官鳥司從職皇王有秉厯之符元圭有成功之瑞豈直天地合德日月光華而己哉皇帝以上聖之姿膺下武之運通乾象之靈啓神明之德夷典秩宗見之三禮䕫為樂正聞之九成克巳偹於禮容威風總於戎政加以卑躬菲食皀帳綈衣百姓為心四海為念西郊不雨即動皇情東作未登彌回天眷兵革無㑹非有待於丹烏宫觀不移故無勞於白燕銀甕金船山車澤馬豈止竹葦兩草共埀甘露青赤二氣同為景星雕題鑿齒識海水而來王烏弋黃支驗東風而受吏於時元鳥司厯蒼龍御行羔獻冰開桐花萍合皇帝幸於華林之園玉衡正而泰階平閶闔開而鈎陳轉千軍雷動萬騎雲屯落花與芝蓋同飛楊柳共春旗一色乃命羣臣陳大射之禮雖行袚禊之飲即同春搜之儀止立行宫裁舒帳殿階無玉璧既異河間之碑户不金鋪殊非許昌之賦洞庭既張承雲乃奏騶虞九節貍首七章正飾五采之雲壺寧百福之酒唐弓九合冬幹春膠夏箭三成青莖赤羽於是選朱汗之馬校黃金之埒紅陽飛鵲紫燕晨風唐成公之驌驦海西侯之千里莫不飲羽銜竿吟猿落鴈鐘鼓震地埃塵漲天酒以罍行肴由鼎進彩則錦市俱移錢則銅山合徙太史聽鼓而論功司馬張旃而賞獲上則雲布雨施下則山藏海納實天下之至樂景福之歡欣者也既而若朩將低金波欲上天顔惟穆賔歌惟醉雖復暫離北闕聊宴西城即同鄷水之朝更是岐山之㑹小臣不舉奉詔為文以管窺天以蠡酌海盛德形容豈陳梗概嵗次昭陽月在大梁其日上已其時少陽春史司職青祇效祥徴萬騎於平樂開千門於建章屬車釃酒復道焚香皇帝翊四圉於帝回六龍於天苑對宣曲之平林望甘泉之長坂華蓋平飛風烏細轉路直城遙林長騎逺帷宫宿設帳殿開筵傍臨細柳斜界祈年開鶴列之陳靡魚鬚之旃行漏抱刻前旌載鳶河湄剃草渭口澆泉堋雲五色的暈重圓陽管既調春絃實撫總章協律成均樹羽翔鳯為林靈芝為圃草銜長帶桐埀細乳鳥囀歌來花濃雪聚玉律調鐘金錞節鼓於是咀銜拉鐡逐日追風并試長楸之埒俱下蘭池之宫鳴鞭則汗赬入埓則塵紅既觀賢於大射乃頒政於司弓變三驅而畫鹿登百尺而懸熊繁弱振地鐡驪踏空禮正六耦詩歌九節七札俱穿五豝同穴弓如明月對堋馬似浮雲向埒雁失羣而行斷猿求林而路絶控玉勒而搖星跨金鞍而動月乃有六郡良家五陵豪選新回馬邑之兵始罷龍城之戰將軍戎服來參武宴尚帶流星猶乘奔電始聽鼓而唱籌即倚竿而標箭馬噴沾衣塵驚灑面石堰水而澆園花乘風而繞殿熊耳刻杯飛雲畫罍水衡之錢山積織室之錦霞開司筵賞至酒正杯來至樂則賢乎秋水歡笑則勝上春臺既而日下澤宫筵闌相圃悵徙蹕之留歡眷回鑾之餘舞欲使石梁銜箭銅山飲羽橫弧於楚水之蛟飛鏃於吳亭之虎况復恭己無為南風在斯非有心於蜓翼豈留情於㦸枝惟觀揖讓之禮蓋取威雄之儀臣謹按周明帝紀武成二年三月㑹羣公列將卿大夫及突厥使者於芳林園賜錢帛各有差則園在長安明矣庾信賦稱歲次昭陽係辛已年乃武帝保定元年蓋帝初即位踵行故事而史偶失書耳考魏志云芳林園避少帝號改曰華林是則鄴下先有芳林園後周無諱當避而此賦亦改芳為華則未詳何故耳隋大興苑長安志開皇元年置通志在宫城之北即唐禁苑也芙蓉園劉餗小說本古曲江文帝惡其名曲改名芙蓉園為其水盛而芙蓉富也雍録隋營京城宇文愷以京城東南隅地髙故闕此地不為居人坊巷鑿之為池以厭勝之又㑹黃渠水自城外南來可以穿城而入入城為芙蓉池且為芙蓉園也謹按芙蓉園劉餗以為在城外程大昌以為在城中據康駢劇談録云芙蓉園在曲江之南則在城外明矣煬帝藩邸長安志武德中以賜左僕射蕭瑀所為少陵原南接終南北至滻水即漢鴻固原也後瑀子鋭尚襄城公主詔别營主第主辭以姑婦異居有乖禮則因固陳請乃取園地充主第又辭公主􅙶㦸不欲異門乃并施瑀之院門西苑雍勝略隋煬帝大業元年築西苑周三百里其內為海周十餘里為方丈蓬萊瀛洲諸山髙出水百餘尺臺觀宫殿羅絡山上向背如神海北有龍鱗渠縈紆注海內緣渠十六院門皆臨渠每院以四品夫人主之堂殿樓觀窮極華麗宫樹秋冬凋落則剪綵為華葉綴於枝條色渝則易以新者常如陽春沼內亦剪綵為芰荷菱芡乘興逰幸則去冰而布之十六院競以肴羞精麗相尚求市恩寵上好以宫女月夜數千騎逰西苑作清夜逰曲於馬上奏之又西苑池雍大記在長安城中楊素宅通志在延康坊唐禁苑長安志在宫城之北東西二十七里南北三十三里東接灞水西臨長安故城南連京城北枕渭水苑西即太倉北距中渭橋與長安故城相接東西十三里南北十三里亦隸苑中苑中四面皆有監南面太樂監北面舊宅監東監西監分掌宫中植種及修葺園囿等事又置苑總監領之皆隸司農寺苑中宫亭凡二十四所南面三門中曰景曜東曰芳林西曰光化東面二門南曰光泰北曰昭遠西面二門南曰延秋北曰元武北面三門中曰啓運東曰飲馬西曰永泰雍録曰唐大內有三苑西內苑東內苑禁苑皆在兩宫北而有分别西內苑並西內太極宫之北東內苑則包大明宫東北兩面兩內苑北門之外始為禁苑之南門內苑長安志啓運門之南有內苑北曰重元門東曰東雲龍門西曰西雲龍門自元武門北至重元門一里東西與宫門齊南望春亭北望春亭雍録在禁苑東南髙原之上舊記多云望春宫其東正臨滻水也天寶元年韋堅因古跡堰渭水絶滻灞為潭東注永豐倉下以便漕運名廣運潭未幾滻灞二水沙泥衝塞潭不可漕付司農掌之為捕魚之所王維奉和聖製於望春亭觀禊飲應制詩長樂青門外宜春小苑東樓開萬井上輦過百花中畫鷁移仙仗金貂列上公清歌邀落日妙舞向春風渭水明秦甸黃山入漢宫君王來袚禊灞滻亦朝宗魚藻池雍大記深一丈在禁苑中貞元十三年詔更淘四尺引灞河水漲之在魚藻宫後穆宗以觀競渡雍録王建宫詞曰魚藻宫中鎖翠娥先皇行處不曽過而今池底休鋪錦菱角雞頭積漸多先皇謂德宗池底張錦引水被之令其光艷透見也蠶壇亭長安志在院之東皇后祈先蠶之所青門亭長安志去宫城十三里在長安故城之東即邵平種瓜之所櫻桃園通志在禁苑之南又有東西葡萄園臨渭亭長安志禁苑內舊唐書中宗本紀景龍四年四月甲寅幸臨渭亭修禊飲桃園亭長安志去宫城四里隸舊宅監所領咸宜宫未央宫長安志禁苑內皆漢之舊宫也去宫城二十一里唐置都邑之後因其舊址復增修之宫側有未央池漢武庫武宗㑹昌元年因逰畋至未央宫見其遺址詔葺之尚有殿舍二百四十九間作正殿曰通光殿東曰詔芳亭西曰凝思亭又有南昌國北昌國流杯三亭皆漢舊址並立端門隸舊宅監所梨園雍録在光化門北光化門禁苑南面西頭第一門在芳林景曜門之西也中宗令學士自芳林門入集於梨園分朋拔河則梨園在太極宫西禁苑之內矣開元二年置教坊於蓬萊宫上自教法曲謂之梨園弟子至天寶中即東宫宜春北苑命宫女數百人為梨園弟子是梨園者按樂之地預教者名為弟子唐崔湜梨園亭子侍宴應制詩年光陌上發香輦禁中遊草緑鴛鴦殿花明翡翠樓寶杯呈露酌仙館雜風流今日陪歡豫皇恩不可酬坡頭亭柳園亭月坡毬場亭子青城橋新鱗橋栖雲橋凝碧橋上陽橋正興亭元沼亭神皋亭七架亭明水園長安志並內苑所有東內苑長安志南北二里與大明宫城齊東西盡一坊之地南即延政門北即銀臺門東即太和門龍首池長安志在東內苑㑹要元和十三年浚龍首池靈符應聖院長安志在龍首池東凝碧池雍大記在東內苑雍録祿山亂逆徒張樂於此樂工雷海青憤擲樂器王維陷賊被拘僧寺聞之為詩曰萬户傷心生野烟百官何日再朝天秋槐葉落深宫裏凝碧池頭奏管絃已上禁苑尚書省雍録在朱雀門北正街之東自占一坊長安志省中有都堂本尚書令㕔事都堂之東吏部户部禮部三行每行四司左司統之都堂之西兵部刑部工部每行四司右司統之吏部選院雍録長安志曰在尚書省之南亦曰吏部南院選人看榜之所也六典吏部員外郎掌選院謂之南曹注云其曹在選曹之南也禮部南院長安志吏部選院東禮部南院四方貢舉聚㑹之所也雍録禮部南院者即貢院也今世淡墨書進士榜首列四字曰禮部貢院者唐世遺則也則唐人已嘗名南院為貢院矣有列榜之地如吏部國子監長安志在務本坊監東開街若兩坊北抵皇城南盡一坊之地監中有孔子廟貞觀四年立又房元齡宅亦在此坊驥德院雍録後院有驥德院禁馬所在亦在務本坊禮賔院册府元龜元和九年六月置禮賔院於長興里北京兆府𪠘長安志在光德坊東南隅府內𪠘宇並隋開皇中制度其後隨事改作萬年縣𪠘長安志宜陽坊東南隅萬年縣𪠘去府七里縣門屋宇文愷所造太平公主降薛紹於縣𪠘設昏席初以縣門隘狹欲毁之髙宗敕宇文愷所造製作多竒不須毁拆也長安縣廨長安志長壽坊西南隅長安縣𪠘去府六里尉遲恭宅亦在是坊曲江池雍勝略去咸寧縣南一十里本秦隑州漢之宜春下苑也太平寰宇記曲江池其水曲折有似廣陵之江故名之西京記朱雀街東第五街皇城之東第三街升道坊龍華尼寺南有流水屈曲謂之曲江劇談録曲江開元中疏鑿遂為勝境其南有紫雲樓芙蓉園其西有杏園慈恩寺花卉環周烟水明媚都人逰玩盛於中和上已之節綵幄翠幬匝於堤岸鮮車健馬比肩擊轂上已賜宴臣僚京兆府大陳筵席長安萬年二縣以雄勝相較錦繡珍玩無所不施百辟㑹於山亭恩賜太常及教坊聲樂池中備綵舟數隻惟宰相三使北省官與翰林學士登焉傾動皇州以為勝觀入夏則菰蒲葱翠柳隂四合碧波紅藥湛然可愛好事者賞芳辰玩清景聨騎攜觴亹亹不絶春明退朝録曲江宴唐初設以慰下第舉人其後弛廢而進士㑹同年於此開元時造紫雲樓於江邉至期上率宫嬪埀簾觀焉命公卿士庶大酺各攜妾妓以往娼優緇黃無不畢集先期設幕江邊是以商賈皆以竒貨麗物陳列豪客園户爭以名花布道進士乘馬盛服鮮制子弟僕從隨後率務華侈都雅推同年俊少者為探花使有匿花於家者罰之開元天寶間旁有殿宇安史亂後盡圮廢文宗覽杜甫詩云江頭宫殿鎖千門細栁新蒲為誰緑因建紫雲樓落霞亭歲時賜宴又詔百司於兩岸建亭館名山記曲江亭在府城東曲江池西南唐羅鄴曲江春望詩故國東歸澤國遙曲江晴望憶漁樵都緣北闕春先到不是南山雪易消瑞影玉樓開組繡歡聲丹禁奏雲韶雖然未得陪鴛鷺亦酹金觴祝帝堯盧綸曲江春望詩菖蒲翻葉柳交枝暗上蓮舟鳥不知更望荷花最深處玉樓金殿影參差雍裕之曲江池上詩殷勤春在曲江頭全藉羣仙占勝逰何必三山待鸞鶴年年此地是瀛洲杏園玉海曲江池西㑹要大中元年正月敕進士放榜後杏園宴集韋曲雍勝略在咸寧縣南二十里樊川唐韋安石别業杜石花亭號為勝地杜甫詩云韋曲花無賴家家惱殺人杜曲雍録在啓夏門外向西少陵原也杜甫詩云杜曲花光濃似酒雍勝略杜曲去咸寧縣南三十里樊川韋曲東十里有南杜北杜杜固謂之南杜杜曲謂之北杜按二曲名勝之地韋杜二家歷代顯宦故唐人語曰城南韋杜去天尺五九曲池雍大記在長安城西興慶池西唐寧王山池院引興慶水西流疏鑿屈曲連環為九曲池上築土為基叠石為山植松柏有落猿岩棲鳯岫竒石異朩珍禽怪獸又有鶴洲仙渚殿宇相連左滄浪右臨漪王與宫人賔客宴飲弋釣其中定昆池雍大記本安樂公主西莊也在京城延平門外景龍初命司農卿趙履溫為公主疏園植果中列臺榭慿空架迥棟宇相屬又敕將作監少監楊務亷引水作沼延十數里時號定昆池通典曰安樂公主恃寵請昆明池中宗不與公主怒自以家財别穿池號曰定昆景龍中中宗幸焉度支亭子長安志在永逹坊輦下歲時記新進士牡丹宴在永逹亭子家令寺園長安志在昌明坊貞觀中日南王入朝詔於此營第尋還國宅遂廢復為園諸王府長安志寶厯二年以延康坊官宅一區為諸王府唐朝故事王府在京師合有曹局自天寶以後王不出閣所置寮采過於閒冗至是瓊王府長史裴簡求奏遽創官府十六宅雍録在安國寺東附苑城為大宅分處十王謂慶忠棣鄂榮儀臺潁永濟也後盛壽陳豐常凉六王又就封入內宅是為十六宅後以諸孫成長又置百孫院永寧園長安志在永寧坊賜祿山永寧園為邸奉誠園長安志馬燧宅在安邑里貞元末獻舊第為奉誠園唐元稹奉誠園詩蕭相深誠奉至尊舊居求作奉誠園秋來古巷無人掃樹滿空牆閉㦸門馬璘池亭長安志在崇賢坊後入官貞元後羣臣多賜宴於此何將軍山林通志今謂之塔坡少陵原乃樊川之北原自司馬村起至此而盡其髙三百尺在杜城之東韋曲之西山林久廢上有寺浮圖亦廢唐杜甫陪鄭廣文逰何將軍山林詩不識南塘路今知第五橋名園倚緑水野竹上青霄谷口舊相得濠梁同見招平生為幽興未惜馬蹄遙百頃風潭上千章夏木清卑枝低結子接葉暗巢鶯鮮鯽銀絲膾杳芹碧澗羮翻疑柁樓底晚飯越中行萬里戎王子何年别月支異花開絶域蔓草匝清池漢使徒空到神農竟不知露翻兼雨打開拆漸離披旁舍連髙竹踈籬帶晚花碾渦深沒馬藤蔓曲藏蛇詞賦工無益山林跡未賖盡拈書籍賣來問爾東家賸水滄山破殘山碣石開緑埀風折筍紅綻雨肥梅銀甲彈筝用金魚換酒來興移無灑掃隨意坐莓苔風磴吹隂雪雲門吼瀑泉酒醒思卧簟衣冷欲裝綿野老來看客河魚不取錢只疑淳朴處自有一山川棘樹寒雲色茵陳春藕香脆添生菜美隂益食單凉野鶴清晨出山精白日藏石林蟠水府百里獨蒼蒼憶過楊柳渚走馬定昆池醉把青荷葉狂遺白接䍦刺船思郢客解水乞吳兒坐對秦山晚江湖興頗隨牀上書連屋階前樹拂雲將軍不好武稚子總能文醒酒微風入聽詩靜夜分絺衣挂蘿薜凉月白紛紛幽意忽不愜歸期無奈何出門流水住回首白雲多自笑燈前舞誰憐醉後歌祇應與朋好風雨亦來過又重過何氏詩問訊東橋竹將軍有報書倒衣還命駕髙枕乃吾廬花妥鶯捎蝶溪喧獺趁魚重來休沐地真作野人居山雨尊仍在沙泥榻未移犬迎曽宿客鴉護落巢兒雲薄翠微寺天清皇子陂向來幽興極步屣過東籬落日平臺上春風啜茗時石闌斜㸃筆桐葉坐題詩翡翠鳴衣桁蜻蜓立釣絲自今幽興熟來往亦無期頗怪朝參懶應耽野趣長雨拋金鎖甲苔卧緑沈槍手自移蒲柳家才足稻梁看君用幽意白日到羲皇到此應常宿相留可判年蹉跎暮容色悵望好林泉何日沾微祿歸山買薄田斯懷恐不遂把酒意茫然逍遙公别業張說東山記韋嗣立東山之側有别業焉上聞而賞之乃命千官飲乎池上即席拜逍遙公名其居曰清虛原幽栖谷唐紀韋嗣立搆别廬於驪山鳯凰原鸚鵡谷有重崖洞壑飛瀑中宗臨幸改為清虛原幽栖谷拜嗣立為逍遙公唐李嶠奉和聖製幸韋嗣立山莊應制詩萬騎千官擁帝車入龍三馬訪仙家鳯凰原上開青壁鸚鵡杯中美紫霞王維别墅雍録輞川在藍田縣西南二十里王維别墅在焉本宋之問别圃也王維輞川詩序余别業在輞川山谷其逰止有孟城坳華子岡文杏館斤竹嶺鹿柴朩蘭柴茱茰沜宫槐陌臨湖亭南垞欹湖柳浪欒家瀨金屑泉白石灘北垞竹里館辛夷塢漆園椒園等與裴迪閒暇各賦絶句云唐王維輞川聞居詩一從歸白社不復到青門時依簷前樹逺看原上村青菰臨水拔白鳥向山翻寂寞於陵子桔橰方灌園又孟城坳詩新家孟城口古朩餘衰柳來者復為誰空悲昔人有華子岡詩飛鳥去不窮連山復秋色上下華子岡惆悵情何極文杏館詩文杏裁為梁香茅結為宇不知棟裏雲去作人間雨斤竹嶺詩檀欒映空曲青翠漾漣漪暗入商山路樵人不可知鹿柴詩空山不見人但聞人語響返景入深林復照青苔上朩蘭柴詩秋山斂餘照飛雨逐前侣彩翠時分明夕嵐無處所茱茰沜詩結實紅且緑復如花更開山中儻留客置此茱萸杯宫槐陌詩仄徑䕃宫槐幽䕃多緑苔譍門但迎掃畏有山僧來臨湖亭詩輕舸迎上客悠悠湖上來當軒對尊酒四面芙蓉開南垞詩輕舟南垞去北垞渺難即隔浦望人家遙遙不相識欹湖詩吹簫臨極浦日暮送夫君湖上一回首青山卷白雲柳浪詩分行接綺樹倒影入清漪不學御溝上春風傷别離樂家瀨詩颯颯秋雨中淺淺石溜㵼跳波自相濺白鷺驚復下金屑泉詩日飲金屑泉少當千餘歲翠鳯翊文螭羽節朝玉帝白石灘詩清淺白石灘緑蒲向堪把家住水東西浣紗明月下北垞詩北垞湖水北雜樹映朱闌逶迤南川水明滅青林端竹里館詩獨坐幽篁裏彈琴復長嘯深林人不知明月來相照辛夷塢詩朩末芙蓉花山中發紅蕚澗戶寂無人紛紛開且落漆園詩古人非傲吏自闕經世務偶寄一微官婆娑數株樹椒園詩桂尊迎帝子杜若贈佳人椒漿奠瑶席欲下雲中君裴迪孟城坳詩結廬古城下時登古城上古城非疇昔今人自來往華子岡詩落日松風起還家草露晞雲光侵履跡山翠拂人衣文杏館詩迢迢文杏館躋攀日己屢南嶺與北湖相看復回顧斤竹嶺詩明流紆且直緑篠密復深一徑通山路行歌望舊岑鹿柴詩日夕見寒山便為獨往客不知深林事但有麏跡朩蘭柴詩蒼蒼落日時鳥聲亂溪水緣溪路轉深幽興何時已茱萸沜詩飄香亂椒桂布葉間檀欒雲日雖回照森沈猶自寒宫槐陌詩門前宫槐陌是向欹湖道秋來山雨多落葉無人掃臨湖亭詩當軒彌滉漾孤月正裴回谷口猿聲發風傳入户來南垞詩孤舟信一泊南垞湖水岸落日下崦嵫清波殊渺漫欹湖詩空濶湖水廣青熒天色同􅋈舟一長嘯四面來清風柳浪詩映池同一色逐吹散如絲結隂既得地何謝陶家詩欒家瀨詩瀨聲喧極浦沿涉向南津泛泛鷗鳬渡時時欲近人金屑泉詩縈渟淡不流金碧如何拾迎晨含素華獨往事朝汲白石灘詩跂石復臨水弄波情未極日下川上寒浮雲淡無色北垞詩南山北垞下結宇臨欹湖每欲采樵去扁舟出菰蒲竹里館詩來過竹里館日與道相親出入惟山鳥幽深無世人辛夷塢詩緣堤春草合王孫自留玩况有辛夷花色與芙蓉亂漆園詩好閒早成性果此諧宿諾今日漆園逰還同莊叟樂椒園詩丹刺罥人衣芳香留過客幸堪調鼎用願君埀采摘大興湯院通志藍田西南有地雪落即融唐時有異僧見之曰必溫泉也掘之果然凡病者浴之輒愈後有白魚之瑞神女屢降立玉女堂於泉側明皇賜名大興湯院李靖宅通志在三原縣韋端符觀李衛公故物記端符於三原令坐中揖其羣官有客曰李彥芳是衛公之胄也其家傳賜書與他服器十餘物俱無恙張說宅通志在永興坊本侍中王德正宅燕公修葺之又說有别宅在宣義坊裴度宅通志在永樂坊魏徴宅雍録在永興坊長寧公主宅兩京記在崇仁坊西南隅後為禮㑹院長安志公主及駙馬揚脊交奏割宅向西一半官市為禮㑹院每公主郡縣主出降皆就此院成禮又蘇瓌宅亦在是坊李林甫宅長安志在平康坊本尚書令左僕射衛國公李靖宅景龍中韋庶人妹夫陸頌所居韋氏敗靖姪孫令聞居之後為林甫宅有堂如偃月每欲排擠大臣即處之思所以中傷者又蘭陵公主禇遂良裴光庭宅俱在平康坊虢國夫人宅通志在宣陽坊明皇雜録本韋嗣立舊宅太真外傳楊銛與國忠五家於宣陽里甲第洞開僣擬宫掖每造一堂費逾千萬見制度宏於已者則毁之復造土朩之工不舍書夜又長安志郭元振楊國忠宅俱在宣陽坊郭子儀宅談賔録在親仁坊宅居其坊地四分之一通永巷家人三千出入者不知其居其里巷負販之人上至簮纓之士出入不問或至王夫人趙氏愛女方籹梳對鏡公麾下將吏及郎吏皆被召令汲水持帨視之不異僕隸他日子弟集諫公笑曰爾曹固非所料吾官馬食粟者五百匹官餼者一千人進無所往退無所據向使重垣扄户不通內外一怨將起搆以不臣則噬臍莫及矣今蕩蕩無間四門洞開雖讒毁無以加也諸子皆服又子儀園長安志在大安坊後為岐陽公主别館安祿山宅長安志在親仁坊滕王元嬰宅亦在是坊楊憑宅唐書楊憑傳憑入拜京兆尹治第永寧里工役叢煩謗議頗歡貶臨賀尉窮幽記白樂天得楊慿宅竹朩池館有林泉之致因為池上篇又長安志裴行儉裴炎李輔國徐浩王涯白敏中宅俱在永寧坊李晟宅長安志興元二年賜永寧里甲第渾瑊宅長安志興元元年賜渾瑊宅在進昌坊宋璟宅長安志在大寧坊柳公綽宅通志在升平坊柳公權宅通志在耀州北四十里宅廢今名為柳家原宅旁有公權瘞筆冢姚崇宅通志在興寧坊又李訴宅亦在是坊李光顔宅長安志開化坊有李光顔宅穆宗初賜第崇德坊以為别宅令狐楚宅酉陽雜爼在開化坊牛僧孺宅通志在新昌坊殷開山顔師古宅通志並在敦化坊長安志貞觀永徽間太常少卿歐陽詢著作郎沈越賔亦在此坊殷顔南朝舊族歐陽與沈又江左士人時人呼此坊為吳兒坊元載宅長安志在安仁坊談賔録元載城中南北二甲第又於近郊起亭榭帷帳什器皆如宿設城南别墅凡數十所奴僕曳羅綺二百餘人又杜佑宅長安志在安仁坊李思訓宅長安志在通義坊閻立本宅長安志在延康坊武元衡宅通志在靖安坊又韓愈劉伯芻李宗閔宅亦在是坊張九齡宅通志在修政坊李光弼宅通志在敦義坊武三思宅通志在休祥坊李績宅通志在普寧坊上官昭容宅通志在羣賢坊宋寇凖宅通志新說曰府城掖庭街有寇萊公宅中有山池熙熙臺後改為安衆禪院中有萊公祠堂又渭南縣亦有萊公宅今城內普照寺即其遺址孫思邈宅長安志今為僧寺在祋祤縣東五里流惠鄉惠政坊啓玉山种放宅通志新說曰府城街後有种太尉宅中有奎鈞閣賜之閣閣下東壁繪晉王羲之蘭亭圖西壁繪廬山遠公白蓮社圖空翠堂通志在鄠縣西五里溔陂北岸隄上取杜甫溔陂行絲管啁啾空翠來之句宋知縣張伋撰記久而堂廢明嘉靖間重建前有紫閣後有菱池氣象清幽松竹叢中水磨之聲不絶司竹監長安志在盩厔縣東三十里史記渭川千畝竹漢謂秦地有鄠杜竹林晉地道記司竹都尉治鄠縣其園周一百里以供國用唐置司竹監丞掌之隋義寧元年唐髙祖起兵其第三女平陽公主舉兵於司竹園號娘子軍宋設監仍唐制通志明設司竹局以大使典之宋蘇軾司竹監燒葦園因召都巡檢柴貽朂左藏以其徒會獵園下詩官園刈葦歲留槎深冬放火如紅霞枯槎熱盡有根在春雨一洗皆萌芽黃狐老兔最狡捷賣侮百獸常矜誇年年此厄竟不悟但愛䝉密爭來家風回焰卷毛尾燒欲出已被蒼鷹遮野人來言此最樂徒手曉出歸潘車巡邊將軍在近邑呼來颯颯從矛又戍兵又聞可小試戰鼓雖凍猶堪撾雄心欲搏南澗虎陳勢頗學常山蛇霜乾火烈聲爆野飛走無路號且呀迎人截來􅒂逄箭避犬逸去窮投罝擊鮮走馬殊未厭但恐落日催棲鴉弊旗仆鼓坐數獲鞍挂雉兔肩分麚主人置酒聚狂客紛紛醉語晚更譁燎毛燔肉不暇割飲啖直欲追羲媧青邱雲夢古所咤與此何啻百倍加苦遭諫疏說夷羿又被賦客嘲淫奢豈如閒官走山邑放曠不與趨朝衙農工己畢歲云暮車騎雖少賔殊佳酒酣上馬去不告獵獵霜風吹帽斜姚氏山亭通志在盩厔黑水峪宋蘇軾自仙逰回至黑水見居民姚氏山亭髙絶可愛復憩其上詩山鴉曉辭谷似報逰人起出門猶屢顧幓若去吾里道途險且紆繼此復能幾溪邊有危構歸駕聊復柅愛此山中人縹眇如仙子平生暮獨往官爵同一屣胡為此溪邉眷春若有俟國恩久未報念此暫且泚臨風浩悲咤萬世同一軌何年謝簮紱丹砂留迅晷御花園通志在渭南縣花園村舊志謂宋太后所置周處廟碑云曹皇后莊望輝堂通志在耀州署後州東鑑山年豐則有光如鑑故登此堂以望之宋皇祐中華原令楊庭建金張中孚宅通志府城草場街有金紫光祿大夫張中孚宅中有頤真堂衆樂堂流杯亭後為錢監元為利用倉元成德堂通志長安府學成德堂七門八椽髙敞雄壯元末已毁明宣德中建為明倫堂亷相泉園通志元至元中平章亷希憲行省陜右愛秦中山水遂於樊川杜曲林泉佳處葺治㕔館亭榭導泉灌園移植漢沔東洛竒花異卉畦分碁布松檜梅竹羅列成行暇日雅歌投壺彈琴詠詩其間柳塘通志在鄠縣南山下元楊奐隱居教授其徒植柳千株有清風閣讀書堂明秦王府雍大記在西安府城中之左洪武初命長興侯耿炳文修洪武三年四月初七日封愍王之國於秦又保安郡王府在秦府之西永興郡王府在秦府西南一里興平郡王府永壽郡王府並在秦府西南二里宜川郡王府在秦府西南三里小池坊汧陽郡王府在秦府西北半里郃陽郡王府在秦府東南三里臨潼郡王府在東城之外洪武中為蒲城郡主府第關中勝蹟圖志卷六
