body:
  text: 關中勝蹟圖志卷十八陜西巡撫臣畢沅撰古蹟宫闕鳳翔府殷岐陽宫雍勝略故基在岐山縣東北五十里即周太王由豳遷岐所建今宫廢而土人猶稱之臯門在岐陽城內周太王所立詩乃立臯門臯門有伉應門在臯門內亦周太王所立詩乃立應門應門將將泰平陽封宫通志在郿縣故平陽城內郊祀志雍大雨壞平陽宫垣史記武公元年伐彭戲氏至於華山下居平陽封宫雍録云在華山下蓋因史記至於華山之文而誤也羽陽宫通志在寶雞縣陳倉故城內澠水燕談録秦武公作羽陽宫在寶雞縣界嵗久不可究知其處元祐六年正月直縣門之東百步居民權氏濬池得古銅瓦面上隱起四字曰羽陽千嵗篆字隨勢為之不取方正始知為羽陽舊址也其地北負髙原南臨渭水前附羣峰形勢雄壯真勝地也大鄭宫左傳注鳳翔縣南七里有古雍城秦德公所居大鄭宫城也史記泰本紀德公元年初居雍城大鄭宫髙泉宫雍勝略在扶風縣東美陽故城長安志秦宣太后起虢宫三輔黃圖秦宣太后起在岐州虢縣界棫陽宫雍勝略在扶風縣東北三十里秦穆公建遺址尚存謹按長安志謂棫陽宫為秦昭王起與此異祈年宫通志即槖泉宫在鳳翔府城內東南隅雍録酈道元水經注曰雍縣中窂與牢同井秦惠公故居所謂祈年宫也孝公又謂之槖泉宫据酈此言則是惠公所都雍縣有祈年宫至孝公命為槖泉名雖兩出其實一宫也又推酈此言則是祈年槖泉皆在惠公雍都亦不知何人所建獨漢書曰祈年宫惠公所起黃圖祈為蘄且曰穆公所造廟記曰宫在城外而始皇本紀則曰在雍皆以世逺難究其的也雍勝略後人又於此建祈年觀漢回中宫一統志在鳳翔縣三輔黃圖回中宫在汧括地志回中秦故宫在雍州西四十里隋仁夀宫通志在麟遊縣西五里通鑑文帝詔楊素營仁夀宫於岐山之北素奏宇文愷封德彛為土朩監於是夷山堙谷以立宫殿崇臺纍榭宛轉相屬岐陽宫通志在鳳翔縣城內開皇六年建安仁宫一統志在郿縣東隋志郿縣有安仁宫開皇十五年置行宫十二所自京師以達仁夀宫此其一也唐貞觀十八年自九成宫還至安仁宫即此通志又有鳳泉宫亦隋離宫唐九成宫唐書地理志在麟遊縣西五里本隋仁夀宫貞觀五年復置更名永徽二年曰萬年宫乾封二年復曰九成宫周垣千八百步並署禁苑及府庫官寺元和郡縣志每嵗避暑春往冬還義寧元年廢宫置郡縣貞觀五年復修舊宫以為避暑之所改名九成縣志宫在縣西天臺山上中有碧城及排雲御容等殿今遺址無考惟九成萬年兩古碑尚存金石文字記唐九成宫醴泉銘魏徵撰歐陽詢書又萬年宫銘髙宗御製并書二碑並存唐魏徵九成宫醴泉銘維貞觀六年孟夏之月皇帝避暑乎九成之宫此則隋之仁夀宫也冠山搆殿絶壑為池跨水架楹分巖竦闕髙閣周建長廊四起棟宇膠葛臺榭參差仰視則迢遰百尋下臨則崢嶸千仞珠璧交映金碧相輝照灼雲霞蔽虧日月觀其移山回澗窮泰極侈以人從欲良足深尤至於炎景流金無鬱蒸之氣微風徐動有凄清之涼信安體之佳所誠養身之勝地漢之甘泉不能尚也皇帝爰在弱冠經營四方逮乎立年撫臨億兆始以武功一海內終以文德懷逺人東越青邱南踰丹徼皆獻琛奉贄重譯來王西暨輪臺北拒元闕並地列州縣人充編戶氣淑年和邇安逺懷羣生咸遂靈貺畢臻雖藉二儀之功終資一人之慮遺身利物􅌨風沐雨百姓為心憂勞成疾同堯肌之如臘甚禹足之胼胝針石屢加腠理猶滯爰居京室每弊炎暑羣下請建離宫庶可怡神養性聖上愛一夫之力惜十家之産深閉固拒未肯俯從以為隋氏舊宫營於曩代棄之則可惜毁之則重勞事貴因循何必改作於是斫雕為模損之又損去其太甚葺其頽壞雜丹墀以砂礫間枌壁以塗泥玉砌接於土階茅茨續於瓊室仰觀壯麗可作鑒於既往俯察卑儉足垂訓於後昆此所謂至人無為大聖不作彼竭其力我享其功者也然昔之池沼咸引谷澗宫城之內本乏水源求而無之在乎一物既非人力所致聖心懷之不忘粵以四月甲申朔旬冇六日已亥上及中宫歷覽臺觀閒步西城之隂躊躇髙閣之下俯察厥土微覺有潤因而以杖導之有泉隨而湧出乃承以石檻引為一渠其清若鏡味草如醴南注丹霄之右東流度於雙闕貫穿青鎖縈帶紫房激揚清波滌蕩瑕穢可以導養正性可以澄瑩心神鑒映羣形潤生萬物同湛恩之不竭將元澤之常流匪惟乾象之精蓋亦神靈之寶謹按禮緯云王者刑殺當罪賞錫當功得禮之宜則醴泉出於闕廷鶡冠子曰聖人之德上及太清下及太寧中及萬靈則醴泉出瑞應圖曰王者純和飲食不貢獻則醴泉出飲之令人夀東觀漢記曰光武中元元年醴泉出於京師飲之者痼疾皆愈然則神物之來實扶明聖既可蠲兹沈痼又將延彼遐齡是以百辟卿士相趨動色我后固懷撝挹推而弗有雖休勿休不徒聞於往昔以祥為懼實取驗於當今斯乃上帝元符天子令德豈臣之未學所能丕顯但職在記言屬兹書事不可使國之盛美有遺典策敢陳實録爰勒斯銘其詞曰惟皇撫運奄冇寰宇千載膺期萬物斯覩功髙大舜勤深伯禹絶後光前登三邁五握儀蹈矩乃聖乃神武克禍亂文懷逺人書契未紀開闢不臣冠冕並襲琛贄咸陳大道無名上德不德元功潛運幾深莫則鑿井而飲耕田而食靡藉天功安知帝力上天之載無臭無聲萬物資始品物流形隨感變質從德效靈介焉如響赫赫明明雜遝景福葳蕤繁祉雲氏龍宫龜圖鳳紀日含五色烏呈三趾頌不輟工筆無停史上善降祥上知斯悅流謙潤下潺湲皎潔萍旨醴甘氷凝鏡徹用之日新挹之無竭道隨時泰慶與泉流我后夕惕雖休勿休居崇茅宇樂不般遊黃屋非貴天下為憂人玩其華我取其實還淳反本代文以質居髙思墜持滿戒溢念兹在兹永保貞吉永安宫雍録貞觀八年置在麟遊縣西古蹟苑囿附第宅鳳翔府周尹喜故宅偃曝餘談寶雞縣有尹喜故宅張三丰邱長春馬丹陽王重陽劉綱樊夫人秦㺯玉仙跡往往而在第虎豹熊羆時出伺人有獨角獸樵者見其卧林間或搏虎而食之食輒餘其半山家每得殘虎以飽唐李茂貞園通志在鳳翔縣東北五里光啓中茂貞節度鳳翔時建修竹萬竿內有竹閣傍引溪水灌之宋蘇軾李氏園詩朝遊北城東回首見修竹下有朱門家破牆圍古屋舉鞭叩其門幽響答空谷入門所見夥十步九移目異花兼四方野鳥喧百族其西引溪水活活轉牆曲東注入深林林深窗戶緑水光兼竹淨時有獨立鵠林中百尺松嵗久蒼鱗蹙豈惟此地少意恐關中獨小橋過南圃夾道多喬木隱如城百雉挺若舟千斛隂隂日光淡黯黯秋氣蓄盡東為方池野雁雜家鶩紅梨驚合抱映島孤雲馥春光水溶漾雪陳風翻撲其北臨長溪波聲卷平陸北山卧可見蒼翠間磽秃我時來周覽問此誰所築云昔李將軍負險乘衰叔抽錢算閒口但未榷羮粥當時奪民田失業安敢哭誰家美園囿籍歿不容贖此亭破千家鬱鬱城之麓將軍竟何事蟣蝨生刀韣何嘗載美酒來此駐車轂空使後世人聞名頸猶縮我今官正閒屢至因休沐人生營居止竟為何人卜何當辦一身永與清景逐汧陽閣一統志在汧陽縣治南唐韋莊汧陽閣詩汧水悠悠去似絣逺山如畫翠眉橫僧尋野渡歸吳嶽雁帶斜陽入渭城邊靜不收蕃悵馬地貧惟賣隴山鸚牧童何處吹羌笛一曲梅花出塞聲一經堂一統志在隴州治東刺史韋臯建取韋賢教子一經之義賣酒樓一統志在寶雞縣東陳倉故城內自唐至宋中更兵燹獨存此樓宋蘇軾詩云曉入陳倉縣惟餘賣酒樓謂此宋會景亭一統志在鳳翔縣城外南溪處衆亭之間蘇軾遷之水西可以逺眺又改名招隱題詩其上宋蘇軾會景亭詩飛簷臨古道髙榜勸遊人未即令公隱聊須濯路塵茅茨分聚落烟火傍城闉林缺湖光漏窗明野意新居民惟白帽過客謾朱輪山好留歸屐風回落醉巾他年誰改築舊製不須因再到吾雖老猶堪作坐賔喜雨亭通志在鳳翔縣東北蘇軾判郡時建鑿池其南引流種樹為休息之所自為文記之宋蘇軾喜兩亭記亭以雨名志喜也古者有喜則以名物示不忘也周公得禾以名其書漢武得鼎以名其年叔孫勝狄以名其子其喜之大小不齊其示不忘一也余至扶風之明年始治官舍為亭於堂之北而鑿池其南引流種樹以為休息之所是嵗之春雨麥於岐山之陽其占為有年既而彌月不雨民方以為憂越三月乙卯乃雨甲子又雨民以為未足丁卯大雨三日乃止官吏相與慶於庭商賈相與歌於市農夫相與抃於野憂者以樂病者以愈而吾亭適成於是舉酒於亭上以屬客而告之曰五日不雨可乎曰五日不雨則無麥十日不雨可乎曰十日不雨則無禾無麥無禾嵗且薦饑獄訟繁興而賊盜兹熾則吾與二三子雖欲優游以樂於此亭其可得耶今天不遺斯民始旱而賜之以雨使吾與二三子得相與優游而樂於此亭者皆雨之賜也其又可忘耶既以名亭又從而歌之曰使天而雨珠寒者不得以為𥜗使天而雨玉饑者不得以為粟一雨三日繄誰之力民曰太守太守不有歸之天子天子曰不然歸之造物造物不自以為功歸之太空太空𡨕𡨕不可得而名吾以名吾亭武成樓一統志在寶雞縣東三十里武成鎮宋陳希亮守鳳翔時建斯飛閣一統志在寶雞縣西南宋蘇軾斯飛閣詩西南歸路逺蕭條倚檻魂飛不可招野濶牛羊同雁鶩天長草樹接雲霄昏昏水氣浮山麓泛泛春風㺯麥苗誰使愛官輕去國此身無計老漁樵翠麓亭一統志在寶雞縣東南一百八十里青峰寺旁石林亭一統志在麟遊縣東宋劉敞有詩蘇軾和之宋蘇軾石林亭詩都城日荒廢往事不可還惟餘故苑石漂散向人間公來始購蓄不憚道里艱忽從塵埃中來對氷雪顔瘦骨拔凜凜蒼根潄潺潺唐人惟竒章好石古莫攀盡令屬牛氏刻鑿紛班班嗟此本何常聚散實循環人失亦人得要不出區寰君看劉季末不能保河關況此百株石鴻毛於太山但當對石飲萬事付等閒張橫渠宅一統志在郿縣東五十里橫渠鎮南大振谷口古蹟祠宇鳳翔府上古倉頡廟通志在岐山縣西南五里縣志舊在渭河之南嵗久岸圮明嘉靖中改建於河北原上姜嫄廟通志在扶風縣東南四十里邰城鎮內夏禹廟一統志在岐山縣東十三里有古柏九十四株枝悉西向周太王廟通志在岐山縣東北十五里岐陽舊地創建無考金重慶元年重修後圮誤傳為赧王廟明正統間行人郭仲南過岐訪周遺址得石碣乃知為太王廟知縣王澤重修仲南撰記一統志廟側又有王季及文王廟泰伯廟一統志在岐山縣西北十里寇村三公廟一統志在鳳翔縣東郭內祀周公召公太公配以蜀漢諸葛亮宋張子周公廟通志在岐山縣西北十五里鳳凰山麓唐武德間建宋元祐元年重修一統志有姜嫄廟在廟後府志有太姜太任太姒三廟在姜嫄廟東姜太公廟通志在寶雞縣東南六十里磻溪側磻溪東北流入渭廟居其右廟左有釣石石根著土甚微盤旋而上至頂平廣雙窊膝跡顯然當時坐而持竿之所也鳳女祠通志在鳳翔縣南五十里其地有鳳女臺相傳秦穆公築以居簫史弄玉者後人因臺作祠以祀陳寶祠一統志在寶雞縣東二十里史記秦文公獲若石於陳倉北坂城祠之祀以一牢命曰陳寶列異傳秦穆公時陳倉人掘地得物若羊非羊若猪非猪牽以獻穆公逢二童子曰此為媪述常在地中食人腦若欲殺之以柏插其首媪曰此二童子名為雞寶得雄者王得雌者霸陳倉人舍之逐二童子化為雉飛入於林陳倉人告穆公發徒大獵得其雌又化為石置之汧渭之間至文公立祠名陳寶縣志祀雞臺址尚存漢三班祠一統志在扶風縣南飛鳳山祀班彪及子固超乂曹大家祠亦在此山伏波祠通志在扶風縣東四十里祀馬援馬超廟一統志在扶風縣茂陵山下元延祐二年建通志即超故居地諸葛武侯廟通志在岐山縣南五丈原魏鄧艾祠通志在鳳翔縣北十里隋文帝廟通志在扶風縣東四十五里每嵗春秋祀西鎮吳山廟通志在隴州南七十里吳嶽山下隋開皇十六年凖西鎮吳山造神廟唐李晟鎮鳳翔時禱雨有應于公異為記册府元龜清泰元年正月壬申詔吳嶽成德公可進封靈應王初帝在鳳翔遣房嵩祀之有應至是欲加封爵下有司簡討天寶十載正月封吳山神為成德公至德二年十二月改吳山為嶽祠享官屬視五嶽今國家以靈告祥宜示殊等故有是命宋史開寶六年遣使奉衣冠劍履送西鎮吳嶽廟立秋日祀西鎮吳山於隴州舊封成德公元豐八年封王元史大德二年二月加封西鎮吳山為成德永靖王至元三年定嵗祀嶽鎮之制七月土王日祀吳山於隴州界續文獻通考明洪武三年詔嶽鎮海瀆英靈之氣受命上帝豈國家封號可加命依古制止以山水本名稱西鎮吳山之神十二年遣官賜金香盒一座有司祭服二襲永樂二年敇修五年災知州張幹重建本朝康熙四十二年五月賜額曰五峰挺秀每嵗春秋有司修其常祀唐韓文公祠一統志在扶風縣北崇正鎮段太尉祠通志一在汧陽縣南一里一在縣西北四十里祀唐段秀實唐書興元元年詔贈太尉諡忠烈帝還都又詔致祭旌其門閭親銘其碑太和中子伯倫始立廟有詔給鹵簿賜度支綾絹五百以少牢致祭太白山神廟通志在郿縣東南四十里太白山上唐天寶八載封山神為神應公貞元十二年秋旱詔飾祠廟翌日大雨黍稷用豐宋至和三年封神為濟民侯嘉祐七年復封為明應公熙寧八年進封福應王金元俱仍王爵明正統四年重建廟東坡志林太白山神至靈自昔禱無不應近嵗向公少師為守奏封山神為濟民侯自此禱不應偶取唐會要看云天寶十四年詔封山神為靈應公吾然後知神之所以不悅者即告太守遣使禱之若應當奏乞復公爵旦以瓶取水歸郡遂大雨三日吾作奏檢具言其狀詔封明應公且修其廟祀之日有白鼠長尺餘歷酒饌上嗅而不食父老曰龍也臣謹按太白山靈湫數處歷代以來久著神異關中每於望澤之時凡有禱祈咸昭丕應乾隆五年川陜督臣尹繼善奏請列入本省祀典臣䝉簡命巡撫陜西於乾隆二十九年三月霡霂偶愆禾苗待澤臣敬率僚屬步禱西安神廟復遣官赴山於靈湫取水立沛甘霖四野霑足經臣奏請特賜封號䝉恩敕加昭靈普潤四字用答神庥其神廟之在山中者舊制庳隘臣復捐俸飭郿令重為葺治嵗時致祭庶明神顧享益多嘉應焉玉皇廟通志在寶雞縣東南六十里相傳唐縣尹劉綱夫婦登仙處靈義侯祠通志在隴州城內唐大厯二年故郡壘艱於得水荀氏夫婦獻地因遷城於此敕封為靈義侯靈順夫人立祠以祀有禱屢應宋太祖時改封安祐侯開元寺通志在鳳翔縣城內開元中建聞見後録大殿九間後壁吳道子畫自佛始生修行說法至滅度山林宫室人物禽獸數千萬種極古今天下之妙其識開元三十年云宋蘇軾記所見開元寺吳道子畫佛滅度以答子由詩西方真人誰所見衣被七寶從雙狻當時修道頗辛苦柏生兩肘鳥巢肩初如濛濛隱山玉漸如濯濯出水蓮道成一旦就空滅奔會四海悲人天翔禽哀響動林谷獸鬼躑躅淚迸泉龎眉深目彼誰子繞牀彈指性自圓隱如寒月墮清畫空有孤光留故躔春遊古寺拂塵壁遺像久此霾香烟畫師不復寫名姓皆云道子口所傳從橫固巳蔑孫鄧有如巨鰐吞小鮮來詩所誇孰與此安得擕挂其旁觀天柱寺鳳翔縣志在縣北三里舊有楊惠之塑維摩像唐李洞宿鳳翔天柱寺窮易元上人房詩天柱暮相逢吟思天柱峰墨研青露月茶吸白雲鐘卧語身粘蘚行禪頂拂松探元為一决明月去臨卭宋蘇軾維摩像唐楊惠之塑在天柱寺詩昔者子輿病且死其友子祀往問之跰􅓷鑒井自歎息造物將安以我為今觀古塑維摩像病骨磊嵬如枯龜乃知至人外生死此身變化浮雲隨世人豈不碩且好身雖未死身已疲此叟神完中有恃談笑可却千熊羆當其在時或問法俯首無言心自知至今遺像兀不語與昔未死無增虧田翁俚婦那肯顧時冇野鼠銜其髭見之使人每自失誰能與語無言師普門寺通志在鳳翔縣東一里唐建金大定六年修明正德八年重修舊有唐王維吳道子畫宋蘇軾王維吳道子畫詩何處訪吳畫普門與開元開元有東塔摩詰留手痕吾觀畫品中莫如二子尊道子實雄放浩如海波翻當其下手風雨快筆所未到氣已吞亭亭雙林間彩暈扶桑􅚐中有至人談寂滅悟者悲涕迷者手自捫蠻君鬼伯千萬萬相排競進頭如黿摩詰木詩老佩芷襲芳蓀今觀此壁畫亦如其詩清且敦祇園弟子畫鶴骨心如死灰不復溫門前兩叢竹雪節貫霜根交柯亂葉動無數一一皆可尋其源吳生雖妙絶猶以畫工論摩詰得之於像外有如仙翮謝籠樊吾觀二子皆神俊又于維也斂衽無閒言又獨遊普門寺有憶子由詩花開美酒盍不歸來看南山冷翠微憶弟淚如雲不散望鄉心與雁南飛明年縱健人應老昨日追歡意正違不問秋風强吹帽秦人不笑楚人譏耆闍寺通志在岐山縣東北四十里崛山下唐乾寧四年建石磴﨑嶇巖洞峭絶春時人多遊此法門寺一統志在扶風縣北二十里崇正鎮即唐憲宗迎佛骨處聞見後録古塔四層瘞佛手指骨一節憲宗盛儀肅迎入禁中塔下層有石芙蕖工製精妙每芙蕖一葉上刻一施金錢人姓名殆數千人宫女姓名為多又刻白玉像所瘞佛指骨節置金蓮花中隔琉璃水晶匣可見通志元和十四年詔改為法雲寺敕學士張仲素撰碑宋徽宗有讚并大書皇帝佛國四字於山門之上西明寺通志在郿縣西南二十里顯慶三年為元奘法師建酉陽雜俎孫思邈隱終南石室與宣律師互參元旨於此龍泉寺一統志在汧陽縣十五里龍泉山上唐武德間建宋大中祥符間改普濟禪院有碑僧善俊書石墨鐫華以為不減聖教序慈禪寺一統志在麟遊縣東四里杜澄交會處有永徽四年鐫刻石佛像興國寺通志在麟遊縣治北門外童山下唐開元十年建唐時古松尚存有銀杏樹大四五圍髙與山齊明正統間禱雨有應天臺寺通志在麟遊縣西五里天臺山即唐九成宫故墟也南面青蓮北負排雲寺內尚存白松古柏宋張橫渠祠通志在郿縣大振谷口本朝康熙二十三年賜額曰學達性天又有祠在縣東五十里橫渠鎮先生故居元元貞間建真興寺一統志在鳳翔縣城內宋初節度使王彥超建閣髙十餘丈宋蘇軾真興寺閣詩山川與城郭漠漠同一形市人與鴉鵲浩浩同一聲此閣幾何髙何人之所營側身送落日引手攀飛星當年王中令斫木南山頳寫真留閣下鐵面眼有稜身強八九尺與閣兩崢嶸古人雖暴恣作事今世驚登者尚吁喘作者何以勝曷不觀此閣其人勇且英又真興寺閣禱兩詩太守親從千騎禱神翁逺借一杯清雲隂黯黯將噓遍雨意昏昏欲釀成已覺微風吹袂冷不堪殘日傍山明今年秋熟君知否應向江南飽食粳賢山寺通志在扶風縣東南二十里有塔淳祐五年建旁有三洞極幽邃蓋勝迹也鐵佛寺通志在隴州香泉有鐵佛一軀宋咸平中建元祐間重修金槐北寺通志在郿縣槐芽鎮北一里即古惠濟院大定四年賜額南擁太白北環渭水東接柿林西臨清湫先是有異僧禪憩於此至金敕修遂為一方勝概焉雲庵通志在郿縣東南四十里大定間有髙僧隱庵中後有石洞洞中刻達摩像相傳達摩傳法於此景福宫通志在扶風縣治北正隆間建有仙人張三丰畫壁玉清宫一統志在汧陽縣西舊縣東三里大定中建元至元中重修姚燧撰碑元大金佛寺通志在鳳翔縣東大德元年敕修世祖鑄金佛像髙尺許重三十五斤賜寺中供養明初失之成道宫通志在寶雞縣東南六十里渭水之南邱處機修道於此始名長春觀後改今名明三賢祠通志在汧陽縣東祀燕伋郭欽段秀實伋從夫子適周欽肥遁於王莽之世秀實死難舊各祀於鄉天啓元年始創此祠髙攀龍撰記馮從吾篆額金臺觀通志在寶雞縣東北一里許張三丰修道之所古蹟郊邑鳳翔府唐虞斄亭雍勝略在郿縣境漢書郊祀志注后稷封斄斄讀如邰或曰鳳翔府郿縣有邰亭桓談新論邰在漆縣其民有會日以相與夜中市如不為則有災咎周授經臺雍勝略在鳳翔縣南本終南山峰尹喜既見老子授五千言喜退而書之曰道德經後常居此野人塢名山記在鳳翔縣南秦穆公失善馬野人得而食之者三百人吏捕得欲法之公曰吾聞食善馬肉不飲酒傷人皆賜之酒其後秦伐晉三百人皆從報德遂脫穆公於難鳳臺通志在鳳翔縣南十五里水經注雍有鳳臺秦穆公時有蕭史者善吹簫能致白鶴孔雀穆公女弄玉好之公為作鳳臺以居之積數十年一旦隨鳳去雍宫世有簫管之聲焉今臺傾祠毁不復然矣召亭雍勝略在岐山縣西八里召公村公采邑在此故後人建亭水經注雍水東徑召亭南召康公之采邑也周城通志在岐山縣西北十五里亦曰周公邸水經注岐水之南有周城周城者周公之采邑也磻溪釣石通志即釣臺在寶雞縣東南磻溪谷中其石下細上巨俯臨溪中故老相傳為太公釣魚處有兩膝所著跡謹按太公釣魚臺有三一在河南新安城東今去水數丈一在咸陽一在寶雞磻溪谷中其遇丈王者磻溪也又見大川虢縣鎮通志在寶雞縣東五十里即周武王封虢叔地隋為虢縣元省入寶雞白起城雍勝略在郿縣東北十五里秦白起所築今遺址尚存太王陵一統志在岐山縣東北五十里通志在岐陽鎮北俗云幽王陵按幽王陵在臨潼北二十五里太王始遷岐下冢在岐陽無疑秦穆公墓通志在鳳翔縣城內東南隅周圍五丈有奇前有碑嵗時致祭史記秦本紀穆公葬雍皇覽秦穆公冢在橐泉宫祈年觀下謹按史記注謂在雍縣東南二里是在城以外也今城正唐末李茂貞所築宋蘇軾秦穆公墓詩槖泉在城東墓在城中無百步乃知昔未有此城秦人以泉識公墓昔公生不誅孟明豈有死之日而忍用其良乃知三子殉公意亦如齊之二子從田橫占人感一飯尚能殺其身今人不復見此等乃以所見疑古人古人不可望今人益可傷三良冢通志在城南半里許朱子詩傳文公六年秦伯任好卒以子車氏之三子奄息仲行針虎為殉皆秦之良也國人哀之為之賦黃鳥謹按括地志三良冢在岐州雍縣一里故城內今在城外是城巳改築也秦武公墓一統志在岐山縣西南史記秦本紀武公葬雍平陽臣謹按陜西通志據劉紹周平陽封域辨以秦武公墓在郿縣考武公葬平陽以平陽為屬郿縣者魏書地形志史記裴駰集解胡三省通鑑注是也以平陽為屬岐山者括地志史記正義是也又考元豐九域志虢縣有平陽鎮蓋即平陽故城虢縣元時省入寶雞而一統志謂平陽故城在岐山縣西南接寶雞界地理頗合則以武公墓為在岐山尤為有據今從之秦寧公墓一統志在寶雞縣西北史記秦寧公葬西山帝王世紀寧公葬西山大麓故號秦陵山括地志寧公墓在陳倉縣西北三十七里秦陵山謹按始皇本紀云葬衙與此不同漢伏波村一統志在扶風縣西七里馬援故居絳帳村一統志在扶風縣東南二十五里相傳馬融授徒處郿塢城雍勝略在郿縣東十五里董卓封郿侯築塢髙厚皆七丈徙金銀雜物於內積三十年穀俗謂之小長安水經注渭水東徑郿塢南宋蘇軾郿塢詩衣中甲厚行何罹塢裏金多退足憑畢竟英雄誰得似臍脂自照不須燈回中城雍勝略在隴州西北四十里即漢來歙開道處斜谷關通志在郿縣西南三十里通鑑元狩中發卒萬人作褒斜道魏志郭淮傳青龍二年亮出斜谷田於蘭坑賈逵傳正始元年曹爽征蜀使賈逵至斜谷觀形勢蜀志建興十一年蜀運米集斜谷口治斜谷邸閣十二年亮由斜谷出據五丈原雍録長安可達漢中惟子午關子午關在正南次西則駱谷關又西則斜谷關漢王自漢中出襲雍則自褒斜出也岐山縣志褒斜二谷阻衙嶺為首尾雍梁有事為出入咽喉與祁山大散子午駱谷並稱要地大散關通志在寶雞縣南五十二里大散嶺上通褒斜後漢書順陽侯嘉傳建武二年延岑引兵北入散關至陳倉嘉追破之注散關故城在陳倉縣南十里有散谷水因取名焉水經注汧水東入散關唐書地理志寶雞西南有大散關中興四朝志大散關屬梁泉縣在寶雞南為秦蜀往來要道自關距和尚原才咫尺兩山關控斗絶出可以攻入可以守實表裏之形勢也縣志大散關一曰散關在縣西南大散嶺上為秦蜀襟喉南山自藍田而西至此方盡又西則隴首特起汧渭縈流關當山川之會扼南北之交隴關通志在隴州西七十里隴山下後漢書順帝紀永和四年命扶風築隴道塢五年羌寇武都燒隴關通典隴山一名隴坻漢隴關今名大震關在縣西雍録漢武帝至此遇震雷因名大震關方輿紀要宇文周天和中避諱改關曰大寧亦曰隴山關隋唐復為大震關唐薛逵改築新關於隴山上西去故關三十里控扼要道與故關並為戌守秦雍喉嗌隴關當之矣詳見唐安戎馬援墓一統志在扶風縣西七里後漢書本傳援卒後有上書譖之者帝怒妻孥惶懼不欲以喪還舊塋裁買城西數畝地藁葬而已妻子詣闕上書訴寃前後六上然後得葬魯恭墓通志在扶風縣北四十里魯馬村謹按中牟縣志恭墓在縣西北兖州府志載恭墓在焦氏山南考後漢書本傳恭以老病罷官卒於家則中牟諸處皆非實冢班固墓通志在扶風縣東二十里三國落星村通志在岐山縣東五十里即蜀漢諸葛亮長星墜營處三交城元和郡縣志在寶雞縣西十六里司馬懿與諸葛亮相距所築石鼻寨通志在縣東四十里武侯築以拒郝昭一名石鼻城通鑑唐光啓三年田令孜奉上發寶雞增禁兵守石鼻為後拒胡三省注蘇軾曰寶雞縣武成鎮即俗所謂石鼻寨也宋蘇軾石鼻城詩平時戰國今無在陌上征夫自不閒北客初來試新險蜀人從此送殘山獨穿暗月朦朧裏愁渡奔河蒼茫間漸入西南風景變道邊修竹水潺潺晉竇滔墓通志在扶風縣北周秦坡隋文帝泰陵通志在扶風縣東南四十五里隋書文獻獨孤皇后仁夀二年八月葬於泰陵髙祖文皇帝仁夀四年十月合葬於泰陵同墳而異穴關中陵墓志陵髙五丈周數百步謹按元和郡縣志太平寰宇記皆云文帝秦陵在武功縣西南二十里三畤原一統志從之考武功西南二十里已交扶風界陵在今扶風境故載於此唐臨􅊈城一統志在隴州西北册府元龜王承元為鳳翔節度使於􅊈陽西北八十里築新城一所賜額為臨􅊈城鳳翔西接涇原無山谷之險吐蕃由是往往入寇故承元奏於衝要築壘分兵千人以守之謹按臨􅊈城新舊唐書皆在􅊈陽一統志列入隴州蓋本鳳翔府志隴亭通志在隴州隴山官道旁唐時巳有此亭安戎關一統志在隴州西南册府元龜大中六年隴州防禦使薛逵言汧源西境切在故關昔有隄防殊無制置僻在重岡之上茍務髙深今移要會之中實堪控扼舊絶泉井逺汲河流今則臨水挾山當川限谷危牆深塹克揚營壘之勢謹畫圖進乞改為安戎關唐書地理志汧源西有安戎關本大震關薛逵移築更名通鑑唐天復二年孔勍取成隴二州乃自故關歸後唐乾祐元年蜀將韓保貞出新關胡三省注秦州清水東五十里有大震關自薛逵徙築安戎關於隴山由是謂大震關為故關今隴山之西有故關山新關在汧源縣西潘氏堡一統志在寶雞縣東北唐書楊晟傳光啓三年守大散關朱玫攻關晟戰於潘氏遂敗通鑑注潘氏堡在寶雞東北模壁寨通志在寶雞縣西南七十里通鑑乾祐初蜀將安思謙救鳳翔遣别將趨模壁箭括關通志在汧陽縣南十五里通鑑梁貞明六年蜀將陳彥威出散關敗岐兵於箭括嶺胡三省注其山兩岐故俗呼為箭括有箭括關宋史吳玠傳紹興三十一年金沒立方攻箭括關玠遣將擊敗之甘露坊一統志在麟遊縣西唐馬坊也九域志縣有八馬坊李淳風墓通志在岐山縣東北五里謹按河南府志李淳風墓在新安縣畿輔通志在涿州皆無所徵信考唐書淳風岐山人似應以此為正又西安府志盩厔縣東二里亦有淳風墓楊恂墓通志在扶風縣東北二十里舊美陽城北二里碑字甚竒古李茂貞墓通志在寶雞縣北五里段行琛墓通志在汧陽縣北七十里太尉段秀實父贈揚州大都督段秀實墓通志在汧陽西六十里太平寰宇記在縣西北四十里萬善鄉草僻川西謹按臨潼縣志亦載段秀實墓未知孰是宋凌虛臺一統志在鳳翔縣東北陳希亮守鳳翔時所建宋蘇軾凌虛臺記臺於南山之下宜若起居飲食與山接也四方之山莫髙於終南而都邑之最麗者莫近於扶風以至近求至髙其勢必得而太守之居未嘗知有山焉雖非事之所以損益而物理有不當然者此凌虛之所為築也方其未築也太守陳公杖履逍遙於其下見山之出於林朩之上者纍纍如人之旅行於牆外而見其髻也曰是必有異使工鑿其前為方池以其土築臺髙出於屋之簷而止然後人之至於其上者忱然不知臺之髙而以為山之踴躍奮迅而出也公曰是宜名凌虛以告其從事蘇軾而求文以為記軾復於公曰物之興廢成毁不可得而知也音者荒草野田霜露之所蒙翳狐虺之所竄伏方是時豈知有凌虛臺耶廢興成毁相尋於無窮則臺之復為荒草野田皆不可知也嘗試與公登臺而望其東則秦穆之祈年槖泉也其南則漢武之長楊五柞而其北則隋之仁夀唐之九成也計其一時之盛𢎞傑詭麗堅固而不可動者豈特百倍於臺而已哉然而數世之後欲求其髣佛而破瓦頽垣無復存者既已化於禾黍荆棘邱墟隴畝矣而況於此臺歟夫臺猶不足恃以長久而况於人事之得喪忽往而忽來者歟而或者欲以誇世而自足則過矣蓋世有足恃者而不在乎臺之存亡也既巳言於公退而為之記乂凌虛臺詩才髙多感激道直無往還不知此臺上舉酒邀青山青山雖云逺似亦識公顔崩騰赴幽賞披豁露天慳落日銜翠壁暮雲㸃烟鬟浩歌清興發放意未禮刪是時嵗云暮微雪灑袍斑吏退跡如掃賓來勇躋攀臺前飛雁過臺上雕弓彎聨翩向空墜一笑驚塵寰橋頭寨通志在鳳翔縣東北十五里紹興三十一年吳璘遣别將彭青至寶雞渭河夜劫金人橋頭寨破之井田通志在郿縣東五十里橫渠鎮南張子所畫未就之井田也張子厚墓一統志在郿縣東五十里橫渠鎮父涪州守迪暨弟戩以下四世墓俱在焉金橫水鎮通志在鳳翔縣東三十里金史地理志鳳翔府舊有橫水鎮益店鎮通志在岐山縣東三十五里金史地理志鳳翔府舊有驛店鎮羅局鎮通志在岐山縣東南三十五里金史地理志岐山馬蹟鎮按羅局鎮在馬蹟里蓋即馬蹟鎮元射箭臺一統志在寶雞縣西南十里元憲宗入蜀常駐師於此較射碑刻尚存清風臺一統志在寶雞縣南六十里邱處機所築西倚飛雲壁東臨潄玉溪為一邑最勝處清湫鎮通志在郿縣東二十五里以近清湫水而名至正十四年達魯所築城址尚存二里闕通志在寶雞縣西南四十里古置關遺址尚存元史鄭鼎傳中統初鼎從伐蜀攻二里散關屢立戰功縣志居髙嶺上長亘二里因名乃連雲棧出入必由之路明初設巡檢司於益門鎮嘉靖間遷於此益門鎮通志在寶雞縣西南十五里元末李思齊所築以備川蜀洪武三年蜀將王友仁攻興元守將金興旺請援時徐達在西安即帥師還屯益門鎮陜西既入關平衍千餘里西南抵寶雞復岸然山合惟一隘口始入是為益門鎮秦山嵯峨清江滉漾路惟鳥道雲棧百折達荆梁通滇益名鎮以益義取諸此李思齊墓通志在寶雞縣東三十里明咸宜關通志在隴州西四十里明正統中因關山路阻改咸宜關移巡檢司於此鑿山開道通秦鳳故關廢為鎮通鑑梁貞明六年蜀使王宗儔等將兵伐岐出故關壁於咸宜胡三省注在隴州汧源界臣謹按隴山置關始於西漢自漢迄明雖經三徙然咸因山設險總而名之皆隴關也漢曰大震唐曰安戎明曰咸宜考太平寰宇記安戎宋時已廢後此仍由大震即今隴州西八十里之關山是也前明咸宜置關而大震又廢唐宋以大震為故關而安戎為新關近時則以關山為故關而咸宜為新關雍勝略云左隴山而右汧水面五峰而扼靈谷為秦鳳要害之地信哉本朝大學士党崇雅墓通志在寶雞縣西平原關中勝蹟圖志卷十八
