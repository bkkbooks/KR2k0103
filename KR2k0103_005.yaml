body:
  text: 關中勝蹟圖志卷五陜西巡撫臣畢沅撰古蹟宫闕唐京城唐書地理志上都初曰京城天寶元年曰西京至德二載曰中京上元二年復曰西京肅宗元年曰上都京城前直子午谷後枕龍首山左臨灞岸右抵灃水德宗本紀貞元四年築夾城長安志唐京城東西一十八里一百一十五步南北一十五里一百七十五步周六十七里郭中南北十四街東西十一街其間列置諸坊有京兆府萬年長安二縣當皇城南朱雀門有南北大街曰朱雀門街東西廣百步萬年長安二縣以此街為界萬年領街東五十四坊及東市長安領街西五十四坊及西市天祿識餘咸陽有六岡如乾之六爻唐時宫殿皆在九二岡上而作太清宫於九五岡上百官府在九四岡上明德門六典南面三門中曰明德長安志北當皇城朱雀門南出抵終南山八十里啓夏門六典南面三門中曰啓夏長安志門外西南二里有圓丘先農籍田三壇按長安圖東南角有進芳門安化門六典南面三門西曰安化通化門長安志東面三門北曰通化門至德三載改為達禮門尋復舊春明門六典東面三門中曰春明實録開元十七年五月侍臣以下燕於春明門延興門六典東面三門南曰延興開遠門長安志西面三門北曰開遠門金光門六典西面三門中曰金光唐書韓朝宗傳韓朝宗天寶初為京兆尹分渭水入金光門長安志西出趨昆明池也延平門六典北面一門曰光化門已上京城皇城六典在京城之中其中左宗廟在安上門內之東右社稷在含光門之東百寮𪠘宇列乎其間凡省六寺九臺一監四衛十有八東宫官屬凡府一坊一寺三率府十朱雀門長安志皇城南面三門中曰朱雀門北當宫城之承天門南當外郭之明德門玉海隋志士庶不得雜居朱雀門之內故宗廟官寺兵衛悉在焉安上門長安志朱雀門東曰安上門至德三載改為光天門尋復舊含光門長安志朱雀門西曰含光門定武門安禮門元德門長安志北面三門正北曰定武門次東曰安禮門又東曰元德門即西內東宫北門也巳上皇城西內太極宫唐書地理志宫城在皇城之北長千四百四十步廣九百六十步周四千八百六十步其崇三丈有半長安志宫城東西四里南北二里二百七十步周十三里一百八十步南即皇城北抵苑東即東宫西有掖庭宫玉海龍朔後皇帝常居大明宫乃謂之西內神龍元年改曰太極宫雍録太極宫者隋大興宫也諸帝多居大明宫或遇大禮大事復在太極如髙宗元宗每五日一御太極有初即位不於大明而於太極者知太極尊於大明也雍勝略按西內有三城外一重曰京城外郭城也中一重曰皇城惟列府市不使雜人居止又內一重是曰宫城則今之省城正直宫城之地所謂六爻九二之地也承天門長安志正殿南承天門隋開皇三年作初名曰廣陽門仁夀元年改曰昭陽門唐武德元年改曰順天門神龍元年改為承天門外有朝堂東有胏石西有登聞鼓長樂門重福門一曰重門永春門六典注承天門之東曰長樂門長安志次東門曰重福門即東宫之正門次東曰永春門東北為延喜門廣運門永安門長安志承天門之西曰廣運門內有左右藏庫次西曰永安門通明門嘉猷門長安志西面二門南曰通明門北曰嘉猷門嘉德門長安志太極門外承天門之內曰嘉德門歸仁門納義門長安志嘉德門東廊有歸仁門西廊有納義門太極門長安志當承天門內北曰太極門隋曰大興門後改曰乾福門貞觀八年改為太極門東隅有鼓樓西隅有鐘樓貞觀四年置太極殿唐書髙祖本紀武德元年五月甲子即皇帝位於太極殿六典太極門內曰太極殿朔望則坐而視朝焉注蓋古之中朝也隋曰大興殿武德元年改有東西上二閣門通志東上閣在太極之東西上閣在太極之西左延明門右延明門長安志在太極殿東廊有左延明門西廊有右延明門門下省在左延明門東南中書省在右延明門東南玉海時謂尚書省為南省門下中書省為北省亦謂門下省為左省中書省為右省或通謂之兩省宏文館兩京記在門下省東唐書百官志武德四年置修文館於門下省九年改曰宏文館神龍元年改曰昭文館史館長安志在門下省北貞觀三年置祕書內省以修五代史又置史館以編國史尋廢祕書內省朱明門六典太極殿北曰朱明門左曰乾化門右曰肅章門長安志肅章門西曰暉政門乾化門東曰武德門武德殿延恩殿六典武德門內有武德殿延恩殿兩儀門六典朱明門北曰兩儀門兩儀殿六典兩儀門內曰兩儀殿常日聽朝而視事焉注蓋古之內朝也長安志兩儀殿在太極殿後隋曰中華殿唐貞觀五年改萬春殿六典兩儀殿之東又千秋殿兩儀殿之西又新殿長安志兩儀殿東有新殿獻春門六典兩儀之左又宜秋門兩儀之右宜秋之右曰百福門百福殿長安志百福門內曰百福殿宣宗改雍和宫內有親親樓諸王宴㑹之所也㑹要大中元年勑修百福殿八十間承慶門六典百福之西曰承慶門承慶殿六典承慶門內曰承慶殿立政門六典獻春之左曰立政門立政殿六典立政門內大吉門六典立政之東大吉殿六典大吉門內甘露門六典兩儀殿之北曰甘露門長安志門外有東西永巷東出橫門又東有日華門西出橫門又西有月華門院北有東西千步廊西有掖庭甘露殿長安志甘露門內㑹要太和二年修兩儀殿及甘露殿一百七十二間唐李嶠甘露殿侍宴應制詩月宇臨丹地雲窗網碧紗御筵陳桂醑天酒酌榴花水向浮橋直城連禁苑斜承恩恣歡賞歸路滿烟霞神龍門長安志甘露門左神龍殿長安志神龍門內武德殿後安仁門長安志甘露右安仁殿長安志安仁門內甘露殿西佛光殿長安志神龍殿西歸真觀長安志安仁殿後觀後有綵絲院西有咸池殿淑景殿長安志歸真觀西殿西有第三落次西第四落又次西第五落延嘉殿長安志在甘露殿北殿南有金水河往北流入苑承香殿長安志延嘉北有承香殿通志西有昭慶殿殿西為凝香閣閣西為鶴羽殿景福臺通志延嘉殿西北長安志臺西有望雲亭紫雲閣通志神龍殿東長安志閣西有南北千步廊舍南至尚食院西北盡宫城閣南有山水池尚食內院凝隂殿通志紫雲閣西凌烟閣長安志凝隂殿南南部新書凌烟閣畫功臣皆北向長安志凌烟閣西有功臣閣東有司寶庫毬場亭子一作鞫場亭子長安志凝隂之北有毬場亭子宏文殿觀雲殿通志俱在凝隂殿北四海池雍大記一在毬場亭之東一在咸池殿之東一在望雲亭之西一在望雲亭之北掖庭長安志永安門西有掖庭內侍省長安志掖庭南隅有內侍省興仁門宣猷門崇道門惠訓門昭德門安禮門正禮門宣光門通福門光昭門嘉猷門華光門暉儀門夀安門綏福門翔鳯殿薰風殿就日殿臨照殿望仙殿鶴仙殿乘龍殿翔鳯閣並見六典方位無考巳上西內太極宫東宫門即東宫正門也門外有東宫朝堂在焉宣明門長安志嘉德正南嘉德門長安志明德殿南門東有東奉化門西有西奉化門門外東廊為左永福門西廊為右永福門明德殿長安志東宫正殿㑹要武德九年八月太宗即位於東宫明德殿玉海即顯德殿中宗諱顯為太子時改曰明德長安志殿東廊為左嘉善門西廊為右嘉善門宜春宫宜秋宫長安志俱在明德殿旁宜春門通志宜春宫外門外有典膳厨宜春北苑又宜秋門在宜秋宫外門外道東有命婦院左春坊通典龍朔二年改門下坊為左春坊玉海東宫宜春宫門外有左春坊坊南有崇文館右春坊通典龍朔二年改典書坊為右春坊玉海東宫宜秋宫門外有右春坊崇教殿在明德殿後又麗正殿集賢注記在崇教殿之北光大殿之南長安志開元改為集仙殿十三年改為集賢殿佛堂院通志在麗正殿後東為射殿承恩殿崇文殿崇仁殿八風殿射殿亭子山池左右長林門掖庭宫長安志宫城東西四里南即皇城北抵苑掖庭西門貞觀二年敕左丞戴胄於掖庭西門簡宫人出之按掖庭宫蓋髙祖所起宫人教藝之所也大安宫雍録在宫城外西偏太宗嘗獵昆明池獻獲於大安宫蓋自昆明東歸之路也唐書地理志長安縣有大安宫本宏義宫㑹要武德七年五月營宏義宫初秦王居宫中承乾殿髙祖以秦王有克定天下之功建宏義宫以居之至九年七月髙祖以宏義宫有山林勝境雅好之貞觀三年四月乃徙居之改為大安宫埀拱前殿通志在大安宫戢武殿長安志在大安宫實録太宗與公卿謁太上皇於戢武殿置酒為歡乙夜方散又文思殿長安志在大安宫翠華殿通志在大安宫東北遺址尚存俗云祭酒臺巳上大安宫東內大明宫雍勝略在省城東北今含光殿故基髙四十餘尺去城三里殿基前有翔鳯閣栖鳯閣二基猶存唐書地理志上都大明宫在禁苑東南接京城之北面西接宫城之東北隅長千八百步廣千八十步長安志初髙宗命司農少卿梁孝仁制造此宫北據髙原南望爽塏每天晴日朗望終南山如指掌京城坊市街陌俯視如在檻內雍録大明宫本太極宫之後苑東北面射殿也地在龍首山上太宗初於其地營永安宫以備太上皇清暑九年正月雖嘗改名大明宫然太上皇仍居大安不曽徙入也龍朔二年髙宗染風痺惡太極宫卑下故就修大明宫改名蓬萊取殿後蓬萊池為名也長安五年又改為大明宫長安志叙載其地比太極宫承天門則退北三坊地而中析之以為六坊中六坊地以為丹鳯中門正街可達承天南即朱雀正街矣其百司庶府居民第宅仍依大興都城之舊無所更易故東內大明雖曰創營而朝市悉仍隋舊無所增移也丹鳯門六典南面五門正南曰丹鳯門長安志至德三年改為明鳯門尋復舊名望仙門延政門六典丹鳯門東曰望仙門次曰延政門長安志望仙門貞元中修有樓十間延政門抵長樂坊北建福門興安門六典丹鳯門西曰建福門次曰興安門㑹要故事建福望仙等門昏而閉五更而啓至德中敕晚開元和二年令有司各據班品置待漏院於建福門外長安志望仙建福二門內各有下馬橋跨東西龍首渠太和門日營門長安志太和東面一門日營西面一門元武門銀漢門青霄門長安志北門曰元武門德宗造門樓外設兩廊持兵宿衛謂之北衛元武門左曰銀漢門右曰青霄門唐書兵志貞觀十二年置左右屯營於元武門領以諸衛將軍㑹要神龍元年改元武門為神武制勝樓含元殿六典丹鳯門內正殿曰含元殿㑹要龍朔三年移仗就蓬萊宫新作含元殿長安元年改為大明殿神龍元年復為含元唐書五行志含元路寢大朝㑹之所御也長安志含元殿南去丹鳯門四百餘步中無間隔左右寬平東西廣五百步賈黃中談録殿前龍尾道自平地凡詰曲七轉由丹鳯北望宛如龍尾下垂於地兩垠欄悉以青石為之劇談録龍尾道出於闕前每朝㑹禁軍御仗宿於殿庭金甲葆戈雜以綺繡羅列文武纓珮序立仰觀御座若在雲漢雍録王仁裕曰含元殿前玉階三級第一級可髙二丈許每間引出一石螭頭東西鱗次第二第三級各髙五尺三級以自上而下為次級兩面龍尾道各六七十步方逹第一級皆花磚唐李華含元殿賦維皇髙祖穆端命於元穹萬有千嵗鍾景祚於洪裔建北宫之尊嚴上取法於天帝乃圖正殿之逌居規崇山而定制信神明幽贊而人謀襲契不然何前王曠此之雄麗也先是大司空率其屬執度而相之曰美哉川原騖乎其大哉亘坤靈兮配乾剛坤順乾而為龍舒廣衍兮走羣山紛却面而朝宗陵正陽之奕奕鬱佳氣之葱葱蓋昊天之作而黃祗授元聖獲以造新宫也乃審於龜筮龜筮協從太卜以告神人咸同皇曰欽哉是將宜於朕躬因以鴻稱含元建名易乾卦之說曰含宏光大又曰元亨利貞括萬象以為尊特巍巍乎上京則命徴盤石之匠下荆揚之材操斧執斤者萬人涉磧礫而登崔嵬擇一幹於千木規大壯於喬枚聲坎坎於青雲若神培而顛摧勢動連崖拉風捽雷倒徑梢於窮谷斬巨柢於昭回時也山祗效靈波神作氣為桴為筏羽疊鱗萃朝沉江漢夕出河渭雲奔山撗交積於作宫之地於是農事既收靈臺勿亟子來而就役者周邦畿而薄四海咸忘勞而獻力乃張為廣庭考正極星邦伯是經國工研精剗盤岡以為址太階積而三重因博厚而順髙明築陵天之四墉四墉既列太階如截下上相嶔愕視沉沉其始也星鎚電交於萬堵霜鋸冰解於千尋擁材為山攢杵如林乃占日月之吉以成帝室崇梁徑於中極榱桷楫以礱密析姑繇以為楹隳喬山以為礩飛重簷以切霞炯素壁以留日神標峻摘鬼叠層楣髙卑迭作尋尺相持木從繩而後正棟操宇而不危陛瑩冰級瓦敷鱗差蕩晶景而升降歘睒眥以交輝聳大厦之竒傑勢將頓而復飛爰詔有司練日推時徴考室於周頌㑹公卿以落之丕赫哉如俯如跂若合若離森修邃以窅徼恍岌嶪而巖巍謂衝飈激海兮漩􅞹淪以無底奔雷觸山兮掉巘㠋而傾㩻石鮫拖首於堂廡狀出雲而撐鬐嵩髙之制靈邱上盤鄰斗極之光耀邇天漢之波瀾密鑿柄之吞吐吸山藂而水攢建升龍之大斾邈不至於階端峥嶸孱顔下視南山照燭無間七曜回環㰹欱赫以突兀攄閎宏以蕭榝捧帝座於三辰衝天街於九逹進而仰之騫龍首而張鳯翼退而瞻之岌樹顛而崒雲末嶷兮峩峩巨鱉載仙山而出滄波劃兮煌煌燭龍析穹穴而臨北方排層城而廓帝居豁閶闔而面蒼蒼左翔鸞而右棲鳯翹兩闕而為翼環阿閣以周墀象龍行之曲直夾雙壺以鴻洞啓重閨之呀赩趨堂塗而未半望宸居而纍息惟上聖之欽明爰德政而崇德去雕璣與金玉絀漢京之文飾熾丹雘於崚嶒抗重霄而競色若乃紫微晨曀彤墀夜明雲薄萬栱風交四榮冬止其陽則釋裘而燠夏休其隂則捐絺以清旗獵風而振響葉墜露而成聲懸櫨駢凑竦柱奔列復檻層綴髙窗景熱黭翳日而罘連曤天開而中絶形持神而欲離足慺步而將跌眝昭訓之崇崇瞵光範之揭揭其南則丹鳯啓途遐矚荆吳十扇開閉隂陽睢盱容鼎九扃方駕五車示王者之無外不樹屏於清都望仙闢於巽維建福敞於坤隅偃朱旗而橐元甲屯仡仡之驍夫其後則深闈祕殿曼宇踈楹瑞木交隂元墀砥平鮮風歷廡凌散飄英隂藹武闈增華穆清玉燭內融則嘉盛豐偹太陽照臨而天下文明古有六寢御兹一人今也三朝繇古是因布大命於宣政淡元心於紫宸羲和弭節於通乾望舒停景於觀象密勿旒扆臣人是仰左黃閣而右紫微命伊臯以為長其下則鶡冠魚服良家茂族厲禁非宜金吾領之其前則置兩石以恤刑張三候以興武告善之旌登聞之鼓節晷漏於鐘律架為樓之筍簴以辨內外之差以正東西之序天光流於紫庭倒景入於朱户騰祥雲之郁靄映旭日之葱蘢清渠導於元氣玉樹生於景風平坦數里徘徊無窮羅千乘與萬騎曾不得半乎其中厥初經營天下既又文物未周孤其壯麗蓋重於施勞非不懷也乃眷睿孫睿孫開元萬物宴清而大和掩書契之所論既克廣於崇構聲明偹而益尊蓋聖皇之孝也輝焯變化兮動搖乾坤其東於是宏文教而開館對日華之清閾蓋左學之遺制協前王之講德其西於是延載筆之良史俯月華之峻扉集賢人於别殿朝命婦於中闈王風闡而成化隂教偹而不虧加以咏周詩而展親睦魯衛而敦叙因合族而來宴置更衣之豐宇至於殿內諸曹則左右有局通軒並廡物有恆司供無廢舉又有銀璫珥貂寺人巷伯奉宣出納之令更踐中宫之役熊羆之旅董以龍武矛㦸森森材官羽林聲破邱山氣讋飛沈爪抉千鈞跟騰百尋克壯皇威協比其心其外則校人掌馬天駟在間以偹順逰放牧其間望我鑾和陟彼髙山猶慮憲章或遺國容未偹乃立掌匭之司館通事之吏職在逹下情於上天警王言於有位堧通太極隥指龍池重門內注復道潜移幽峻肅以相屬光彤融以熺熺懸象著明帝座維三皇居設位俯察仰參翼室正中遊宫次南北起含光其容耽耽總而言之如山之夀則曰蓬萊如日之升則曰大明自兹而北燕逰所經逹於苑囿不可殫名周廬更阿匝以環衛南端百仞上極霄際却視㽎崟經途廣深繚以層城黕為重隂至若時雨膏田九農恞暢雲歸山穴倏以昭曠白日麗於宫隅混晶光而益壯於是風師斂威纎埃不升穎絶搖芒葉無翻稄自中徂外鏡洗川澄弦直閭閈井畫溝塍靡迤秦山陂陀漢陵知稼穡之艱難見皇王之廢興及乎元冥戒寒海神飛雪瑶城粉野琪樹森列玉宇凝階雲門露闕天華爽霽朗日朝徹赤旌降庭朱柱艷月仰白帝而金精開據河宫而銀燭發其或遠方不至帝用興戎降元帥於天上發神謀於禁中皇靈震耀殄厥渠凶矯矯武臣此焉獻功操俘馘以陳器械恢莫大之威容爾乃時殷仲冬日正南至上公奉斚羣后在位一人夀昌萬國承賜式燕以樂欣欣且醉乃撞宫懸砅碣天地及乎獻嵗元辰東風發春懸法象魏與人惟新儼文物於王庭兼九伐而宿陳威儀之嚴嶽嶽振振若太一披絪緼而俯百神既而咸造勿褻㑹朝清明璿柄指寅寢闈發扃皇帝御衮龍之法服佩蒼璧之純精執鎮圭導朱紘降輦登階微聞玉聲於是典禮之官贊王就位南面穆然至若甸侯采衛要荒閩貊輸其方賮罔不來格統以千官六卿二伯司儀叙進象胥重譯肅肅委皮乾乾尊璧設以庭燎天烘地赫雷鼓殷殷朱干玉戚神簴如生熊羆愕眙危昂歇向歊爛噴射金根玉輅太常少伯火烈門旗霜交陛㦸乃進元元以觀禮珿億兆之增增金吾南首麾之以肱遞攀援而聳仰齊屢企而冠騰太史來告卿雲勃興灑豐澤於生人若上元之休徴申命司寇緩刑冡卿降德秩山川而問耆老周雨露而均邦國明良竭歡喜氣闐塞揭金雞於太清炫晨光於正色慶欣之聲不踰晨而靁四域當斯時也驅風驟漢於廓煥爛王臨於朝天地貞觀靈宫巖巖上下交贊蓋所以法乾道而遵帝度豈惟安體而明威者哉夫瑶臺之美不可以型萬國土階之陋不可以儀天下奢不孫而儉固允執中於大位洪範曰皇建其有極富哉上聖之宏議也詩歌楚室頌美泮宫諸侯之事也雲夢甘泉宴談景福辟王之志也論諸侯曷若以戴天子嘉辟王曷若以尊聖人烈烈盛唐祖武宗文五帝赧德六王慚勛而政本乎慈用過乎儉夫蒼生所奉者惟君所愛者惟親寧有君親宅體於卑室而臣子得安其身乎故有熊明庭帝堯總期從人欲也天埀定星易有大壯君人法焉聖朝猶斥其華而憑其質今為是殿也惟鐵石丹素無加飾焉身居元眇心與萬姓同畎畝之勞以是臨衆何衆不賔以是享神何神不若雖欲宫崑崙而館不周城八極而隍四海猶未足儲鴻猷而俯丕耀豈咸鎬一京之所能極哉策四瀆之前嵗敕懷鉛之小臣俾讎書於禁中正百代之遺文由是循環天造耳目日新敢頌成功告於神明無愧斯干之什式昭聖德之容頌曰帝作含元含元言言崒若日觀呀為天門太階三層逺法崑崙鎮兹秦野揭以周原烈文祖宗永錫孝孫孝孫有慶於以施令奄甸萬姓受天休命歌之頌之管磬宜之穆穆皇君夀考無期既成斯文客有勸之上者對曰前王之宏祥詭瑞乃聖朝之細事今休徴已厭於聰明頌聲亦飫於天意夫私歌竊忭乃臣子之常志又焉足以薦聞哉客曰不然今至尊明發不寐永懷先皇周文之孝也克恭克讓光溢海內帝堯之謙也自即位以來上下之休嘉臣人之詠歌歌於睿躬則固辭頌於宗廟則無斁今吾子之文昭乎纍聖之耿光美於大君之孝德可進而退宜言而默使雅頌之音卷而不舒猶坦蕩其胸臆無乃過歟為人之下者冇可逹乎君親雖濵於死亦冒行之况宗廟或啓其心乎臣華嘗聞遷善之規願附升歌之未翔鸞閣栖鳯閣長安志含元殿東南有翔鳯閣西南有栖鳯閣六典夾殿兩間左曰翔鸞右曰栖鳯注與殿飛廊相接閣下即朝堂肺石登聞鼓如承天之制鐘樓鼓樓長安志殿東南西南有鐘鼓樓又有金吾左右仗院通乾門觀象門六典注夾道東有通乾門西有觀象門唐書儀衛志百官序班於通乾觀象門宣政門六典含元殿北曰宣政門唐書儀衛志百官入宣政門文班自東門入武班自西門入長安志朝堂東廊有齊德門西廊有興禮門宣政殿六典宣政門內曰宣政殿兩京記含元殿後有宣政殿即正衙殿也朔望大册拜則御之長安志宣政殿東有東上閣門西有西上閣門日華門長安志宣政殿前東廊曰日華門門下省長安志日華門東雍録名左掖亦名東省通志省東有宏文館待制院雍録閣本圖待制院在宣政殿之東少陽院之西蓋倣漢世待詔而立此官稱也武后名曌故凡詔皆改為制而待詔亦改待制也少陽院雍録長慶元年於門下省東少陽院築牆及樓觀史館長安志宏文館西自門下省少陽院史館皆南出含耀門東出昭訓門北入崇明門月華門長安志宣政殿前西廊曰月華門中書省在月華門一名右掖亦名西掖南出光範門西出昭慶門北入光順門政事堂雍録在東省屬門下至中宗時裴炎以中書令執政遂徙政事堂於中書省杜甫為左拾遺作紫宸殿退朝詩有云宫中每出歸東省㑹送䕫龍集鳯池鳯池者中書也杜為左拾遺在肅宗時則政事堂已在中書天故出東省而集西省者就政事堂見宰相也御史北臺按舒元輿御史臺中書院記云御史府故事於中書之南常有理所太和四年於政事堂直阡之南選地以作之號中書南院院門北闢嚮朝廷也觀者命為御史北臺殿中內省長安志中書省北曰殿中內省通志內省西有命婦院北有親王待制院延英門六典宣政之右西上閣次西曰延英門延英殿六典延英門內之左玉海按六典㑹要延英在西上閣之西而李庚賦乃曰左閣當宸誤矣㑹要憲宗元和十五年詔於西上閣門西廊西畔開便門以通宰相自閣中赴延英路則不在紫宸東矣長安志肅宗時梁上生玉芝一莖三花僖宗改為靈芝殿自蜀還復舊名尚書故實延英靈芝殿也謂之小延英苗韓公居相位以足疾步驟微蹇上每於此待之含象殿六典延英門內之右紫宸門六典宣政殿北紫宸殿六典紫宸門內即內朝正殿也雍録宣政前殿也謂之衙衙有仗紫宸便殿也謂之入閣其不御前殿而御紫宸也乃自正衙喚仗由閣門而入百官候朝於衙者因隨以入見故謂之入閣乾符已後因亂禮闕天子不能日見羣臣而見朔望故正衙常日廢仗而朔望入朝有仗其後習見遂以入閣為重至出御前殿猶謂之入閣明義殿長安志在紫宸殿西蓬萊殿六典紫宸殿北玉海東有綾綺殿浴堂門雍録紫宸殿東浴堂殿玉海館本圖在綾綺殿南珠鏡殿通志在綾綺殿東長安志東北有大角觀還周殿清暉閣兩京記蓬萊殿西承歡殿長安志在還周南唐宗楚客奉和人日清暉閣宴羣臣遇雪應制詩窈窕神仙閣參差雲漢間九重中葉起七日早春還太液天為水蓬萊雪作山今朝上林樹無處不堪攀金鑾殿兩京記還周北雍録金鑾坡者龍首山之支隴隱起平地而坡陀靡迤者也其上有殿名為金鑾在蓬萊山西微南通志殿西南有金鑾御院東學士院雍録韋執誼故事云置學士院後又置東學士院於金鑾殿之西謹按㑹要有東翰林院在金鑾殿之西即此長安殿兩京記在金鑾殿西南蓬萊殿西殿北有仙居殿仙居西北有麟德殿此殿三面故以三殿名南有閣東西皆有樓殿北相連各有障日閣內宴多在於此雍録三院即三殿也結璘樓即三殿之西廊也鬱儀樓即三殿之東廊也鬱儀又東即寢殿矣鬱儀結璘皆重廊翰林院學士院皆在三殿西廊之外仙居殿後有拾翠殿杜甫詩賦詩拾翠殿東亭㑹慶亭通志在麟德殿北含凉殿長安