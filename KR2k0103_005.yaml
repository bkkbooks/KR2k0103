漢離宫宫樹行行浴殿空武帝舊時人欲盡青山空閉御牆中崔魯華清宫詩門橫金鎖悄無人落日秋聲渭水濵紅日下山寒寂寂濕雲如夢雨如塵北門長安志華清宫北向正北門外有左右朝堂相對有望仙橋左右講武殿津陽門長安志宫北正門之內曰津陽門門外有宏文館唐鄭嵎津陽門詩并序津陽門者華清宫外闕南局禁闈北走京道開成中嵎常下帷於石甕僧院多聞宫中陳迹今年冬自虢來暮及山下因解鞍謀餐客旅邸而主翁年且艾自言及事明皇夜闌酒餘復為嵎道承平故事翼日於馬上輒裁刻俚叟之語為長句七言詩凡一千四百字成一百韻津陽門北臨通逵雪風獵獵飄酒旗泥寒欵段蹶不進疲童退問前何為酒家顧客催解裝案前羅列樽與巵青錢瑣屑安足數白醪軟美甘如飴開壚引滿相獻酬枯腸渴肺忘朝饑愁憂似見出門去漸覺春色入四肢主翁移客桃華燈雙肩隱膝烏帽欹笑云鮐老不為禮飄蕭雪鬢雙埀頤問余何往凌寒曦顧翁枯朽郎豈知翁曽豪盛客不見我自為君陳昔時時平親衛號羽林我才十五為孤兒射熊搏虎衆莫敵彎弧出入隨佽飛此時初創觀風樓簷髙百尺堆華榱樓南更起鬭雞殿晨光山影相參差其年十月移禁仗山下櫛比羅百司朝元閣成老君見㑹昌縣以新豐移幽州曉進供奉馬玉珂寶勒黃金羈五王扈駕夾城路傳聲校獵渭水湄羽林六軍各出射籠山絡野張罝維雕弓繡韣不知數翻身滅沒皆蛾眉赤鷹黃鵠雲中來妖狐狡兔無所依人煩焉殆禽獸盡百里腥腥禾黍稀暖山度獵東風微宫娃賜浴長湯池刻成玉蓮噴香液潄回烟浪深逶迤犀屏象薦雜羅列錦鳬繡雁相追隨破簮碎鈿不足拾金溝殘溜和纓緌上皇寬容易承事十家三國爭光輝繞牀呼盧恣樗博張燈逹晝相謾欺相君侈擬縱驕橫日夜秦虢多遊嬉朱衫馬前未滿足更驅武卒羅旌旗畫輪寶軸從天來雲中笑語聲融怡鳴鞭後騎何蹀躞宫粧襟袖皆仙姿青門紫陌多春風風中數日殘春遺驪駒吐沫一奮迅路人擁篲爭珠璣八姨新起合歡堂翔鵾賀燕無由窺萬金酬工不肯去矜能恃巧猶嗟咨四方節制傾附媚窮奢極侈沽恩私堂中特設夜明枕銀燭不張光鍳帷瑶光樓南皆紫禁梨園仙宴臨花枝迎娘歌喉玉䆗窱蠻兒舞席金葳蕤三郎紫笛弄烟月怨如别鶴呼羈雌玉奴琵琶龍香撥倚歌促酒聲嬌悲飲鹿泉邉春露晞粉梅檀杏飄朱墀金沙洞口長生殿玉蘂峯頭王母祠禁庭術士多幻化上前較勝紛相持羅公如意奪顔色三藏袈裟成散絲蓬萊池上望秋月無雲萬里懸清輝上皇夜半月中去三十六宫愁不歸月中祕樂天半聞丁璫玉石和塤箎宸聰聽覽未終曲却到人間迷是非千秋御節在八月㑹同萬國朝華夷花蕚樓南大合樂八音九奏鸞來儀都盧尋橦誠齷齪公孫劍伎方神竒馬知舞徹下牀榻人惜曲終更羽衣祿山此時侍御側金雞畫仗當罘罳繡祤衣褓日屓屭甘言狡計愈嬌癡詔令上路建甲第樓通走馬如飛翬大開內府恣供給玉缶金筐銀簸箕異謀潜熾促歸去臨軒賜帶盈十圍忠臣張公識逆狀日日切諌上弗疑湯成召浴果不至潼關己溢漁陽師御街一夕無禁鼓玉輅順動西南馳九門回望塵坌多六龍夜馭兵衛疲縣官無人具軍頓行宫徹屋屠雲螭馬嵬驛前駕不發宰相射殺寃者誰長眉鬒髮作凝血空有君王潜涕洟青泥坂上到三蜀金堤城邊止九旗栘文泣祭昔臣墓度曲悲歌秋雁辭明年尚父上捷書洗清觀闕收封畿兩君相見望賢頓君王鼓舞皆㱆欷宫中親呼髙驃騎潜令改葬楊真妃花膚雪艷不復見空有香囊和淚滋鑾輿却入華清宫滿山紅實垂相思飛霜殿前月悄悄迎春亭下風颸颸雪衣女失玉籠在長生鹿瘦銅牌垂象牀塵凝罨颯被畫簷蟲網頗梨碑碧菱花覆雲母陵風篁雨菊低離披真人影帳偏生草果老藥室空掩扉鼎湖一日失弓劍橋山烟草俄霏霏空聞玉碗入金市但見銅壺飄翠微開元到今踰十紀當初事迹皆殘隳竹花唯養棲梧鳯水藻周遊巢葉龜㑹昌御宇斥內典去留二教分黃緇慶山汙瀦石甕毁紅樓緑閣皆支離竒松怪柏為樵蘇童山眢谷忘嶮巇烟中壁碎摩詰畫雲間字失元宗詩石魚巖底百尋井銀牀下卷紅綆遲當時清影映紅葉一旦飛埃埋素規韓家燭臺倚林杪千枝燦若山霞摛昔年光彩奪天月昨日銷鎔當路岐龍宫御榜髙可惜火焚牛挽臨﨑峗孔雀松殘赤琥珀鴛鴦瓦碎青琉璃今我前程能幾許徒有餘息精力羸逢君話此空灑涕却憶歡娛無見期主翁莫泣聽我語寧勞感舊休吁嘻河清海宴不難覩我皇己上升平基湟中土地昔湮沒昨夜收復無瘡痍單于北走棄青塜戰馬西奔空月支喜逢堯年豈易偶願翁頤養豐膚肌平明酒醒便分手今夕一樽翁莫違開陽門長安志宫之東面正門也門外有宜春亭望京門長安志宫之西面正門也門外近南有御交道上嶺通望京樓望昭陽門長安志宫之南面正門也今謂之山門門外有登朝元閣路本唐之御輦便路也瑶光樓長安志津陽門之東曰瑶光樓樓南有小湯臨潼縣志小湯之西有梨園飛霜殿長安志瑶光樓南曰飛霜殿寢殿也白少傅以長生殿為寢殿非也御湯九龍殿長安志在飛霜殿之南亦名蓮花湯明皇雜録元宗幸華清新廣湯池制作宏麗安祿山於范陽以白玉石為魚龍鳬鴈石梁石蓮花以獻雕鐫巧妙殆非人工上大悅命陳於湯中仍以石梁橫亘其上而蓮花才出水際上因幸解衣將入而魚龍鳬鴈皆若奮鱗舉翼狀欲飛去上甚恐遽命撤去而蓮花石至今猶存焉賈氏談録湯池凡一十八所第一是御湯周回數丈悉砌以白石瑩徹如玉面皆隱起魚龍花鳥之狀四面石坐階級而下中有雙白石蓮泉眼自甕口中湧出噴注白蓮之上唐元宗惟此溫泉是稱愈疾豈豫獨受其福思與兆人共之乘暇巡逰乃言其志桂殿與山連蘭湯湧自然隂崖含秀色溫谷吐潺湲績為蠲邪著功因養正宣願言將億兆同此共昌延張說奉和聖製溫泉言志應制詩溫谷媚新豐驪山橫半空湯池薰水殿翠木暖烟宫起疾逾仙藥無私合聖功始知堯舜德心與萬人同盧象駕幸溫泉詩傳聞聖主幸新豐清蹕鳴鑾出禁中細草終朝隨步輦埀楊幾處繞行宫千官扈從驪山北萬國來朝渭水東此日小臣徒獻賦漢家誰復重揚雄王維和太常韋主簿五郎溫湯寓目之作漢主離宫接露臺秦川一半夕陽開青山盡是朱旗繞碧澗翻從玉殿來新豐樹裏行人度小苑城邊獵騎回聞道甘泉能獻賦懸知獨有子雲才皇甫冉溫泉即事詩天仗星辰轉霜冬景氣和樹含溫液潤山入繚垣多丞相金錢賜平陽玉輦過魯儒求一謁無路獨如何陸龜䝉湯泉詩暖殿流湯數十間玉渠香細浪回環上皇初解雲衣浴珠櫂時敲琴瑟山羅鄴溫泉詩一條春水潄莓苔幾繞元宗浴殿回此水貴妃曽照影不堪流入舊宫來玉女殿長安志今名星晨湯南有玉女殿北有虛閣閣下即湯泉二玉石甕湯所出也三秦記驪山湯舊說以三牲祭乃得入可以去疾消病不爾即爛人肉俗云始皇遇神女戲不以禮神女唾之生瘡始皇怖謝為出溫泉洗除後人因以為驗日華門臨潼縣志由蓮花湯而西曰日華門門之南曰太子湯長安志太子湯次西少陽湯少陽湯次西尚食湯尚食湯次西宜春湯臨潼縣志宜春湯有前殿後殿又西曰月華門笋殿臨潼縣志月華門之內有笋殿雍録殿側有魏溫泉頌碑其石瑩徹見人形影宫人號玻璃碑謹按碑今移置山下靈泉觀中長湯臨潼縣志笋殿北有長湯十六所津陽門詩注宫內除供奉兩湯外而內外更有十六所長湯每賜諸嬪御其修廣與諸湯不侔甃以文瑶密石中央有玉蓮捧湯泉噴以成池又縫綴錦繡為鳬鴈致於水中上時於其間泛鈒鏤小舟以嬉逰焉芙蓉湯臨潼縣志一名海棠湯在蓮花湯西沈埋已久人無知者近修築始出石砌如海棠花俗呼為楊妃賜浴湯七聖殿臨潼縣志芙蓉湯北有七聖殿長安志神堯太宗髙宗中宗睿宗明皇肅宗皆立衣袞衣繞殿石榴皆太真所植南有功德院其間瑶壇羽帳皆在焉順興影堂果老藥室亦在禁內宜春亭雍録在開陽門外重明閣長安志四聖殿北倚欄北瞰縣境如在諸掌閣下有方池中植蓮花池東鑿井盛夏極甘泠邑人汲之四聖殿重明閣之南殿東有怪柏長生殿長安志齊殿也有事於朝元閣即齊沐此殿山城內多馴鹿有流澗號鹿飲泉金沙洞玉蘂峯皆元宗命名洞居殿之左玉蘂峯上有王母祠朝元閣賈氏談録在北山嶺之上基趾最為峻絶次東即長生殿故基册府元龜天寶七載十二月元元皇帝降於朝元閣改為降聖閣雍録閣南有連理木丹霞泉唐儲光羲降聖觀詩一山盡天苑一峯開道宫道花飛羽衛天鳥游雲空玉殿俯元水春旗搖素風夾門小松柏覆井新梧桐自昔大仙下乃知元化功神皇作桂館此意與天通宋杜常朝元閣詩行盡江南數十程曉風殘月入華清朝元閣上西風急都入長楊作雨聲老君殿長安志朝元閣南有老君殿玉石為像製作精絶鐘樓雍録朝元閣之東明珠殿雍録長生殿之南近東也望風樓津陽門詩注樓在宫外東北隅屬夾城而逹於內前臨馳道周視山川鬭雞殿雍録在觀風樓之南殿內有按歌臺南臨東繚牆長安志殿北有舞馬臺毬場長安志宜春亭之北門外曰毬場其西曰小毬場羯鼓樓長安志在朝元閣東近南繚牆之外巳上華清宫萬全宫㑹要儀鳯三年於藍田作凉宫名萬全宫永淳二年廢唐書髙宗本紀永淳元年七月作萬全宫龍躍宫雍勝略唐髙祖舊宅在髙陵縣西十四里武德六年以奉義宫改建髙祖其先本成紀人後魏時王大父熙為金門鎮將戍武川因家焉祖虎伐魏有功封唐國公父昞襲爵生髙祖於長安則龍躍宫或昞别宅抑或髙祖離宫乎德宗改為修真觀中有神堯御容及御井霜柏梁開平中廢但龍泉寺在其旁或因是而名今其地稱李觀所存乃卧龍寺遊龍宫雍勝略在渭南縣西十一里唐開元中修按兩京道里記云取黑龍飲渭名之白樂天有黑龍飲渭賦武平一登驪山詩有日下黑龍川句亦謂此也關中勝蹟圖志卷五
