流入於漢漢水又西南徑通谷合通谷水謹按今州北百二十里有燕子河疑即通谷水然無可考又西南寒水注之謹按今州南六十里有西流河一名韓溪皆以為即古之寒水然與水經注入漢之序不合又西徑石亭戍廣平水東南流注之元和郡縣志嘉陵江經金牛縣西去縣三十里謹按金牛故城在州東北太平寰宇記嘉陵江在三泉縣西半里謹按三泉故城在州西北廣平河在寧羌州西北陽平關西通志其水南入嘉陵江水經注廣平水西出百頃川東南流注漢漢水在寧羌州東北通志一名漾水一名沔水東南流入沔縣界水經注山海經所謂漢出鮒鰅山也東北流得獻水口漢水又東北合沮口同為漢水之源宋陸遊文集嘗登嶓冢山有泉涓涓出山間是為漢水之源即安國傳所謂泉始出山為漾者也謹按漢水始出為漾合沮為沔東流為漢蜀道驛程記出沔縣西門曲折行亂山中沔水流經其中西涉沮水抵大安驛沔沮之間濶者未丈許狹者才二三尺沙石磷磷深不沒踝自大安西南亂山益稠至金牛驛北望嶓冢峩然雲表一小水自西東流即所謂嶓冢導漾者也水才濫觴不沒鳬堆合五丁峽水東流為沔其流始大又自寧羌州行十里渡水過百牢關關下有分水嶺嶺東水皆北流至五丁峽北合漾水入沔嶺西水皆南流徑七盤關龍洞合嘉陵水為川江臣謹按嶓冢有二漢水亦有二其出秦州嶓冢山歷禮縣成縣南流入略陽縣經寧羌州而西入四川廣元縣界者此嘉陵江之正源西漢水是也其出寧羌州嶓冢山東流經沔縣褒城南鄭城固洋縣之南西鄉縣之北又東經石泉縣南乃折而南經漢陰及紫陽縣之西復折而東出興安州之北又東經洵陽縣南白河縣北而入湖廣鄖陽府界者此即禹貢嶓冢導漾東流為漢之漢水也夫隴西嶓冢非禹功所及而西漢水亦無漾沔之名其以秦州嶓冢及漢水繫之禹貢者誤自班固漢書地理志而常璩華陽國志桑欽水經酈道元注皆因之而不能辨近時惟胡渭禹貢錐指始以嶓冢漢水之在寧羌者為應經義其説允為可從文繁不能具載著其大指如此瀕倉河在寧羌州東北九十里通志徑鐵佛寺東流四十里入漢一名東流河謹按即沔縣之三泉水玉帶河在寧羌州城北通志源發州南箭竹嶺流徑城西而北而東復會於東南盤曲若圍帶然故名又東至沔縣入漢又有洄水河在州西二十里曲折南流十五里合於玉帶河蓮花池在寧羌州西門外府志南山如屏障小山聨絡如畫灘聲清響如雜絲竹七里堰在寧羌州西南七里通志堰洄水灌田千餘畝己上寧羌關中勝迹圖志卷二十一
