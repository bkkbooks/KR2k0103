body:
  text: 關中勝迹圖志卷二十一陜西巡撫臣畢沅撰大川附水利漢中府漢水在南鄭縣南三里自褒城界流入又東入城固界書孔傳沔至漢中東流為漢水水經注漢水自合褒水又東徑漢廟堆下又東過南鄭縣南合廉水又右合池水又東得長柳渡元和郡縣志漢水經縣南去縣一百步褒水在南鄭縣西二十里自褒城界來南流至龍江鋪西小柏鄉入漢通志一名黑龍江詳見褒城廉水在南鄭縣西南四里自褒城界來東北流入於漢魏書地形志華陽縣有廉水水經注廉水出巴嶺山北流徑廉川故水得其名又北注漢水太平寰宇記龍岡山北有廉津廉水所經老渚河在南鄭縣南十里通志即池水源出籠蓋山經城東南十五里北流入漢漢書地理志旱山池水所出東北入漢水經注池水出旱山夾溉諸田散流左注漢水太平寰宇記旱山下有石池即池水之源謹按池水本出旱山通志又謂出籠蓋山蓋有二源矣壻水在南鄭縣西北又東流入城固界通志即左谷水一名聽水又名智鄉水水經注左谷水出漢北即智水也北發聽山山下有穴水穴水東南流歷平川中謂之智鄉水謹按六朝人壻字皆書作聓智水智鄉疑即聓水聓鄉以傳寫而訛也湧泉在南鄭縣北六十一里天臺山雍勝略其泉地中行人於泉上甃一井深一尺五寸水深四寸常取此水禱雨以瓶著井水自湧起注瓶中故名山河大斜堰在南鄭縣西二十里通志褒城山河第二堰水東流過小斜堰入縣界首築此堰與褒邑分水灌溉又東五里為柳葉洞謹按大斜堰與柳葉洞皆與褒邑共灌田畝下則專灌南鄭又東為豐立洞謹按豐立柳葉二洞相連故不著里數又東八里為羊頭堰又東五里為度通堰又東三里為小林洞又東二里為燕兒窩堰又東一里為紅岩子堰又東二里為薑家洞又東二里為營房洞又東半里為李堂洞又東半里為李官洞自褒城縣金華堰至此為上壩第二堰水又東流一里為高橋洞引水東南流分為三溝曰中溝東溝南溝又東一里為小王官洞又東半里為大王官洞又東一里為康本洞又東半里為陳定洞又東半里為祁家洞又東半里為花家洞又東半里為何棋洞又東半里為高洞子又東半里為東柳葉洞又東半里為伍家水口又東半里為吳家水口又東半里為王家水口又東為聶家水口又東至三皇川設木閘以節水分渠七首曰北高渠次麻溝渠次上中溝渠次北高拔洞渠次南低中溝渠次柏楊坪渠次南低徐家渠自高橋洞至此為下灞凡灌田三萬九千四百餘畝又東溝自褒城任頭堰分山河第三堰水灌田千九百餘畝廉水馬湖堰在南鄭縣西南八十里通志引廉水灌田堰首在褒城境東流一里入縣界其下流仍入褒城界廉水又東北流為野羅堰堰首在褒城境流三里入縣界又東北為馬嶺堰堰在縣境其下流入褒城界又東北為流珠堰堰首在褒城境流五里入縣界又東北為鹿頭堰堰首在褒城境流五里入縣界又東北為石梯堰堰首在褒城境流五里入縣界又東北為楊村堰堰首在褒城境流三里入縣界凡灌田一萬四千餘畝黃土堰在南鄭縣東南二十里通志引觀溝河水作堰分東西二溝共灌田三千六十畝已上南鄭褒水在褒城縣東一里一統志其上流為紫金水下流曰黑龍江通志亦名山河史記河渠書孝武時欲通褒斜道及漕事拜御史大夫張湯子卭為漢中守發數萬人作褒斜道五百餘里道果便近而水多湍石不可漕漢書地理志武功縣褒水出衙嶺山至南鄭入沔水經注褒水西北出衙嶺山東南徑大石門歷故棧道下谷又東南徑三交城城在三水之會一水北出長安一水西北出仇池一水東北出太白山是城所名矣褒水又東南得丙水口又東南歷小石門又南歷褒口又南徑褒縣故城東又南流入於漢括地志褒水出褒城縣西北九十八里衙嶺山與斜水同源而派分輿地紀勝山河水即褒水出太白山又有石鼓在縣北四十里褒水中擊之有聲又有將軍石亦在水中入谷十五里有石如兜鍪然又有白玉盆亦在水中大石光白其中可實五斗方輿勝覽紫金水在河池縣北一里源出太白山沿流至鳯縣武休關入漢中為山河堰即褒水也縣志褒水在縣東門外南流出褒谷至縣南二十里入漢江曰兩河口武關河在褒城縣北百四十里通志一名石溝河自鳯縣流徑武休關東合於褒水水經注所謂一水西北出仇池蓋指此也謹按褒水當以出太白山者為正源而武關河則褒水之别源也丙水在褒城縣西北水經注丙水上承丙穴下注褒水太平寰宇記丙水源出縣西北牛頭山輿地紀勝大丙水源出黃崖嶺下廉水在褒城縣西南百二十五里通志源出巴州密谷東北徑雙乳山又北徑中梁山南東北至南鄭界入漢又讓水在縣西南百三十里一名遜水范柏年對宋明帝臣鄉有廉泉讓水是也仙人溝在褒城縣北八十里通志山徑逶迤林朩蓊翳其境甚幽鶴騰泉在褒城縣西南六十里通志源出中梁山由二穴湧出南注漢中有石梁天成平分兩渠餘水還峽中下注鶴騰澗為瀑布焉山河堰在褒城縣東引褒水灌田一統志蕭何始立為二堰輿地紀勝蕭何始立為堰後乃語訛為山河曹參落成之諸葛亮軍駐漢中踵迹增築至宋復壞吳玠吳璘相繼修治廣溉民田宋史河渠志嘉祐中史照奏上堰法刻石堰上乾道七年吳珙修六堰濬大小渠六十五宣力最多通志褒水入縣南流至雞頭關下築堰截水第一堰名鐵樁堰在縣北三里今廢褒水南流三里許至縣東門外為第二堰乃山河堰之正身也堤長三百六十步其下植柳築坎名曰柳邊堰分水灌田首為高堰子又東流三里為金華堰支分小堰七曰雞翁堰沙堰周家堰崔家堰何家堰劉家堰跨槽堰又東三里為舞珠堰支分小堰五曰魯家堰鄧家堰朱家堰瞿家堰白火石堰又東五里為小斜堰又東一里為大斜堰又東五里為柳葉洞謹按大斜堰柳葉洞與南鄭分水灌溉凡溉縣境田三千六百七十餘畝第三堰在城南五里流二里至三橋洞分兩派西流者為西溝東流者為東溝東溝東流七里許至任頭堰又分二派西為西渠其東流者入南鄭界凡溉縣境田六百餘畝謹按山河堰古刻云巨石為主鎖石為輔橫以大木植以長樁又楊絳記云堰導褒水限以石順流而疏之自北而西者注於褒城之野行於東南者悉歸南鄭之區廉水馬湖堰在褒城縣西南一百里通志自縣境梁家營築堰南流入南鄭界又流一里入縣界又東北流二十里為野羅堰堰在縣境下流入南鄭界又東北流三里為馬嶺堰堰首在南鄭境又東北流三里為流珠堰堰在縣境流五里入南鄭界又東北流六里為鹿頭堰堰在縣境流五里入南鄭界又東北流為石梯堰堰在縣境流五里入南鄭界又東北流為楊村堰流三里入南鄭界謹按石梯楊村堰首雖在褒邑而所溉皆南鄭田褒邑不沾其利凡溉縣境田四千五百六十餘畝已上褒城漢水在城固縣南四里自南鄭界流入又東入洋縣界水經注漢水自長柳渡又東右會盤余水又東左會文水又東黑水注之又東過城固縣南又東過安陽縣南涔水出自旱山北注之又左合壻水謹按安陽故城在縣東南沙河在城固縣西南三十里通志即盤余水源出巴山北流入漢水經注盤余水出南山巴嶺上泉流分兩南入蜀水北注漢津謂之盤余口又小沙河在縣南十里源出縣東南曹林壩北流入漢文川水在城固縣西北四十里水經注文水即門水也出北山石穴中長老云杜陽有仙人宫石穴宫之前門故號其川為門川水為門水雍勝略文水兩水合流有如文字宋范柏年對明帝臣鄉有文川武鄉即此黑水在城固縣西北五里水經注黑水出北山南流入漢庾仲雍曰黑水去高橋三十里諸葛亮箋云朝發南鄭暮宿黑水四五十里指謂是水也括地志黑水源出梁州城固縣西北太山元和郡縣志同臣謹按方輿紀要謂黑水即褒水以褒水一名黑龍江為證然核其地理褒城在南鄭之西城固在南鄭之東褒水發源褒城西北之衙嶺山南流至南鄭之小柏鄉己入於漢乂安得以發源城固之黑水而即指為褒水乎今不取其説涔水在城固縣南通志一名鬵谷水漢書地理志安陽縣鬵谷水出西南北入漢水經注涔水即黃水也出南鄭縣旱山東北流徑城固南城北右岸有悅歸館水歷其北又北至安陽入沔謹按禹貢錐指顔師古曰鬵音潛其字亦或從水涔灊古字通或以為禹貢之潛非是又按史記沱潛之潛皆作涔壻水在城固縣東北六里通志一名北水河自南鄭界來南流入漢水經注唐公房升仙之日壻行未還約以此川為居因號曰壻鄉故水亦即名焉又南歷壻鄉溪東南流徑通關勢南又東徑七女冢又徑樊噲臺南又東南徑大城固北東回南轉又徑其城東而南入漢水謂之三水口府志壻水源出太白山東流徑縣北又東南入漢又有上中下清溪在縣北七十里源出馬盤山南流合於壻水之溪在城固縣北五十里通志瀠洄曲折如之字故名明月池在城固縣東北水經注壻水東徑七女冢水北有七女池池東有明月池狀如偃月皆相通注謂之張良渠蓋良所開也雍勝略明月池中有臺相傳為漢高祖所築又有七女池按漢中記曰昔人無男養七女父沒女於此負土為冢遂成此池壻水渠高堰在城固縣西北四十里通志引壻水灌田南流繞慶山而出於山下築一堰為百丈堰堰常有暴水衝淤明萬厯間知縣高登明建石橋以閘暴水仍於兩岸築堤渠道遂無所患壻水又東為五門堰堰有五門以泄山水元至正間建前明及本朝康熙間先後修築分水車九輛及七洞以溉田壻水又南為楊填堰謹按宋楊從義於河內填成此堰因名堰截壻水按亦名截河堰東南流為幫河堰又東南流有六洞及鵝兒堰新堰而入洋縣界凡溉縣境田三萬六千八百餘畝北沙河上官堰在城固縣西三十里通志引北沙河水於東岸作堰又南流西岸有西小堰又南流西岸有棗兒堰凡溉田三千七百餘畝謹按北沙河即文川水馬理陜西通志乂有鄒公橫渠二堰今無考南沙河萬夀堰通志在城固縣西南四十五里引南沙河於東岸作堰河水又北流五里西岸有上盤堰古名盤蛇堰稍下為下盤堰又北流五里東岸有新堰稍下為平沙堰又北流五里西岸有沙平堰稍下為蓮花堰又北流十里東岸有倒流堰凡溉田七千一百餘畝小沙河東流堰在城固縣南五里通志在東岸故名東流其在西岸者曰西流堰凡灌田七百餘畝謹按馬理陜西通志縣南引小沙河者有承沙周公二堰今廢己上城固漢水在洋縣南二里通志自城固界流入又東入西鄉界水經注漢水自合壻水又東會益口又東至灙城南與洛谷水合又東徑小城固南又東歷上濤而徑於龍下蓋伏石驚湍流屯激怒故有上下二濤之名龍下地名也度此溯洄從漢為山行之始又東徑石門灘山峽也又東會酉水又東徑媯墟灘又東徑猴徑灘又東徑小大黃金南又東合蘧蒢溪口謹按小城固故城在縣東元和郡縣志漢水經興道縣南去縣一百步太平寰宇記漢水自發源至此屈曲行三百七十里流入金州漢陰縣界壻水在洋縣西四十里縣志經城固流入縣境入漢溢水河在洋縣西二十五里通志即益水北出秦嶺南流入漢水經注益水出北山益谷東南流入於漢水灙水在洋縣西一里通志即洛谷水又名鐵冶河水經注洛谷水北出洛谷南流右則灙水注之水發西溪東南流合為一水亂流南出際灙城西南注漢水太平寰宇記灙谷水一名洛谷水在興道縣北三十里南流注漢水縣志鐵冶河在縣北百八十里下流入於灙水大龍溪在洋縣東北三十里通志即龍涓水輿地紀勝龍涓水在興道縣二十九里水出龍涓谷屈曲西南流十五里入