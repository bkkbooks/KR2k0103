入丹水鹿池在商州東百十八里通志去月兒潭三里傳有白鹿飲此水見人化去花園泉在商州城內西南隅通志郡人治以為園種蓮養魚遊釣其中又鑿渠由東而南出水門入州河又五龍泉在西關龍王廟前泉水迸湧其味清甘或以為與江南惠泉相似又以禱雨有應立碑號甘雨泉泉山泉在商州西北泉村集通志泉山有泉二十餘處最佳者三一在上寺西麓一在玉皇廟後一在冦家村此泉尤奇石上一竇天成可容三四斗其水常滿既供取汲餘猶㵼注大河且味甘美權之重於他水泉村之得名以此丹水渠通志丹水經流州境二百里兩岸隨地皆可開渠但水性泛漲每歲旋衝旋築約灌田千餘畝己上商州遲河在鎮安縣西南百八十里通志一名東池河即直水下流入石泉界詳見石泉洵河在鎮安縣西南七十里通志自長安界入境又流入洵陽界隋書地理志豐陽縣有洵水謹按縣在隋屬豐陽地長安志洵河在乾佑縣西南百里出萬年長安兩縣界秦嶺下東南流入洵陽縣謹按萬年縣今屬咸寧縣志源出長安縣界至盧家寺入縣境流至洵陽之兩河關與乾祐河合互見洵陽縣乾祐河在鎮安縣東三里通志即柞水一作泎以舊縣名水經注柞水西出柞溪南流徑重崖堡西長安志泎水在乾祐縣東五里出萬年縣界秦嶺下流入洵陽又藴水在乾祐縣西南七里出考山下流入泎河縣志乾祐河源出咸寧界秦嶺至舊縣關入縣境至洵陽之兩河關合洵水又有溫水河在縣西北九十里即薀水也東南流入乾祐河鎮安河在鎮安縣城南通志俗名縣河源出西王峪徑雲蓋寺名雲蓋川東南流入乾祐河金井河在鎮安縣東北一百十里通志自商州流入縣境又東南入山陽界水經注甲水流歷金井城南又東南經上庸郡北與關柎水合隋書地理志豐陽縣有甲水縣志亦名合河一名安樂川源出咸寧豐家河至孟李寨入縣境經柴家寨至山陽與葛河合花水河在鎮安縣東南九十里通志有石磴數十級水激浪湧如花東流注於山陽之合河己工鎮安洛水在雒南縣北五里通志源出秦嶺東流徑熊耳山入河南盧氏縣界書禹貢導洛自熊耳山海經歡舉之山洛水出焉而流注於元扈之水漢書地理志禹貢雒水出冢嶺山東北至鞏入河過郡二行千七十里水經注洛水出上洛縣歡舉山東與丹水合又東尸水注之又東得乳水又東會龍餘之水又東至陽虛山合元扈之水又東歷清池山傍合武里水又東門水出焉又東要水入焉又東與獲水合謹按門水及獲水今無考又東徑熊耳山東北過盧氏縣南太平寰宇記洛水在縣北一里縣志洛河源出洛水泉在縣西一百里秦嶺下東注彎環百折盡邑境之東西蓋州境之山皆起於秦嶺及中幹山而兩山之水皆起於洛河縣册洛河出洛水泉屬渭南境流五里入縣界又東南受元扈石門諸水流三百二十里出境謹按今亦謂之南雒水以别於源出慶陽白於山之洛水洛字作雒魚豢典略云漢火行忌水故去水加佳地畫岔水在雒南縣西北百餘里通志源出渭南界合於洛又有階峪川源出金堆城徑蔣家溝入洛又有構峪川南流至保安村入洛山海經竹山之陽丹水出焉東南流注於洛水經注丹水出西北竹山注於洛又尸水北出發尸山乳水北出良餘山皆南流入洛又龍餘水出蠱尾之山東流入洛臣謹按水經注此條在洛水篇别是一丹水非商州至淅入鈞之丹水而地畫岔諸水疑即此丹水及尸乳龍餘諸水矣詳閲桑酈經注兩丹水源流迥别本自分明惟商州丹水出秦嶺昌黎祠下之第九山息邪澗舊志亦稱竹山而兩丹水之源遂混又雒南丹水所出之竹山今亦僅存名目未能指實雍勝略謂在商州西北二百里準其地望當在華州渭南商州雒南四州縣之交而渭南有山名箭峪其陰為大赤水所出考太平寰宇記竹水南出竹山亦曰大赤水又名箭谷水然則竹山即箭谷無疑丹水乃出其陽耳通志亦疑為箭谷而未有明證今詳著之黑潭水在雒南縣西八十里山海經陽虛之山臨於元扈之水是謂洛汭水經注元扈之水出於元扈之山蓋山水兼受其目縣志元扈水出元扈山之陰今名黑潭子東北流入洛其入洛處當陽虛山南石門川在雒南縣北十八里通志即魚難水太平寰宇記魚難山有撲水崖高五十丈魚不能過故又曰魚難水經石門入洛西安府志石門川源出黃龍山合麻坪川水南注於洛縣志石門在縣北十里石門麻坪二水會流處石山突起中闢一門高廣各五六丈二水合流其中亦號為龍門縣河在雒南縣南二百步通志即武里水水經注洛水東歷清池山旁合武里水其水南出武里山東北流注於洛太平寰宇記里清川謂之清池川蓋以水在清池山旁名也謹按此清池川入洛非商州入丹水之清池水故縣川在雒南縣東南四十里通志即要水水經注要水南出三要山東北徑拒陽城西而東北流入於洛謹按拒陽故城在縣東南縣志源出三要山源逺水濶東流而北折經故縣治因名又北徑縣東南五十里之頁山下繞回西入於洛已上雒南金井河在山陽縣西南七十里通志自鎮安界流入又東南入湖廣鄖西界漢書地理志上洛甲水東南至錫入沔謹按上洛今屬商州錫縣今屬鄖西白河界水經注甲水自徑金井城南又東徑上庸郡北與關柎水合又東南徑魏興郡之洵陽南又東右入漢水謹按魏上庸郡治豐陽屬今縣境隋書地理志豐陽縣有甲水謹按豐陽故城在縣南通志甲河以甲於諸水而名舊云夾河非是西安府志金井河一名金津河商州志一名合河以衆水所會而名又東南流徑縣南百二十里南入湖廣舊上津縣境凡三百八十里至甲河關入漢縣志自鎮安柴家莊東來合花水諸河至董家溝合於豐水又花水河在縣西南百里自鎮安境白石崖東來流入合河色河在山陽縣西三十里通志自商州來南流與豐水合水經注關柎水自青泥西山南經陽亭聚西俗謂之平陽水南合豐鄉川水又南入上津注甲水謹按陽亭聚在今縣北今二水相合在縣境則合處亦舊屬上津地也縣志關柎色河其上源曰安武水又名下關坊河西流至石碥合於豐河縣河在山陽縣南通志即豐陽川一名豐鄉川又名豐河水經注豐陽川水出豐鄉東山西南流經豐鄉故城南又西合關柎水縣志縣河發源於縣東二十里圈嶺西流徑縣城南又西流合色河折而南入合河又南至甲河關入漢丹水在山陽縣東百五十里與商南接界通志一名兩河自州東入縣境至竹林關與銀花水合又銀花河在縣東八十里源出圈嶺己上山陽丹水在商南縣西四十里商州志即今之兩河水自州境來徑縣西南一百里曰上兩河合銀花河水又東復徑縣南四十里曰下兩河與沐河商河合又東南入淅川界又沐河一名縣河在縣東門外發源盧氏縣之界嶺南流入縣境西南入兩河又商河在縣西南八十里東流入兩河清油河在商南縣西三十里通志源出雒南花障坪自西北入境納武關以東之水南流徑縣西而入丹水花字潭在商南縣西南百三十里縣志有三潭相連俱在石上每潭周十餘丈兩旁懸崖下瞰形勢甚險亦名風雨雷潭俗傳至其地者不敬則雷聲隱隱潭水隨溢己上商南古迹第宅商州唐洛源監一統志在商州東五十里孝野崖唐書地理志商州有洛源監錢官迎翠樓一統志在商州東商洛故城內唐時建宋阜民監一統志在雒南縣東南四十里宋史食貨志仁宗採雒南紅崖山虢州青水冶青銅置阜民朱陽二監元豐九域志上洛縣有阜民錢監又有龍渦鎮北二銀場按朱陽監在河南陜州西暉亭商州志在州西十里宋團練副使王禹稱建禹稱詩有西暉亭下峰巒碧南靜川中朩葉紅之句遺址猶存卧牛臺商州志在州西北鳯凰原上邵雍寓商州時州守延賞牡丹時章惇為商洛令議論縱橫不知敬雍雍言見蓓蕾而知花之高下者知花之次也見根蘖而知花之高下者知花之上也如公所言知花之次耳因陳天人理數之學惇始愧服古迹祠宇上古蒼頡廟一統志在商州城北商山書院後唐虞契廟一統志在商州東九十里漢四皓廟一統志在商州西金雞原一在州東商洛鎮後魏雙烈祠商州志在州治西祀北魏孝武時洛州刺史郭琰泉仚唐裴晉公祠一統志在商州東八里祀裴度韓文公祠一統志在商州西秦嶺上祀韓愈大雲寺一統志在商州治西唐建舊名西巖院元至正中更名西巖寺一統志在商州西八里仙娥峰麓唐建雲蓋寺一統志在鎮安縣西北四十里雲蓋嶺唐建殿宇宏麗遺址猶存明正統中重修黃龍寺一統志在雒南縣西四十五里相傳唐黃龍禪師駐錫處明原尚書祠一統志在商南縣西祀原傑古迹郊邑周蒼野聚一統志在州東南左傳楚師軍於蒼野杜注蒼野在上洛縣水經注丹水自蒼野東歷菟和山按蒼野在菟和山西舊志謂在州南一百六十里誤武關通志在商州東一百八十五里左傳楚司馬昄使謂晉陰地大夫曰將通於少習以聽命杜注少習秦商縣武關也戰國䇿蘇秦説楚威王曰秦一軍出武關一軍下黔中則鄢郢動矣漢書高帝紀沛公攻武關應劭曰武關秦南關也通南陽郡京相璠曰武關楚通上雒扼道也水經注丹水歷少習出武關洛書甄曜度武關山為地門上應天齊星柳宗元館驛使記自霸而南至於藍田其驛六其蔽曰商州其關曰武關州志在州東武關山下當官道設關北接高山南臨絶澗去河南內鄉縣一百七十里明洪武中以兵守之後設巡檢司今廢唐李涉再宿武關詩遠别秦城萬里遊亂山高下出商州關門不鎖寒溪水一夜潺湲送客愁宋胡宿過武關詩津亭歌闋戒棠舟五兩風來不暫留西北浮雲連魏闕東南初日滿秦樓層城渺渺人傷别芳草萋萋客倦遊平樂舊歡收不得更憑飛夢到瀛洲漢王陵故城一統志在州南水經注丹水徑一故城南名曰三户城昔漢祖入關王陵起兵丹水以歸漢祖此城疑陵所築也括地志王陵故城在上洛縣南三十一里州志今縣西南四十里軍嶺下地名秦王城或謂即王陵之訛漢王城一統志在商南縣東十里俗傳光武屯軍於此四皓墓通志在商州西三里有四冢冢前有廟廟中有古今碑刻又商洛舊縣西亦有四皓冢謹按十六國春秋前涼張重華云長安有四皓墓考文章緣起云惠帝為之立碑商山則葬長安之説誤也但今商州四皓墓有二一在州西三里一在州東八十里商州鎮西未知孰是唐李白過四皓墓詩我行至商洛幽獨訪神仙園綺復安在雲蘿尚宛然荒涼千古迹蕪沒四墳連伊昔鍊金鼎何年閉玉泉隴寒惟有月松古漸無煙木魅風號去山精雨嘯旋紫芝高咏罷青史舊名傳今日併如此哀哉信可憐唐偏路隘通志在商州西北十里唐書地理志貞元七年商州刺史李西華自藍田至內鄉開新道七百餘里回山取途人不病涉謂之偏路輿程記自武關西北行四百餘里至藍田縣皆行山中即所謂偏路也至藍田始出險就平州志又自説法洞至石佛灣明嘉靖萬厯間商洛道郗元洪知州王邦俊相繼修葺鑿壁架梁砌石連棧至今利賴唐李商隱商于新開路詩六百商于路崎嶇古共聞蜂房春欲暮虎穽日初曛路向泉間辨人從樹杪分更誰開捷徑速擬上青雲又商于詩商于朝雨霽歸路有秋光背塢猿收果投巖麝退香建瓴真得勢橫戟豈能當割地張儀詐謀身綺季長清渠川外月黃葉廟前霜今日看雲意依依入帝鄉板橋通志在商州北四十里跨荆水上溫庭筠詩人迹板橋霜即此韋善俊墓通志在雒南縣西南二十里藥子嶺宋乾祐關縣志今名舊縣關宋置在鎮安縣北九十五里又青鳯關俗名青銅關在縣南七十五里接洵陽縣界輿地紀勝云洵陽縣有青鳯關即此關也西安府志謂之青風關金商洛鎮通志在商州東八十五里金史地理志商洛縣貞元二年廢為鎮謹按即隋故商洛縣黃川鎮通志在商州西七十里金史地理志商州舊有黃川鎮明牧護關一統志在商州西一百二十里與西安府藍田縣接界或訛為糢糊關又訛為莫護關有南北二關明設秦嶺巡司於此今廢龍駒寨一統志在州東一百里有東西二寨據雞冠山俗傳項羽烏騅産此故名其地水趨襄漢陸入關輔南北輻輳一巨鎮也盧靈關一統志在洛南縣東北一百十五里路通河南盧氏靈寶二縣關之西有黃龕舊傳河中有金關之東有石室宏敞名五仙窑三要鎮一統志在雒南縣東南九十里三要山下明成化七年置巡司於此竹林關一統志在山陽縣東一百三十里臨丹水自此登舟經浙川榖城至小江口入漢為下襄陽水路明成化十三年置巡司今裁豐陽關一統志在山陽縣東南一百二十里即故漫川縣明洪武初置巡司於豐陽鎮成化十三年移駐於此仍名豐陽巡司今裁通志晉永和九年秦苻雄遣苻菁略上洛立荆州於豐陽川即今豐陽關永安寨一統志在商南縣西十里本朝康熙初縣嘗僑置於此關中勝迹圖志卷二十五
