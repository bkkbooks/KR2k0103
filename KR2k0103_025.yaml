body:
  text: 欽定四庫全書關中勝迹圖志卷二十五陜西巡撫臣畢沅撰地理商州釋名通志商本山名在州東南故名又周秦為商于地故漢以名縣後周以名州沿革一統志治在省城東南三百里禹貢梁州之域春秋晉上洛邑戰國屬秦漢置上洛縣謹按秦為衛鞅邑漢又置商縣後漢為上雒侯國三國屬魏晉置上洛郡後魏改曰洛州後周改曰商州隋改州為上洛郡唐武德元年復曰商州天寶元年曰上洛郡乾元元年復為商州屬山南西道後𨽻京畿宋曰商州上洛郡屬永興軍路謹按文獻通考紹興十二年金割商州之半存上津豐陽金初屬京兆府路元光二年改屬河南路元省上洛縣入州屬奉元路明洪武七年降州為商縣屬華州成化十三年復升為州屬西安府本朝雍正三年直𨽻陜西布政使司領縣四曰鎮安雒南山陽商南州城南臨丹江元至元中築明成化嘉靖間甃甎周五里有奇門四鎮安縣釋名通志郭子章云縣南門外有鎮安河蓋縣因水名也沿革一統志治在州西南三百四十里漢漢中郡旬陽縣地晉以後為豐陽縣地唐萬歲通天元年析置安業縣屬商州乾元元年改曰乾元縣五代漢乾祐二年改曰乾祐縣宋因之金省入咸寧縣元至元二十九年復置乾祐縣三十一年廢明景泰三年始置鎮安縣屬西安府成化十三年改屬商州本朝因之縣城北倚山明景泰三年建正德七年甃以甎周四里有奇門三雒南縣釋名通志以在洛水之南故名明以光宗諱改洛為雒沿革一統志治在州北少東九十里漢上洛縣地晉太和三年置拒陽縣屬上洛郡尋廢後魏復置仍屬上洛郡後周置拒陽郡隋開皇初郡廢改縣曰洛南屬商州大業初屬上洛郡唐屬商州宋金元因之明洪武七年改屬華州成化十三年復屬商州本朝因之縣城北近山南臨水金興定二年築明嘉靖十三年甃石周三里有奇門三山陽縣釋名通志以在北山之南豐水之北故名沿革一統志治在州南少東一百二十里漢商縣地晉泰始三年析置豐陽縣屬上洛郡後廢後魏太安二年復置尋又廢後周仍置豐陽縣隋屬上洛郡唐屬商州宋紹興十三年改屬金州金貞元二年省入上洛縣明成化十三年始置山陽縣屬商州本朝因之縣城明成化十三年築正德三年甃甎周二里有奇門三商南縣釋名通志本後魏南商縣地成化間置縣曰商南以縣在商州之南也沿革一統志治在州東少南二百五十里漢商縣地隋以後為商洛縣地金為上洛縣地元為商州地明初為商縣地成化十三年析置商南縣屬商州本朝因之縣城明成化十三年築嘉靖二年拓其西萬厯七年甃以甎周三里門四名山商州金鳯山在州北里許通志一名鳯凰山州之主山也其西二里許曰鳯凰原安山在商州北五十五里通志即清池山下有紫榆澗清池水出焉水經注清池水東北出清池山輞峪嶺在商州北八十里通志嶺之下道出華州相近有藥子嶺馬腳山在商州北百里通志一名小華山山石壁立四面如削巖下一穴上出約七八丈登者以朩攀援而上出穴口上有兩峰峽中細水下㵼樹多松柏槲栗竒險天設昔人多避兵於此霍家洞在商州西北二十里通志由胭脂關北三里許河東岸一山突起西向一穴有井深丈餘踰井而過寬若數間屋中有石徑不盈尺行百餘步一穴向下以朩梯度之左右前後巖穴可棲者數十百處冢嶺山在商州西北百二十里漢書地理志上雒縣禹貢洛水出冢嶺山謹按上洛故縣即今州治山海經歡舉之山洛水出焉陸澄曰冢嶺山即歡舉也謹按禹貢錐指漢志云上雒縣護輿山在東北歡舉疑是護輿之誤字形相似也水經注丹水出上雒縣西北冢嶺山名高豬山一統志商州西北諸山皆秦嶺也甲水出其南丹水出其東南洛水出其東北後人因分為歡舉冢嶺等名其實本一山也又見雒南縣西巖山在商州西十里通志與仙娥峰對其麓有西巖洞古稱棲真之地仙娥峰一名吸秀山亂山中特起一峰下臨丹江謂之仙娥洞唐白居易仙娥峯詩我為東南行始登商山道商山無數峯最愛仙娥好參差樹若插匼匝雲如抱渴望寒玉泉香聞紫芝草青崖屏削碧白石床鋪縞向無如此物安足留四皓感彼私自問歸山何不早可能塵土中還隨衆人老熊耳山在商州西四十里隋書地理志上洛縣有熊耳山州志兩峰插漢以形似名謹按此非禹貢導洛之熊耳辨見洛南縣宋邵雍辨熊耳詩昔禹别九州導洛自熊耳熊耳自有兩未審孰為是東者近成周西者隔丹水書傳稱上洛斯言得之矣白龍洞在商州西九十里接藍田界通志在紅崖寨山中洞口如甕燃炬而進膝行里許有石室一區後壁一池如斗大禱雨輒應雖盛暑而寒如冬秦嶺在商州西百里通志朝陽洞玉皇洞雷神洞並在其後又其下有黑龍峪相傳漢高祖入關分二道一出藍田一由此漢書地理志上洛縣甲水出秦嶺山三秦記東西亘八百里嶺根水北流入渭號為八百秦川亦即丹水所出高車山在商州西南五里水經注楚水東徑高車嶺南太平寰宇記上有四皓祠漢惠帝所立高后使張良以駟馬高車迎四皓於此故名通志一作膏車宋王禹稱詩云南過膏車嶺川源似掌平州志山在乳水北岸兩峰如駝俗名駝峰土中常得矢鏃蓋古屯兵處秦望山在商州西南九十里通志即良餘山俗訛為秦王山山海經良餘之山乳水出於其陽西安府志山西南有花水峰亦四皓隱處南秦嶺在商州南二里通志過嶺為南秦川宋邵雍寓此天柱山在商州南五里通志宋邵雍愛此山因卜居於此樓山在商州南五十里通志其北有劉嶺一名流嶺為唐高太素隱居舊有澄心亭積翠樓凝碧池六逍遙館今皆蕪廢又西南有桐谷鶯川高碥山在商州南八十里雍大記深溝陡澗巨石壁立如門中穿行路澗上高崖萬仞插天下極幽險諸天洞在商州東四十五里通志怪石壁立中有水清甘可飲仰蔭飛巖俯臨丹水燕子山在商州東五十里通志上有龕高百尺兩山相合昔土人傍山鑿碥可容六十餘户以元鳥冬多蟄此又名燕子龕迤南百餘步為鵬崖山兩山壁立高數百仞鑿石為路路絶處懸梯以躋約百丈得巖穴亦可容五十户棣花山在商州東七十里通志以地多棣花而名有東暘洞相近又有羅漢洞丹崖壁立高數十丈下臨丹水又有老君峪俗傳為老子騎青牛過此有路通雒南商山在商州東八十里戰國䇿蘇秦説韓宣惠王曰西有商坂之塞史記正義商坂即商山在商洛縣南一里帝王世紀南山曰商山又名地胏山亦名楚山雲笈七籖一名商谷山四皓仙人隱處名山記一名商洛山後人名四皓隱處為智亭山通鑑地理通釋七盤十二䋫即商山嶺也雍勝略商山形如商字湯以為國號郡以為名州志自乳水之南皆曰楚山自劉峪口以下丹水之南山亦皆曰楚山唐溫庭筠商山早行詩晨起動征鐸客行悲故鄉雞聲茅店月人迹板橋霜槲葉落山路枳花明驛牆因思杜陵夢鳬雁滿回塘王貞白商山詩商山名利路夜亦有人行四皓卧雲處千秋疊蘚生晝燒籠澗黑殘雪隔林明我待酬恩了來聽水石聲雞冠山在商州東百里通志峰巒攢簇為龍駒寨主山山有紫陽洞真人張伯端修煉處伯牙山在商州東百里通志聳拔紆折俗呼為白鴉山相傳有樵子刈薪其上隱隱聞琴絲聲尋之不得明末有好事者陟山巔得斷碣於敗葉中鐫伯牙二字大如斗意伯牙昔常遊此而後人因以名其山歟資峪嶺在商州東一百十五里左傳哀公四年楚人臨上洛左師軍於菟和杜注山在上洛縣東後漢郡國志上洛縣有菟和山水經注丹水自蒼野東歷菟和山州志資峪嶺即菟和山或曰資峪菟和之南嶺也武關山在商州東百八十里通志即少習山左傳楚左司馬使謂陰地大夫士蔑曰晉楚之盟好惡同之不然將通於少習以聽命杜注少習商縣武關也謹按商縣故城在州東州志山道險厄北接高山南臨絶壑為自楚入秦要隘東巖山在商州東北三里通志有大小趙峪循峪而入有山曰東巖以對仙娥溪北之西巖而名有水曰東溪相傳為唐李白僑寓處囷石山在商州東北十五里通志盤曲如囷巖阿深邃為昔人隱逸之地石龍洞在商州東北四十里通志由十九河溯流而上有山嵯峨下嵌一洞方廣約五六丈中有石龍十數鱗角爪牙宛出人工有伏而寢者偃而舒者俯而飲者仰而吸者門者舞者蟠曲似蟄者獨一龍昂首欲飛口中有液滴成小湫每禱雨以瓶承頷下但得一滴瓶即滿行不數里輒大雷雨否則終日不獲一滴蓋視人意之虔否也己上商州對峰在鎮安縣北六十里通志兩峰聳峙下有洞相傳明代中葉吼聲三日忽劃為兩中有神水祈雨輒應天書山在鎮安縣北八十里通志宋真宗時知永興軍冦準得天書於乾祐山中即此旬山在鎮安縣西北水經注旬水出旬山聖燈崖在鎮安縣西三十里通志在雲蓋寺側相傳每良夜輒見一燈出崖畔俄散為七八既復合為一又縣西三十五里有白侍郎洞相傳白居易賈島遊此北陽山在鎮安縣東南百五十里通志內有石洞與楚之上津接界又相近有南陽山相傳漢張良寓此中有子房洞石壁嶺在鎮安縣東北五里通志形勢峭立下有魚洞通乾祐河其深莫測洞口流泉噴薄每歲霜降遊魚泝流入洞榖雨後水發魚逐隊出居人截洞口得之其味頗佳擬諸丙穴云己上鎮安冢嶺山在雒南縣西北八十五里通志亦名秦嶺山縣志秦嶺在縣北橫亘三百里自嶢山入縣界則名秦嶺陰即太華稍東即潼關重峰疊嶂自縣西抵北而東為洛水發源處即冢嶺山矣燕子山在雒南縣西北通志縣址枕其上山勢壁立環繞而西與梁原山岡隴相接即梁原之首也又梁原山在縣城西諸山多怪石不堪耕治獨此山可田書堂山在雒南縣北二十里一統志邑之主峰俯視羣山環向若揖山後有二洞昔有逐鹿者至此聞其中有書聲故名通志相傳張良從赤松子隱於此黃龍山在雒南縣北九十里一統志山頂有礦洞明嘉靖八年填塞洞口多五色石中有路通華州太平寰宇記大谷龍龕山在縣東北八十里北接秦嶺多出麩金疑即此陽虛山在雒南縣西北百里雍勝略古云蒼頡造書於此山海經陽虛之山臨於元扈之水水經注河圖玉版曰蒼頡為帝南巡登陽虛之山臨於元扈洛汭之水靈龜負書丹甲青文以授之隋書地理志洛南縣有陽靈山謹按陽靈即陽虛之訛通志山前有黑潭潭上有古字不可辨縣志陽虛山在洛水北元扈山在雒南縣西北百里山海經鹿蹄之山至於元扈之山凡九山水經注元扈通於歡舉為九山之次故山海經曰此二山者洛間也黃帝録帝在元扈閣上與大司馬容光左右輔周昌等百二十人臨之鳯銜圖至帝前黃玉為匣路史元扈者石室也臨洛水今商之上洛南有元扈山縣志山在洛水南與陽虛對峙藥子嶺在雒南縣西南二十里通志與商州分界舊傳唐真人韋善俊種藥於此龍山在雒南縣南十里通志山之東有希夷洞亦名藏修洞相傳為宋陳摶隱處有石牀石枕遺迹中幹山在雒南縣南五十里通志由冢嶺發脈蜿蜒南繞盡縣之境高與秦嶺埒俗名為莽嶺三要山在雒南縣東南六十里通志南出青草河可通武關東出即盧氏之孔道北望閿鄉靈寶皆有捷徑因名三要水經注要水出三要山王喬山在雒南縣東南百里通志相傳仙人王子喬隱於此熊耳山在雒南縣東南百二十里書禹貢導洛自熊耳漢書地理志上雒縣有熊耳山水經注洛水又東徑熊耳山北通志山在縣東商虢分壤之處洛水至此始大故禹導洛始此臣謹按熊耳山有四一在河南宜陽縣水經注洛水東北過宜陽縣南水北有熊耳山雙巒競舉狀同熊耳昔光武破赤眉積甲仗與熊耳齊是也一在河南陜州唐書地理