body:
  text: 關中勝迹圖志卷十五陜西巡撫臣畢沅撰地理鳳翔府釋名雍勝略唐至德初置取鳳鳴岐山之義沿革一統志治在省城西北三百六十里禹貢雍州之域周王畿地春秋時為秦國都始皇時為內史地漢初屬雍國後為右扶風地後漢因之三國魏為扶風郡地晉為秦國地後魏太延二年於雍縣置平秦郡太和十一年兼置岐州西魏改郡曰岐山隋開皇三年郡廢大業初改州為扶風郡唐武德初復曰岐州天寶元年復曰扶風郡至德元載改曰鳳翔郡二載升為西京鳳翔府上元元年置鳳翔軍節度使二年罷京隸關內道五代曰岐州宋曰鳳翔府扶風郡鳳翔軍節度屬秦鳳路金亦曰鳳翔府為鳳翔路治皇統二年升為府軍名天興大定十九年更名鳳翔軍二十七年升總管府元初仍立鳳翔路總管府至元九年更為散府屬陜西行省明曰鳳翔府屬陜西布政使司本朝因之領縣七曰鳳翔岐山寶雞扶風郿麟遊汧陽州一曰隴州府城通志唐節度使李茂貞建明萬歷二年增築周十二里有竒門四東曰迎恩西曰保和南曰景明北曰寧逺鳳翔縣釋名通志本雍縣唐改鳳翔義與府同沿革一統志附郭春秋時雍邑為秦都後置雍縣漢屬右扶風後漢及晉因之後魏為平秦郡及岐州治隋為扶風郡治唐為鳳翔府治至德二載改曰鳳翔縣又析置天興縣寶應元年省鳳翔縣入天興宋因之金大定十年改天興縣曰鳳翔仍為府治元明不改本朝因之岐山縣釋名通志本後周三龍縣隋移治岐山南遂改為岐山因山名也沿革一統志治在府東三十里漢右扶風雍美陽二縣地後魏太平真君六年置周城縣屬平秦郡後周廢天和四年改置三龍縣隋開皇十六年改曰岐山縣屬扶風郡唐屬鳳翔府宋金元明不改本朝因之縣城通志唐武德四年建元至元二十五年明景泰元年先後增築周五里有竒門二寶雞縣釋名元和郡縣志乾元初改陳倉為寶雞以昔有陳倉鳴雞之瑞故名之沿革一統志治在府西南九十里秦置陳倉縣漢屬右扶風後漢及晉因之東晉末廢改置苑川縣後魏因之西魏復曰陳倉後周兼置顯州尋廢隋開皇十八年復置陳倉縣仍屬扶風郡唐屬鳳翔府改曰寶雞宋金元明不改本朝因之縣城通志唐至德中建明景泰二年增築周二里有竒門三扶風縣釋名通志唐貞觀初以扶風名縣仍漢右扶風名也沿革一統志治在府東一百十里漢美陽縣地唐初為岐山縣地武德三年分置湋川縣四年屬稷州貞觀八年改曰扶風縣屬岐州至德中屬鳳翔府宋因之金改曰扶興尋復故元明不改本朝因之縣城通志明景泰元年建因漆湋為池周四里門七郿縣釋名通志郿周邑秦以名縣毛萇云文公所營是也沿革一統志治在府東南一百十里漢郿縣屬右扶風為右輔都尉治後漢及晉因之後魏廢太平真君六年改置平陽縣屬武都郡西魏改縣曰郿城後周改置周城縣天和元年於縣置雲州建德三年州廢隋開皇十八年改縣曰渭濱大業二年又改曰郿縣屬扶風郡義寧二年於縣置郿城郡唐武德初改曰郇州三年州廢縣屬稷州七年屬岐州後屬鳳翔府宋因之金貞祐四年分屬恆州元初升為郿州至元初復為縣屬奉元路明還屬鳳翔府本朝因之縣城通志元至大元年建明景泰隆慶間先後增築周三里許門三麟遊縣釋名通志隋義寧初獲白麟於廢仁夀宫因置縣沿革一統志治在府東北一百二十里秦杜陽邑漢置杜陽縣屬右扶風後漢初廢永和二年復置仍屬右扶風晉廢隋大業初改置普潤縣屬扶風郡義寧元年增置麟遊縣兼置鳳棲郡二年改郡曰麟遊兼領普潤縣唐武德元年改郡曰麟州貞觀元年州廢二縣俱屬岐州後俱屬鳳翔府宋金因之元廢普潤縣入麟遊屬鳯翔路明屬鳳翔府本朝因之縣城通志隋義寧中建明天順中增築外城周九里有竒門三汧陽縣釋名通志後周縣名太平寰宇記以縣在汧水之陽而名沿革一統志治在府西少北七十里漢置隃麋縣屬右扶風後漢為隃麋侯國晉省入汧縣後周置汧陽縣兼置汧陽郡尋廢郡隋屬扶風郡唐屬隴州宋因之金移隴州來治元仍屬隴州明嘉靖中改屬鳳翔府本朝因之縣城通志唐太和中築於北山麓畔元至正二年移今縣西五里界汧暉二河之間明嘉靖二十六年移建今城周三里有竒門四隴州釋名元和郡縣志魏改東秦為隴州因山為名沿革一統志治在府西少北一百五十里周時秦汧邑漢置汧縣屬右扶風後漢及晉因之後魏置隴東郡正光三年兼置東秦州孝昌三年廢永熙元年復置東秦州及汧隂縣西魏廢帝三年改州曰隴州縣曰杜陽後周復曰汧隂隋開皇三年郡廢五年改縣曰汧源大業三年州廢屬扶風郡義寧二年復置隴東郡唐武德元年復曰隴州天寶元年改為汧陽郡乾元元年復曰隴州屬關內道天復元年置保勝軍節度宋仍曰隴州汧陽郡屬秦鳳路金移州治汧陽元復移治汧源屬鞏昌路明初省汧源縣入州屬鳳翔府本朝因之州城通志西魏隴州在州南八里周明帝移今治明景泰元年改築周五里有竒門四關中勝迹圖志卷十五
