body:
  text: 關中勝蹟圖志卷二十六陜西巡撫臣畢沅撰地理乾州釋名雍大記在長安西北隅故云沿革一統志治在省城西北百六十里禹貢雍州之域秦置好畤縣漢屬右扶風後漢因之後魏為扶風郡治又析置漠西縣屬武功郡後周廢扶風郡省好畤入漠西隋開皇十七年置上宜縣十八年改漠西曰好畤大業三年又省好畤入上宜屬京兆郡唐武德二年復置好畤縣屬雍州三年改屬稷州貞觀元年還屬雍州八年省上宜入岐陽縣二十一年廢好畤又分岐陽置上宜縣尋改曰好畤文明元年又分醴泉好畤二縣地置奉天縣天授二年二縣并屬稷州大足元年還屬雍州乾寧初於奉天縣置乾州以好畤縣屬焉五代因之宋熙寧五年州廢以奉天縣屬京兆好畤縣屬鳳翔府政和七年復於奉天縣置醴州八年割州屬環慶路金天德三年復改州曰乾州屬京兆府路元至元初并奉天縣入州五年又并好畤縣入州屬奉元路明屬西安府本朝雍正三年直𨽻陜西布政使司領縣二曰武功永夀州城通志唐建中元年德宗用桑道茂言詔京兆尹嚴郢城之子城周五里羅城周十里有竒髙二丈二尺後子城圮今城即羅城也門六武功縣釋名元和郡縣志縣境有武功山斜谷水亦曰武功水縣以山水立名沿革一統志在乾州南六十里古邰國漢置斄美陽二縣屬右扶風後漢初廢斄縣永平八年置武功縣晉以武功屬始平郡後魏太平真君七年省入盩厔縣太和十一年于美陽縣置武功郡後周建德三年郡廢改美陽置武功縣屬扶風郡隋屬京兆郡唐武德三年于縣置稷州大足元年州廢縣屬雍州乾寧二年分屬乾州後唐同光中屬鳳翔府長興初又屬京兆府宋政和八年改屬醴州金天德三年屬乾州大定二十九年改曰武亭元復曰武功明不改本朝因之縣城通志唐貞元十五年建依雍原之麓宋修元末張良弼李思齊增築又循雍原列十二城以守明洪武九年增築之周三里有竒土築門四永夀縣釋名通志後周于永夀原西置永夀縣縣因原而名也沿革一統志在乾州北九十里漢漆縣地後魏白土縣地西魏大統十四年置廣夀縣後周大象元年改曰永夀隋開皇三年省入新平縣唐武德二年復置屬邠州五代因之宋乾德二年改屬乾州熙寧五年仍屬邠州政和八年屬醴州金又屬邠州元至元五年還屬乾州明不改本朝因之縣城通志元至正四年建于麻亭鎮明末被冦圮因結寨于虎頭山居之本朝順治丁酉築寨下南關康熙八年創建新城西南依舊寨四方崒嵂中央坦夷額曰金盤城周三里髙二丈八尺土築門二名山乾州梁山通志在乾州北十里孟子太王居邠踰梁山史記秦始皇本紀始皇三十五年幸梁山宫注引師古曰梁山在岐山東九嵕山西元和郡縣志梁山髙宗乾陵所在乾州志山髙三百七十四丈周九里廣二里正南兩峯並峙直北一峯最髙東與醴泉之九嵕比峻南對太白終南相近有玉洞石門山通志在乾州西北十里許其下有響石潭一名幕谷一名漠谷上有甘澤廟廟北崖髙數丈水落勢如瀑布明月山通志在乾州西與扶風縣分界長安志嶺上有婁敬廟丹崖乾州志在州東三十五里唐有竇氏二女於此投崖至今卉草拳曲土石皆赤豹谷通志在乾州東北十里有唐僖宗靖陵五峯山乾州志在州東北五十里東與梁山相映五峰並峙多産藥物上有靈湫禱雨多應巳上乾州東原西原通志西原在武功縣西即縣城所附者東原在縣東長安志亦謂之上武亭川原上武亭川東原至興平西界二十五里上武亭川西原至扶風東界十一里武功縣志西原一名雍原即古周原也或曰通東西原皆謂之雍原又有鳳岡即雍原北岡也南原元和郡縣志在武功縣西南二十里髙五十丈西入扶風界武功縣志一名三畤原自西而東盡於漆水之西滸北臨湋南距渭在縣境者十餘里已上武功武陵山通志在永夀縣城外西南一名翠屛山甘泉山元和郡縣志在縣北二十五里一名髙泉山太平寰宇記漠谷水源出此一名麻亭嶺五峰山永夀縣志在縣東南八十里南界乾州東界醴泉發脉於縣北十里之分水嶺連延七十里陡起五峯為九嵕山之祖脉山有寺內有寶泉旱禱則應一名溫修山一名溫秀山一名三陽山已上永夀大川附水利乾州武亭河在乾州西四十里自麟遊界來又南流入武功界一名武水一名杜水一名好畤水即中亭川之上流水經注之大橫水也漠谷水漠一作莫通志在乾州西自永夀縣麻亭嶺流入合錦川水又南入武功縣界一名莢水水經注莢水出好畤縣梁山大嶺泉南徑梁山宫西太平寰宇記莫谷水本名安陽泉後魏於水西置縣因名莫西乾州志漠谷水西南流徑乾州西北四十里地名龍塘口泉溫可浴又稱沐浴河又徑州西南三十里入武功界合渭亦謂之夾道水泔河通志在乾州東北十五里一名甘谷水太平寰宇記水自永夀縣溫宿嶺流至奉天縣界又入醴泉縣合於涇乾州志甘谷神潭在州東二十里土人聽水聲以占風雨如風即風如雨即雨已上乾州渭水通志在武功縣南三十五里自郿縣界來與盩厔接界又東入興平界水經注渭水自武功縣合溫泉水又東徑斄縣故城南又東合雍水又東徑郿塢南謹按漢武功今屬郿縣斄縣故城在縣西南武功縣志渭水由扶風入縣界至永安鎮南屬盩厔北屬武功行五十餘里至薛固鎮入興平界雍水通志在武功縣西南十二里自扶風界流來又流入興平界水經注雍水東徑美陽縣之中亭川與大橫水合又南徑美陽縣西又南流注於渭謹按美陽縣今屬扶風太平寰宇記雍水俗名白水亦曰圍川水一名湋水武功縣志湋水自扶風東門外受鳳泉水又至縣南合漆水南流入渭武亭河通志在武功縣東門外自乾州界流入合雍水水經注大橫水自合鄉谷水又南莢水注之又南徑美陽縣之中亭川注雍水謂之中亭川縣志漆水今訛為武水俗呼好畤河自邠岐之間來入縣界行二十餘里至縣東門受漠谷水合流八里許㑹湋水入渭漠谷水通志在武功縣東北自乾州流來合武亭水水經注莢水徑梁山宫西又南徑美陽縣之中亭川注雍水武功縣志浴水即乾州西夾道水從邠西梁山來意此或即沮水關西人讀浴若于于沮固易訛謹按漠谷水入縣界十五里入漆谷谷關西人讀作峪此水一名沐浴河亦漠谷之轉訛也巳上武功漠谷水通志在永夀縣西北二里南流十八里入乾州之夾道河錦州河通志在永夀縣西南六十里一名沙凹河流五十里入于乾州之龍塘合漠谷水川中石多錦文故名泔河通志在永夀縣東一里一名東河自縣北十里之分水嶺東南流九十里入乾州界醴泉通志在永夀縣南三十五里彭村有土橋水過橋南泄澗下久旱聞泉中吼聲則雨以穢物投之則水不逾橋滲入土中待穢盡水乃復出人呼神泉吕公泉通志在永夀縣北五里邑無甘泉宋吕大防為令行近境得泉二欲𨗳之入城而地勢髙下不一乃用考工置臬法凖之不旬日間疏為渠又益民泉流入街市民便之元至大三年邑人白用至北郭五里許俯瞷流泉掘地得𨗳水瓦溝金舊制也續瓦引流直達城內縣志源出分水嶺有三泉滙為一亦謂之吕公惠民泉金太和中主簿邢珣元延祐中處士白用重修後漸湮廢本朝康熙九年修後縣以地震瓦溝壓裂雍正十年又修治之巳上永夀古蹟宫闕乾州秦梁山宫通志在永夀縣南八十里史記秦始皇本紀始皇幸梁山宫三秦記梁山宫城皆文石名織錦城唐慶善宫雍録本名武功髙祖舊第也在武功縣渭水北太宗誕生于此貞觀六年改慶善宫㑹要貞觀六年太宗幸慶善宫宴從臣于渭濵上賦詩賞賜閭里有同漢宛沛焉起居郎吕才播于樂府被之管絃名曰功成慶善樂古蹟第宅宋思政堂通志在乾州公署宋時本州刺史鄭彥文建元歸來堂乾州志在乾州城內元楊奐佚老之所古蹟祠宇漢太白祠武功縣志在縣西北一里漢永平八年建祠于此旱禱神應明洪武丙辰重建魏武陵寺永夀縣志在縣治西翠屏山內有塔後魏平陽王熙建明碧峰禪師居此唐興教寺乾州志在州南四十里田果村唐貞觀八年建興國寺乾州志在州東南五十里唐貞觀八年建金大定四年修薛祿寺乾州志在州東南四十里薛祿鎮唐德宗時建明萬厯二年修日照寺乾州志在州西六十里河斜村唐德宗時建報本寺通志在武功西北一里本唐髙祖舊宅大中元年建為寺依山立剎中有浮圖髙二十尋偉然一邑之望明萬厯年修又恩義寺在建子溝亦唐髙祖故宅宋唐太宗廟通志在武功縣城北宋元祐三年直龍圖閣游師雄建崇寧元年趙茂曾碑記按唐紀太宗文皇帝以隋開皇十二年戊午生於武功之别館有二龍戲門外三日而去京兆武功之南有唐慶善宫今為慈德寺乃其所也北曰報本寺神堯之舊宅焉先是縣圖雖載厥事而祀秩無文龍圖閣游公率里人即報本北隅經始廟貌左右壁間悉圖貞觀朝臣英姿凛然倣佛見當時之盛縣志前殿為鴻禧觀祀老氏明嘉靖末重修明聖母姜嫄廟后稷廟在武功縣城內西山續文獻通考明嘉靖十五年巡按御史周鈇言武功即堯封后稷有邰之地與稷母姜嫄皆有専祀第未及祀典宜賜修舉從之閻鐸后稷祠碑記祠舊在縣西南二里後徙縣城之西坂上旁有古窰極深邃松檜交翠乾封三年復建神堯别館周顯德中傾圮為僧據為寶意寺而祠泯矣明宏治辛亥重建祠復肖聖母姜嫄像于祠後通志按縣志后稷祠在城內西山上祠後作姜嫄祠皆明時改建與碑記同今姜嫄祠在山嶺最上又不知昉于何時也姜嫄祠制三楹前為后稷祠俱南向前後柏二十餘本歲時祭賽頗盛本朝康熙四十年修蘇武廟武功縣志在縣西原大道旁明萬厯辛未建渾瑊祠通志在乾州治南門內明洪武二十七年乾州同知史孟通言唐忠臣渾瑊在德宗時涇原兵變保乘輿全城郭功載唐史今其祠廟在而祀事有闕甚非報功勸忠之意宜令有司春秋致祭詔從之竇女祠一統志在乾州城北四十里竇村唐書列傳竇伯女京兆奉天人永泰中遇賊行剽二女姊年十九妹年十六自匿山谷賊迹而得之將逼以私行臨大谷伯曰我豈受汚於賊乃自投下賊大駭俄而仲亦躍而墜京兆第五琦表其烈行詔旌門閭通志明宏治八年命建新祠于東門外春秋享祀乾州志女死千有餘載其撲墜之處卉草拳曲土石皆赤竒蹟常存近更移置新祠于城東街豫備倉右古蹟郊邑上古聖母姜嫄墓關中陵墓志在武功縣南門外武功古斄國也或云葬邠非是漢蘇武墓通志在武功東三十里臣謹按蘇武墓武功韓城兩地志乘皆載入元和郡縣志武墓在好畤縣東考故好畤縣地無常所漢縣在奉天界今在乾州東七里晉縣在舊縣南二里唐縣在州西北六里後併入永夀以今地按之武墓當在武功縣東三十里守節鄉且蘇氏自漢及唐世居武功當從通志為允唐奉天故城通志唐德宗建中元年術士桑道茂言奉天有天子氣宜高大其城池乃命京兆發丁夫數千推六軍之士築奉天城名山記奉天城外象龜形內列六街乾州志舊子城周五里羅城周十里後子城坍今乾州城即羅城舊址薛仁貴采地乾州志在乾州東四十里今名薛祿鎮雙烈村乾州志在乾州北門外唐竇氏烈女故居也即今竇村北門有雙烈坊雲橋乾州志在州南門外橋本朱泚築以攻城之具渾瑊掘隧陷賊之所今有橋存髙宗乾陵通志在乾州西北五里梁山唐書武后本紀文明元年庚寅葬天皇大帝於乾陵唐書地理志文明元年析醴泉始平好畤武功邠州之永夀五縣地置奉天縣奉乾陵中宗本紀神龍二年五月庚申葬則天大聖皇后長安志乾陵周八十里有于闐國所進無字碑文獻通考陪葬乾陵者章懷太子賢懿德太子重潤澤王上金許王素節邠王守禮義陽新都永泰安興四公主特進王及善劉審禮中書令薛元超豆盧欽望楊再思劉仁軌左衛將軍李謹行左武衛將軍高侃僖宗靖陵通志在乾州東北十五里唐書昭宗本紀文德元年十月辛卯葬惠聖恭安孝皇帝于靖陵長安志靖陵封內四十里與乾陵相接隔豹谷狄仁傑墓關中陵墓志在乾州北門外五里許當乾陵東蘇瓌墓通志在武功縣西南博村石墨鐫華許公瓌景雲元年十一月葬于武功碑盧藏用撰序張說撰銘八分書蘇頲墓通志在武功縣西南十五里新寨南有神道碑張說撰宋游師雄墓通志在武功縣西八里石墨鐫華游師雄墓志張舜民撰邵䶵正書明康海墓通志在武功縣西門外關中勝蹟圖志卷二十六
