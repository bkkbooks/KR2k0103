衝中地歸德堡一統志在榆林縣南四十里成化中置為腹裏中地又思河堡在縣南八十里唐銀州地本名黑土圪塔正統二年置思河寨於九股水成化十一年移置今所城在半山為腹裏上地又鎮川堡在縣南一百四十里嘉靖二十九年建保寧堡一統志在榆林縣西三十里舊名古梁城嘉靖四十三年增建城在平地為極衝下地𣢾貢城一統志在榆林縣北紅山上中有鎮北臺易馬臺俱萬厯五年築又有筆架城在縣西北嘉靖四十五年套夷陷此柏林堡一統志在神木縣西南六十里成化初置城在山原又大柏油堡在縣西三十里城在山上永興堡一統志在神木縣東北六十里地名黑城兒成化中置城在山上楊家城一統志在神朩縣西北正統五年副都御史陳鎰移縣於楊家城後以在山巔不便仍復故處清水營堡一統志在府谷縣東北六十里成化中置城在山坡又黃甫川堡在縣東北七十里天順中置城在山畔西北就山東南臨川孤山堡一統志在府谷縣西北四十里本孤圪塔馬營正統中置在西山成化初移置城在山畔又鎮羌堡在縣西北八十里明初置在東村成化二年改建城在山原明楊一清孤山堡詩簇簇青山隱戍樓暫時登眺使人愁西風畫角孤城曉落日晴沙萬里秋甲士解鞍休戰馬農兒持券買耕牛回思未築邊牆日曾得清平似此不木瓜園堡一統志在府谷縣北五十里即明初木瓜園寨成化十六年改置堡城在山上三捷關一統志在懷遠縣東二十里衆山環列中通一道頗稱險要波羅堡一統志在懷遠縣東少北四十里正統十年置以有波羅寺因名城在山畔為極衝中地又響水堡在縣東八十里正統二年置成化二年移出黑河山易名平夷堡九年復還響水城在山坡為極衝中地威武堡一統志在懷遠縣西南四十里地名響鈴塔成化五年置城在山阜為極衝上地又清平堡在縣西南八十里舊名磚兒營成化初置城在山原為極衝中地響水石橋府志在懷遠縣響水堡南滉忽都河上又有下響水橋河廣半里水從崖落成化中有僧從水底鑿三窟河流頽疊而下其上為石梁今兩旁窟俱壞中一窟猶存建安堡一統志在州北一百五十里地名崖寺子成化十年增置城在山畔又高家堡在州北一百六十里地名飛鴉川正統四年建城在平川梁震墓通志在神木縣南十里關中勝迹圖志卷二十四
