body:
  text: 關中勝迹圖志卷二十四陜西巡撫臣畢沅撰地理榆林府釋名通志本漢榆溪塞水經注所謂諸次水東徑榆林塞是也明因塞置衛遂取名焉沿革府志治在省城北一千三百五十里禹貢雍州之域春秋時翟地秦為上郡地漢為上郡龜兹奢延西河郡圁陰等縣地兼置屬國都尉後漢末廢晉義熙中赫連勃勃據地稱大夏國名其城曰統萬後魏始光四年建為統萬鎮太和十一年改置夏州兼置化政郡西魏改郡曰宏化隋開皇初郡廢大業初改夏州為朔方郡唐貞觀二年復為夏州屬關內道天寶初復改朔方郡乾元初仍曰夏州貞元三年置夏州節度中和二年賜號定難軍五代因之宋為西夏地元為綏德州地明成化七年始置榆林衛為延綏鎮治本朝雍正八年改置榆林府屬陜西布政使司領縣四曰榆林神朩府谷懷逺州一曰葭州府城通志即舊衛城東枕駝山臨黃河明正統初創築成化九年增築北城後又拓南城嘉靖隆慶萬厯中相繼甃磚南關外有外城正德十年築西門外又有羅城隆慶元年築周十三里三百餘步門七榆林縣釋名通志縣本榆林堡地義與府同沿革一統志附郭漢置龜兹縣屬上郡為屬國都尉治後漢因之晉省後魏為夏州地後周置彌渾戍隋開皇初改德靜鎮大業九年置德靜縣屬朔方郡唐貞觀七年於縣置北開州十三年州廢縣屬夏州五代因之宋沒於西夏元為米脂縣地明永樂初置榆林塞成化七年置榆林衛為延綏鎮治本朝雍正二年省衛入綏德州八年置榆林縣為榆林府治神木縣釋名通志元縣名本宋神朩寨也郭子章云縣西十五里楊家城內有神松三株枝柯相連故曰神朩沿革縣志治在府東北二百四十里漢惠帝五年置圁陰縣屬西河郡後漢因之晉時荒廢後魏置石城縣後周改曰銀城隋屬雕陰郡唐初屬勝州天寶元年分置麟州兼置新秦縣為治其年改新秦郡乾元初復曰麟州屬關內道五代周時屬北漢宋曰麟州新秦郡元豐中於銀城縣界置神木寨政和四年省銀城入新秦縣金時地屬西夏州縣皆廢元初於神木寨置靈州至元六年廢州為神木縣屬葭州不不改本朝乾隆元年改屬榆林府縣城通志明正統中周周四里有奇門四府谷縣釋名通志唐未置府谷鎮後唐升為縣縣鎮鎮名也沿革縣志治在府東北二百里漢西河郡地唐唐為銀城縣地後唐置府谷縣兼置府州永安軍節屬屬河東路宋崇寧元年改曰靖康軍政和五年賜名河河郡金時地屬西夏元初仍曰府州至元六年州廢二十二年縣屬葭州明不改本朝乾隆元年改屬榆林府縣城通志明正德中增築因河為池周五里有奇門六懷遠縣釋名通志本明懷遠堡縣從堡名也沿革一統志治在府西南一百六十里漢置奢延縣屬上郡後漢因之晉省後魏置巖緑縣為夏州及化政郡治西魏為宏化郡治隋為朔方郡治唐貞觀二年改縣曰朔方為夏州治宋沒於西夏元為米脂縣地明天順中置懷遠堡屬榆林衛本朝雍正二年改屬綏德州九年置懷遠縣屬榆林府縣城通志即舊堡城明天順中築萬厯中甃磚周三里有竒門三葭州釋名通志金州名以州臨葭蘆川也川在州西五里岸多葭蘆故以名州沿革州志治在府東南一百七十里漢西河郡圁陰縣地晉時荒廢西魏置真鄉縣後周置真鄉郡隋開皇初郡廢屬雕陰郡唐屬銀州宋初屬西夏元豐中收復置葭蘆寨屬石州臨泉縣元符二年以寨置晉寧軍屬河東路金貞元元年屬汾州大定二十二年升為寧晉州二十四年改曰葭州興定二年屬延安府元屬延安路明屬延安府本朝雍正三年直𨽻陜西布政使司乾隆元年改屬榆林府州城通志宋熙寧中置葭蘆寨據山為固因河為池至今稱為鐵葭州明洪武初因舊址改建周三里有奇門二名山榆林府駝山在榆林縣城東通志一名東山城半踞其巔高數十丈俗呼為東山土人多穴山居之山形類駝鎮之得名駝城以此紅山在榆林縣北十里通志一名紅石峽山皆紅石地近沙阜因築紅山墩延綏志山環列若屏障落日照之如霞起兩崖飛湍電轉紅影外浮昔李繼遷葬其祖障水别流鑿石為穴既葬復引水其上疑即此中有寺復道飛簷望之如畫榆柳陰映鳬鷖唼喋榆溪之水所自出也越榆溪而西為十里河風吹日映色如龍鱗逶迤十餘里通志水甘草茂明巡撫余子俊築塞堡植柳萬株其下明楊守謙遊紅石峽詩倚劍臨榆塞開筵傍斗城銀川朝氣合金粟暮雲平虎帳倚緹騎龍河拔漢旌封侯思定逺投筆愧書生木􅓓神山在榆林縣南五十里延綏志明成化時有妖神棲此立廟祀之後有道士經此書符咒之並焚其祠祟遂殄息己上榆林朩根山在榆林縣北套內晉書載記苻堅建元元年遣鄧羌討劉衛厄擒之於朩根山馬良山在榆林縣北套內延綏志明嘉靖二十五年套夷犯保安慶陽諸處總督曾銑遣將李珍搗其巢於馬良山後即此陰山在榆林縣北套外續漢書郡國志五原西安陽縣北有陰山水經注河水又南徑馬陰山西漢書音義曰陰山在河南謂是山也而實不在河南唐書地理志安北府北至陰山七十里謹按唐安北都護府東至榆林二百五十里涿邪山在榆林縣北套外漢書胸奴傳天漢二年因杆將軍公孫敖出西河與強弩都尉路博德會涿邪山置顔山在榆林縣北套外漢書胸奴傳元狩四年衛青出定襄塞千餘里破單于兵至置顔山趙信城而還大斤山在榆林縣北套外隋書突厥傳開皇末遣太平公史萬歲出朔州擊突厥達頭於大斤山燕然山在榆林縣北套外漢書胸奴傳征和二年李廣利出五原乘勝追北至范夫人城又北至郅居水上引還至速邪烏燕然山單于遮擊二師敗降後漢書竇憲傳永元元年竇憲破北單于於稽落山追至私渠北鞮海遂登燕然山去三千餘里刻石勒功而還黑山在榆林縣北套外魏書蠕蠕傳神麚二年討蠕蠕帝出東道向黑山長孫翰從西道向大峨山同會賊庭襲之至栗水大檀衆西奔唐書郭知運傳開兀四年突厥降户叛知運領朔方兵邀擊於黑山呼延谷大破之鐵山在榆林縣北套外唐書突厥傳貞觀四年李靖出定襄進屯惡陽嶺夜襲頡利頡利驚退牙磧口走保鐵山靖復襲擊大破之己上邊外名山附見榆林龍眼山在神木縣東南百步通志上有二穴穿透如龍眼縣志㟏岈突起類龍頭角香爐山在神朩縣東北一里通志明武宗賜名鳯頭山縣志峰峭如削其頂最圓而稍舒如喙明霞掩映灼灼生輝東為虎頭山又東北為錦屏山山形峻峭布列如屏泗滄之水繞其下駝兒山在神朩縣西三里通志首尾皆峻中稍低凹儼若駝峰明武宗賜名筆架山沈家寺山在神朩縣西南三十里延綏志山石有巨人迹長尺五寸濶五寸車輞迹一道俗傳周世宗微時憩此又縣西南八十里有點軍崕在柏林堡南相傳秦王過此點軍今有馬蹄及人跪坐衣文在石白龍寺山在神朩縣東南十里通志四面壁立祗通一徑登者拾級聚足以上土人多有結廬而居者又縣東十里有鳯凰石相傳宋時鳯鳴於此卧牛峰在神朩縣東北縣志在永興堡東南十五里夏將訛龎東侵宋將郭恩被執於此已上神木跋那山在神朩縣北套內魏書蠕蠕傳登國六年討蠕蠕縕紇提西遁魏主追至跋那山縕紇提降縕紇提之子曷多汗棄父西走長孫肥輕騎追至跋那山斬之骨羅山在神朩縣北套內魏書明帝紀永興五年帝西幸五原挍獵於骨羅山雞秩山在神朩縣北套外漢書胸奴傳本始二年祁連將軍田廣明出西河塞千六百里至雞秩山己上邊外名山附見神木五虎山在府谷縣東一里雍勝略五峰雄峙其形如虎延安府志一名五龍山下有香爐山曾有仙人煉丹於此桃花洞在府谷縣城南通志洞有硃沙艷如桃花又千佛洞在桃花洞南又懸空洞在縣東門外高踞城巔俯瞰洪流又洪濟洞在縣小南門外水塞山在府谷縣北十五里通志兩川夾流山峙川中龍峰山在府谷縣東北三十里通志山形盤曲紆回上有高峰特立樹朩陰翳旱禱輒應建有龍王廟青石崖在府谷縣東北九十里通志在黃甫營北又相近有竺琭臺巨石巑岏一名蓮花纒己上府谷暖泉峰在府谷縣北套內九域志在豐州西北三十七里謹按豐州故城在府谷北百五十里沙角山在府谷縣北套內三秦記河西有沙角山峰崿危峻逾於石山其沙粒粗色黃如乾糒又山之陽有泉名沙井綿歷今古沙不填之人欲入穴即有鼓角之聲震動人足九域志豐州西五十里至沙井嶺薛林山在府谷縣北套內魏書明帝本紀後魏泰常四年帝從君子津西渡大狩於薛林山拔鄰山在府谷縣北套內魏書太武帝紀始光四年西討赫連昌濟君子津次拔鄰山榆林衛志山去君子津二百餘里石門山在府谷縣北套外漢書胸奴傳太初三年光祿徐自為出五原塞數百里遠者千里築城障列亭至廬朐謹按顏師古曰廬胊山名也朐音劬地理志稒陽縣北出石門障得光祿城水經注石門水出石門山謹按石門山在舊臨沃縣境禹貢錐指廬朐山謂之光祿塞按元和郡縣志石門障即光祿城古入胸奴大路己上邊外名山附見府谷狄青原在懷遠縣西南五十里延綏志在威武堡南十里明成化二年總兵楊信破敵於此橫山在懷遠縣西南接安定縣界縣志宋元豐中种諤上言橫山延袤千里多馬宜稼且有鹽鐵之利其城壘控險足以守禦即此己上懷遠契吳山在懷遠縣北套內十六國春秋赫連勃勃北遊契吳歎曰美哉臨廣澤而帶清流吾行地多矣自馬嶺以北大河以南未之有也元和郡縣志山在朔方縣北七十里謹按水經注云河水左合契吳山水在定襄桐過之下則山當屬山西境抑或别有一山存以俟考朩瓜嶺在懷遠縣北套內唐書地理志朔方縣有朩瓜嶺陽山在懷遠縣北套外水經注河水東徑陽山南漢書注曰陽山在河北指此山也又東徑石迹阜西是阜破石之文悉有鹿馬之迹自高闕以東夾山帶河陽山以西皆北假也禹貢錐指陽山即陰山山在中國極北故名陰山水北曰陽山在河水之北故亦謂之陽山漢書侯應曰北邊塞至遼東外有陰山東西千餘里計陰山綿亘直抵遼東非河南所能容信徐廣之謬謹按徐廣曰陰山在河南陽山在河北懷已上邊外名山附見逺第一峰在葭州北五里通志高出羣峰又有飛來石在州北三里許片石挂於懸崖相傳昔時飛落於此龍頭岡在葭州東南百步通志岡之東有果老洞層崕橫出洞臨黃河俗傳果老曾居此相近有香爐石在州治東麓石笋突出高十餘仞駕朩為橋構觀音閣其上俯臨黃河宛然中流之柱萬户峪在葭州北八十里通志宋咸平中啜訛引趙保吉之衆從此入冦麟州謹按麟州今屬神木古為沃壤谷中有居民萬家又鳯凰山在萬户峪東北層巒特出南憑黃河高數百仞又峪北有獅子石聳峻玲瓏其巔突出石笋上濶下狹攀援而上可容數十人東臨黃河一名獅撲石石鼓崖在葭州北百里漢樓子溝西通志青石一片長丈餘架兩石上又落大石一隙其中形如鼓圈覆青石上擊之其聲如鼓題詩崖在葭州西北五十里通秦塞葭蘆河西州志巖邊石上有朱字詩二首似古鳥迹體首云深山隱玉樹餘不能辨塔兒山在葭州西北百四十里州志上有小塔在真鄉川北嘉靖間吉囊侵東路至此西嶺山在葭州西五里葭蘆川傍通志宋將薛義敗夏人於葭蘆西嶺即此又相近有桃李塢在申家灣東繞蘆水西峙石崖清泉盈耳桃李怡目落珠崖在葭州西七十里五女川西州志石崖壁立亂水噴注如落珠相傳宋兵至此亂箭射石水隨箭鏃迸出土人名曰萬箭崖嵯峨峰在葭州南三里許通志崔嵬巨石立南山之崖若蹲踞然其下為龍虎灣在州南舊城下其南山下有石長十餘丈橫峙葭蘆河中形若卧龍