body:
  text: 欽定四庫全書關中勝蹟圖志卷二十九陜西巡撫臣畢沅撰地理綏德州釋名通志本後魏綏州宋為綏德城金升為州因城舊名也沿革州志治在省城東北一千一百里禹貢雍州之域春秋時白翟地戰國魏置上郡秦置膚施縣漢初為翟國尋復置上郡後漢因之建安二十年郡縣俱廢西魏置上縣又置綏州及安寧郡隋開皇初郡廢大業初改州曰上州尋又改州為雕隂郡唐貞觀二年平梁師都復置綏州天寶初改縣曰龍泉又改州為上郡乾元初復曰綏州屬關內道五代時為蕃族所據宋熙寧三年收復為綏德城屬延州元符二年升為綏德軍屬延安府金大定二十二年升為綏德州屬鄜延路元屬延安路明屬延安府本朝雍正三年直𨽻陕西布政使司領縣三曰米脂清澗吳堡州城通志環水抱山明洪武中因舊址築周八里有竒門四關城周六里有竒門亦四米脂縣釋名通志本宋米脂城以地有米脂水故以名城金升為縣因宋舊名也沿革一統志治在州北八十里漢上郡膚施龜兹二縣地西魏置撫寧縣後周分置銀州隋廢州屬雕隂郡唐復置銀州屬關內道宋初屬西夏元豐四年收復置米脂寨屬綏德軍金因之後升為縣屬綏德州元明不改本朝因之縣城通志明洪武中築周二里有竒門二清澗縣釋名通志宋种世衡因寬州舊壘築城賜名清澗以城西有清澗河也金始升為縣沿革一統志治在州東南一百四十里漢上郡膚施縣地西魏置綏德城平二縣隋屬雕隂郡唐屬綏州五代時廢宋康定元年置清澗城屬延州元符二年屬綏德軍金大定二十二年升為清澗縣屬綏德州元及明初因之後改屬延安府本朝雍正三年仍屬綏德州縣城通志宋康定元年种世衡營建土城明洪武初增築甃以磚嘉靖中西南二面易以石周三里有竒門三吳堡縣釋名通志本宋吳堡寨縣從寨名也沿革縣志治在州東八十里漢上郡膚施縣地隋唐為石州地宋置吳堡寨金正大三年升為縣屬葭州元明不改本朝乾隆元年改屬綏德州縣城通志明正統中因舊址重築周二里有竒門四名山綏德州疏屬山在州城內山海經二負之臣曰危與二負殺窫窳帝乃梏之疏屬之山郭璞注漢宣帝使人發上郡疏屬山於盤石中得一人徒祼被髮反縛械一足羣臣莫能曉劉向按此言對之帝驚異元和郡縣志龍泉縣有疏屬山亦名雕隂山謹按唐龍泉縣本西魏雕隂郡即今治雍大記山連城橫峙其形望之如雕刻城在山北故曰雕隂月宫山在綏德州北二里通志有月崕建月宫寺合龍山在綏德州西南五里漢書地理志膚施縣有五龍山謹按秦膚施故城在州西北則合龍山疑即五龍山也路史上郡膚施縣五龍山蓋出治之所也故宣帝立五龍仙人祠於膚施有帝原水黃帝祠定仙嶺在綏德州東南七十里太平寰宇記延福縣有定仙嶺謹按延福故城在州東延安府志金大定中置堡於此聖佛崕在綏德州東十五里石佛鋪太平寰宇記延福縣有聖佛崖鳯凰山在綏德州東四十里通志古屯戍處一名鳯宿嶺相傳有鳯集此已上綏德白雲山在米脂縣北二里通志環抱縣城又馮家山在縣北三里其西甚峻有泉湧出峰頂又髙家山在縣北五里下有石洞可容數千人石佛山在米脂縣東七十里縣志髙聳峭特縣境諸山之冠已上米脂草場山在清澗縣治北百步通志一名草塢山又名寨山相傳為宋种世衡積草處即古寬州城筆架山在清澗縣西百步通志三峰秀峙縣城憑以為固相近有峰臺山上有古峰墩故名東峰山在清澗縣東一里縣志峰巒秀麗為邑之勝境吐谷嶺在清澗縣東二十里縣志唐以吐谷渾部族僑治州界故名嶺之西有苜蓿嶺白草原在清澗縣東百三十里黃河岸側通志王昌齡詩云白草原頭望京師黃河水流無盡時即此已上清澗塞西山在吳堡縣西一里通志宋置吳堡寨於此金為縣故名南達中原東障黃河層巒拱峙朝氣尤爽火燒山在吳堡縣北十五里縣志一名桃花莊赤砂紫石嶙峋列峙可稱竒觀其相近有停仙坪在黃河中流兩山夾列傾石若墜雪浪銀濤中有髙坪世傳仙人集此妙峯山在吳堡縣北七十里縣志又名黑龍岑黃河曲流如帶臨泉離石諸山如屏上有淨道院髙原寨山在吳堡縣西北五十里縣志巍然天際為衆山宗龍鳯山在吳堡縣南十里通志以山勢回翔故名又名黑虎山己上吳堡大川附水利綏德州黃河在州東百二十里自吳堡界流入與山西永寧州寧鄉縣分界又南入清澗界水經注河水又南徑離石縣西奢延水注之謹按離石縣今屬永寧州太平寰宇記綏州延福縣有黃河自撫寧縣流入州東至石州界黃河一百三十里河上有孟門關在石州西九十五里又州東南至隰州石樓縣西北黃河為界一百五十里謹按撫寧縣今屬米脂石州今屬永寧州無定河在綏德州東門外自米脂界入境又東南入清澗界水經注奢延水自徑膚施縣又東入五龍山帝原水自下亦為通稱厯長城東出於赤翟白翟之中又有平水入之又東走馬水注之元和郡縣志龍泉縣有無定河一名奢延水自撫寧縣界流入沈括夢溪筆談嘗過無定河活沙履之百步皆動如行幕上或陷則人馬車駝無遺或以為即古之流沙州志無定河以潰沙急流深淺不定故名經米脂綏德而勢益大積沙驚浪行人苦之為古戰守要地唐陳祐無定河詩無定河邉暮笛聲赫連臺畔旅人情函關歸路千餘里一夕秋風白髮生大理川在綏德州西北城下自米脂縣流入徑州西北東流入無定河通志即平水理一作力水經注平水西北出平溪東南入奢延水隋書地理志大斌縣有平水謹按大斌廢縣在州境太平寰宇記龍泉縣有大力川在西又廢大斌縣有小力川縣志大中祥符三年趙德明出大理河築柵蒼耳坪又治平四年种諤復綏州夜渡大理水即此州冊大理河源出龍州堡雙城兒又小理河源出懷逺之威武堡徑艾蒿峁巡檢司溝合大理河入州境懷寧河在綏德州東南十里自清澗縣流入又徑州東南入無定河通志即走馬水水經注走馬水自陽周東北流入長城又東北流入奢延水謹按陽周今屬安定大河川在綏德州東南太平寰宇記廢延福縣有大河川謹按延福故城在州東南接清澗界則大河川當即清澗之清澗水俗名大河者也龍泉在綏德州東三里太平寰宇記唐龍泉縣以此名延安府志在無定河東岸泉從石龍口中出故名嗚咽泉在綏德州東五里名山記相傳即秦太子扶蘇賜死處已丄綏德無定河在米脂縣西十里自榆林界入境又東南入綏德界水經注奢延水自合帝原水又東徑膚施縣謹按漢膚施縣今屬綏德州元和郡縣志無定河自夏州界流入又經撫寧縣北二十里謹按撫寧故城在縣西縣志元豐四年种諤攻米脂敗夏人於無定河即此明堂川在米脂縣西北通志其水自榆林流入無定河宋元豐五年曲珍敗夏人於明堂川即此謹按即榆林西河米脂水在米脂縣東南百步西南流入無定河通志源出張家山地沃宜粟米汁如脂故名宋蘇軾聞米脂川大捷詩聞說將軍取乞銀將軍旗鼓捷如神應知無定河邉栁得共中原雪絮春王圭米脂川大捷詩神兵十萬忽乘秋西磧妖氛一夕收匹馬不嘶榆塞外長城自起玉關頭君王别繪凌烟閣將帥今輕定逺侯莫道無人能定國紅旗行去取凉州大理河在米脂縣西六十里自懷逺縣流入通志源出沙漠紅石川經縣境又入綏德西北城下東北流入無定河又小理河在縣西百五十里流金堰在米脂縣南一統志明正德中壘石溪口作堰長五十餘丈引山水灌田民獲其利已上米脂黃河在清澗縣東百二十里自綏德界流入與山西石樓縣分界又南至張家山入延川界水經注河水又南徑離石縣西奢延水注之又南過土軍縣西謹按離石今屬山西永寧州土軍今屬石樓縣無定河在清澗縣東北自綏德界入境又徑縣東八十里東南流入黃河水經注奢延水自合走馬水又東與白羊水合又東入於河懷寧河在清澗縣西北自安定南溝岔入境流七十里東北徑綏德州入無定河縣志源出安定柏山寺下徑縣北境東流入無定河白家河在清澗縣東北源出吐谷嶺東北流五十里入無定河謹按縣境水東北注奢延者惟白家河疑即水經注之白羊水也水經注白羊水出於西南白羊溪巡溪東北注於奢延水秀延水在清澗縣西城下自安定界來南流入延川界水經注秀延水得浣水口又東㑹根水露桃水太平寰宇記廢城平縣有清澗水謹按城平故城在縣西縣志清澗水俗名大河自安定縣流入至縣北官山折而南流過城西迤東繞城南又東南入延川縣即秀延水也亦名吐延水至縣南四十里張家灣曰小吕梁以水勢似之因名石井在清澗縣城內縣志宋种世衡城清澗乏泉鑿地百尺餘遇石世衡命屑石一畚豫百錢卒得泉今謂之种公井已上清澗黃河在吳堡縣東一里自葭州流入與山西永寧州分界又南入綏德州界水經注河水自合諸次水又南湯水注之縣志自縣北螅蜊峪入境東流經川口至丁家畔二十里曲折南流經下沙灘橫溝寨李家溝七十里至城下復轉而西流入綏德州界水灘水在吳堡縣北十里縣志二泉交流頗為勝概流十餘里至宋家灘入河流觴池在吳堡縣南二里石塔寺下通志澗水曲流清潭靜注邑人載酒逰覽之所馬跑泉在吳堡縣西北二十五里通志相傳宋將楊滿堂經此馬渴甚以蹄跑之泉出已上吳堡古蹟祠宇綏德州秦扶蘇祠一統志在州城內明嘉靖中改建於疏屬山峰宋种公祠一統志在清澗縣城內祀宋种世衡明九真觀一統志在綏德州治西一里宣德中建古蹟郊邑秦長城太平寰宇記城有二一在綏德州西四十五里大力川一在州北二十五里無定河皆䝉恬所築之遺跡朔方臺一統志在綏德州無定河東岸世傳秦太子扶蘇所築一名扶蘇臺又州北二里有月兒臺扶蘇墓通志在綏德州治北關中陵墓志扶蘇墓有四一在臨潼縣藥水村一在平凉府東一在寧縣西一在綏德按綏德古上郡扶蘇監䝉恬軍處賜死葬綏德即此葉映榴嗚咽泉賦序雕山之巔扶蘇冢在焉時有白虹出冢中去冢不五里有泉曰嗚咽相傳為扶蘇自裁處䝉恬墓通志在綏德州西南一里大理河北岸天寧寺下晉吳兒城一統志在綏德州西北元和郡縣志在龍泉縣西北四十里初赫連勃勃破劉義真於長安遂徙其人築此城以居之號吳兒城唐寬州石城通志在清澗縣東北山上今縣東二十里有石城即唐初置寬州城也即今後山寨宋相思亭一統志在綏德州南三十里西北二水交㑹於此宋司馬光相思亭詩嶺上雙流水猶知㑹合時行人經過此那得不相思義合寨通志在綏德州東六十里宋史地理志本夏人寨元豐四年收復開光堡通志在綏德州北四十里宋史地理志紹聖四年修築元符元年賜名种諤傳熙寧四年諤遣都監趙璞築撫寧故城及分荒堆三泉吐渾川開光嶺葭蘆川諸寨大理河橋渡通志在綏德州南城外秋設橋夏則撤有官渡船宋史种諤傳治平四年諤復綏州夜渡大理河周美傳美率衆由㕔子部西濟大理河永樂城一統志在米脂縣西宋史徐禧傳元豐初种諤西討得銀夏宥三州而不能守延帥沈括欲城永樂詔禧往相其事禧言銀州雖據明堂川無定河之㑹而故城東南已為河水所吞西北又阻天塹不如永樂形勢險厄遂城永樂地理志即永樂小川築新城距故銀州二十五里前據銀州大川賜名銀川寨旋被西人所陷崇寧四年收復仍為銀州五年廢為銀川城清澗寨通志在清澗縣東北十里東控黃河西岸本隋綏平縣地名清澗川宋慶厯中築順安寨通志在清澗縣東北八十里宋史地理志延州延川縣舊寨元符二年廢後復置九域志延川有順安白草永平三寨縣志宋初建南安寨康定中棄之慶厯中修復改今名白草寨通志在清澗縣東北一百餘里黃河岸側內有新井宋嘉祐中白草寨主康惟幾鑿正德間邉患急知縣趙輅恐井不足用更鑿一井引東河水自城下穿入宋史地理志延州延川縣舊寨元符二年廢後復置縣志東扼黃河伏落關路北控綏德州鐵茄坪定仙嶺滿堂川三路最為要害之地營田堡通志在清澗縣南三十里种世衡營田處老鴉關渡通志在清澗縣東一百二十里老鴉關通山西石樓縣即宋种世衡城清澗致河東之粟處隄址猶存吳崕寨通志在吳堡縣東北六十里下臨黃河邉防要地宋時設守對峙有誤兒寨又縣北七十里有虎頭寨東臨黃河石崕三級洵天險也韓王母墓通志在清澗縣北五十里官山嶺談吉璁韓王母墓辨清澗之北五十里為官山嶺嶺之中有韓王母墓不封不植而居人至今不敢耕牧也土人云齊王韓信母冢冢之下有坎窞數十處皆深至丈許云作竈井設伏者夫韓信生淮隂未嘗至清澗北盟㑹編云韓世忠綏德軍人少年曾戲槊於二郎山謹按二郎山亦名文屏山在州城南此宋史所不載宜其母墓不著也今韓王母墓為世忠母墓無疑至坎其下塹其旁皆宋人拒馬處也南渡後韓王故鄉已沒於金尚得封識之乎任泰亨墓通志在清澗縣西七里紙張溝縣志泰亨仁宗朝兵部尚書敕命祭葬今翁仲猶存金趙勸墓通志在綏德州西十里有施宜生碑元党時濟墓通志在縣東一百三十里党家山有碑明葫蘆堡通志在米脂縣四十里明置寧川堡通志在清澗縣西三十里一名栁家坪大川平坦路通安定又石嘴岔堡在縣北七十里又田家堡在縣北一百里三堡皆嘉靖中築馬汝驥墓通志在綏德州東五里郝志義墓通志在清澗縣北八十里縣志志義刑部右侍郎子序援例乞祭葬劉瑾謂洪武禮制無此例下序詔獄謫戍瑾敗乃復關中勝蹟圖志卷二十九
